</style></head><body><div id="app"></div><div id="toast" role="status" aria-live="polite"></div><script>const families=[
{title:'분류하고 기준 설명하기',flow:['사례 살펴보기','기준에 따라 분류','분류 이유 설명','다시 검토'],response:'분류한 결과 / 분류에 사용한 기준',examples:[
['정보','데이터의 특징에 따라 분류','A: 정답 이름표가 붙은 사진으로 학습\nB: 정답 없이 구매 기록이 비슷한 고객을 묶음','각 사례를 지도학습과 비지도학습으로 분류하고 기준을 설명해 보세요.','정답 이름표가 주어졌는지 살펴보세요.','A는 지도학습, B는 비지도학습. 정답 제공 여부를 기준으로 구분한다.'],
['국어','주장과 근거 구분','A: 학교에 자전거 거치대를 늘려야 한다.\nB: 조사에서 거치대가 부족하다고 답한 학생이 30명 중 22명이었다.','주장과 근거를 구분하고 각 문장의 역할을 설명해 보세요.','의견을 말하는 문장과 의견을 뒷받침하는 문장을 구분하세요.','A는 주장, B는 근거. B는 조사 결과로 A의 필요성을 뒷받침한다.'],
['수학','도형의 성질에 따라 분류','정삼각형 / 정사각형 / 직사각형 / 정오각형','삼각형·사각형·오각형으로 분류하고 사용한 기준을 설명해 보세요.','변의 개수를 살펴보세요.','변이 3개면 삼각형, 4개면 사각형, 5개면 오각형. 정사각형과 직사각형은 모두 사각형이다.'],
['과학','관찰한 생물의 특징별 분류','개미: 다리 6개 / 거미: 다리 8개 / 나비: 다리 6개','관찰한 다리 수를 기준으로 분류하고 기준을 설명해 보세요.','겉모습 전체보다 제시된 관찰 특징에 집중하세요.','다리 6개 집단은 개미와 나비, 8개 집단은 거미. 여기서는 다리 수를 기준으로 분류한다.']]},
{title:'순서를 구성하고 이유 설명하기',flow:['단계 살펴보기','순서 구성','순서의 이유 설명','절차 확인'],response:'단계의 순서 / 이 순서로 정한 이유',examples:[
['정보','알고리즘 구성','A: 합계 출력 / B: 두 수 입력 / C: 두 수 더하기','두 수의 합을 구하는 절차를 순서대로 놓고 이유를 설명하세요.','계산하려면 먼저 무엇이 있어야 하나요?','B → C → A. 입력한 두 수로 계산한 뒤 결과를 출력한다.'],
['국어','문단 순서 구성','A: 마지막으로 완성한 화분에 물을 주었다.\nB: 먼저 화분과 흙, 씨앗을 준비했다.\nC: 그다음 흙에 씨앗을 심었다.','문단을 시간 순서대로 배열하고 연결 표현을 근거로 설명하세요.','먼저, 그다음, 마지막으로를 찾아보세요.','B → C → A. 시간의 흐름을 나타내는 표현이 순서의 단서다.'],
['수학','풀이 단계 구성','A: x = 4 / B: 2x = 8 / C: 2x + 3 = 11','방정식의 풀이 순서를 정하고 각 단계에서 한 일을 설명하세요.','양변에서 같은 수를 빼고 같은 수로 나누세요.','C → B → A. 양변에서 3을 빼고 2로 나눈다.'],
['과학','실험 절차 구성','A: 같은 시간 동안 저은 뒤 녹은 정도 비교\nB: 같은 양의 물을 서로 다른 온도로 준비\nC: 같은 양의 설탕을 넣기','물의 온도에 따른 설탕의 녹는 빠르기를 비교할 절차를 구성하세요.','조건을 준비한 뒤 실험하고 결과를 비교해요.','B → C → A. 물과 설탕의 양, 젓는 조건은 같게 유지한다.']]},
{title:'오류를 찾아 수정하기',flow:['문제 부분 찾기','오류 이유 설명','내용 수정','수정 결과 확인'],response:'찾은 오류 / 오류인 이유 / 수정한 내용',examples:[
['정보','코드 오류 수정','목표: 1부터 5까지 출력\nfor n in range(1, 5):\n    print(n)','빠진 출력값을 찾고 코드를 수정하세요.','range의 끝값은 포함되지 않아요.','5가 출력되지 않는다. range(1, 6)으로 바꾼다.'],
['국어','글의 논리적 모순 수정','민수는 이번 달에 책을 한 권도 읽지 않았다. 그래서 이번 달에 읽은 세 권 중 한 권을 추천했다.','서로 맞지 않는 부분을 찾고 뜻이 이어지도록 고쳐 보세요.','읽은 책의 수에 관한 두 표현을 비교하세요.','한 권도 읽지 않았다는 진술과 세 권을 읽었다는 진술이 충돌한다. 예: 이번 달에 책 세 권을 읽었다로 수정한다.'],
['수학','잘못된 풀이 수정','2(x + 3) = 10\n2x + 3 = 10\n2x = 7','처음 오류가 나타난 줄을 찾고 풀이를 고치세요.','괄호 안의 각 항에 2를 곱했나요?','둘째 줄이 오류. 2x + 6 = 10, 2x = 4, x = 2로 수정한다.'],

</script><script>let evalDraft=null,evalCounter=0,resultActivity='all',resultStatus='all';

 ];
 let items;
 if(a.id==='sort')items=[['8, 2, 6, 1, 4를 선택 정렬합니다. 첫 단계 후 전체 순서를 쓰세요.','1, 2, 6, 8, 4. 최솟값 1과 맨 앞의 8을 교환한다.'],['첫 단계가 끝난 뒤 어느 카드부터 다시 비교하나요? 이유도 쓰세요.','두 번째 위치의 2부터 남은 카드를 비교한다. 첫 위치의 1은 확정되었기 때문이다.']];
 else if(a.options)items=[['정답 이름표 없이 소리를 비슷한 특징끼리 묶었습니다. 어떤 학습 유형인가요?','비지도학습. 정답 없이 유사한 특징을 찾았다는 점을 확인한다.'],['이 사례를 지도학습과 구분하는 기준을 설명해 보세요.','지도학습은 정답이 주어지고, 이 사례는 정답 없이 특징을 찾는다는 차이를 설명한다.']];

 return items.map(([question,criteria])=>({id:newEvalId(),question,criteria,origin:'auto'}));

const subjectBadge=a=>`<span class="subject-badge ${subjectClass(a)}">${esc(a.subject)}</span>`;
const colorCodes=['#fff6c5','#fff6c5','#fff6c5','#fff6c5'];
const miniLabels=[['A','B','기준'],['①','②','③'],['오류','수정'],['자료','판단']];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const activities=[];
families.forEach((f,fi)=>f.examples.forEach((a,ei)=>activities.push({id:`${fi}-${ei}`,family:fi,subject:a[0],name:a[1],material:a[2],question:a[3],hint:a[4],solution:a[5],minutes:15,mode:'온라인',goal:f.title,prep:'학생용 PC 또는 태블릿',unit:fi===0&&ei===0?'인공지능':ei===0?'알고리즘':a[0]+' 활동',response:f.response,stages:['자료를 보고 생각 떠올리기','활동하고 이유 설명하기','답을 검토하고 배운 점 정리하기']})));
Object.assign(activities[0],{name:'AI 학습 유형 분류하기',material:'정답이 없는 구매 기록에서 비슷한 고객끼리 묶었습니다.',question:'어떤 학습 유형인가요?',options:['지도학습','비지도학습','강화학습'],correct:'비지도학습',hint:'어느 집단에 속하는지 정답을 미리 알려 주었나요?',solution:'정답 없이 비슷한 특징을 찾아 묶으므로 비지도학습입니다.',goal:'사례를 분류하고 그 이유를 설명한다.',stages:['학습 유형 떠올리기','사례 분류와 이유 쓰기','단서를 확인하고 다시 풀기']});
activities.splice(1,0,{id:'sort',family:1,subject:'정보',unit:'알고리즘',name:'숫자 카드로 선택 정렬하기',material:'7, 3, 9, 1, 5',question:'남은 카드 중 가장 작은 수를 찾아 맨 앞 카드와 바꾸세요.',hint:'자리가 정해진 카드는 제외하고 반복해요.',solution:'1 → 3 → 5 → 7 → 9',minutes:20,mode:'언플러그드',goal:'규칙에 따라 정렬하고 반복한 절차를 설명한다.',prep:'숫자 카드 · 기록지 · 필기구',response:'단계 / 최솟값 / 바꾼 카드 / 전체 순서',stages:['카드 정리 방법 예상하기','규칙대로 이동하고 과정 기록하기','다른 순서로 다시 해 보고 규칙 설명하기']});
const drafts=new Map();let view='browse',mode='activities',family=0,selected=null,draft=null,filters={subject:'전체 교과',unit:'전체 단원',time:'모든 시간',format:'모든 방식'};
function get(id){return drafts.get(id)||activities.find(a=>a.id===id)}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>e.style.display='none',2600)}
function go(v){view=v;render();window.scrollTo({top:0,behavior:'instant'})}
function nav(){return `<header class="header"><a class="brand" href="#" data-home><span class="brand-mark"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false"><rect x="3.5" y="7.5" width="12.5" height="12.5" rx="3" fill="none" stroke="#1f2a44" stroke-width="2"/><rect x="7.5" y="3.5" width="12.5" height="12.5" rx="3" fill="#fff" stroke="#1f2a44" stroke-width="2"/><path d="M13.75 6.6l.95 2.1 2.1.95-2.1.95-.95 2.1-.95-2.1-2.1-.95 2.1-.95z" fill="#1f2a44"/></svg></span>수업활동 스튜디오</a><nav class="nav" aria-label="주 메뉴"><button data-mode="activities" class="${mode==='activities'?'on':''}" aria-current="${mode==='activities'?'page':'false'}">활동 찾기</button><button data-mode="templates" class="${mode==='templates'?'on':''}" aria-current="${mode==='templates'?'page':'false'}">공통 템플릿</button><button data-mode="results" class="${mode==='results'?'on':''}" aria-current="${mode==='results'?'page':'false'}">학생 결과</button></nav><span class="demo">교사용 목업</span></header>`}
function cover(a){const mini=a.id==='sort'?a.material.split(',').slice(0,5).map(n=>n.trim()):miniLabels[a.family];return `<div class="cover ${subjectClass(a)}"><div class="cover-top">${subjectBadge(a)}<span>${esc(a.mode)}</span></div><div class="cover-title">${esc(shortNames[a.family])}</div><div class="mini" aria-hidden="true">${mini.map(n=>`<span>${esc(n)}</span>`).join('')}</div></div>`}
function activityCard(a){return `<article class="activity">${cover(a)}<div class="activity-body"><button class="template-link" data-family-link="${a.family}">${esc(shortNames[a.family])} 템플릿</button><h3>${esc(a.name)}</h3><p class="meta">${a.minutes}분 · ${a.mode==='언플러그드'?'3인 모둠 · 인쇄물':'개인 활동'}</p><button class="open" data-open="${a.id}">활동 보기</button></div></article>`}
function picker(label,key,values){return `<label>${label}<select data-filter="${key}">${values.map(v=>`<option ${filters[key]===v?'selected':''}>${esc(v)}</option>`).join('')}</select></label>`}
function browse(){if(mode==='results')return resultsPage();const all=activities.map(a=>get(a.id));if(mode==='templates')return `<div class="heading"><div><h1>어떤 활동을 할까요?</h1><p>같은 틀로, 다양한 교과에.</p></div></div><div class="template-grid">${families.map((f,i)=>`<button class="template-card ${family===i?'on':''}" style="--tile:${colorCodes[i]}" data-family="${i}" aria-pressed="${family===i}"><span>공통 템플릿 0${i+1}</span><strong>${shortNames[i]}</strong><span>${i===0?'기준 설명':i===1?'이유 설명':i===2?'수정 후 확인':'자료로 뒷받침'}</span></button>`).join('')}</div><div class="section-line"><h2>${esc(families[family].title)}</h2><span class="muted">교과별 예시</span></div><div class="flow">${families[family].flow.map((f,i)=>`<span>${i+1}. ${esc(f)}</span>`).join('')}</div><div class="cards">${all.filter(a=>a.family===family).map(activityCard).join('')}</div>`;
const filtered=all.filter(a=>(filters.subject==='전체 교과'||a.subject===filters.subject)&&(filters.unit==='전체 단원'||a.unit===filters.unit)&&(filters.format==='모든 방식'||a.mode===filters.format));return `<div class="heading"><div><h1>오늘 수업, 활동부터 골라요.</h1><p>고르고 · 바꾸고 · 사용하고</p></div></div><div class="filter-row">${picker('교과','subject',['전체 교과','정보','국어','수학','과학'])}${picker('단원','unit',['전체 단원','인공지능','알고리즘','국어 활동','수학 활동','과학 활동'])}${picker('방식','format',['모든 방식','온라인','언플러그드'])}</div><div class="section-line"><h2>수업 활동 <span class="muted">${filtered.length}</span></h2><button class="template-link" data-mode="templates">공통 템플릿으로 찾기 →</button></div><div class="cards">${filtered.map(activityCard).join('')}</div>${!filtered.length?'<div class="empty"><h2>조건에 맞는 활동이 없어요.</h2><button id="reset-filters">전체 보기</button></div>':''}`}
function cardNumbers(a){return `<div class="number-cards">${a.material.split(',').map(n=>`<span>${esc(n.trim())}</span>`).join('')}</div>`}
function studentPaper(a,live=false){return `<div class="paper-label">${subjectBadge(a)}<span>학생용 ${a.mode==='언플러그드'?'활동지':'화면'}</span><span>${esc(shortNames[a.family])}</span></div><h2>${esc(a.name)}</h2>${a.id==='sort'?cardNumbers(a):`<div class="material">${esc(a.material)}</div>`}<p class="question">${esc(a.question)}</p>${a.options?`<div class="student-options">${a.options.map(x=>`<button type="button" ${live?`data-choice="${esc(x)}"`:'disabled'} aria-pressed="false">${esc(x)}</button>`).join('')}</div>`:''}${live?`<label for="student-answer">${a.options?'이유 쓰기':'내 답변'}</label><textarea class="student-input" id="student-answer" placeholder="생각과 이유를 적어 보세요."></textarea><div class="actions"><button id="student-hint">도움말</button><button id="student-check" class="primary">${a.options?'답 확인':'답변 완료'}</button></div><div id="student-feedback" class="feedback" aria-live="polite"></div>`:`<div class="response">${esc(a.response||'분류 결과 / 분류한 이유')}</div>`}`}
function plan(a){return `<section class="lesson-flow"><h3>수업 흐름</h3><ol>${a.stages.map((s,i)=>`<li><strong>${['도입','전개','결론'][i]}</strong><span>${esc(s)}</span></li>`).join('')}<li><strong>평가</strong><span>학습 목표 확인 · ${a.evaluation.length}개 기준</span></li></ol></section>`}
function detail(a){return `<button class="back" id="back-list">← 목록</button><div class="detail-grid"><div class="paper">${studentPaper(a)}</div><section><span class="eyebrow">${subjectBadge(a)} <span class="muted">${esc(a.unit)}</span></span><h1>${esc(a.name)}</h1><button class="template-link" data-family-link="${a.family}">${esc(shortNames[a.family])} · 같은 틀 보기 →</button><div class="fact-grid"><div><small>시간</small><strong>${a.minutes}분</strong></div><div><small>활동</small><strong>${a.mode==='언플러그드'?'모둠 · 실물 카드':'개인 · 온라인'}</strong></div><div><small>준비물</small><strong>${esc(a.prep)}</strong></div><div><small>학습 목표</small><strong>${esc(a.goal)}</strong></div></div>${plan(a)}${evaluationSummary(a)}<details class="lesson-plan"><summary>정답·지도 도움말</summary><p class="material">${esc(a.solution)}</p><p class="muted">${esc(a.hint)}</p></details><div class="actions"><button id="edit">내용 수정</button><button id="use" class="primary">이대로 사용</button></div><button id="try" style="margin-top:12px;width:100%">${a.mode==='언플러그드'?'활동지 보기':'학생 화면 체험'}</button><p class="notice">교과별 활용 예시입니다. 학급의 학습 범위에 맞게 확인해 주세요.</p></section></div>`}
function field(label,name,val,type='textarea'){return `<label>${label}${type==='textarea'?`<textarea name="${name}" required maxlength="1800">${esc(val)}</textarea>`:`<input name="${name}" value="${esc(val)}" required ${type==='number'?'type="number" min="5" max="60"':'maxlength="100"'}>`}</label>`}
function editPage(){return `<button class="back" id="cancel-edit">← 활동으로</button><div class="heading"><div><h1>필요한 내용만 바꿔요.</h1><p>${subjectBadge(draft)} ${esc(shortNames[draft.family])} 템플릿</p></div><span class="muted">변경 내용이 오른쪽에 반영돼요.</span></div><div class="edit-grid"><form id="edit-form" class="form"><div class="two">${field('활동 이름','name',draft.name,'text')}${field('시간(분)','minutes',draft.minutes,'number')}</div>${field(draft.id==='sort'?'숫자 5개 · 쉼표로 구분':'자료·사례','material',draft.material)}${field('활동 질문','question',draft.question)}${draft.options?`<label>정답<select name="correct">${draft.options.map(x=>`<option ${x===draft.correct?'selected':''}>${x}</option>`).join('')}</select></label>`:''}${field('도움말','hint',draft.hint)}${draft.id==='sort'?'':field('교사용 예시 답변','solution',draft.solution)}<p id="form-error" class="error" role="alert"></p><div class="actions"><button type="button" id="cancel-bottom">취소</button><button type="submit" class="primary">저장하고 확인</button></div></form><div><p class="live-label">학생용 미리보기</p><div class="paper" id="live-paper">${studentPaper(draft)}</div><div class="tip">공통 구성은 그대로<br>${esc(families[draft.family].flow.join(' → '))}</div></div></div>`}
function ready(a){return `<button class="back" id="back-detail">← 활동 확인</button><section class="ready"><span class="eyebrow" style="text-align:center">수업 준비 완료</span><h1>${esc(a.name)}</h1><p class="ready-meta">${subjectBadge(a)} ${a.minutes}분 · ${a.mode}</p><div class="paper">${a.mode==='언플러그드'?`<h2>카드와 기록지를 준비해요.</h2>${cardNumbers(a)}<p>모둠별 1세트 · 3인 활동</p><div class="actions"><button id="worksheet">인쇄물 보기</button><button class="primary" id="print">인쇄하기</button></div>`:`<h2>학생 화면을 열어 보세요.</h2><div class="ready-code">체험용 활동</div><div class="actions"><button class="primary" id="launch">학생 화면 열기</button></div><p class="notice">현재는 체험용입니다. 실제 학생 배포는 연결하지 않았습니다. 체험 제출물은 학생 결과에서 확인할 수 있습니다.</p>`}</div><div class="actions"><button id="back-edit">내용 수정</button><button id="another">다른 활동 찾기</button></div><p class="notice">수정 내용은 이 브라우저에 저장됩니다.</p></section>`}
function render(){document.title=(selected&&view!=='browse'?get(selected).name+' · ':'')+'수업활동 스튜디오';app.innerHTML=nav()+`<main>${view==='browse'?browse():view==='detail'?detail(get(selected)):view==='edit'?editPage():view==='assessment'?evaluationPage():ready(get(selected))}</main><dialog id="student-dialog"></dialog><dialog id="worksheet-dialog"></dialog><dialog id="result-dialog"></dialog>`;bind();}
function bind(){app.querySelector('[data-home]').onclick=e=>{e.preventDefault();mode='activities';go('browse')};app.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;go('browse')});app.querySelectorAll('[data-family]').forEach(b=>b.onclick=()=>{family=Number(b.dataset.family);render()});app.querySelectorAll('[data-family-link]').forEach(b=>b.onclick=()=>{mode='templates';family=Number(b.dataset.familyLink);go('browse')});app.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{selected=b.dataset.open;go('detail')});app.querySelectorAll('[data-filter]').forEach(s=>s.onchange=()=>{filters[s.dataset.filter]=s.value;render()});const on=(id,fn)=>{const e=document.getElementById(id);if(e)e.onclick=fn};on('reset-filters',()=>{filters={subject:'전체 교과',unit:'전체 단원',time:'모든 시간',format:'모든 방식'};render()});on('back-list',()=>go('browse'));on('another',()=>go('browse'));on('back-detail',()=>go('detail'));on('cancel-edit',()=>go('detail'));on('cancel-bottom',()=>go('detail'));const startEdit=()=>{draft=structuredClone(get(selected));go('edit')};on('edit',startEdit);on('back-edit',startEdit);on('use',()=>go('ready'));on('try',()=>get(selected).mode==='언플러그드'?openWorksheet():openStudent());on('launch',openStudent);on('worksheet',openWorksheet);on('print',printWorksheet);on('evaluation-edit',openEvaluation);if(view==='assessment')bindEvaluation();if(view==='browse'&&mode==='results')bindResults();
if(view==='edit'){const form=document.getElementById('edit-form');form.oninput=()=>{const fd=new FormData(form);for(const [k,v]of fd)draft[k]=k==='minutes'?Number(v):v;if(draft.id==='sort')draft.solution=draft.material.split(',').map(Number).sort((a,b)=>a-b).join(' → ');document.getElementById('live-paper').innerHTML=studentPaper(draft)};form.onsubmit=e=>{e.preventDefault();if(['name','material','question','hint'].some(k=>!draft[k].trim())||(draft.id!=='sort'&&!draft.solution.trim())){document.getElementById('form-error').textContent='빈 항목을 채워 주세요.';return;}if(draft.id==='sort'){const nums=draft.material.split(',').map(s=>s.trim());if(nums.length!==5||nums.some(s=>!/^\d{1,3}$/.test(s))||new Set(nums.map(Number)).size!==5){document.getElementById('form-error').textContent='서로 다른 0~999 숫자 5개를 입력해 주세요.';return;}}drafts.set(selected,structuredClone(draft));go('detail');toast('수정 내용을 반영했어요.')};}}
function openStudent(){const a=structuredClone(get(selected)),d=document.getElementById('student-dialog');d.innerHTML=`<div class="dialog-head"><span class="muted">학생 화면 체험</span><button id="close-student" aria-label="학생 화면 닫기">닫기</button></div>${studentPaper(a,true)}${studentEvaluation(a)}`;d.showModal();document.getElementById('close-student').onclick=()=>d.close();let choice='',hints=0,attempts=[];d.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{choice=b.dataset.choice;d.querySelectorAll('[data-choice]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))});document.getElementById('student-hint').onclick=()=>{hints++;document.getElementById('student-feedback').textContent=a.hint};document.getElementById('student-check').onclick=()=>{const txt=document.getElementById('student-answer').value.trim(),feedback=document.getElementById('student-feedback');if(txt&&(!a.options||choice))attempts.push({choice,answer:txt});feedback.textContent=!txt?'생각과 이유를 적어 주세요.':a.options&&!choice?'학습 유형을 선택해 주세요.':a.options&&choice!==a.correct?'다시 생각해 볼까요? '+a.hint:a.options?'유형을 알맞게 골랐어요. '+a.solution:'예시와 비교해 보세요. '+a.solution;};document.getElementById('student-submit').onclick=()=>{const name=document.getElementById('student-name').value.trim(),answer=document.getElementById('student-answer').value.trim(),evaluationAnswers=a.evaluation.map((_,i)=>document.getElementById('student-eval-'+i).value.trim());if(!name||!answer||(a.options&&!choice)||evaluationAnswers.some(v=>!v)){document.getElementById('submit-error').textContent='이름, 활동 답변, 평가 답변을 모두 입력해 주세요.';return}saveSubmission(a,{name,answer,choice,evaluationAnswers,attempts,hints});d.innerHTML=`<div class="dialog-head"><h2>제출했어요</h2><button id="submitted-close">닫기</button></div><p>활동 결과를 제출했습니다.</p><button id="submitted-results" class="primary">교사용 학생 결과 보기</button><p class="notice">현재 목업 안에서만 확인할 수 있어요.</p>`;document.getElementById('submitted-close').onclick=()=>d.close();document.getElementById('submitted-results').onclick=()=>{d.close();mode='results';resultActivity=a.id;resultStatus='all';go('browse')};};}
function worksheet(a){return `<h1>${esc(a.name)}</h1><p>이름 / 모둠: ____________________　날짜: __________</p>${cardNumbers(a)}<p>${esc(a.question)}</p><table class="print-table"><thead><tr><th>단계</th><th>최솟값</th><th>바꾼 카드</th><th>전체 순서</th></tr></thead><tbody>${[1,2,3,4].map(n=>`<tr><td>${n}</td><td></td><td></td><td></td></tr>`).join('')}</tbody></table><h3>결론 · 어떤 규칙을 반복했나요?</h3><p>____________________________________________________</p><h3>평가 기준</h3>${a.evaluation.map((item,i)=>`<p>${i+1}. ${esc(item.question)}</p>`).join('')}`}
function openWorksheet(){const d=document.getElementById('worksheet-dialog');d.innerHTML=`<div class="dialog-head"><span class="muted">카드·기록지</span><button id="close-worksheet">닫기</button></div>${worksheet(get(selected))}<button id="print-dialog" class="primary">인쇄하기</button>`;d.showModal();document.getElementById('close-worksheet').onclick=()=>d.close();document.getElementById('print-dialog').onclick=printWorksheet;}
function printWorksheet(){let el=document.querySelector('.print-area');if(!el){el=document.createElement('div');el.className='print-area';document.body.append(el)}el.innerHTML=worksheet(get(selected));window.print();}
initializeEvaluations();

  --surface-alt: #232a20;\n    --border: #313a2c;\n    --text: #eceee7;\n    --text-muted: #a9b0a0;\n    --text-faint: #707a68;\n    --accent: #74c092;\n    --accent-strong: #93d4ac;\n    --accent-soft: rgba(116, 192, 146, 0.14);\n    --accent-contrast: #0f2019;\n    --warn: #e3ac5c;\n    --warn-soft: rgba(227, 172, 92, 0.14);\n    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px -12px rgba(0, 0, 0, 0.5);\n    color-scheme: dark;\n  }\n\n  * { box-sizing: border-box; }\n  body {\n    background: var(--bg);\n    color: var(--text);\n    font-family: \"Noto Sans KR\", -apple-system, BlinkMacSystemFont, \"Malgun Gothic\", sans-serif;\n    line-height: 1.55;\n    padding-inline: 0;\n  }\n  #app { min-height: 100%; }\n\n  a { color: inherit; }\n  button, input, textarea { font-family: inherit; color: inherit; }\n  textarea { font-size: 14px; }\n  h1, h2, h3 { text-wrap: balance; margin: 0; }\n  ::selection { background: var(--accent-soft); }\n  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }\n\n  .shell { max-width: 880px; margin: 0 auto; padding-inline: 20px; padding-block: 18px 48px; }\n  .topbar {\n    display: flex; align-items: center; justify-content: space-between; gap: 12px;\n    margin-bottom: 24px; flex-wrap: wrap;\n  }\n  .brand { display: flex; align-items: center; gap: 10px; }\n  .brand-mark {\n    width: 30px; height: 30px; border-radius: 8px; background: var(--accent);\n    color: var(--accent-contrast); display: flex; align-items: center; justify-content: center;\n    font-weight: 800; font-size: 14px; flex-shrink: 0;\n  }\n  .brand-name { font-weight: 700; font-size: 15px; letter-spacing: -0.01em; }\n  .brand-sub { font-size: 11px; color: var(--text-faint); }\n  .session-chip {\n    display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-muted);\n    background: var(--surface); border: 1px solid var(--border); border-radius: 999px;\n    padding: 6px 8px 6px 12px;\n  }\n  .session-chip button {\n    border: none; background: var(--surface-alt); color: var(--text-muted);\n    font-size: 12px; padding: 5px 10px; border-radius: 999px; cursor: pointer;\n  }\n  .session-chip button:hover { background: var(--border); }\n\n  .eyebrow {\n    font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n    color: var(--text-faint); font-weight: 600; margin-bottom: 6px;\n  }\n\n  .card {\n    background: var(--surface); border: 1px solid var(--border); border-radius: 16px;\n    box-shadow: var(--shadow);\n  }\n\n  /* ---- Login ---- */\n  .login-card { padding: 28px; max-width: 520px; margin: 6vh auto 0; }\n  .login-title { font-size: 20px; font-weight: 700; margin-bottom: 4px; }\n  .login-desc { font-size: 13px; color: var(--text-muted); margin-bottom: 22px; }\n  .role-group { margin-bottom: 18px; }\n  .role-group:last-child { margin-bottom: 0; }\n  .role-list { display: flex; flex-direction: column; gap: 8px; }\n  .user-row {\n    text-align: left; width: 100%; padding: 12px 14px; border-radius: 12px;\n    border: 1px solid var(--border); background: var(--surface); cursor: pointer;\n    display: flex; align-items: center; justify-content: space-between; gap: 10px;\n    transition: border-color .15s ease, background .15s ease;\n  }\n  .user-row:hover { border-color: var(--accent); background: var(--accent-soft); }\n  .user-row .name { font-weight: 600; font-size: 14px; }\n  .user-row .meta { font-size: 12px; color: var(--text-faint); }\n\n  /* ---- Activity list ---- */\n  .page-head { margin-bottom: 18px; }\n  .page-head .who { font-size: 12px; color: var(--text-faint); margin-bottom: 2px; }\n  .page-head h1 { font-size: 20px; font-weight: 700; }\n\n  .activity-list { display: flex; flex-direction: column; gap: 10px; }\n  .activity-card {\n    padding: 16px 18px; display: flex; align-items: center; justify-content: space-between; gap: 16px;\n    flex-wrap: wrap;\n  }\n  .activity-info { min-width: 0; }\n  .tag-row { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; flex-wrap: wrap; }\n  .tag {\n    font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--surface-alt);\n    color: var(--text-muted); font-weight: 600;\n  }\n  .tag.subject { background: var(--accent-soft); color: var(--accent-strong); }\n  .badge { font-size: 11px; padding: 3px 9px; border-radius: 999px; font-weight: 600; }\n  .badge.not_started { background: var(--surface-alt); color: var(--text-faint); }\n  .badge.in_progress { background: var(--warn-soft); color: var(--warn); }\n  .badge.submitted { background: var(--accent-soft); color: var(--accent-strong); }\n  .badge.reopened { background: var(--warn-soft); color: var(--warn); }\n  .reopen-hint {\n    font-size: 12px; color: var(--warn); background: var(--warn-soft); border-radius: 10px;\n    padding: 8px 12px; margin-bottom: 12px;\n  }\n  .activity-title { font-weight: 700; font-size: 15px; margin-bottom: 2px; }\n  .activity-oneliner { font-size: 13px; color: var(--text-muted); }\n  .btn {\n    border: none; border-radius: 10px; padding: 9px 16px; font-size: 13px; font-weight: 600;\n    cursor: pointer; white-space: nowrap; transition: opacity .15s ease, background .15s ease;\n    display: inline-block; text-decoration: none;\n  }\n  .tag.outline { background: transparent; border: 1px solid var(--border); color: var(--text-faint); }\n  .btn.primary { background: var(--accent); color: var(--accent-contrast); }\n  .btn.primary:hover { background: var(--accent-strong); }\n  .btn.primary:disabled { opacity: .4; cursor: not-allowed; }\n  .btn.ghost { background: var(--surface-alt); color: var(--text-muted); }\n  .btn.ghost:hover { background: var(--border); }\n  .btn.block { width: 100%; display: block; text-align: center; }\n  .btn.disabled-look { background: var(--surface-alt); color: var(--text-faint); cursor: default; }\n\n  /* ---- Flow ---- */\n  .flow-wrap { max-width: 560px; margin: 0 auto; }\n  .back-link { font-size: 12px; color: var(--text-faint); text-decoration: none; }\n  .back-link:hover { color: var(--text-muted); }\n  .progress-dots { display: flex; gap: 6px; justify-content: center; margin: 14px 0 16px; align-items: center; }\n  .dot-btn { border: none; background: none; padding: 6px 2px; cursor: default; line-height: 0; }\n  .dot-btn.reachable { cursor: pointer; }\n  .dot { height: 6px; border-radius: 999px; background: var(--border); width: 6px; display: block; transition: all .2s ease; }\n  .dot.on { background: var(--accent); width: 24px; }\n  .dot-btn.reachable:not(:hover) .dot:not(.on) { background: var(--text-faint); opacity: .55; }\n  .dot-btn.reachable:hover .dot { background: var(--accent-strong); }\n  .review-hint { font-size: 11px; color: var(--text-faint); text-align: center; margin-bottom: 10px; }\n  .flow-card { padding: 26px; min-height: 380px; display: flex; flex-direction: column; }\n  .flow-title { font-size: 17px; font-weight: 700; margin-bottom: 14px; }\n  .flow-body { flex: 1; font-size: 14px; }\n  .flow-body p { margin: 0 0 10px; color: var(--text-muted); }\n  .flow-footer { margin-top: 20px; display: flex; gap: 8px; }\n  .saving-note { font-size: 11px; color: var(--text-faint); text-align: right; margin-top: 6px; height: 14px; }\n\n  .apple-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin: 14px 0; }\n  .apple-tile {\n    text-align: center; font-size: 26px; background: var(--surface-alt); border-radius: 10px;\n    padding: 10px 4px; border: 2px solid transparent; cursor: pointer; position: relative;\n    transition: background .15s ease, border-color .15s ease;\n  }\n  .apple-tile .emoji-inner { display: inline-block; }\n  .apple-tile:hover { background: var(--accent-soft); }\n  .apple-tile.selected { background: var(--accent-soft); border-color: var(--accent); }\n  .apple-tile .check {\n    position: absolute; top: 3px; right: 4px; font-size: 10px; color: var(--accent-strong);\n    opacity: 0; transition: opacity .15s ease;\n  }\n  .apple-tile.selected .check { opacity: 1; }\n  .select-hint { font-size: 12px; color: var(--text-faint); margin: -6px 0 12px; }\n  .select-hint.enough { color: var(--accent-strong); }\n  .apple-grid.small .apple-tile { font-size: 18px; padding: 6px 2px; cursor: default; }\n  .apple-grid.small .apple-tile:hover { background: var(--surface-alt); }\n  .result-box { border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-top: 14px; }\n  .result-title { font-size: 13px; font-weight: 700; margin-bottom: 10px; }\n  .test-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }\n  .test-tile { border-radius: 10px; padding: 10px 4px; text-align: center; position: relative; }\n  .test-tile.correct { background: var(--accent-soft); }\n  .test-tile.wrong { background: var(--warn-soft); }\n  .test-tile .emoji { font-size: 22px; display: inline-block; }\n  .test-tile .emoji.blemished { filter: sepia(.35) saturate(.6); }\n  .test-tile .blemish-mark { position: absolute; top: 6px; right: 10px; font-size: 9px; }\n  .test-tile .label { font-size: 10px; color: var(--text-muted); margin-top: 4px; }\n  .test-tile .verdict { font-size: 10px; font-weight: 700; margin-top: 2px; }\n  .test-tile.correct .verdict { color: var(--accent-strong); }\n  .test-tile.wrong .verdict { color: var(--warn); }\n  .training-note { font-size: 13px; color: var(--text-faint); }\n  .preview-label { font-size: 12px; color: var(--text-muted); margin: 14px 0 6px; }\n\n  .modal-overlay {\n    position: fixed; inset: 0; background: rgba(20, 24, 15, 0.45); display: flex;\n    align-items: center; justify-content: center; padding: 20px; z-index: 50;\n  }\n  .modal-box { background: var(--surface); border-radius: 16px; padding: 22px; max-width: 360px; box-shadow: var(--shadow); }\n  .modal-box h3 { font-size: 15px; margin-bottom: 8px; }\n  .modal-box p { font-size: 13px; color: var(--text-muted); margin: 0 0 16px; }\n\n  .record-card { padding: 18px 20px; margin-bottom: 12px; }\n  .record-card.fresh { border-color: var(--accent); }\n  .record-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; flex-wrap: wrap; gap: 6px; }\n  .record-title { font-weight: 700; font-size: 14px; }\n  .record-date { font-size: 11px; color: var(--text-faint); }\n  .fresh-badge { font-size: 10px; background: var(--accent); color: var(--accent-contrast); padding: 2px 8px; border-radius: 999px; font-weight: 700; }\n\n  textarea.field {\n    width: 100%; height: 120px; border: 1px solid var(--border); border-radius: 12px;\n    padding: 12px; resize: none; background: var(--surface); font-size: 14px;\n  }\n  textarea.field:focus { border-color: var(--accent); }\n  .char-count { font-size: 11px; color: var(--text-faint); text-align: right; margin-top: 4px; }\n\n  .slider-label { font-size: 13px; color: var(--text-muted); display: block; margin-bottom: 8px; }\n  input[type=\"range\"] { width: 100%; accent-color: var(--accent); margin-bottom: 6px; }\n  .slider-value { font-size: 11px; color: var(--text-faint); margin-bottom: 14px; }\n  .accuracy-box { border: 1px solid var(--border); border-radius: 12px; padding: 16px; text-align: center; }\n  .accuracy-box .cap { font-size: 12px; color: var(--text-muted); }\n  .accuracy-box .num { font-size: 32px; font-weight: 800; margin-top: 2px; font-variant-numeric: tabular-nums; }\n\n  .summary-row { margin-bottom: 16px; }\n  .summary-row:last-of-type { margin-bottom: 0; }\n  .summary-cap { font-size: 11px; color: var(--text-faint); margin-bottom: 3px; }\n  .summary-val { font-size: 13px; color: var(--text); }\n  .footnote { font-size: 11px; color: var(--text-faint); margin-top: 22px; }\n\n  /* ---- Teacher ---- */\n  .student-result { padding: 16px 18px; }\n  .student-result-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }\n  .student-result-name { font-weight: 700; font-size: 14px; }\n  .student-result-data { font-size: 13px; color: var(--text-muted); display: flex; flex-direction: column; gap: 4px; }\n  .student-result-data .quote { color: var(--text-faint); }\n  .summary-strip { font-size: 12px; color: var(--text-faint); margin-bottom: 14px; }\n\n  .demo-banner {\n    font-size: 12px; color: var(--text-muted); background: var(--surface-alt);\n    border: 1px solid var(--border); border-radius: 12px; padding: 10px 14px; margin-bottom: 20px;\n  }\n\n  @media (max-width: 480px) {\n    .apple-grid, .test-grid { grid-template-columns: repeat(3, 1fr); }\n    .activity-card { flex-direction: column; align-items: flex-start; }\n    .activity-card .btn, .activity-card .badge-wrap { align-self: stretch; }\n  }\n\u003c/style>\n\n\n\u003cdiv id=\"app\">\u003c/div>\n\n\u003cscript>\n(function () {\n  \"use strict\";\n\n  var USERS = [\n    { id: \"teacher-1\", name: \"김선생\", role: \"teacher\", classroom: \"1학년 3반\" },\n    { id: \"student-1\", name: \"이서준\", role: \"student\", classroom: \"1학년 3반\" },\n    { id: \"student-2\", name: \"박하은\", role: \"student\", classroom: \"1학년 3반\" },\n    { id: \"student-3\", name: \"최하은\", role: \"student\", classroom: \"1학년 3반\" }\n  ];\n\n  var ACTIVITIES = [\n    { id: \"act-picky-ai\", slug: \"picky-ai\", title: \"편식하는 AI\", oneLiner: \"학습 데이터에 따라 달라지는 AI의 판단\", subject: \"정보\", domain: \"인공지능\", hasFlow: true },\n    { id: \"act-sorting-robot\", slug: \"sorting-robot\", title: \"성급한 정렬 로봇\", oneLiner: \"한 번만 훑어보고 완료를 선언하는 로봇\", subject: \"정보\", domain: \"알고리즘과 프로그래밍\", hasFlow: false, url: \"activities/sorting-robot.html\" },\n    { id: \"act-how-many-passes\", slug: \"how-many-passes\", title: \"몇 번을 봐야 끝날까\", oneLiner: \"정렬 사전 탐구 워밍업 활동지\", subject: \"정보\", domain: \"알고리즘과 프로그래밍\", hasFlow: false, url: \"activities/how-many-passes.html\" },\n    { id: \"act-not-just-words\", slug: \"not-just-words\", title: \"말로만은 안 통해요\", oneLiner: \"같은 대상을 다른 데이터로 표현하기\", subject: \"정보\", domain: \"데이터\", hasFlow: false, url: \"activities/not-just-words.html\" },\n    { id: \"act-can-i-use-photo\", slug: \"can-i-use-photo\", title: \"그 사진, 써도 될까?\", oneLiner: \"저작권 함정 탐구 (사전활동)\", subject: \"정보\", domain: \"디지털 윤리\", hasFlow: false, url: \"activities/can-i-use-photo.html\" },\n    { id: \"act-wildfire-sensor\", slug: \"wildfire-sensor\", title: \"헛다리 짚는 산불 감지기\", oneLiner: \"소리·냄새·온도, 뭘로 산불을 알아챌까\", subject: \"정보\", domain: \"컴퓨팅 시스템\", hasFlow: false, url: \"activities/wildfire-sensor.html\" },\n    { id: \"act-wildfire-threshold-lab\", slug: \"wildfire-threshold-lab\", title: \"산불 감지 임계값 실험실\", oneLiner: \"구역마다 다른 기준, 심화 최적화 실험 (성취수준 상위 전용)\", subject: \"정보\", domain: \"컴퓨팅 시스템\", hasFlow: false, url: \"activities/wildfire-threshold-lab.html\" }\n  ];\n\n  var STATUS_LABEL = { not_started: \"시작 전\", in_progress: \"탐구 중\", submitted: \"제출 완료\", reopened: \"다시 제출 대기\" };\n\n  var submissions = {\n    \"act-picky-ai__student-2\": {\n      status: \"in_progress\",\n      data: { prediction: \"빨간 사과 사진만 보여줘서 다른 색 사과는 잘 모르는 것 같아요.\" }\n    },\n    \"act-picky-ai__student-3\": {\n      status: \"submitted\",\n      data: {\n        prediction: \"AI가 빨간색만 사과라고 배워서 초록 사과를 못 알아본 것 같다.\",\n        diversitySlider: 80,\n        retrainCount: 2,\n        finalAccuracy: 100,\n        reflection: \"다양한 사진으로 학습해야 AI가 더 정확해진다는 걸 알게 됐다.\"\n      }\n    }\n  };\n\n  function loadSubmissions() {\n    try {\n      var raw = localStorage.getItem(\"atss_demo_submissions_v1\");\n      if (raw) submissions = JSON.parse(raw);\n    } catch (e) { /* ignore */ }\n  }\n  function saveSubmissions() {\n    try { localStorage.setItem(\"atss_demo_submissions_v1\", JSON.stringify(submissions)); } catch (e) { /* ignore */ }\n  }\n  loadSubmissions();\n\n  function subKey(activityId, studentId) { return activityId + \"__\" + studentId; }\n  function getSubmission(activityId, studentId) { return submissions[subKey(activityId, studentId)] || null; }\n  function upsertSubmission(activityId, studentId, patch, status) {\n    var key = subKey(activityId, studentId);\n    var existing = submissions[key];\n    var merged = Object.assign({}, existing ? existing.data : {}, patch);\n    submissions[key] = { status: status, data: merged };\n    saveSubmissions();\n    return merged;\n  }\n\n  var state = { view: \"login\", currentUser: null, flowStep: 1, flowTraining: false, selectedApples: [false, false, false, false, false, false], showQuestionModal: false };\n\n  function esc(s) {\n    return String(s == null ? \"\" : s).replace(/[&\u003c>\"']/g, function (c) {\n      return { \"&\": \"&amp;\", \"\u003c\": \"&lt;\", \">\": \"&gt;\", '\"': \"&quot;\", \"'\": \"&#39;\" }[c];\n    });\n  }\n\n  function findUser(id) { for (var i = 0; i \u003c USERS.length; i++) if (USERS[i].id === id) return USERS[i]; return null; }\n  function findActivity(slug) { for (var i = 0; i \u003c ACTIVITIES.length; i++) if (ACTIVITIES[i].slug === slug) return ACTIVITIES[i]; return null; }\n\n  // ---------- shell ----------\n  function shell(inner) {\n    var chip = \"\";\n    if (state.currentUser) {\n      chip =\n        '\u003cdiv class=\"session-chip\">' +\n          \"\u003cspan>\" + esc(state.currentUser.name) + (state.currentUser.role === \"teacher\" ? \" 선생님\" : \"\") + \"\u003c/span>\" +\n          '\u003cbutton onclick=\"ATSS.logout()\">나가기\u003c/button>' +\n        \"\u003c/div>\";\n    }\n    return (\n      '\u003cdiv class=\"shell\">' +\n        '\u003cdiv class=\"topbar\">' +\n          '\u003cdiv class=\"brand\">' +\n            '\u003cdiv class=\"brand-mark\">AI\u003c/div>' +\n            '\u003cdiv>\u003cdiv class=\"brand-name\">AI 탐구 수업 스튜디오\u003c/div>\u003cdiv class=\"brand-sub\">체험용 프로토타입\u003c/div>\u003c/div>' +\n          \"\u003c/div>\" +\n          chip +\n        \"\u003c/div>\" +\n        inner +\n      \"\u003c/div>\"\n    );\n  }\n\n  // ---------- login ----------\n  function userRow(u) {\n    return (\n      '\u003cbutton class=\"user-row\" onclick=\"ATSS.login(\\'' + u.id + '\\')\">' +\n        '\u003cspan class=\"name\">' + esc(u.name) + \"\u003c/span>\" +\n        '\u003cspan class=\"meta\">' + esc(u.classroom) + \"\u003c/span>\" +\n      \"\u003c/button>\"\n    );\n  }\n  function viewLogin() {\n    var teachers = USERS.filter(function (u) { return u.role === \"teacher\"; });\n    var students = USERS.filter(function (u) { return u.role === \"student\"; });\n    return (\n      '\u003cdiv class=\"login-card card\">' +\n        '\u003cdiv class=\"login-title\">오늘은 누구로 들어가시나요?\u003c/div>' +\n        '\u003cdiv class=\"login-desc\">실제 로그인은 아니고, 팀원들이 화면을 각자 확인해볼 수 있도록 만든 역할 선택 화면입니다.\u003c/div>' +\n        '\u003cdiv class=\"role-group\">\u003cdiv class=\"eyebrow\">교사로 입장\u003c/div>\u003cdiv class=\"role-list\">' +\n          teachers.map(userRow).join(\"\") +\n        \"\u003c/div>\u003c/div>\" +\n        '\u003cdiv class=\"role-group\">\u003cdiv class=\"eyebrow\">학생으로 입장\u003c/div>\u003cdiv class=\"role-list\">' +\n          students.map(userRow).join(\"\") +\n        \"\u003c/div>\u003c/div>\" +\n      \"\u003c/div>\"\n    );\n  }\n\n  // ---------- student home ----------\n  function statusOf(activity) {\n    if (!state.currentUser) return \"not_started\";\n    var sub = getSubmission(activity.id, state.currentUser.id);\n    return sub ? sub.status : \"not_started\";\n  }\n  function activityCardStudent(a) {\n    var status = statusOf(a);\n    var cta, statusMarkup;\n    if (a.hasFlow) {\n      cta = '\u003cbutton class=\"btn primary\" onclick=\"ATSS.openStudentFlow(\\'' + a.slug + '\\')\">' + (status === \"not_started\" ? \"시작하기\" : \"이어하기\") + \"\u003c/button>\";\n      statusMarkup = '\u003cspan class=\"badge ' + status + '\">' + STATUS_LABEL[status] + \"\u003c/span>\";\n    } else if (a.url) {\n      cta = '\u003ca class=\"btn ghost\" href=\"' + a.url + '\" target=\"_blank\" rel=\"noopener\">다른 창에서 열기 ↗\u003c/a>';\n      statusMarkup = '\u003cspan class=\"tag outline\">별도 프로토타입 · 진행 기록 없음\u003c/span>';\n    } else {\n      cta = '\u003cspan class=\"btn disabled-look\">준비 중\u003c/span>';\n      statusMarkup = '\u003cspan class=\"badge not_started\">준비 중\u003c/span>';\n    }\n    return (\n      '\u003cdiv class=\"card activity-card\">' +\n        '\u003cdiv class=\"activity-info\">' +\n          '\u003cdiv class=\"tag-row\">\u003cspan class=\"tag subject\">' + esc(a.subject) + \" · \" + esc(a.domain) + \"\u003c/span>\" + statusMarkup + \"\u003c/div>\" +\n          '\u003cdiv class=\"activity-title\">' + esc(a.title) + \"\u003c/div>\" +\n          '\u003cdiv class=\"activity-oneliner\">' + esc(a.oneLiner) + \"\u003c/div>\" +\n        \"\u003c/div>\" +\n        cta +\n      \"\u003c/div>\"\n    );\n  }\n  function viewStudentHome() {\n    var u = state.currentUser;\n    return (\n      '\u003cdiv class=\"demo-banner\">이 화면의 진행 상황은 이 브라우저에만 저장됩니다. 이 폴더를 통째로 유지하면 산불 감지기 등 다른 활동도 같은 폴더 안에서 바로 열립니다.\u003c/div>' +\n      '\u003cdiv class=\"page-head\">\u003cdiv class=\"who\">' + esc(u.classroom) + \"\u003c/div>\u003ch1>\" + esc(u.name) + \"님의 탐구공방\u003c/h1>\u003c/div>\" +\n      '\u003cdiv class=\"activity-list\">' + ACTIVITIES.map(activityCardStudent).join(\"\") + \"\u003c/div>\"\n    );\n  }\n\n  // ---------- teacher home ----------\n  function activityCardTeacher(a) {\n    if (!a.hasFlow) {\n      var linkOrDisabled = a.url\n        ? '\u003ca class=\"btn ghost\" href=\"' + a.url + '\" target=\"_blank\" rel=\"noopener\">학생 화면 미리보기 ↗\u003c/a>'\n        : '\u003cspan class=\"btn disabled-look\">준비 중\u003c/span>';\n      var tagMarkup = a.url\n        ? '\u003cspan class=\"tag outline\">별도 프로토타입 · 결과 취합 미연동\u003c/span>'\n        : \"\";\n      return (\n        '\u003cdiv class=\"card activity-card\"' + (a.url ? \"\" : ' style=\"opacity:.55\"') + '>' +\n          '\u003cdiv class=\"activity-info\">' +\n            '\u003cdiv class=\"tag-row\">\u003cspan class=\"tag subject\">' + esc(a.subject) + \" · \" + esc(a.domain) + \"\u003c/span>\" + tagMarkup + \"\u003c/div>\" +\n            '\u003cdiv class=\"activity-title\">' + esc(a.title) + \"\u003c/div>\" +\n            '\u003cdiv class=\"activity-oneliner\">' + esc(a.oneLiner) + \"\u003c/div>\" +\n          \"\u003c/div>\" +\n          linkOrDisabled +\n        \"\u003c/div>\"\n      );\n    }\n    return (\n      '\u003cbutton class=\"card activity-card\" style=\"width:100%;text-align:left;border:1px solid var(--border);cursor:pointer\" onclick=\"ATSS.openTeacherDetail(\\'' + a.slug + '\\')\">' +\n        '\u003cdiv class=\"activity-info\">' +\n          '\u003cdiv class=\"tag-row\">\u003cspan class=\"tag subject\">' + esc(a.subject) + \" · \" + esc(a.domain) + \"\u003c/span>\u003c/div>\" +\n          '\u003cdiv class=\"activity-title\">' + esc(a.title) + \"\u003c/div>\" +\n          '\u003cdiv class=\"activity-oneliner\">' + esc(a.oneLiner) + \"\u003c/div>\" +\n        \"\u003c/div>\" +\n        '\u003cspan class=\"btn ghost\">결과 보기 →\u003c/span>' +\n      \"\u003c/button>\"\n    );\n  }\n  function viewTeacherHome() {\n    var u = state.currentUser;\n    var studentCount = USERS.filter(function (x) { return x.role === \"student\"; }).length;\n    return (\n      '\u003cdiv class=\"demo-banner\">이 화면의 데이터는 이 브라우저에만 저장되는 체험용입니다. 다른 사람 브라우저와 공유되지 않아요.\u003c/div>' +\n      '\u003cdiv class=\"page-head\">\u003cdiv class=\"who\">' + esc(u.classroom) + \"\u003c/div>\u003ch1>\" + esc(u.name) + \" 선생님의 탐구공방\u003c/h1>\u003c/div>\" +\n      '\u003cdiv class=\"activity-list\">' + ACTIVITIES.map(activityCardTeacher).join(\"\") + \"\u003c/div>\" +\n      '\u003cp class=\"footnote\">전체 학생 ' + studentCount + \"명 (시드 데이터 기준)\u003c/p>\"\n    );\n  }\n\n  // ---------- teacher detail: picky-ai ----------\n  function viewTeacherDetail() {\n    var students = USERS.filter(function (u) { return u.role === \"student\"; });\n    var submittedCount = students.filter(function (s) {\n      var sub = getSubmission(\"act-picky-ai\", s.id);\n      return sub && sub.status === \"submitted\";\n    }).length;\n\n    var rows = students.map(function (s) {\n      var sub = getSubmission(\"act-picky-ai\", s.id);\n      var status = sub ? sub.status : \"not_started\";\n      var d = sub ? sub.data : {};\n      var lines = \"\";\n      if (d.diversitySlider !== undefined) {\n        lines += '\u003cdiv>다양성 조절 ' + d.diversitySlider + \"% · 재학습 \" + (d.retrainCount || 0) + \"회 · 최종 정확도 \" + (d.finalAccuracy != null ? d.finalAccuracy : \"-\") + \"%\u003c/div>\";\n      }\n      if (d.prediction) lines += '\u003cdiv class=\"quote\">1차 예상: “' + esc(d.prediction) + '”\u003c/div>';\n      if (d.reflection) lines += '\u003cdiv class=\"quote\">알게 된 것: “' + esc(d.reflection) + '”\u003c/div>';\n      if (!lines) lines = '\u003cdiv class=\"quote\">아직 진행한 내용이 없습니다.\u003c/div>';\n\n      var actionHtml = \"\";\n      if (status === \"submitted\") {\n        actionHtml = '\u003cbutton class=\"btn ghost\" style=\"margin-top:10px\" onclick=\"ATSS.reopenSubmission(\\'' + s.id + '\\')\">다시 제출하게 열어주기\u003c/button>';\n      } else if (status === \"reopened\") {\n        actionHtml = '\u003cdiv class=\"quote\" style=\"margin-top:6px\">✓ 학생에게 다시 제출할 기회를 열어줬어요. 학생이 고쳐서 다시 제출하면 자동으로 반영됩니다.\u003c/div>';\n      }\n\n      return (\n        '\u003cdiv class=\"card student-result\">' +\n          '\u003cdiv class=\"student-result-head\">\u003cspan class=\"student-result-name\">' + esc(s.name) + '\u003c/span>\u003cspan class=\"badge ' + status + '\">' + STATUS_LABEL[status] + \"\u003c/span>\u003c/div>\" +\n          '\u003cdiv class=\"student-result-data\">' + lines + \"\u003c/div>\" +\n          actionHtml +\n        \"\u003c/div>\"\n      );\n    }).join(\"\");\n\n    return (\n      '\u003ca class=\"back-link\" href=\"#\" onclick=\"ATSS.backToTeacherHome();return false;\">← 활동 목록\u003c/a>' +\n      '\u003cdiv class=\"page-head\" style=\"margin-top:8px\">\u003ch1>편식하는 AI — 결과 확인\u003c/h1>\u003c/div>' +\n      '\u003cdiv class=\"summary-strip\">제출 ' + submittedCount + \"/\" + students.length + \"명\u003c/div>\" +\n      '\u003cdiv class=\"activity-list\">' + rows + \"\u003c/div>\"\n    );\n  }\n\n  // ---------- student flow: picky-ai ----------\n  var RED_APPLES = [\"🍎\", \"🍎\", \"🍎\", \"🍎\", \"🍎\", \"🍎\"];\n  var APPLE_TRANSFORMS = [\n    \"rotate(-6deg) scale(.95)\", \"rotate(4deg)\", \"scaleX(-1) rotate(3deg)\",\n    \"rotate(-3deg) scale(1.05)\", \"rotate(6deg) scaleX(-1)\", \"rotate(-2deg)\"\n  ];\n  var TEST_SET = [\n    { emoji: \"🍎\", label: \"빨간 사과 A\", correct: true },\n    { emoji: \"🍎\", label: \"빨간 사과 B\", correct: true },\n    { emoji: \"🍏\", label: \"초록 사과\", correct: false },\n    { emoji: \"🍎\", label: \"흠집 사과\", correct: false, blemished: true }\n  ];\n  function accuracyFor(slider) { if (slider >= 70) return 100; if (slider >= 35) return 75; return 50; }\n  function compositionTiles(slider) {\n    var total = 6;\n    var greenCount = Math.round((slider / 100) * total);\n    var redCount = total - greenCount;\n    var tiles = [];\n    for (var i = 0; i \u003c redCount; i++) tiles.push(\"🍎\");\n    for (var j = 0; j \u003c greenCount; j++) tiles.push(\"🍏\");\n    return tiles.map(function (e, i) {\n      return '\u003cdiv class=\"apple-tile\">\u003cspan class=\"emoji-inner\" style=\"transform:' + APPLE_TRANSFORMS[i % APPLE_TRANSFORMS.length] + '\">' + e + \"\u003c/span>\u003c/div>\";\n    }).join(\"\");\n  }\n\n  function flowData() {\n    var sub = getSubmission(\"act-picky-ai\", state.currentUser.id);\n    return sub ? sub.data : {};\n  }\n  function dataMaxStep(d) {\n    if (d.reflection !== undefined) return 7;\n    if (d.retrainCount || d.diversitySlider !== undefined) return 6;\n    if (d.prediction !== undefined) return 5;\n    if (d.trainedOnce) return 4;\n    if (d.step1Started) return 2;\n    return 1;\n  }\n  function flowShell(step, title, bodyHtml, footerHtml, maxStep) {\n    var cap = Math.max(maxStep || 1, step);\n    var dots = [1, 2, 3, 4, 5, 6, 7].map(function (i) {\n      var on = i \u003c= step ? \" on\" : \"\";\n      if (i \u003c= cap) {\n        return '\u003cbutton class=\"dot-btn reachable\" onclick=\"ATSS.goStep(' + i + ')\" aria-label=\"' + i + '단계로 이동\">\u003cspan class=\"dot' + on + '\">\u003c/span>\u003c/button>';\n      }\n      return '\u003cspan class=\"dot-btn\">\u003cspan class=\"dot' + on + '\">\u003c/span>\u003c/span>';\n    }).join(\"\");\n    var reviewHint = cap > 1 ? '\u003cdiv class=\"review-hint\">위 단계 번호를 누르면 이전에 진행한 내용을 다시 볼 수 있어요\u003c/div>' : \"\";\n    return (\n      '\u003cdiv class=\"flow-wrap\">' +\n        '\u003ca class=\"back-link\" href=\"#\" onclick=\"ATSS.backToStudentHome();return false;\">← 활동 목록\u003c/a>' +\n        '\u003cdiv class=\"progress-dots\">' + dots + \"\u003c/div>\" +\n        reviewHint +\n        '\u003cdiv class=\"card flow-card\">' +\n          '\u003cdiv class=\"flow-title\">' + title + \"\u003c/div>\" +\n          '\u003cdiv class=\"flow-body\">' + bodyHtml + \"\u003c/div>\" +\n          '\u003cdiv class=\"flow-footer\">' + footerHtml + \"\u003c/div>\" +\n        \"\u003c/div>\" +\n        '\u003cdiv class=\"saving-note\" id=\"savingNote\">\u003c/div>' +\n      \"\u003c/div>\"\n    );\n  }\n\n  function viewFlow() {\n    var d = flowData();\n    var step = state.flowStep;\n    var name = esc(state.currentUser.name);\n    var maxStep = dataMaxStep(d);\n\n    if (step === 1) {\n      return flowShell(1, \"① 사과 분류 AI를 만들어보자\",\n        '\u003cp>' + name + \"님, 안녕하세요! 오늘은 사진을 보고 “이게 사과인지 아닌지” 맞히는 AI를 직접 학습시켜볼 거예요.\u003c/p>\" +\n        \"\u003cp>학습 데이터를 어떻게 구성하느냐에 따라 AI의 판단이 얼마나 달라지는지 직접 확인해봅시다.\u003c/p>\",\n        '\u003cbutton class=\"btn primary block\" onclick=\"ATSS.goStep(2)\">시작하기\u003c/button>',\n        maxStep\n      );\n    }\n\n    if (step === 2) {\n      var trained = !!d.trainedOnce;\n      var selectedCount = state.selectedApples.filter(Boolean).length;\n      var enoughSelected = selectedCount >= 3;\n      var appleTiles = RED_APPLES.map(function (e, i) {\n        var sel = state.selectedApples[i];\n        return (\n          '\u003cbutton class=\"apple-tile' + (sel ? \" selected\" : \"\") + '\" onclick=\"ATSS.toggleApple(' + i + ')\" ' + (trained ? \"disabled\" : \"\") + '>' +\n            '\u003cspan class=\"check\">✓\u003c/span>' +\n            '\u003cspan class=\"emoji-inner\" style=\"transform:' + APPLE_TRANSFORMS[i] + '\">' + e + \"\u003c/span>\" +\n          \"\u003c/button>\"\n        );\n      }).join(\"\");\n      var body =\n        \"\u003cp>빨간 사과 사진 6장 중, 학습에 쓸 사진을 3장 이상 골라주세요.\u003c/p>\" +\n        '\u003cdiv class=\"apple-grid\">' + appleTiles + \"\u003c/div>\" +\n        (!trained ? '\u003cdiv class=\"select-hint' + (enoughSelected ? \" enough\" : \"\") + '\">' + (enoughSelected ? \"✓ \" + selectedCount + \"장 선택됨 — 학습을 시작할 수 있어요\" : \"현재 \" + selectedCount + \"장 선택 · 3장 이상 골라야 학습할 수 있어요\") + \"\u003c/div>\" : \"\") +\n        (state.flowTraining ? '\u003cp class=\"training-note\">AI가 학습하고 있어요…\u003c/p>' : \"\") +\n        (trained ?\n          '\u003cdiv class=\"result-box\">\u003cdiv class=\"result-title\">테스트 결과 · 정확도 50%\u003c/div>\u003cdiv class=\"test-grid\">' +\n            TEST_SET.map(function (t) {\n              return (\n                '\u003cdiv class=\"test-tile ' + (t.correct ? \"correct\" : \"wrong\") + '\">' +\n                  (t.blemished ? '\u003cspan class=\"blemish-mark\">🟤\u003c/span>' : \"\") +\n                  '\u003cdiv class=\"emoji' + (t.blemished ? \" blemished\" : \"\") + '\">' + t.emoji + \"\u003c/div>\" +\n                  '\u003cdiv class=\"label\">' + t.label + '\u003c/div>\u003cdiv class=\"verdict\">' + (t.correct ? \"사과 맞음\" : \"오판\") + \"\u003c/div>\" +\n                \"\u003c/div>\"\n              );\n            }).join(\"\") +\n          \"\u003c/div>\u003c/div>\" : \"\");\n      var footer = trained\n        ? '\u003cbutton class=\"btn primary block\" onclick=\"ATSS.goStep(3)\">다음으로\u003c/button>'\n        : '\u003cbutton class=\"btn primary block\" onclick=\"ATSS.startTraining()\" ' + (state.flowTraining || !enoughSelected ? \"disabled\" : \"\") + \">\" + (state.flowTraining ? \"학습 중…\" : \"AI 학습시키기\") + \"\u003c/button>\";\n      return flowShell(2, \"② AI 학습시키기\", body, footer, maxStep);\n    }\n\n    if (step === 3) {\n      return flowShell(3, \"③ 방금 무슨 일이 있었나요?\",\n        \"\u003cp>방금 AI가 초록 사과와 흠집 사과를 “사과가 아니다”라고 오판했어요. 빨간 사과 사진으로만 학습했기 때문이에요.\u003c/p>\",\n        '\u003cbutton class=\"btn primary block\" onclick=\"ATSS.goStep(4)\">예상해보러 가기\u003c/button>',\n        maxStep\n      );\n    }\n\n    if (step === 4) {\n      var val = d.prediction || \"\";\n      return flowShell(4, \"④ 왜 그랬을지 예상해보기\",\n        '\u003ctextarea class=\"field\" id=\"predictionInput\" maxlength=\"200\" placeholder=\"AI가 왜 실패했을지, 어떻게 하면 더 잘 학습할 수 있을지 적어보세요 (200자 이내)\" oninput=\"ATSS.onPredictionInput(this.value)\">' + esc(val) + \"\u003c/textarea>\" +\n        '\u003cdiv class=\"char-count\" id=\"predictionCount\">' + val.length + \"/200\u003c/div>\",\n        '\u003cbutton class=\"btn primary block\" id=\"predictionSubmit\" onclick=\"ATSS.submitPrediction()\" ' + (val.trim() ? \"\" : \"disabled\") + \">제출하기\u003c/button>\",\n        maxStep\n      );\n    }\n\n    if (step === 5) {\n      var slider = d.diversitySlider || 0;\n      var retrainCount = d.retrainCount || 0;\n      var accBox = retrainCount > 0\n        ? '\u003cdiv class=\"accuracy-box\">\u003cdiv class=\"cap\">재학습 ' + retrainCount + \"회 · 정확도\u003c/div>\u003cdiv class=\\\"num\\\">\" + d.finalAccuracy + \"%\u003c/div>\u003c/div>\"\n        : \"\";\n      var body =\n        '\u003clabel class=\"slider-label\">학습 데이터의 다양성 (빨간 사과만 ↔ 다양한 사과)\u003c/label>' +\n        '\u003cinput type=\"range\" min=\"0\" max=\"100\" value=\"' + slider + '\" id=\"diversitySlider\" oninput=\"ATSS.onSliderInput(this.value)\">' +\n        '\u003cdiv class=\"slider-value\" id=\"sliderValue\">다양성 ' + slider + \"%\u003c/div>\" +\n        '\u003cdiv class=\"preview-label\">학습 데이터 구성 미리보기\u003c/div>' +\n        '\u003cdiv class=\"apple-grid small\" id=\"compositionPreview\">' + compositionTiles(slider) + \"\u003c/div>\" +\n        accBox;\n      var footer =\n        '\u003cbutton class=\"btn primary\" onclick=\"ATSS.retrain()\">다시 학습시키기\u003c/button>' +\n        (retrainCount > 0 ? '\u003cbutton class=\"btn ghost\" onclick=\"ATSS.goStep(6)\">다음으로\u003c/button>' : \"\");\n      return flowShell(5, \"⑤ 데이터를 다양하게 바꿔서 다시 학습시키기\", body, footer, maxStep);\n    }\n\n    if (step === 6) {\n      var rval = d.reflection || \"\";\n      var subNow = getSubmission(\"act-picky-ai\", state.currentUser.id);\n      var isReopen = subNow && subNow.status === \"reopened\";\n      var hint = isReopen\n        ? '\u003cdiv class=\"reopen-hint\">선생님이 다시 제출할 수 있게 열어줬어요. 아래 내용을 고쳐서 다시 제출해보세요.\u003c/div>'\n        : \"\";\n      return flowShell(6, \"⑥ 실험해보니 알게 된 것\",\n        hint +\n        '\u003ctextarea class=\"field\" id=\"reflectionInput\" maxlength=\"200\" placeholder=\"오늘 실험을 통해 알게 된 것을 짧게 정리해보세요 (200자 이내)\" oninput=\"ATSS.onReflectionInput(this.value)\">' + esc(rval) + \"\u003c/textarea>\" +\n        '\u003cdiv class=\"char-count\" id=\"reflectionCount\">' + rval.length + \"/200\u003c/div>\",\n        '\u003cbutton class=\"btn primary block\" id=\"reflectionSubmit\" onclick=\"ATSS.submitReflection()\" ' + (rval.trim() ? \"\" : \"disabled\") + \">\" + (isReopen ? \"다시 제출하기\" : \"제출하기\") + \"\u003c/button>\",\n        maxStep\n      );\n    }\n\n    // step 7\n    return flowShell(7, \"⑦ 오늘의 탐구, 이렇게 진행했어요\",\n      '\u003cdiv class=\"summary-row\">\u003cdiv class=\"summary-cap\">① 처음 시도 결과\u003c/div>\u003cdiv class=\"summary-val\">빨간 사과만으로 학습 → 정확도 50%(초록·흠집 사과를 오판)\u003c/div>\u003c/div>' +\n      '\u003cdiv class=\"summary-row\">\u003cdiv class=\"summary-cap\">② 내 예상\u003c/div>\u003cdiv class=\"summary-val\">' + esc(d.prediction || \"(입력 없음)\") + \"\u003c/div>\u003c/div>\" +\n      '\u003cdiv class=\"summary-row\">\u003cdiv class=\"summary-cap\">③ 다시 탐구한 결과\u003c/div>\u003cdiv class=\"summary-val\">재학습 ' + (d.retrainCount || 0) + \"회 · 최종 정확도 \" + (d.finalAccuracy != null ? d.finalAccuracy : \"-\") + \"%\u003c/div>\u003c/div>\" +\n      '\u003cdiv class=\"summary-row\">\u003cdiv class=\"summary-cap\">④ 알게 된 것\u003c/div>\u003cdiv class=\"summary-val\">' + esc(d.reflection || \"(입력 없음)\") + \"\u003c/div>\u003c/div>\" +\n      '\u003cp class=\"footnote\">' + name + \"님의 기록이 저장되었습니다.\u003c/p>\",\n      '\u003cbutton class=\"btn primary block\" onclick=\"ATSS.openGrowthRecord()\">성장기록실에서 보기\u003c/button>' +\n      '\u003cbutton class=\"btn ghost block\" onclick=\"ATSS.openQuestionModal()\">질문공방으로 이동\u003c/button>',\n      maxStep\n    );\n  }\n\n  // ---------- growth record (성장기록실) ----------\n  function recordCard(opts) {\n    return (\n      '\u003cdiv class=\"card record-card' + (opts.fresh ? \" fresh\" : \"\") + '\">' +\n        '\u003cdiv class=\"record-head\">' +\n          '\u003cdiv>\u003cspan class=\"tag subject\">' + esc(opts.subject) + \"\u003c/span> \" +\n          '\u003cspan class=\"record-title\">' + esc(opts.title) + \"\u003c/span>\u003c/div>\" +\n          (opts.fresh ? '\u003cspan class=\"fresh-badge\">방금 완료\u003c/span>' : '\u003cspan class=\"record-date\">' + esc(opts.date) + \"\u003c/span>\") +\n        \"\u003c/div>\" +\n        '\u003cdiv class=\"summary-row\">\u003cdiv class=\"summary-cap\">① 처음 시도 결과\u003c/div>\u003cdiv class=\"summary-val\">' + opts.b1 + \"\u003c/div>\u003c/div>\" +\n        '\u003cdiv class=\"summary-row\">\u003cdiv class=\"summary-cap\">② 내 예상\u003c/div>\u003cdiv class=\"summary-val\">' + opts.b2 + \"\u003c/div>\u003c/div>\" +\n        '\u003cdiv class=\"summary-row\">\u003cdiv class=\"summary-cap\">③ 다시 탐구한 결과\u003c/div>\u003cdiv class=\"summary-val\">' + opts.b3 + \"\u003c/div>\u003c/div>\" +\n        '\u003cdiv class=\"summary-row\">\u003cdiv class=\"summary-cap\">④ 알게 된 것\u003c/div>\u003cdiv class=\"summary-val\">' + opts.b4 + \"\u003c/div>\u003c/div>\" +\n      \"\u003c/div>\"\n    );\n  }\n  function viewGrowthRecord() {\n    var d = flowData();\n    var fresh = recordCard({\n      fresh: true, subject: \"정보 · 편식하는 AI\", title: \"편식하는 AI\",\n      b1: \"빨간 사과만으로 학습 → 정확도 50%(초록·흠집 사과를 오판)\",\n      b2: esc(d.prediction || \"(입력 없음)\"),\n      b3: \"재학습 \" + (d.retrainCount || 0) + \"회 · 정확도 50% → \" + (d.finalAccuracy != null ? d.finalAccuracy : \"-\") + \"%\",\n      b4: esc(d.reflection || \"(입력 없음)\")\n    });\n    var science = recordCard({\n      fresh: false, subject: \"과학\", title: \"광합성 속도, 온도를 바꾸면?\", date: \"지난주\",\n      b1: \"온도 20°C 고정 조건으로 1회 측정 → 결과가 들쑥날쑥함\",\n      b2: \"온도가 너무 낮거나 높으면 광합성이 느려질 것 같다.\",\n      b3: \"10 / 20 / 30°C로 나눠 반복 측정 → 25°C 근처에서 가장 활발함을 확인\",\n      b4: \"온도마다, 그리고 같은 온도라도 여러 번 재봐야 믿을 만한 결과가 나온다.\"\n    });\n    var korean = recordCard({\n      fresh: false, subject: \"국어\", title: \"이 글의 주장, 근거가 충분할까?\", date: \"2주 전\",\n      b1: \"근거 없이 결론만 있는 글을 그대로 받아들임\",\n      b2: \"이 주장은 다들 그렇게 생각할 것 같아서 근거가 없어도 되지 않을까?\",\n      b3: \"같은 주장에 근거를 1개 → 3개로 늘려가며 설득력 변화를 비교\",\n      b4: \"근거가 많고 구체적일수록 주장이 더 믿을 만하게 느껴진다.\"\n    });\n    return (\n      '\u003ca class=\"back-link\" href=\"#\" onclick=\"ATSS.backToStudentHome();return false;\">← 활동 목록\u003c/a>' +\n      '\u003cdiv class=\"page-head\" style=\"margin-top:8px\">\u003ch1>성장기록실\u003c/h1>\u003c/div>' +\n      '\u003cp class=\"summary-strip\">완성한 탐구 활동이 교과를 넘나들며 여기에 쌓여요.\u003c/p>' +\n      fresh + science + korean\n    );\n  }\n\n  function questionModal() {\n    if (!state.showQuestionModal) return \"\";\n    return (\n      '\u003cdiv class=\"modal-overlay\" onclick=\"if(event.target===this) ATSS.closeQuestionModal()\">' +\n        '\u003cdiv class=\"modal-box\">' +\n          \"\u003ch3>질문공방으로 이동\u003c/h3>\" +\n          \"\u003cp>질문공방은 아직 프로토타입 단계예요. 방금 탐구공방에서 남긴 예상·기록이 질문공방 대화의 출발점으로 자동 반영될 예정입니다. (실제 연결은 질문공방 프로토타입 제작 시 진행)\u003c/p>\" +\n          '\u003cbutton class=\"btn primary block\" onclick=\"ATSS.closeQuestionModal()\">확인했어요\u003c/button>' +\n        \"\u003c/div>\" +\n      \"\u003c/div>\"\n    );\n  }\n\n  // ---------- render ----------\n  function render() {\n    var app = document.getElementById(\"app\");\n    var inner;\n    if (state.view === \"login\") inner = viewLogin();\n    else if (state.view === \"student-home\") inner = viewStudentHome();\n    else if (state.view === \"student-flow\") inner = viewFlow();\n    else if (state.view === \"teacher-home\") inner = viewTeacherHome();\n    else if (state.view === \"teacher-detail\") inner = viewTeacherDetail();\n    else if (state.view === \"growth-record\") inner = viewGrowthRecord();\n    else inner = viewLogin();\n    app.innerHTML = shell(inner) + questionModal();\n  }\n\n  // ---------- controller ----------\n  var ATSS = {\n    login: function (id) {\n      var u = findUser(id);\n      if (!u) return;\n      state.currentUser = u;\n      state.view = u.role === \"teacher\" ? \"teacher-home\" : \"student-home\";\n      render();\n    },\n    logout: function () {\n      state.currentUser = null;\n      state.view = \"login\";\n      render();\n    },\n    openStudentFlow: function (slug) {\n      var a = findActivity(slug);\n      if (!a || !a.hasFlow) return;\n      state.flowStep = 1;\n      state.flowTraining = false;\n      state.selectedApples = [false, false, false, false, false, false];\n      var sub = getSubmission(\"act-picky-ai\", state.currentUser.id);\n      var d = sub ? sub.data : {};\n      // resume where the browser last left off\n      if (sub && sub.status === \"reopened\") state.flowStep = 6;\n      else if (d.reflection) state.flowStep = 7;\n      else if (d.retrainCount) state.flowStep = 5;\n      else if (d.prediction) state.flowStep = 5;\n      else if (d.trainedOnce) state.flowStep = 3;\n      state.view = \"student-flow\";\n      render();\n    },\n    backToStudentHome: function () { state.view = \"student-home\"; render(); },\n    backToTeacherHome: function () { state.view = \"teacher-home\"; render(); },\n    openTeacherDetail: function (slug) {\n      if (slug !== \"picky-ai\") return;\n      state.view = \"teacher-detail\";\n      render();\n    },\n    goStep: function (n) {\n      if (n === 2) {\n        upsertSubmission(\"act-picky-ai\", state.currentUser.id, { step1Started: true }, \"in_progress\");\n        state.selectedApples = [false, false, false, false, false, false];\n      }\n      state.flowStep = n;\n      render();\n    },\n    toggleApple: function (i) {\n      state.selectedApples[i] = !state.selectedApples[i];\n      render();\n    },\n    openGrowthRecord: function () { state.view = \"growth-record\"; render(); },\n    reopenSubmission: function (studentId) {\n      var sub = getSubmission(\"act-picky-ai\", studentId);\n      if (!sub) return;\n      submissions[subKey(\"act-picky-ai\", studentId)] = { status: \"reopened\", data: sub.data };\n      saveSubmissions();\n      render();\n    },\n    openQuestionModal: function () { state.showQuestionModal = true; render(); },\n    closeQuestionModal: function () { state.showQuestionModal = false; render(); },\n    startTraining: function () {\n      var selectedCount = state.selectedApples.filter(Boolean).length;\n      if (selectedCount \u003c 3) return;\n      state.flowTraining = true;\n      render();\n      setTimeout(function () {\n        state.flowTraining = false;\n        upsertSubmission(\"act-picky-ai\", state.currentUser.id, { trainedOnce: true }, \"in_progress\");\n        render();\n      }, 900);\n    },\n    onPredictionInput: function (val) {\n      var count = document.getElementById(\"predictionCount\");\n      var submitBtn = document.getElementById(\"predictionSubmit\");\n      if (count) count.textContent = val.length + \"/200\";\n      if (submitBtn) submitBtn.disabled = val.trim().length === 0;\n      window._pendingPrediction = val;\n    },\n    submitPrediction: function () {\n      var val = window._pendingPrediction != null ? window._pendingPrediction : flowData().prediction;\n      upsertSubmission(\"act-picky-ai\", state.currentUser.id, { prediction: val }, \"in_progress\");\n      note(\"저장됨\");\n      state.flowStep = 5;\n      render();\n    },\n    onSliderInput: function (val) {\n      var label = document.getElementById(\"sliderValue\");\n      if (label) label.textContent = \"다양성 \" + val + \"%\";\n      var preview = document.getElementById(\"compositionPreview\");\n      if (preview) preview.innerHTML = compositionTiles(Number(val));\n      window._pendingSlider = Number(val);\n    },\n    retrain: function () {\n      var slider = window._pendingSlider != null ? window._pendingSlider : (flowData().diversitySlider || 0);\n      var d = flowData();\n      var count = (d.retrainCount || 0) + 1;\n      var accuracy = accuracyFor(slider);\n      upsertSubmission(\"act-picky-ai\", state.currentUser.id, { diversitySlider: slider, retrainCount: count, finalAccuracy: accuracy }, \"in_progress\");\n      render();\n    },\n    onReflectionInput: function (val) {\n      var count = document.getElementById(\"reflectionCount\");\n      var submitBtn = document.getElementById(\"reflectionSubmit\");\n      if (count) count.textContent = val.length + \"/200\";\n      if (submitBtn) submitBtn.disabled = val.trim().length === 0;\n      window._pendingReflection = val;\n    },\n    submitReflection: function () {\n      var val = window._pendingReflection != null ? window._pendingReflection : flowData().reflection;\n      upsertSubmission(\"act-picky-ai\", state.currentUser.id, { reflection: val }, \"submitted\");\n      state.flowStep = 7;\n      render();\n    }\n  };\n\n  function note(text) {\n    var el = document.getElementById(\"savingNote\");\n    if (!el) return;\n    el.textContent = text;\n    setTimeout(function () { if (el) el.textContent = \"\"; }, 1200);\n  }\n\n  window.ATSS = ATSS;\n state.currentUser=findUser('student-1');state.view='student-flow';state.flowStep=1;render();\n})();\n\u003c/script>\n\n\u003cscript>document.addEventListener('click',function(e){const a=e.target.closest('a');if(a&&a.getAttribute('href')&&!a.getAttribute('href').startsWith('#'))e.preventDefault();});\u003c/script>\u003c/body>\u003c/html>\n", "grade": "", "school": "중학교", "mode": "온라인", "imported": true, "family": 3}, {"id": "ext-sorting-robot", "name": "성급한 정렬 로봇", "subject": "정보", "visual": "sort", "minutes": 20, "html": "\u003c!doctype html>\u003chtml>\u003chead>\u003cmeta charset=utf8>\u003cmeta name=viewport content=\"width=device-width,initial-scale=1,viewport-fit=cover\">\u003cstyle>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}\u003c/style>\u003c/head>\u003cbody>\n\u003ctitle>성급한 정렬 로봇\u003c/title>\n\n\u003cstyle>\n:root{\n  --bg:#EEF2F6; --surface:#FFFFFF; --surface-2:#E3E9F0;\n  --ink:#1C2733; --ink-muted:#5B6B7C; --accent:#FF7A45; --accent-ink:#2A1204;\n  --success:#1FA97F; --success-soft:#E3F5EE; --warn:#E5484D; --warn-soft:#FBE4E4;\n  --line:#D6DEE6; --tile-bg:#1C2733; --tile-ink:#F4F7FA; color-scheme:light;\n}\n@media (prefers-color-scheme: dark){\n  :root:not([data-theme=\"light\"]){\n    --bg:#0F151C; --surface:#1A222C; --surface-2:#212B37;\n    --ink:#ECF1F5; --ink-muted:#9FB0C0; --accent:#FF8A5B; --accent-ink:#1C0D02;\n    --success:#34D399; --success-soft:#123329; --warn:#F17075; --warn-soft:#3A1518;\n    --line:#2B3542; --tile-bg:#ECF1F5; --tile-ink:#131A22; color-scheme:dark;\n  }\n}\n:root[data-theme=\"dark\"]{\n  --bg:#0F151C; --surface:#1A222C; --surface-2:#212B37;\n  --ink:#ECF1F5; --ink-muted:#9FB0C0; --accent:#FF8A5B; --accent-ink:#1C0D02;\n  --success:#34D399; --success-soft:#123329; --warn:#F17075; --warn-soft:#3A1518;\n  --line:#2B3542; --tile-bg:#ECF1F5; --tile-ink:#131A22; color-scheme:dark;\n}\n\n*{box-sizing:border-box;}\nhtml,body{min-height:100%;}\nbody{background:var(--bg);color:var(--ink);font-family:\"Work Sans\",system-ui,sans-serif;padding-inline:16px;padding-block:16px 32px;display:flex;flex-direction:column;}\nh1,h2,h3{font-family:\"Fredoka\",\"Work Sans\",system-ui,sans-serif;font-weight:600;text-wrap:balance;margin:0;}\np{margin:0;}\n.mono{font-family:\"JetBrains Mono\", ui-monospace, monospace;}\n.tabular{font-variant-numeric:tabular-nums;}\n.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px;width:100%;flex:1;}\n\n.progress-shell{\n  position:sticky;top:env(safe-area-inset-top,0px);z-index:20;\n  background:color-mix(in srgb, var(--bg) 88%, transparent);backdrop-filter:blur(6px);\n  padding-block:10px;margin-inline:-16px;padding-inline:16px;border-bottom:1px solid var(--line);\n}\n.progress-track{max-width:640px;margin:0 auto;display:flex;gap:5px;}\n.progress-dot{flex:1;height:8px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);transition:background .25s ease, border-color .25s ease;}\n.progress-dot.done{background:var(--success);border-color:var(--success);}\n.progress-dot.current{background:var(--accent);border-color:var(--accent);}\n.progress-caption{max-width:640px;margin:6px auto 0;font-size:12px;color:var(--ink-muted);display:flex;justify-content:space-between;}\n\nheader.hero{display:flex;flex-direction:column;gap:8px;padding-top:2px;}\n.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);}\nheader.hero h1{font-size:clamp(24px,6vw,30px);}\nheader.hero .lede{color:var(--ink-muted);font-size:14px;line-height:1.5;max-width:56ch;}\n\ndetails.meta{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;}\ndetails.meta summary{cursor:pointer;font-weight:600;font-size:13px;color:var(--ink-muted);display:flex;align-items:center;gap:6px;}\ndetails.meta summary::marker{content:\"\";}\ndetails.meta summary::before{content:\"▸\";display:inline-block;transition:transform .15s ease;}\ndetails.meta[open] summary::before{transform:rotate(90deg);}\n.meta-table{margin-top:10px;width:100%;border-collapse:collapse;font-size:13px;}\n.meta-table td{padding:5px 6px;border-top:1px solid var(--line);vertical-align:top;}\n.meta-table td:first-child{color:var(--ink-muted);white-space:nowrap;width:110px;font-weight:600;}\n\n.stage{position:relative;flex:1;display:flex;}\n.screen{\n  display:none;flex-direction:column;gap:14px;\n  background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;\n  width:100%;\n}\n.screen.active{display:flex;animation:screenIn .28s ease both;}\n@keyframes screenIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}\n@media (prefers-reduced-motion: reduce){ .screen.active{animation:none;} }\n\n.screen-head{display:flex;align-items:center;justify-content:space-between;gap:10px;}\n.screen-head-left{display:flex;align-items:center;gap:10px;}\n.badge{font-family:\"Fredoka\",sans-serif;font-weight:600;font-size:13px;background:var(--tile-bg);color:var(--tile-ink);border-radius:999px;padding:4px 12px;flex-shrink:0;}\n.back-btn{background:transparent;border:none;color:var(--ink-muted);font-size:13px;padding:4px 6px;cursor:pointer;}\n.back-btn:hover{color:var(--ink);}\n\n.prompt{font-size:14px;line-height:1.6;color:var(--ink);}\n.prompt b{color:var(--accent);}\n\n.card-row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding-block:6px;}\n.num-card{\n  width:58px;height:74px;border-radius:12px;background:var(--tile-bg);color:var(--tile-ink);\n  display:flex;align-items:center;justify-content:center;font-family:\"JetBrains Mono\",monospace;\n  font-weight:700;font-size:20px;border:3px solid transparent;position:relative;\n  transition:border-color .2s ease, background .2s ease, transform .2s ease;\n}\n.num-card.compare{border-color:var(--accent);transform:translateY(-4px);}\n.num-card.flag{border-color:var(--warn);background:var(--warn-soft);color:var(--warn);}\n.num-card.flag::after{content:\"❗\";position:absolute;top:-10px;right:-6px;font-size:14px;}\n.num-card.settled{background:var(--success-soft);color:var(--success);}\n\n.ask-line{font-size:15px;text-align:center;font-weight:600;}\n.ask-line .mono{color:var(--accent);}\n\n.row-line{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;}\n.row-line.left{justify-content:flex-start;}\n.stat-pill{font-size:13px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:5px 12px;display:inline-flex;gap:6px;align-items:center;}\n.stat-pill b{font-family:\"JetBrains Mono\",monospace;}\n\nbutton{font-family:\"Work Sans\",sans-serif;font-weight:600;font-size:14px;border-radius:11px;padding:11px 18px;border:1px solid transparent;cursor:pointer;transition:transform .1s ease, background .15s ease;}\nbutton:focus-visible{outline:3px solid var(--accent);outline-offset:2px;}\nbutton:active{transform:scale(.97);}\nbutton.primary{background:var(--accent);color:var(--accent-ink);}\nbutton.ghost{background:var(--surface-2);color:var(--ink);border-color:var(--line);}\nbutton.big{font-size:15px;padding:13px 20px;}\nbutton:disabled{opacity:.45;cursor:not-allowed;transform:none;}\n\n.callout{border-left:4px solid var(--accent);background:var(--surface-2);border-radius:0 12px 12px 0;padding:12px 14px;font-size:14px;line-height:1.6;}\n.callout.win{border-left-color:var(--success);background:var(--success-soft);}\n.callout.warn{border-left-color:var(--warn);background:var(--warn-soft);}\n.robot-line{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.5;}\n.robot-emoji{font-size:22px;flex-shrink:0;}\n.speech{background:var(--surface-2);border-radius:12px;padding:10px 12px;flex:1;}\n\ntextarea{width:100%;min-height:90px;resize:vertical;font-family:\"Work Sans\",sans-serif;font-size:14px;line-height:1.6;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px;}\ntextarea:focus-visible{outline:3px solid var(--accent);outline-offset:1px;}\n.field-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px;color:var(--ink-muted);}\n.done-badge{font-size:12px;font-weight:700;color:var(--success);display:none;align-items:center;gap:4px;}\n.done-badge.show{display:inline-flex;}\n\n.summary-card{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;font-size:14px;line-height:1.6;}\n.summary-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding-bottom:8px;border-bottom:1px solid var(--line);}\n.summary-head .badge{font-size:12px;}\n.summary-head .std{font-size:12px;color:var(--ink-muted);}\n.summary-row b{display:block;font-size:12px;color:var(--ink-muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px;}\n.summary-row span{white-space:pre-wrap;}\n.copy-fallback{width:100%;min-height:120px;margin-top:6px;font-size:12px;}\n\n.modal-overlay{position:fixed;inset:0;background:color-mix(in srgb, #000 55%, transparent);display:none;align-items:center;justify-content:center;padding:20px;z-index:50;}\n.modal-overlay.show{display:flex;}\n.modal-box{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;max-width:380px;width:100%;display:flex;flex-direction:column;gap:12px;}\n.modal-box h3{font-size:16px;}\n.modal-box p{font-size:14px;line-height:1.6;color:var(--ink-muted);}\n\nfooter.end{text-align:center;color:var(--ink-muted);font-size:12px;padding-top:8px;}\n\n@media (prefers-reduced-motion: reduce){ *{transition:none !important;} }\n\u003c/style>\n\n\u003cdiv class=\"wrap\">\n\n  \u003cdiv class=\"progress-shell\">\n    \u003cdiv class=\"progress-track\" id=\"progressTrack\" role=\"progressbar\" aria-label=\"활동 진행률\" aria-valuemin=\"1\" aria-valuemax=\"7\" aria-valuenow=\"1\">\n      \u003cdiv class=\"progress-dot current\" data-step=\"1\">\u003c/div>\n      \u003cdiv class=\"progress-dot\" data-step=\"2\">\u003c/div>\n      \u003cdiv class=\"progress-dot\" data-step=\"3\">\u003c/div>\n      \u003cdiv class=\"progress-dot\" data-step=\"4\">\u003c/div>\n      \u003cdiv class=\"progress-dot\" data-step=\"5\">\u003c/div>\n      \u003cdiv class=\"progress-dot\" data-step=\"6\">\u003c/div>\n      \u003cdiv class=\"progress-dot\" data-step=\"7\">\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"progress-caption\">\u003cspan>①\u003c/span>\u003cspan id=\"progressText\">인트로\u003c/span>\u003c/div>\n  \u003c/div>\n\n  \u003cheader class=\"hero\">\n    \u003cspan class=\"eyebrow\">정보 · 알고리즘과 프로그래밍 · 탐구공방\u003c/span>\n    \u003ch1>성급한 정렬 로봇\u003c/h1>\n    \u003cp class=\"lede\">여러분이 직접 로봇에게 명령을 내려 숫자 카드를 정렬합니다. 딱 한 번만 훑고 \"완료!\"를 외치는 로봇 — 정말 다 된 걸까요?\u003c/p>\n  \u003c/header>\n\n  \u003cdetails class=\"meta\">\n    \u003csummary>교사용 활동 정보 보기\u003c/summary>\n    \u003ctable class=\"meta-table\">\n      \u003ctr>\u003ctd>subject\u003c/td>\u003ctd>정보\u003c/td>\u003c/tr>\n      \u003ctr>\u003ctd>domain\u003c/td>\u003ctd>알고리즘과 프로그래밍\u003c/td>\u003c/tr>\n      \u003ctr>\u003ctd>originalStandardCode\u003c/td>\u003ctd>[9정03-03] 알고리즘의 중요성을 이해하고, 문제를 해결하는 다양한 알고리즘을 비교·분석한다. / [9정03-02] 문제 해결을 위한 추상화의 중요성을 이해하고, 핵심요소를 중심으로 알고리즘을 표현한다.\u003c/td>\u003c/tr>\n      \u003ctr>\u003ctd>inquiryStage\u003c/td>\u003ctd>①문제·질문 인식 → ②예상·가설 세우기 → ③탐구·검증 수행 (탐구공방 담당 범위, 판단 근거 정교화는 질문공방으로)\u003c/td>\u003c/tr>\n      \u003ctr>\u003ctd>coreCompetency\u003c/td>\u003ctd>지식정보처리, 창의적사고\u003c/td>\u003c/tr>\n      \u003ctr>\u003ctd>studioModule\u003c/td>\u003ctd>탐구공방 (완료 후 질문공방으로 핸드오프, 결과는 성장기록실에 축적)\u003c/td>\u003c/tr>\n      \u003ctr>\u003ctd>activityFormat\u003c/td>\u003ctd>조작형 시뮬레이션(학생이 매 비교마다 \"바꿔라/그대로 둬라\" 직접 명령)\u003c/td>\u003c/tr>\n      \u003ctr>\u003ctd>설계 의도\u003c/td>\u003ctd>학생이 매 비교를 직접 명령해 로봇을 조작하는 손맛(직접 조작)과, \"1번만 훑으면 성급하게 완료로 오판한다\"는 발견형 문제의식을 함께 살림. 화면은 스크롤형이 아니라 한 번에 한 화면만 보이는 단계형(버튼으로 다음 화면 전환)으로 구성.\u003c/td>\u003c/tr>\n    \u003c/table>\n  \u003c/details>\n\n  \u003cdiv class=\"stage\">\n\n  \u003c!-- ① 인트로 -->\n  \u003csection class=\"screen active\" id=\"screen1\">\n    \u003cdiv class=\"screen-head\">\u003cdiv class=\"screen-head-left\">\u003cspan class=\"badge\">① 인트로\u003c/span>\u003c/div>\u003c/div>\n    \u003cp class=\"prompt\">숫자 카드 6장을 순서대로 정리하는 일을 \u003cb>정렬 로봇\u003c/b>에게 맡겨볼 거예요. 로봇에게 명령은 여러분이 직접 내립니다.\u003c/p>\n    \u003cdiv class=\"row-line\">\u003cbutton class=\"primary big\" id=\"go2\" type=\"button\">시작하기 →\u003c/button>\u003c/div>\n  \u003c/section>\n\n  \u003c!-- ②(신규) 발견형 도입 -->\n  \u003csection class=\"screen\" id=\"screen2\">\n    \u003cdiv class=\"screen-head\">\u003cdiv class=\"screen-head-left\">\u003cbutton class=\"back-btn\" id=\"back2\" type=\"button\">← 이전\u003c/button>\u003cspan class=\"badge\">② 발견형 도입\u003c/span>\u003c/div>\u003c/div>\n    \u003cp class=\"prompt\">로봇의 규칙은 단순해요 — \u003cb>왼쪽 끝부터 순서대로, 이웃한 두 카드씩 딱 한 번만\u003c/b> 비교합니다. 여러분이 매번 \"바꿔라\" 또는 \"그대로 둬라\"를 명령해주세요.\u003c/p>\n\n    \u003cdiv class=\"card-row\" id=\"cards2\">\u003c/div>\n\n    \u003cdiv id=\"playArea2\">\n      \u003cp class=\"ask-line\" id=\"ask2\">\u003c/p>\n      \u003cdiv class=\"row-line\">\n        \u003cbutton class=\"primary\" id=\"swap2\" type=\"button\">🔁 자리를 바꿔요\u003c/button>\n        \u003cbutton class=\"ghost\" id=\"hold2\" type=\"button\">➡ 이대로 둬요\u003c/button>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"robot-line\" id=\"robotSay2\" style=\"display:none;\">\n      \u003cspan class=\"robot-emoji\">🤖\u003c/span>\n      \u003cspan class=\"speech\" id=\"robotSpeech2\">\u003c/span>\n    \u003c/div>\n    \u003cdiv class=\"row-line\" id=\"checkRow2\" style=\"display:none;\">\n      \u003cbutton class=\"primary\" id=\"checkNow2\" type=\"button\">진짜 다 됐는지 확인해보기 🔍\u003c/button>\n    \u003c/div>\n    \u003cdiv class=\"callout warn\" id=\"discover2\" style=\"display:none;\">\n      \u003cp id=\"discoverMsg2\">\u003c/p>\n      \u003cdiv class=\"row-line\" style=\"justify-content:flex-start;margin-top:10px;\">\u003cbutton class=\"primary\" id=\"go3\" type=\"button\">다음: 문제 상황 확인하
