function lhHome(){const r=lhRows(),feedback=r.filter(x=>x.feedback.length);return `<div class="lh-section-label">MY LEARNING</div><h1>${esc(lhStudent)}의 학습 공간</h1><p class="lh-sub">수업에서 한 활동이 나의 기록으로 이어집니다.</p>${lhStats()}<div class="lh-grid"><section><h2>이번 수업</h2>${lhState.assignments.length?lhState.assignments.map(a=>`<div class="lh-box lh-student-assignment"><h3>${esc(a.activity.name)}</h3><p>${esc(a.activity.subject)} · ${a.activity.minutes}분 · ${esc(a.activity.grade)}</p><button class="primary" data-lh-perform="${a.id}">활동 시작</button></div>`).join(''):'<div class="lh-box"><p>배포된 활동이 없습니다. 교사 화면에서 활동을 골라 배포해 보세요.</p><button data-lh="teacher">교사 화면으로</button></div>'}<h2>최근 활동</h2>${r.slice(0,3).map(lhCard).join('')||lhEmpty('첫 활동을 기다리고 있어요')}</section><aside><div class="lh-box"><h2>교사 피드백</h2>${feedback.slice(0,3).map(x=>`<div class="lh-row"><div><strong>${esc(x.activity.name)}</strong><p>${esc(x.feedback.at(-1).text)}</p>${lhLink(x)}</div></div>`).join('')||'<p>아직 받은 피드백이 없습니다.</p>'}</div><div class="lh-box"><h2>나의 학습 기록</h2><p>모든 제출은 Learning History에, 내가 고른 활동은 Portfolio에 모입니다.</p><div class="lh-actions"><button data-lh="history">Learning History</button><button data-lh="portfolio">Portfolio</button></div></div><div class="lh-box"><h2>학습 세계 미리보기</h2><p>기록이 어떤 학습 공간으로 이어지는지 살펴보세요.</p><button data-lh="world">나의 Learning World 보기 →</button></div></aside></div>`}
function lhHistory(){const r=lhRows(),months=[...new Set(r.map(x=>x.updated.slice(0,7)))];return `<h1>나의 Learning History</h1><p class="lh-sub">모든 활동의 제출·피드백·수정 과정을 시간순으로 확인합니다.</p>${lhSubject?`<p>${esc(lhSubject)} 활동 ${r.length}개 <button id="lh-all-subjects">전체 기록</button></p>`:''}${months.map(m=>`<section class="lh-line"><h2>${m.replace('-','년 ')}월</h2>${r.filter(x=>x.updated.startsWith(m)).map(lhCard).join('')}</section>`).join('')||lhEmpty('아직 제출한 활동이 없어요')}`}
function lhRecord(){const r=lhState.records.find(x=>x.id===lhRecordId);if(!r||r.student!==lhStudent)return lhEmpty('기록을 찾을 수 없어요');const events=[...r.attempts.map((x,i)=>({...x,event:'attempt',label:i?'수정한 내용 · '+i+'차 재제출':'처음 제출한 내용'})),...r.feedback.map(x=>({...x,event:'feedback',label:'교사 피드백'}))].sort((a,b)=>a.at.localeCompare(b.at));return `<button data-lh="${lhTeacher?'growth':'history'}">← ${lhTeacher?'학생 성장':'Learning History'}</button><h1 style="margin-top:22px">${esc(r.activity.name)}</h1>${lhTags(r)}<div class="lh-grid"><section><details class="lh-box"><summary>활동 자료와 질문</summary><p class="lh-content">${esc(r.activity.material)}</p><p>${esc(r.activity.question)}</p></details><div class="lh-line">${events.map(e=>`<section class="lh-box"><p class="lh-mini">${lhDate(e.at)}</p><h2>${e.label}</h2><p class="lh-content">${esc(e.answer||e.text||'')}</p>${e.event==='attempt'?`<p>선택: ${esc(e.choice||'서술형')} · 도움말 ${e.hints}회</p><details><summary>수행 과정 ${e.process.length}건</summary>${e.process.map((p,i)=>`<p>${i+1}. ${esc(p.choice||'')} ${esc(p.answer||p.text||'')}</p>`).join('')||'<p>별도 과정 기록 없음</p>'}</details>`:''}</section>`).join('')}</div>${lhTeacher?`<section class="lh-box"><h2>평가·피드백</h2><textarea class="lh-input" id="lh-feedback" placeholder="어떤 점이 달라졌고, 다음에 무엇을 보완하면 좋을까요?"></textarea><button class="primary" id="lh-feedback-save">피드백 보내기</button><p class="lh-mini">기존 학생 결과 화면의 평가와도 연결됩니다.</p></section>`:`<section class="lh-box"><h2>수정하고 다시 제출</h2><p>앞선 답변과 피드백을 참고하세요. 처음 제출한 내용도 유지됩니다.</p><textarea class="lh-input" id="lh-revision">${esc(r.attempts.at(-1).answer)}</textarea><button class="primary" id="lh-revise-save">수정본 제출</button></section>`}</section><aside><section class="lh-box"><h2>나의 성찰</h2><p>무엇을 바꾸었고, 새롭게 알게 되었나요?</p><textarea class="lh-input" id="lh-reflection" ${lhTeacher?'readonly':''}>${esc(r.reflection||'')}</textarea>${lhTeacher?'':'<button id="lh-reflect-save">성찰 저장</button>'}</section><section class="lh-box"><h2>Portfolio</h2><p>의미 있는 활동을 골라 모아 보세요.</p><label>선택 이유<select class="lh-reason" id="lh-reason" ${lhTeacher?'disabled':''}>${['가장 잘했다고 생각하는 활동','어려웠지만 해결한 활동','많이 수정하면서 좋아진 활동','친구들과 협력한 활동','기억에 남는 프로젝트'].map(t=>`<option ${r.reason===t?'selected':''}>${t}</option>`).join('')}</select></label>${lhTeacher?`<p>${r.portfolio?'대표 활동으로 선택됨':'대표 활동 미선택'}</p>`:`<div class="lh-actions"><button id="lh-portfolio-toggle">${r.portfolio?'★ 포트폴리오에서 빼기':'☆ 포트폴리오에 담기'}</button></div>`}</section></aside></div>`}
function lhPortfolio(){const r=lhRows().filter(x=>x.portfolio);return `<h1>나의 Portfolio</h1><p class="lh-sub">Learning History ${lhRows().length}개 중 내가 선택한 대표 활동 ${r.length}개</p>${r.map(x=>`<section class="lh-box"><h2>${esc(x.activity.name)}</h2>${lhTags(x)}<p><strong>선택 이유</strong> · ${esc(x.reason||'')}</p><p class="lh-content">${esc(x.reflection||'성찰을 남기면 선택한 이유를 더 잘 기억할 수 있어요.')}</p>${lhLink(x)}</section>`).join('')||`<div class="lh-empty"><h2>나만의 대표 활동을 골라 보세요</h2><p>활동 상세에서 ☆ 포트폴리오에 담기를 누르면 됩니다.</p><button data-lh="history">Learning History에서 고르기</button></div>`}`}
function lhAI(){const r=lhRows(),revised=r.filter(x=>x.attempts.length>1),reflection=r.filter(x=>x.reflection);return `<h1>AI 성장 요약</h1><p class="lh-note">다음 단계 Preview · 생성형 AI는 연결하지 않았습니다. 아래 문장은 실제로 저장된 기록의 수와 수정 여부를 읽어 만든 요약입니다.</p>${r.length<2?'<div class="lh-empty"><h2>활동 기록이 조금 더 필요해요</h2><p>두 개 이상의 활동을 수행한 뒤 돌아와 주세요.</p></div>':`<div class="lh-box"><h2>기록에서 확인한 변화</h2><p>현재 활동 ${r.length}개 중 ${revised.length}개에서 첫 제출 후 내용을 다시 제출했습니다. 답변이 어떻게 바뀌었는지 직접 비교해 보세요.</p>${(revised.length?revised:r).slice(0,3).map(x=>`<div class="lh-row"><span>${esc(x.activity.name)}</span>${lhLink(x)}</div>`).join('')}<p class="lh-mini">수정 횟수만으로 학습 능력이나 답변의 질을 판단하지 않습니다.</p></div><div class="lh-box"><h2>나의 생각을 남긴 기록</h2><p>${reflection.length}개 활동에 성찰을 남겼습니다.</p>${reflection.slice(0,3).map(lhCard).join('')}</div><div class="lh-box"><h2>다음 활동 제안</h2><p>서로 다른 자료의 근거를 비교하는 활동을 살펴보세요. 수행 기록을 읽고 다음 수업을 정하는 예시입니다.</p><button data-lh="teacher">활동 찾아보기</button></div>`}`}
function lhGrowth(){const r=lhRows(),counts=Object.fromEntries(activityTypeRegistry.map(t=>[t,r.filter(x=>x.activity.activityTypes.includes(t)).length])),max=Math.max(1,...Object.values(counts));return `<div class="lh-tabs"><button data-lh="results">학생 결과</button><button class="active">학생 성장</button></div><h1>${esc(lhStudent)}의 학생 성장</h1><p class="lh-sub">점수 대신 경험한 활동과 수정 과정을 함께 확인합니다.</p>${lhStats()}<div class="lh-grid"><section><h2>누적 활동</h2>${r.map(lhCard).join('')||lhEmpty('아직 기록이 없습니다')}</section><aside class="lh-box"><h2>경험한 활동 유형</h2>${Object.entries(counts).filter(([t,n])=>n).map(([t,n])=>`<div class="lh-meter"><span>${t}</span><progress value="${n}" max="${max}" aria-label="${t} ${n}개"></progress><strong>${n}개</strong></div>`).join('')||'<p>활동을 제출하면 유형별 경험이 나타납니다.</p>'}<p class="lh-mini">활동 한 개에 여러 유형이 포함될 수 있습니다. 막대 길이는 수행한 활동 수이며 능력 점수가 아닙니다.</p></aside></div>`}
function lhWorld(){const all=lhRows();const places=[['중앙 아카데미','전체','◎'],['테크 연구소','정보','⌘'],['과학관','과학','⚗'],['도서관','국어','▤'],['아트센터','미술','◇'],['스포츠센터','체육','◉']];return `<h1>나의 Learning World</h1><p class="lh-note">Preview · 학습 경험을 공간으로 살펴봅니다. 공간을 선택하면 그 공간과 연결된 실제 활동 기록이 열립니다.</p><div class="lh-world">${places.map(([n,subject,icon])=>{const count=subject==='전체'?all.length:all.filter(x=>x.activity.subject===subject).length;return `<button class="lh-building" data-lh-world="${subject}" ${count?'':'disabled'}><span class="lh-icon">${icon}</span><strong>${n}</strong><span>${count?count+'개 활동 · 기록 보기 →':'아직 연결된 활동 없음'}</span></button>`}).join('')}</div><p>Learning World는 기록을 시각화하는 선택 모듈입니다. 활동 기록과 Portfolio는 이 공간과 독립적으로 유지됩니다.</p>`}
function lhPerform(){const assignment=lhState.assignments.find(x=>x.id===lhRecordId);if(!assignment)return lhEmpty('배포된 활동을 찾을 수 없어요');const a=assignment.activity;return `<h1>${esc(a.name)}</h1><p>${esc(a.subject)} · ${a.minutes}분</p><div class="lh-steps">${(a.stages||[]).map((t,i)=>`<span>${['도입','전개','결론'][i]} · ${esc(t)}</span>`).join('')}</div><div class="lh-grid"><section class="lh-box"><h2>활동 자료</h2><button id="lh-original-activity">기존 활동 화면 열기</button><p class="lh-content">${esc(a.material)}</p><h2>활동 질문</h2><p>${esc(a.question)}</p>${a.options?`<label>선택<select id="lh-choice"><option value="">선택해 주세요</option>${a.options.map(t=>`<option>${esc(t)}</option>`).join('')}</select></label>`:''}<label>나의 답변<textarea class="lh-input" id="lh-answer" placeholder="활동 결과와 판단한 근거를 적어 주세요."></textarea></label><label>수행 과정<textarea class="lh-input" id="lh-process" placeholder="어떤 순서로 생각하고 해결했나요?"></textarea></label><details id="lh-hint"><summary>도움말 보기</summary><p>자료에서 판단의 근거를 찾고, 단계별로 생각을 정리해 보세요.</p></details><p class="lh-alert" id="lh-form-error" role="alert"></p><button class="primary" id="lh-submit">활동 결과 제출</button></section><aside class="lh-box"><h2>학습 목표</h2><p class="lh-content">${esc(a.goal)}</p><h2>평가 기준</h2><ul>${a.evaluation.map(e=>`<li>${esc(e.question)}</li>`).join('')}</ul><p>제출하면 Learning History에 자동으로 저장됩니다.</p></aside></div>`}
function lhRender(){const choices=[...new Set(['체험 학생',...lhState.records.map(r=>r.student)])];app.innerHTML=lhHeader()+`<main class="lh-shell"><div class="section-line"><label>${lhTeacher?'학생 선택':'체험 학생'} <select id="lh-student">${choices.map(n=>`<option ${n===lhStudent?'selected':''}>${esc(n)}</option>`).join('')}</select></label><span class="lh-mini">중·고등 학습활동 플랫폼</span></div>${lhIntro()}<div style="height:26px"></div>${({home:lhHome,history:lhHistory,record:lhRecord,portfolio:lhPortfolio,ai:lhAI,world:lhWorld,growth:lhGrowth,perform:lhPerform}[lhPage]||lhHome)()}<div class="lh-actions"><button id="lh-demo" ${lhState.exampleLoaded?'disabled':''}>${lhState.exampleLoaded?'예시 기록을 불러왔습니다':'예시 학습 기록 불러오기'}</button></div></main>`;lhBind()}
function lhGo(page){if(page==='teacher'||page==='results'){lhPage='';lhTeacher=false;if(page==='results'){mode='results';view='browse'}render();return}if(page==='growth')lhTeacher=true;else if(page!=='record')lhTeacher=false;lhPage=page;lhRender();window.scrollTo(0,0)}
function lhBind(){app.querySelectorAll('[data-lh]').forEach(b=>b.onclick=()=>lhGo(b.dataset.lh));app.querySelectorAll('[data-lh-record]').forEach(b=>b.onclick=()=>{lhRecordId=b.dataset.lhRecord;lhGo('record')});document.getElementById('lh-student').onchange=e=>{lhStudent=e.target.value;lhSubject='';lhPersist();lhRender()};const on=(id,fn)=>{const el=document.getElementById(id);if(el)el.onclick=fn};on('lh-all-subjects',()=>{lhSubject='';lhRender()});on('lh-demo',lhSeed);app.querySelectorAll('[data-lh-world]').forEach(b=>b.onclick=()=>{lhSubject=b.dataset.lhWorld==='전체'?'':b.dataset.lhWorld;lhGo('history')});app.querySelectorAll('[data-lh-perform]').forEach(b=>b.onclick=()=>{lhRecordId=b.dataset.lhPerform;lhGo('perform')});const r=lhState.records.find(x=>x.id===lhRecordId);on('lh-reflect-save',()=>{r.reflection=document.getElementById('lh-reflection').value;lhPersist();lhRender()});on('lh-portfolio-toggle',()=>{r.portfolio=!r.portfolio;r.reason=document.getElementById('lh-reason').value;lhPersist();lhRender()});on('lh-revise-save',()=>{const answer=document.getElementById('lh-revision').value.trim();if(!answer)return;const at=new Date().toISOString();r.attempts.push({at,answer,choice:r.attempts.at(-1).choice,hints:0,process:[]});r.updated=at;r.status='미평가';r.ratings=r.activity.evaluation.map(()=>'');lhSyncSubmission(r);lhPersist();lhRender()});on('lh-feedback-save',()=>{const text=document.getElementById('lh-feedback').value.trim();if(!text)return;r.feedback.push({at:new Date().toISOString(),text,author:'교사'});lhSyncSubmission(r);lhPersist();lhRender()});on('lh-original-activity',()=>{const a=lhState.assignments.find(x=>x.id===lhRecordId).activity;selected=a.id;for(const id of ['student-dialog','worksheet-dialog','result-dialog'])if(!document.getElementById(id)){const d=document.createElement('dialog');d.id=id;app.append(d)}openStudent();const name=document.getElementById('student-name');if(name)name.value=lhStudent});let hints=0;const hint=document.getElementById('lh-hint');if(hint)hint.ontoggle=()=>{if(hint.open)hints++};on('lh-submit',()=>{const a=lhState.assignments.find(x=>x.id===lhRecordId).activity,answer=document.getElementById('lh-answer').value.trim(),choice=document.getElementById('lh-choice')?.value||'',process=document.getElementById('lh-process').value.trim();if(!answer||(a.options&&!choice)){document.getElementById('lh-form-error').textContent='답변과 선택을 확인해 주세요.';return}saveSubmission(a,{name:lhStudent,answer,choice,hints,attempts:process?[{answer:process}]:[],evaluationAnswers:a.evaluation.map(()=> '활동 결과로 확인')});lhGo('history')})}
function lhSyncSubmission(r){let sub=submissions.find(s=>s.id===r.submissionId);const last=r.attempts.at(-1);if(!sub){sub={id:r.submissionId,activityId:r.activity.id,activityName:r.activity.name,subject:r.activity.subject,material:r.activity.material,question:r.activity.question,solution:r.activity.solution,correct:r.activity.correct||'',name:r.student,evaluation:r.activity.evaluation,evaluationAnswers:r.activity.evaluation.map(()=> '활동 결과로 확인'),created:r.created,reviewed:false,ratings:r.activity.evaluation.map(()=>''),status:'미평가',example:!!r.example};submissions.unshift(sub)}Object.assign(sub,{answer:last.answer,choice:last.choice,hints:last.hints,attempts:r.attempts.slice(0,-1).map(x=>({answer:x.answer,choice:x.choice})),comment:r.feedback.at(-1)?.text||'',ratings:r.ratings||sub.ratings,status:r.status||sub.status})}
const lhOriginalSave=saveSubmission;saveSubmission=function(a,data){const sub=lhOriginalSave(a,data);sub.id=lhId();const at=sub.created;let r=lhState.records.find(x=>x.student===data.name&&x.activity.id===a.id&&!x.example);if(!r){r={id:lhId(),submissionId:sub.id,student:data.name,activity:lhSnapshot(a),created:at,updated:at,attempts:[],feedback:[],reflection:'',portfolio:false,reason:'',example:false};lhState.records.push(r)}else{submissions.splice(submissions.indexOf(sub),1);r.submissionId=r.submissionId||sub.id}r.attempts.push({at,answer:data.answer,choice:data.choice||'',process:structuredClone(data.attempts||[]),hints:data.hints||0});r.updated=at;r.status='미평가';r.ratings=r.activity.evaluation.map(()=>'');lhStudent=data.name;lhSyncSubmission(r);lhPersist();return sub};
for(const r of lhState.records)lhSyncSubmission(r);
function lhSyncReviews(){let changed=false;for(const r of lhState.records){const s=submissions.find(x=>x.id===r.submissionId);if(!s)continue;if(s.comment&&s.comment!==r.feedback.at(-1)?.text){r.feedback.push({at:new Date().toISOString(),text:s.comment,author:'교사'});changed=true}r.ratings=s.ratings;r.status=s.status}if(changed)lhPersist()}

<script>
function refPicture(a){let cls='',art='';if(a.id===mission.id){cls='ref-mission';art='<i class="ref-book"></i>'.repeat(5)}else if(a.id===topic.id){cls='ref-topic';art='<i class="ref-bin"></i>'.repeat(3)}else if(a.id==='sort'||a.family===1){cls='ref-sort';art=[1,3,5,7,9].map(n=>`<span class="ref-num ${n===5?'selected':''}">${n}</span>`).join('')}else if(a.family===0){art='<span class="ref-group"><i class="ref-dot"></i><i class="ref-dot"></i></span><span class="ref-group"><i class="ref-tri"></i><i class="ref-tri"></i></span>'}else{cls='ref-generic';art='<span class="ref-sheet"><i></i><i></i><i></i></span>'}return `<div class="ref-picture ${cls}" aria-hidden="true">${art}</div>`}
uiActivity=function(a){const kind=a.id===topic.id?'topic':a.id===mission.id?'mission':'basic';return `<article class="ui-activity-card" data-card-kind="${kind}">${refPicture(a)}<div class="activity-body"><span class="ui-chip">${lhKind(a)}</span><h3>${esc(a.name)}</h3><p class="meta">${esc(a.grade||'중1')} · ${a.minutes||20}분 · ${esc(a.mode||shortNames[a.family||0])}</p><button data-ui-activity="${a.id}">활동 살펴보기</button></div></article>`};
const refOldRecent=uiRecentLessons;uiRecentLessons=function(){let h=refOldRecent();for(const item of lhState.assignments){const a={...get(item.activity.id),...item.activity};h=h.replace(cover(a),refPicture(a))}return h};
const refEnhance=uxEnhance;uxEnhance=function(){refEnhance();app.querySelectorAll('.ui-activity-track').forEach(track=>{track.removeAttribute('tabindex');track.removeAttribute('aria-label');track.removeAttribute('role');track.onkeydown=null;const panel=track.closest('.ui-panel');panel?.querySelectorAll('[data-ui="prev"],[data-ui="next"]').forEach(b=>b.remove());track.querySelectorAll('[data-ui-reuse]').forEach(b=>{const item=lhState.assignments.find(x=>x.id===b.dataset.uiReuse);if(item){b.textContent='다시 사용';b.closest('article').dataset.cardKind=item.activity.id===topic.id?'topic':item.activity.id===mission.id?'mission':'basic'}})})};
interfaceReady=true;interfaceUI.seed();render();
app.querySelector('h1')?.setAttribute('tabindex','-1');
app.querySelector('h1')?.focus({preventScroll:true});
</script>

    const html = c.length ? `<nav class="ui-breadcrumb v9-crumb" aria-label="현재 위치">${c.map(([t, k]) => k ? `<button type="button" class="v9-cl" data-v9-crumb="${k}">${t}</button>` : `<span>${t}</span>`).join('<i aria-hidden="true">›</i>')}</nav>` : '<span></span>';
    return h.replace(/<span class="ui-breadcrumb">[^<]*<\/span>/, html);

  const prevSide = uiSide;
  uiSide = function (student) { let h = prevSide(student); if (student) return h; return h.replace('⇄ 학생 화면', '학생 화면 미리보기').replace(/<p class="ui-footer-note">[^<]*<\/p>/, ''); };
  document.addEventListener('click', e => { const b = e.target.closest && e.target.closest('.ui-side [data-ui]'); if (b && b.textContent.includes('학생 화면 미리보기')) { e.stopImmediatePropagation(); e.preventDefault(); V7.stu.step = 1; v7Go('student'); } }, true);
  const prev = render;

        card.classList.add('v9-click'); card.onclick = ev => { if (ev.target.closest('button,a,input')) return; selected = id; uiTeacherHome = false; lhPage = ''; lhTeacher = false; v27View = ''; go_detail(); };

      if (mode === 'my' && !uiTeacherHome && !v27View) app.querySelectorAll('.my-lesson').forEach(card => {

      });

  };
  function go_detail() { go('detail'); }
})();


/* ---------- v27d: 독립 점검 반영 ---------- */
(function () {

    const b = e.target.closest && e.target.closest('[data-v9-crumb]'); if (!b) return;

        const sits = app.querySelector('.v25-sits'); if (sits && !sits.previousElementSibling?.classList?.contains('v10-lab')) sits.insertAdjacentHTML('beforebegin', '<h2 class="v10-lab">이럴 때 쓰기 좋아요</h2>');
      }
      // 검색 결과 내부 문구 정리
      app.querySelectorAll('.v18-answer *').forEach(el => { if (el.children.length === 0 && /기존 활동에서 골랐어요/.test(el.textContent)) el.textContent = el.textContent.replace(/기존 활동에서 골랐어요\s*·\s*체험용 조건 검색/, '').trim(); });
      const ansEl = app.querySelector('.v18-answer'); if (ansEl && !ansEl.dataset.v10n) { const more = [...ansEl.querySelectorAll('*')].find(x => x.children.length === 0 && /^\d+개 더 있어요$/.test(x.textContent.trim())); const tt = [...ansEl.querySelectorAll('h2,h3,strong,b,p,span')].find(x => /^활동 \d+개를 찾았어요$/.test(x.textContent.trim()));
        if (more && tt) { const m = +more.textContent.match(/\d+/)[0], s = +tt.textContent.match(/\d+/)[0]; tt.textContent = `활동 ${m + s}개를 찾았어요 · 잘 맞는 ${s}개`; more.textContent = `나머지 ${m}개`; ansEl.dataset.v10n = 1; } }
      // 카드 그림 위 '활동지' 배지 제거 (NEW로 충분)
      app.querySelectorAll('.v27-card .v24-badge, .v18-answer .v24-badge').forEach(x => x.remove());
      // 활동 목록: 아래 '내 자료로 활동 만들기' 정리, 제목 옆 활동지 만들기
      if (view === 'browse' && mode === 'activities' && !uiTeacherHome && !v27View) {
        app.querySelectorAll('button').forEach(b => { if (/내 자료로 활동 만들기/.test(b.textContent)) { const p = b.parentElement; if (p && p.textContent.trim().length < 140 && !p.querySelector('.v16-card, h1')) p.remove(); else b.remove(); } });
        const h = [...app.querySelectorAll('h1')].find(x => x.textContent.trim() === '활동 목록');

        const note = [...app.querySelectorAll('.v7 > .v7-help')].find(x => /이유는/.test(x.textContent)); const card = app.querySelector('.v7-card'); if (note && card) { note.classList.add('v10-in'); card.append(note); }
        const tick = app.querySelector('[data-v7-tick]'); const h1 = app.querySelector('.v7-h1'); if (tick && h1 && !h1.contains(tick)) { tick.classList.add('v10-tick'); h1.append(tick); }
      }
    } catch (e) { console.error(e); }
  };
})();
