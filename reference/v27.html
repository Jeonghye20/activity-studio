ass=\"legend-row\">\u003c/div>');\n      [[\"정탐\",\"var(--good)\"],[\"오탐\",\"var(--warn)\"],[\"미탐\",\"var(--crit)\"],[\"정상\",\"var(--neutral)\"]].forEach(function(l){\n        var chip = el('\u003cspan class=\"legend-chip\">\u003c/span>');\n        var sw = el('\u003cspan class=\"legend-swatch\">\u003c/span>'); sw.style.background = l[1];\n        chip.appendChild(sw); chip.appendChild(document.createTextNode(l[0]));\n        legend.appendChild(chip);\n      });\n      chart.appendChild(legend);\n      ZONE_KEYS.forEach(function(z){\n        var block = el('\u003cdiv class=\"zone-bar-block\">\u003c/div>');\n        var title = el('\u003cdiv class=\"zone-bar-title\">\u003c/div>');\n        var pz = last.perZone[z];\n        var avgTxt = pz.avgTime!=null ? (pz.avgTime.toFixed(1)+\"초 평균 감지\") : \"감지 없음\";\n        title.innerHTML = '\u003cb>'+z+'구역 · '+last.thresholds[z]+'℃\u003c/b>\u003cspan>'+avgTxt+'\u003c/span>';\n        block.appendChild(title);\n        block.appendChild(renderStackBar(z, pz.counts, pz.total));\n        chart.appendChild(block);\n      });\n      frag.appendChild(chart);\n\n      // 실험 이력 표\n      var tableWrap = el('\u003cdiv class=\"table-wrap\">\u003c/div>');\n      var table = el('\u003ctable class=\"exp-history\">\u003c/table>');\n      table.innerHTML = '\u003cthead>\u003ctr>\u003cth>회차\u003c/th>\u003cth>A\u003c/th>\u003cth>B\u003c/th>\u003cth>C\u003c/th>\u003cth>오탐 합계\u003c/th>\u003cth>미탐 합계\u003c/th>\u003c/tr>\u003c/thead>';\n      var tbody = el('\u003ctbody>\u003c/tbody>');\n      var minProblem = Math.min.apply(null, b.rounds.map(function(r){\n        var p=0; ZONE_KEYS.forEach(function(z){ p += r.perZone[z].counts[\"오탐\"]+r.perZone[z].counts[\"미탐\"]; }); return p;\n      }));\n      b.rounds.forEach(function(r){\n        var falseAlarms=0, misses=0;\n        ZONE_KEYS.forEach(function(z){ falseAlarms += r.perZone[z].counts[\"오탐\"]; misses += r.perZone[z].counts[\"미탐\"]; });\n        var tr = el('\u003ctr>\u003c/tr>');\n        var isBest = (falseAlarms+misses)===minProblem;\n        tr.innerHTML = '\u003ctd>'+r.n+'\u003c/td>\u003ctd>'+r.thresholds.A+'℃\u003c/td>\u003ctd>'+r.thresholds.B+'℃\u003c/td>\u003ctd>'+r.thresholds.C+'℃\u003c/td>'+\n          '\u003ctd class=\"'+(isBest?\"best\":\"\")+'\">'+falseAlarms+'\u003c/td>\u003ctd class=\"'+(isBest?\"best\":\"\")+'\">'+misses+'\u003c/td>';\n        tbody.appendChild(tr);\n      });\n      table.appendChild(tbody);\n      tableWrap.appendChild(table);\n      frag.appendChild(tableWrap);\n      frag.appendChild(el('\u003cdiv class=\"hint\">초록색으로 강조된 행이 지금까지 중 오탐+미탐 합계가 가장 적었던 회차입니다.\u003c/div>'));\n    } else {\n      frag.appendChild(el('\u003cdiv class=\"hint\">아직 실험을 실행하지 않았어요. 위 버튼을 눌러 첫 실험을 돌려보세요.\u003c/div>'));\n    }\n\n    var canProceed = b.rounds.length>=2;\n    frag.appendChild(stepNav(canProceed, \"기록하러 가기 →\", function(){ if(canProceed) go(\"reflect\"); }, \"← 특성 다시 보기\", function(){ b.step=1; render(); }));\n    if(!canProceed) frag.appendChild(el('\u003cdiv class=\"hint\">※ 최소 2번 이상 실험(조정 후 재실험 포함)해야 다음으로 넘어갈 수 있어요. 지금까지 '+b.rounds.length+'회.\u003c/div>'));\n    return frag;\n  }\n\n  // ---------- ⑥ 1차 기록 제출 ----------\n  function renderReflect(){\n    var wrap = el('\u003cdiv class=\"card-body\">\u003c/div>');\n    wrap.innerHTML =\n      '\u003cdiv class=\"eyebrow\">6 · 기록하기\u003c/div>' +\n      '\u003ch1 class=\"title\">내가 찾은 최적 조합과 그 이유\u003c/h1>' +\n      '\u003cp class=\"lead\">최종적으로 A·B·C에 어떤 임계값을 골랐는지, 오탐과 미탐 사이에서 어떻게 균형을 잡았는지 \u003cb>40자 이상\u003c/b>으로 정리해보자.\u003c/p>';\n    var ta = el('\u003ctextarea class=\"answer\" placeholder=\"예: A는 오탐이 잦아 기준을 45도로 올렸고, C는 빨리 번지니 32도로 낮춰서 조금 예민하게 반응하도록 했다. B는 40도가 적당했다...\">\u003c/textarea>');\n    ta.value = state.reflectText;\n    var counterRow = el('\u003cdiv class=\"counter-row\">\u003cspan class=\"hint\">최소 40자\u003c/span>\u003cspan class=\"count\">\u003c/span>\u003c/div>');\n    var countSpan = counterRow.querySelector(\".count\");\n    function updateCount(){\n      var len = ta.value.trim().length;\n      countSpan.textContent = len + \" / 40자\";\n      countSpan.className = \"count \" + (len>=40?\"ok\":\"low\");\n      next.disabled = len\u003c40;\n    }\n    ta.addEventListener(\"input\", function(){ state.reflectText = ta.value; updateCount(); });\n    wrap.appendChild(ta);\n    wrap.appendChild(counterRow);\n\n    var btnRow = el('\u003cdiv class=\"btn-row\">\u003c/div>');\n    var back = el('\u003cbutton class=\"btn btn-ghost\" type=\"button\">← 이전\u003c/button>');\n    back.onclick = function(){ go(\"build\"); };\n    var spacer = el('\u003cspan class=\"spacer\">\u003c/span>');\n    var next = el('\u003cbutton class=\"btn btn-primary\" type=\"button\">제출하고 기록 보기 →\u003c/button>');\n    next.onclick = function(){ if(state.reflectText.trim().length>=40) go(\"summary\"); };\n    btnRow.appendChild(back); btnRow.appendChild(spacer); btnRow.appendChild(next);\n    wrap.appendChild(btnRow);\n    updateCount();\n    return wrap;\n  }\n\n  // ---------- ⑦ 완료 + 한 페이지 기록 ----------\n  function renderSummary(){\n    var b = state.build;\n    var last = b.rounds[b.rounds.length-1];\n    var falseAlarms=0, misses=0;\n    ZONE_KEYS.forEach(function(z){ falseAlarms += last.perZone[z].counts[\"오탐\"]; misses += last.perZone[z].counts[\"미탐\"]; });\n\n    var wrap = el('\u003cdiv class=\"card-body\">\u003c/div>');\n    wrap.innerHTML =\n      '\u003cdiv class=\"eyebrow\">7 · 완료\u003c/div>' +\n      '\u003ch1 class=\"title\">오늘의 심화 탐구, 이렇게 진행했어요\u003c/h1>';\n\n    var b1 = el('\u003cdiv class=\"summary-block\">\u003ch3>① 처음 시도 결과\u003c/h3>\u003cp>\u003c/p>\u003c/div>');\n    b1.querySelector(\"p\").innerHTML = \"공통 임계값 40℃를 세 구역에 똑같이 적용했더니, 캠핑장 인근 A구역은 오탐이 잦았고 침엽수 밀집 C구역은 대응이 늦어질 위험이 있었습니다.\";\n    wrap.appendChild(b1);\n\n    var b2 = el('\u003cdiv class=\"summary-block\">\u003ch3>② 내 예상\u003c/h3>\u003cp>\u003c/p>\u003c/div>');\n    b2.querySelector(\"p\").textContent = state.predictText || \"(작성한 예상 없음)\";\n    wrap.appendChild(b2);\n\n    var b3 = el('\u003cdiv class=\"summary-block\">\u003ch3>③ 실험 결과\u003c/h3>\u003cp>\u003c/p>\u003c/div>');\n    b3.querySelector(\"p\").innerHTML = \"총 \u003cb>\"+b.rounds.length+\"회\u003c/b> 실험 후 최종 선택한 임계값은 A \u003cb>\"+last.thresholds.A+\"℃\u003c/b> · B \u003cb>\"+last.thresholds.B+\"℃\u003c/b> · C \u003cb>\"+last.thresholds.C+\"℃\u003c/b>였고, 마지막 실험에서 오탐 \u003cb>\"+falseAlarms+\"회\u003c/b>, 미탐 \u003cb>\"+misses+\"회\u003c/b>가 나왔습니다.\";\n    wrap.appendChild(b3);\n\n    var b4 = el('\u003cdiv class=\"summary-block\">\u003ch3>④ 알게 된 것\u003c/h3>\u003cp>\u003c/p>\u003c/div>');\n    b4.querySelector(\"p\").textContent = state.reflectText || \"(작성한 기록 없음)\";\n    wrap.appendChild(b4);\n\n    var btnRow = el('\u003cdiv class=\"btn-row\" style=\"flex-direction:column;align-items:stretch;\">\u003c/div>');\n    var copyBtn = el('\u003cbutton class=\"btn btn-ghost\" type=\"button\">📋 기록 복사하기\u003c/button>');\n    copyBtn.onclick = function(){\n      var text = \"[산불 감지 임계값 실험실 · 심화 탐구 기록]\\n① 처음 시도: 공통 40℃ 적용 → A 오탐, C 대응 지연 위험\\n② 내 예상: \"+state.predictText+\"\\n③ 실험 결과: \"+b.rounds.length+\"회 실험, 최종 A \"+last.thresholds.A+\"℃/B \"+last.thresholds.B+\"℃/C \"+last.thresholds.C+\"℃, 오탐 \"+falseAlarms+\"회·미탐 \"+misses+\"회\\n④ 알게 된 것: \"+state.reflectText;\n      function fallbackCopy(){\n        var ta=document.createElement(\"textarea\"); ta.value=text; document.body.appendChild(ta);\n        ta.select(); try{document.execCommand(\"copy\");}catch(e){} document.body.removeChild(ta);\n        copyBtn.textContent = \"✅ 복사됨\"; setTimeout(function(){copyBtn.textContent=\"📋 기록 복사하기\";},1500);\n      }\n      if(navigator.clipboard && navigator.clipboard.writeText){\n        navigator.clipboard.writeText(text).then(function(){\n          copyBtn.textContent = \"✅ 복사됨\"; setTimeout(function(){copyBtn.textContent=\"📋 기록 복사하기\";},1500);\n        }).catch(fallbackCopy);\n      } else { fallbackCopy(); }\n    };\n    var growthBtn = el('\u003cbutton class=\"btn btn-primary\" type=\"button\">📚 성장기록실에서 보기\u003c/button>');\n    growthBtn.onclick = function(){ showModal(\"성장기록실\", \"이 심화 기록이 성장기록실에 저장되어, 기본 활동 기록과 함께 누적됩니다. (프로토타입에서는 안내로 대체)\"); };\n    var qBtn = el('\u003cbutton class=\"btn btn-ghost\" type=\"button\">💬 질문공방으로 이동\u003c/button>');\n    qBtn.onclick = function(){ showModal(\"질문공방\", \"오탐과 미탐 중 어느 쪽이 더 위험한지, 실제 산림청이라면 어떤 기준으로 결정할지를 질문공방에서 더 깊이 이야기해볼 수 있습니다. (프로토타입에서는 안내로 대체)\"); };\n    btnRow.appendChild(copyBtn); btnRow.appendChild(growthBtn); btnRow.appendChild(qBtn);\n    wrap.appendChild(btnRow);\n    wrap.appendChild(el('\u003cdiv class=\"modal-note\">※ 이 프로토타입은 심화 활동 화면 흐름(①~⑦)을 보여주기 위한 시연입니다.\u003c/div>'));\n    return wrap;\n  }\n\n  function showModal(title, text){\n    var overlay = el('\u003cdiv style=\"position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;\">\u003c/div>');\n    var box = el('\u003cdiv style=\"background:var(--panel);border-radius:16px;padding:20px;max-width:360px;width:100%;\">\u003c/div>');\n    box.innerHTML = '\u003ch3 style=\"margin:0 0 8px;font-family:var(--font-display);\">'+title+'\u003c/h3>\u003cp style=\"margin:0 0 16px;font-size:.88rem;line-height:1.6;color:var(--ink-dim);\">'+text+'\u003c/p>';\n    var closeBtn = el('\u003cbutton class=\"btn btn-primary\" type=\"button\" style=\"width:100%;\">확인\u003c/button>');\n    closeBtn.onclick = function(){ document.body.removeChild(overlay); };\n    box.appendChild(closeBtn);\n    overlay.appendChild(box);\n    overlay.onclick = function(e){ if(e.target===overlay) document.body.removeChild(overlay); };\n    document.body.appendChild(overlay);\n  }\n\n  var RENDERERS = {\n    intro: renderIntro, discover: renderDiscover, confirm: renderConfirm,\n    predict: renderPredict, build: renderBuild, reflect: renderReflect, summary: renderSummary\n  };\n\n  document.getElementById(\"teacherToggleBtn\").addEventListener(\"click\", function(){\n    var p = document.getElementById(\"teacherPanel\");\n    p.classList.toggle(\"open\");\n    this.textContent = p.classList.contains(\"open\") ? \"교사용 활동 정보 닫기 ▴\" : \"교사용 활동 정보 보기 ▾\";\n  });\n\n  function boot(data){\n    if(data && data.state){ try{ Object.assign(state, data.state); }catch(e){} }\n    render();\n  }\n  if(window.claude && window.claude.hot){\n    window.claude.hot.snapshot(function(){ return {state:{screen:state.screen}}; });\n    window.claude.hot.ready ? window.claude.hot.ready(boot) : boot(window.claude.hot.data||{});\n  } else {\n    boot({});\n  }\n})();\n\u003c/script>\n\u003cscript>document.addEventListener('click',function(e){const a=e.target.closest('a');if(a&&a.getAttribute('href')&&!a.getAttribute('href').startsWith('#'))e.preventDefault();});\u003c/script>", "grade": "", "school": "고등학교", "mode": "온라인", "imported": true, "family": 3}, {"id": "ext-math-graph", "name": "점으로 그려 보는 이차함수", "subject": "수학", "visual": "graph", "minutes": 10, "html": "\u003c!doctype html>\n\u003chtml lang=\"ko\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n  \u003ctitle>중3 수학 | 이차함수 그래프 탐구\u003c/title>\n  \u003cstyle>\n    :root{font-family:system-ui,-apple-system,\"Noto Sans KR\",sans-serif;color:#203048;background:#f6f7fb;font-synthesis:none}\n    *{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}\n    .shell{max-width:1060px;margin:auto;padding:28px 22px 70px}\n    .top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:24px}\n    .brand{font-size:13px;font-weight:800;letter-spacing:.08em;color:#5b49bd}.pill{border-radius:100px;background:#e9e4ff;color:#5c48ad;font-weight:700;padding:8px 13px;font-size:13px}\n    h1{font-size:clamp(27px,4vw,40px);line-height:1.22;margin:10px 0 8px;letter-spacing:-.04em}h2{font-size:23px;letter-spacing:-.035em;margin:0 0 9px}p{line-height:1.65;margin:0}.sub{color:#637083}\n    .tabs{display:flex;gap:8px;margin:28px 0 18px}.tabs button{flex:1;min-height:46px;border:1px solid #dce1eb;background:white;border-radius:11px;color:#586679;font-weight:750}.tabs button[aria-selected=\"true\"]{background:#624bc4;border-color:#624bc4;color:white}.tabs button:disabled{background:#ebedf3;color:#a1a9b5;cursor:not-allowed}.tabs button:focus-visible{outline:3px solid #927bed;outline-offset:2px}[hidden]{display:none!important}\n    .card{background:white;border:1px solid #e3e7ee;box-shadow:0 14px 40px rgba(33,44,71,.06);border-radius:23px;padding:clamp(18px,3vw,30px)}\n    .tag{display:inline-block;color:#6650bb;background:#f0ecff;font-size:12px;font-weight:800;letter-spacing:.04em;border-radius:7px;padding:6px 8px;margin-bottom:12px}\n    .math{font-family:Georgia,serif;font-style:italic;font-size:1.18em;color:#4833a5;font-weight:bold;white-space:nowrap}\n    .grid-layout{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(260px,.65fr);gap:25px;margin-top:22px;align-items:start}\n    .plot-wrap{border:1px solid #dfe3ee;background:#fff;border-radius:16px;padding:8px;touch-action:none;user-select:none}.plot-wrap svg{display:block;width:100%;height:auto;touch-action:none;cursor:crosshair}\n    .side{background:#f7f7fd;border-radius:16px;padding:20px}.side h3{font-size:16px;margin:0 0 10px}.side p,.side li{font-size:14px;color:#5d687b;line-height:1.65}.side ol{padding-left:20px;margin:0 0 15px}.side li+li{margin-top:5px}\n    .coord-list{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:15px}.coord-list label{text-align:center;font-size:12px;font-weight:700;color:#58667b}.coord-list input{width:100%;margin-top:6px;border:1px solid #cbd2e0;border-radius:8px;padding:8px 2px;text-align:center;background:white;color:#203048;font-size:15px}.coord-list input:focus{outline:2px solid #6d56d2;outline-offset:1px}\n    .hint{font-size:12px;color:#778498;margin-top:10px}.actions{display:flex;flex-wrap:wrap;align-items:center;gap:9px;margin-top:20px}.btn{border:0;border-radius:10px;padding:12px 18px;font-weight:750;min-height:44px}.primary{background:#624bc4;color:white}.primary:hover{background:#513ab4}.secondary{background:#edeff6;color:#344259}.secondary:hover{background:#e1e4ed}.btn:focus-visible,.choice:focus-visible{outline:3px solid #927bed;outline-offset:2px}\n    .feedback{margin-top:18px;padding:16px 18px;border-radius:13px;background:#eef8f2;border:1px solid #c8e9d3;color:#235b39;line-height:1.6}.feedback.warn{background:#fff8e8;border-color:#f1dcaa;color:#735015}.feedback strong{display:block;margin-bottom:3px}\n    .question{margin:16px 0 18px;font-size:19px;font-weight:750;line-height:1.55}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.choice{border:1.5px solid #dce1eb;background:white;border-radius:12px;padding:15px 12px;text-align:left;color:#29364d;font-weight:650;min-height:55px}.choice[aria-pressed=\"true\"]{border-color:#624bc4;background:#f2efff;color:#4834aa}.choice:hover{border-color:#8a78db}.choice b{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:#eef0f6;margin-right:9px;font-size:12px}.answer{margin-top:20px;border-top:1px solid #e5e8ee;padding-top:20px}.answer h3{margin:0 0 9px;font-size:18px}.answer p+p{margin-top:9px}.answer code{font-family:inherit;font-weight:750;color:#4834aa}\n    .concept-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}.mini{background:#f7f6fd;border-radius:13px;padding:17px;min-height:128px}.mini b{display:block;color:#5541ad;margin-bottom:8px}.mini p{font-size:14px;color:#59677a}.concept-note{background:#f1efff;border-left:4px solid #7663d5;border-radius:0 10px 10px 0;padding:12px 15px}.share{background:#f6f5fd;border-radius:13px;padding:17px;white-space:pre-wrap;line-height:1.65;margin-top:16px}textarea{display:block;width:100%;min-height:88px;border:1px solid #cbd2e0;border-radius:10px;padding:12px;resize:vertical;margin-top:10px;color:#203048}.talk-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}.talk-grid>div{background:#f8f8fc;border-radius:12px;padding:17px}.talk-grid p{font-size:14px;color:#5d687b}.talk-grid h3{margin:0 0 8px;font-size:16px}details{margin-top:20px;background:#f0effb;border-radius:12px;padding:15px}summary{cursor:pointer;font-weight:800}details p{font-size:14px;margin-top:9px}\n    .foot{font-size:12px;color:#8190a1;margin-top:17px}\n    @media(max-width:740px){.shell{padding:20px 13px 48px}.grid-layout{grid-template-columns:1fr}.top{align-items:flex-start}.pill{white-space:nowrap}.choices,.concept-grid,.talk-grid{grid-template-columns:1fr}.mini{min-height:0}.coord-list{gap:4px}.side{padding:17px}.tabs{gap:5px}.tabs button{font-size:12px;padding:6px 3px}}\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cmain class=\"shell\">\n  \u003cdiv class=\"top\">\u003cdiv class=\"brand\">MATH LAB · 중학교 3학년\u003c/div>\u003cdiv class=\"pill\">개인 탐구 5~7분 · 함께 이야기 2~3분\u003c/div>\u003c/div>\n  \u003ch1>점으로 그려 보는 이차함수\u003c/h1>\n  \u003cp class=\"sub\">그래프를 직접 완성한 뒤, 그래프에서 알 수 있는 값을 찾아보세요.\u003c/p>\n  \u003cnav class=\"tabs\" role=\"tablist\" aria-label=\"활동 단계\">\u003cbutton id=\"tab-graph\" role=\"tab\" type=\"button\" aria-selected=\"true\" aria-controls=\"graph\">1 그래프\u003c/button>\u003cbutton id=\"tab-concept\" role=\"tab\" type=\"button\" aria-selected=\"false\" aria-controls=\"concept\" disabled>2 개념\u003c/button>\u003cbutton id=\"tab-question\" role=\"tab\" type=\"button\" aria-selected=\"false\" aria-controls=\"question\" disabled>3 문제\u003c/button>\u003cbutton id=\"tab-talk\" role=\"tab\" type=\"button\" aria-selected=\"false\" aria-controls=\"talk\" disabled>4 이야기\u003c/button>\u003c/nav>\n\n  \u003csection class=\"card\" id=\"graph\" role=\"tabpanel\" aria-labelledby=\"tab-graph\">\n    \u003cdiv class=\"tag\">활동 01 · 그래프 그리기\u003c/div>\n    \u003ch2 id=\"task-title\">이차함수의 그래프를 완성해요\u003c/h2>\n    \u003cp>아래 좌표평면에 \u003cspan class=\"math\">y = (x − 1)² − 2\u003c/span>의 그래프를 그려 보세요.\u003c/p>\n    \u003cdiv class=\"grid-layout\">\n      \u003cdiv>\n        \u003cdiv class=\"plot-wrap\">\n          \u003csvg id=\"plot\" viewBox=\"0 0 620 455\" role=\"img\" aria-label=\"x좌표가 음수 3부터 5까지, y좌표가 음수 3부터 5까지인 좌표평면. 음수 1부터 3까지 다섯 x 위치에 점을 찍어 그래프를 만듭니다.\">\u003c/svg>\n        \u003c/div>\n        \u003cdiv class=\"coord-list\" id=\"inputs\" aria-label=\"좌표를 숫자로 입력\">\u003c/div>\n        \u003cp class=\"hint\">좌표평면에서 점을 찍거나 아래 칸에 y값을 입력할 수 있어요. 그래프 위에서 점을 끌어 옮길 수도 있어요.\u003c/p>\n      \u003c/div>\n      \u003caside class=\"side\">\n        \u003ch3>어떻게 그릴까요?\u003c/h3>\n        \u003col>\u003cli>x가 −1, 0, 1, 2, 3일 때 각각의 y값을 계산해요.\u003c/li>\u003cli>세로 안내선 위에 점 5개를 찍어요. 점들이 곡선으로 연결돼요.\u003c/li>\u003cli>모두 찍었다면 \u003cstrong>그래프 제출\u003c/strong>을 눌러요.\u003c/li>\u003c/ol>\n        \u003cp>예: x = 0을 식에 대입하면\u003cbr>y = (0 − 1)² − 2 = −1\u003c/p>\n      \u003c/aside>\n    \u003c/div>\n    \u003cdiv class=\"actions\">\u003cbutton id=\"submitGraph\" class=\"btn primary\" type=\"button\">그래프 제출\u003c/button>\u003cbutton id=\"reset\" class=\"btn secondary\" type=\"button\">다시 그리기\u003c/button>\u003c/div>\n    \u003cdiv id=\"graphFeedback\" class=\"feedback\" role=\"status\" aria-live=\"polite\" hidden>\u003c/div>\u003cdiv class=\"actions\">\u003cbutton class=\"btn primary\" id=\"toConcept\" type=\"button\" hidden>개념 확인으로 →\u003c/button>\u003c/div>\n  \u003c/section>\n\n  \u003csection class=\"card\" id=\"concept\" role=\"tabpanel\" aria-labelledby=\"tab-concept\" hidden>\u003cdiv class=\"tag\">활동 02 · 개념 공부\u003c/div>\u003ch2>내가 그린 그래프 읽기\u003c/h2>\u003cp>이차함수의 그래프는 \u003cstrong>포물선\u003c/strong>이에요. 찍은 점을 연결한 모양을 떠올리며 세 가지를 확인해요.\u003c/p>\u003cdiv class=\"concept-grid\">\u003cdiv class=\"mini\">\u003cb>① 좌우 대칭\u003c/b>\u003cp>x = 0과 x = 2에서 y값을 비교해 보세요. 같다면 가운데는 어디일까요?\u003c/p>\u003c/div>\u003cdiv class=\"mini\">\u003cb>② 대칭축\u003c/b>\u003cp>포물선을 좌우로 접었을 때 겹치는 세로 직선이에요.\u003c/p>\u003c/div>\u003cdiv class=\"mini\">\u003cb>③ 꼭짓점\u003c/b>\u003cp>이 그래프에서는 가장 낮은 점이에요. 그 점의 x값과 y값을 살펴보세요.\u003c/p>\u003c/div>\u003c/div>\u003cp class=\"concept-note\">\u003cstrong>생각할 점:\u003c/strong> 그래프에서 가장 낮은 점을 찾으면 그 함수의 최솟값도 알 수 있어요.\u003c/p>\u003cdiv class=\"actions\">\u003cbutton class=\"btn secondary\" type=\"button\" data-back=\"graph\">← 그래프 다시 보기\u003c/button>\u003cbutton class=\"btn primary\" id=\"toQuestion\" type=\"button\">문제 풀기로 →\u003c/button>\u003c/div>\u003c/section>\n\n  \u003csection class=\"card\" id=\"question\" role=\"tabpanel\" aria-labelledby=\"tab-question\" hidden>\n    \u003cdiv class=\"tag\">활동 03 · 그래프 읽기\u003c/div>\n    \u003ch2 id=\"question-title\">문제 하나 풀어 볼까요?\u003c/h2>\n    \u003cp class=\"question\">이차함수 \u003cspan class=\"math\">y = (x − 1)² − 2\u003c/span>의 최솟값과, 그때의 x값을 바르게 짝 지은 것은?\u003c/p>\n    \u003cdiv class=\"choices\" id=\"choices\" role=\"group\" aria-label=\"정답 선택\">\n      \u003cbutton class=\"choice\" type=\"button\" data-value=\"a\" aria-pressed=\"false\">\u003cb>①\u003c/b> 최솟값 −2, x = 1\u003c/button>\n      \u003cbutton class=\"choice\" type=\"button\" data-value=\"b\" aria-pressed=\"false\">\u003cb>②\u003c/b> 최솟값 1, x = −2\u003c/button>\n      \u003cbutton class=\"choice\" type=\"button\" data-value=\"c\" aria-pressed=\"false\">\u003cb>③\u003c/b> 최솟값 −1, x = 0\u003c/button>\n      \u003cbutton class=\"choice\" type=\"button\" data-value=\"d\" aria-pressed=\"false\">\u003cb>④\u003c/b> 최솟값 2, x = −1\u003c/button>\n    \u003c/div>\n    \u003cdiv class=\"actions\">\u003cbutton class=\"btn secondary\" type=\"button\" data-back=\"concept\">← 개념 다시 보기\u003c/button>\u003cbutton class=\"btn primary\" id=\"submitAnswer\" type=\"button\">답 제출\u003c/button>\u003c/div>\n    \u003cdiv id=\"questionFeedback\" class=\"feedback\" role=\"status\" aria-live=\"polite\" hidden>\u003c/div>\n    \u003cdiv id=\"answer\" class=\"answer\" hidden>\n      \u003ch3>정답과 해설\u003c/h3>\n      \u003cp>\u003cstrong>그래프:\u003c/strong> 점 \u003ccode>(−1, 2), (0, −1), (1, −2), (2, −1), (3, 2)\u003c/code>를 지나는 위로 열린 포물선이에요. 꼭짓점은 \u003ccode>(1, −2)\u003c/code>이고 대칭축은 \u003ccode>x = 1\u003c/code>이에요.\u003c/p>\n      \u003cp>\u003cstrong>문제 정답: ①.\u003c/strong> (x − 1)²은 항상 0 이상이고 x = 1일 때 0이므로, y의 최솟값은 \u003ccode>−2\u003c/code>예요.\u003c/p>\n    \u003c/div>\n    \u003cdiv class=\"actions\">\u003cbutton class=\"btn primary\" id=\"toTalk\" type=\"button\" hidden>발표 준비로 →\u003c/button>\u003c/div>\n  \u003c/section>\n  \u003csection class=\"card\" id=\"talk\" role=\"tabpanel\" aria-labelledby=\"tab-talk\" hidden>\u003cdiv class=\"tag\">활동 04 · 함께 이야기\u003c/div>\u003ch2>내 그래프를 설명해요\u003c/h2>\u003cp>어떤 점을 기준으로 대칭을 발견했나요? 그래프에서 가장 낮은 점을 어떻게 찾았는지 적어 보세요.\u003c/p>\u003clabel for=\"observation\" class=\"hint\">나의 관찰·설명\u003c/label>\u003ctextarea id=\"observation\" placeholder=\"예: x=0과 x=2일 때 y값이 같아서 x=1을 기준으로 대칭이라고 생각했다.\">\u003c/textarea>\u003cdiv id=\"share\" class=\"share\" aria-live=\"polite\">\u003c/div>\u003cdiv class=\"talk-grid\">\u003cdiv>\u003ch3>친구와 이야기할 질문\u003c/h3>\u003cp>점 하나를 잘못 찍었다면 어떤 점을 비교해 오류를 찾을 수 있을까요?\u003c/p>\u003c/div>\u003cdiv>\u003ch3>발표할 때\u003c/h3>\u003cp>계산한 점 → 그래프 모양 → 꼭짓점과 최솟값 순서로 30초 정도 설명해 보세요.\u003c/p>\u003c/div>\u003c/div>\u003cdetails>\u003csummary>교사용 결론 · 2~3분\u003c/summary>\u003cp>학생 두 명의 점 찍기 방법을 비교하고, 같은 y값을 갖는 두 점이 대칭축에서 같은 거리인지 확인합니다. 꼭짓점 (1, −2)와 대칭축 x=1을 정리하고, y=(x−1)²−2의 제곱 부분이 0 이상이므로 최솟값이 −2임을 연결합니다.\u003c/p>\u003c/details>\u003cdiv class=\"actions\">\u003cbutton class=\"btn secondary\" type=\"button\" data-back=\"question\">← 문제 다시 보기\u003c/button>\u003c/div>\u003c/section>\n  \u003cp class=\"foot\">이 활동은 브라우저 안에서 진행되며 제출 결과를 외부로 전송하지 않습니다.\u003c/p>\n\u003c/main>\n\u003cscript>\n(() => {\n  const svg=document.getElementById('plot'), values=[null,null,null,null,null];\n  const xs=[-1,0,1,2,3], expected=[2,-1,-2,-1,2], inputs=document.getElementById('inputs');\n  const L=57,T=25,U=65, ymin=-3,ymax=5, xMin=-3,xMax=5;\n  const px=x=>L+(x-xMin)*U, py=y=>T+(ymax-y)*47;\n  let submitted=false, selected=null, dragIndex=null, graphSubmitCount=0, lastGraphCorrect=null;\n  const stepIds=['graph','concept','question','talk'];let unlocked=0;\n  function showStep(id){if(stepIds.indexOf(id)>unlocked)return;stepIds.forEach(s=>{document.getElementById(s).hidden=s!==id;document.getElementById('tab-'+s).setAttribute('aria-selected',String(s===id))});window.scrollTo({top:0,behavior:'smooth'})}\n  function unlock(id){unlocked=Math.max(unlocked,stepIds.indexOf(id));document.getElementById('tab-'+id).disabled=false}\n  stepIds.forEach(id=>document.getElementById('tab-'+id).addEventListener('click',()=>showStep(id)));\n  document.querySelectorAll('[data-back]').forEach(b=>b.addEventListener('click',()=>showStep(b.dataset.back)));\n  const fmt=n=>String(n).replace('-', '−');\n  function element(tag,attrs={}){const e=document.createElementNS('http://www.w3.org/2000/svg',tag);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,v);return e}\n  function spline(points){if(points.length\u003c2)return '';let d=`M ${points[0][0]} ${points[0][1]}`;for(let i=0;i\u003cpoints.length-1;i++){const a=points[Math.max(0,i-1)],b=points[i],c=points[i+1],z=points[Math.min(points.length-1,i+2)];d+=` C ${b[0]+(c[0]-a[0])/6} ${b[1]+(c[1]-a[1])/6}, ${c[0]-(z[0]-b[0])/6} ${c[1]-(z[1]-b[1])/6}, ${c[0]} ${c[1]}`}return d}\n  function draw(){svg.replaceChildren();const add=(tag,attrs)=>svg.appendChild(element(tag,attrs));\n    add('rect',{x:0,y:0,width:620,height:455,fill:'#ffffff'});\n    for(let x=xMin;x\u003c=xMax;x++)add('line',{x1:px(x),x2:px(x),y1:py(ymax),y2:py(ymin),stroke:x===0?'#5a667a':'#e8ebf1','stroke-width':x===0?1.8:1});\n    for(let y=ymin;y\u003c=ymax;y++)add('line',{x1:px(xMin),x2:px(xMax),y1:py(y),y2:py(y),stroke:y===0?'#5a667a':'#e8ebf1','stroke-width':y===0?1.8:1});\n    add('path',{d:`M ${px(xMax)-8} ${py(0)-5} L ${px(xMax)} ${py(0)} L ${px(xMax)-8} ${py(0)+5} M ${px(0)-5} ${py(ymax)+8} L ${px(0)} ${py(ymax)} L ${px(0)+5} ${py(ymax)+8}`,fill:'none',stroke:'#5a667a','stroke-width':1.7});\n    for(let x=xMin;x\u003c=xMax;x++)if(x!==0){let t=add('text',{x:px(x),y:py(0)+19,'text-anchor':'middle',fill:'#69788e','font-size':13});t.textContent=fmt(x)}\n    for(let y=ymin;y\u003c=ymax;y++)if(y!==0){let t=add('text',{x:px(0)-13,y:py(y)+5,'text-anchor':'end',fill:'#69788e','font-size':13});t.textContent=fmt(y)}\n    for(const [str,x,y] of [['0',px(0)-12,py(0)+19],['x',px(xMax)+13,py(0)+5],['y',px(0)-4,py(ymax)-9]]){let t=add('text',{x,y,fill:'#34435a','font-size':15,'font-weight':700});t.textContent=str}\n    xs.forEach((x,i)=>{add('line',{x1:px(x),x2:px(x),y1:py(ymax),y2:py(ymin),stroke:'#baa9f1','stroke-width':1.5,'stroke-dasharray':'5 6'});if(values[i]===null){add('circle',{cx:px(x),cy:py(0),r:5,fill:'#d5caef'});}});\n    const points=values.map((v,i)=>v===null?null:[px(xs[i]),py(v)]).filter(Boolean);\n    if(points.length>=2)add('path',{d:spline(points),fill:'none',stroke:'#664fc7','stroke-width':3.5,'stroke-linecap':'round'});\n    values.forEach((v,i)=>{if(v===null)return;add('circle',{cx:px(xs[i]),cy:py(v),r:8,fill:submitted&&v===expected[i]?'#159568':'#654ec4',stroke:'white','stroke-width':2.5});});\n  }\n  function setValue(i,v){if(!Number.isFinite(v)||v\u003cymin||v>ymax)return;values[i]=Math.round(v*2)/2;submitted=false;document.getElementById('graphFeedback').hidden=true;document.getElementById('toConcept').hidden=true;inputs.querySelectorAll('input')[i].value=values[i];draw()}\n  function locate(ev){let r=svg.getBoundingClientRect(), x=(ev.clientX-r.left)*620/r.width,y=(ev.clientY-r.top)*455/r.height;return{x,y}}\n  svg.addEventListener('pointerdown',ev=>{let {x,y}=locate(ev);if(x\u003cpx(xs[0])-28||x>px(xs[4])+28||y\u003cpy(ymax)-8||y>py(ymin)+8)return;let i=xs.reduce((best,v,j)=>Math.abs(px(v)-x)\u003cMath.abs(px(xs[best])-x)?j:best,0);dragIndex=i;svg.setPointerCapture(ev.pointerId);setValue(i,ymax-(y-T)/47)});\n  svg.addEventListener('pointermove',ev=>{if(dragIndex===null)return;let {y}=locate(ev);setValue(dragIndex,Math.max(ymin,Math.min(ymax,ymax-(y-T)/47)))});\n  svg.addEventListener('pointerup',()=>dragIndex=null);svg.addEventListener('pointercancel',()=>dragIndex=null);\n  xs.forEach((x,i)=>{let label=document.createElement('label');label.textContent='x = '+fmt(x);let input=document.createElement('input');input.type='number';input.min=String(ymin);input.max=String(ymax);input.step='0.5';input.setAttribute('aria-label',`x가 ${fmt(x)}일 때 y값`);input.addEventListener('input',()=>{if(input.value===''){values[i]=null;submitted=false;document.getElementById('graphFeedback').hidden=true;document.getElementById('toConcept').hidden=true;draw();return}let n=Number(input.value);if(Number.isFinite(n)&&n>=ymin&&n\u003c=ymax){values[i]=n;submitted=false;document.getElementById('graphFeedback').hidden=true;document.getElementById('toConcept').hidden=true;draw()}});label.append(input);inputs.append(label)});\n  document.getElementById('reset').addEventListener('click',()=>{values.fill(null);inputs.querySelectorAll('input').forEach(el=>el.value='');submitted=false;lastGraphCorrect=null;document.getElementById('graphFeedback').hidden=true;document.getElementById('toConcept').hidden=true;draw()});\n  document.getElementById('submitGraph').addEventListener('click',()=>{const f=document.getElementById('graphFeedback');if(values.some(v=>v===null)){f.className='feedback warn';f.innerHTML='\u003cstrong>점 5개를 모두 찍어 주세요.\u003c/strong>비어 있는 x 위치의 y값을 계산해 입력한 다음 제출해 보세요.';f.hidden=false;return}submitted=true;draw();const wrong=values.map((v,i)=>v===expected[i]?null:fmt(xs[i])).filter(v=>v!==null);f.className='feedback'+(wrong.length?' warn':'');f.innerHTML=wrong.length?`\u003cstrong>그래프를 제출했어요.\u003c/strong>x = ${wrong.join(', ')}에서 y값을 다시 살펴보세요. 점을 고치고 다시 제출할 수 있어요. 고친 뒤 다시 제출하거나 개념으로 넘어가 보세요.`:'\u003cstrong>잘 그렸어요!\u003c/strong>다섯 점이 모두 맞아요. ‘개념 확인으로’를 눌러 그래프를 읽어 보세요.';f.hidden=false;graphSubmitCount++;lastGraphCorrect=wrong.length===0;unlock('concept');document.getElementById('toConcept').hidden=false;if(!document.getElementById('talk').hidden)updateShare()});\n  document.querySelectorAll('.choice').forEach(btn=>btn.addEventListener('click',()=>{selected=btn.dataset.value;document.querySelectorAll('.choice').forEach(b=>b.setAttribute('aria-pressed',String(b===btn)))}));\n  document.getElementById('submitAnswer').addEventListener('click',()=>{const f=document.getElementById('questionFeedback');if(!selected){f.className='feedback warn';f.innerHTML='\u003cstrong>답을 하나 골라 주세요.\u003c/strong>그래프의 가장 낮은 점을 살펴보세요.';f.hidden=false;return}f.className='feedback'+(selected==='a'?'':' warn');f.innerHTML=selected==='a'?'\u003cstrong>정답이에요! ①\u003c/strong>꼭짓점 (1, −2)에서 y값이 가장 작아요.':'\u003cstrong>정답은 ①이에요.\u003c/strong>그래프의 가장 낮은 점은 (1, −2)입니다.';f.hidden=false;document.getElementById('answer').hidden=false;unlock('talk');document.getElementById('toTalk').hidden=false});\n  document.getElementById('toConcept').addEventListener('click',()=>showStep('concept'));\n  document.getElementById('toQuestion').addEventListener('click',()=>{unlock('question');showStep('question')});\n  document.getElementById('toTalk').addEventListener('click',()=>{showStep('talk');updateShare()});\n  function updateShare(){let note=document.getElementById('observation').value.trim();document.getElementById('share').textContent=`나의 이차함수 그래프 탐구\\n• 식: y = (x − 1)² − 2\\n• 그래프 제출: ${graphSubmitCount}회\\n• 마지막 그래프 결과: ${lastGraphCorrect===null?'다시 그리는 중':lastGraphCorrect?'점 5개 모두 맞음':'고쳐 볼 점이 있음'}\\n• 내가 발견한 점: ${note||'아직 작성하지 않음'}`}\n  document.getElementById('observation').addEventListener('input',updateShare);\n  draw();\n})();\n\u003c/script>\n\u003cscript>document.addEventListener('click',function(e){const a=e.target.closest('a');if(a&&a.getAttribute('href')&&!a.getAttribute('href').startsWith('#'))e.preventDefault();});\u003c/script>\u003c/body>\n\u003c/html>\n", "grade": "중3", "school": "중학교", "mode": "온라인", "imported": true, "family": 3}, {"id": "ext-science-laser", "name": "레이저 미로 탈출", "subject": "과학", "visual": "laser", "minutes": 10, "html": "\u003c!doctype html>\n\u003chtml lang=\"ko\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n\u003ctitle>레이저 미로 탈출 | 중학교 과학\u003c/title>\n\u003cstyle>\n:root{font-family:system-ui,-apple-system,\"Noto Sans KR\",sans-serif;color:#172839;background:#f2f7f8;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}button{cursor:pointer}\n.wrap{max-width:1120px;margin:auto;padding:24px 20px 72px}.top{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:22px}.logo{font-size:13px;letter-spacing:.08em;font-weight:850;color:#087d7b}.time{background:#e4f5f1;color:#11746d;border-radius:99px;padding:8px 13px;font-size:13px;font-weight:700;white-space:nowrap}\nh1{font-size:clamp(30px,4.5vw,48px);line-height:1.15;letter-spacing:-.05em;margin:0 0 10px}h2{font-size:23px;letter-spacing:-.035em;margin:0 0 10px}h3{font-size:17px;margin:0 0 9px}p{margin:0;line-height:1.64}.muted{color:#647587}.lead{font-size:17px;color:#435568}.badge{font-size:12px;font-weight:800;color:#0f7472;letter-spacing:.04em;margin-bottom:9px;display:block}\n.flow{display:flex;align-items:center;flex-wrap:wrap;gap:7px;margin:25px 0 17px}.flow span{font-size:12px;font-weight:750;color:#687a88;padding:7px 10px;border-radius:99px;background:#e5ecee}.flow span.active{background:#086f74;color:white}.flow i{width:16px;height:1px;background:#c4d0d5}\n.card{border:1px solid #dce8e8;border-radius:22px;background:white;box-shadow:0 12px 35px rgba(29,58,66,.06);padding:clamp(18px,3vw,30px);margin-bottom:17px}.hero{display:grid;grid-template-columns:1.25fr .75fr;gap:27px;align-items:start}.mission{background:#effaf7;border-radius:15px;padding:17px;margin-top:18px;color:#24565a;font-weight:650}\n.selects{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 5px}.selects button,.option{border:1.5px solid #d4e1e4;background:#fff;border-radius:11px;min-height:46px;padding:11px 14px;color:#263e4b;font-weight:700}.selects button[aria-pressed=\"true\"],.option[aria-pressed=\"true\"]{border-color:#098d86;background:#e7f8f3;color:#075f60}.selects button:focus-visible,.option:focus-visible,.btn:focus-visible,.range:focus-visible,textarea:focus-visible{outline:3px solid #60bdb2;outline-offset:2px}.small{font-size:13px;color:#687c87}\n.board{border-radius:16px;background:#102c40;padding:12px;overflow:hidden}.board svg{width:100%;height:auto;display:block;touch-action:none}.board-capt{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:9px 4px 2px;color:#d2e7e9;font-size:13px}.board-capt strong{color:#80f2d0}\n.lab{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(250px,.8fr);gap:23px;margin-top:18px}.panel{border-radius:16px;background:#f4f9fa;padding:19px}.panel h3{margin-bottom:13px}.angle{display:flex;align-items:baseline;justify-content:space-between;gap:8px;font-weight:750}.angle strong{font-size:22px;color:#087c78}.range{width:100%;accent-color:#0a978c;margin:16px 0 4px;min-height:30px}.ends{display:flex;justify-content:space-between;color:#71838f;font-size:12px}.tip{font-size:13px;color:#526875;line-height:1.55;margin-top:13px}.btn{border:0;border-radius:11px;padding:12px 17px;min-height:45px;font-weight:800}.primary{background:#097d78;color:white}.primary:hover{background:#086c68}.secondary{background:#e5ecef;color:#34515c}.secondary:hover{background:#d8e5e9}.actions{display:flex;flex-wrap:wrap;align-items:center;gap:9px;margin-top:17px}\n.result{border:1px solid #bce1d5;border-radius:12px;padding:14px 16px;background:#effaf5;color:#216054;line-height:1.56;margin-top:15px}.result.warn{border-color:#f2d6a4;background:#fff8e9;color:#755523}.result strong{display:block}.result[hidden],#concept[hidden],#question[hidden],#discussion[hidden],#answer[hidden]{display:none}\n.concept-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:19px 0}.mini{padding:16px;background:#f3f8f8;border-radius:13px;min-height:126px}.mini b{display:block;color:#087b75;margin-bottom:7px}.mini p{font-size:14px;color:#526674}.concept-note{border-left:4px solid #12a795;padding:9px 15px;background:#f0faf6;border-radius:0 9px 9px 0}\n.question-text{font-weight:800;font-size:18px;line-height:1.5;margin:17px 0}.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.option{text-align:left;min-height:60px}.option b{display:inline-grid;place-items:center;width:25px;height:25px;background:#e7eef0;border-radius:50%;font-size:12px;margin-right:7px}.answer{margin-top:18px;border-top:1px solid #dfe9e9;padding-top:18px}.answer p{color:#36525e}\ntextarea{display:block;width:100%;min-height:86px;resize:vertical;border:1px solid #bcced2;border-radius:12px;padding:12px 14px;background:white;color:#172839;margin-top:12px}.share{background:#eef7f7;padding:17px;border-radius:13px;white-space:pre-wrap;line-height:1.6;margin-top:13px;font-size:14px}.discussion-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px}.discussion-grid>div{background:#f6f9fa;border-radius:13px;padding:17px}.discussion-grid p{font-size:14px;color:#526575}.discussion-grid p+p{margin-top:7px}details{margin-top:20px;background:#e8f4f2;border-radius:12px;padding:15px 18px}summary{cursor:pointer;font-weight:800;color:#086b69}details p{margin-top:10px;color:#405e65;font-size:14px}.foot{color:#758894;font-size:12px;margin-top:17px}\n@media(max-width:780px){.wrap{padding:19px 13px 50px}.hero,.lab{grid-template-columns:1fr}.concept-grid{grid-template-columns:1fr}.mini{min-height:0}.discussion-grid,.options{grid-template-columns:1fr}.board{padding:5px}.board-capt{font-size:12px}.flow{gap:5px}.flow span{font-size:11px;padding:6px 8px}.flow i{width:7px}}\n\u003c/style>\n\u003c/head>\n\u003cbody>\u003cmain class=\"wrap\">\n\u003cheader class=\"top\">\u003cdiv class=\"logo\">SCIENCE LAB · 중학교 과학\u003c/div>\u003cdiv class=\"time\">개인 탐구 5~7분 · 함께 이야기 2~3분\u003c/div>\u003c/header>\n\u003ch1>레이저 미로 탈출\u003c/h1>\u003cp class=\"lead\">거울 하나로 빛의 길을 바꿔 잠긴 문을 열어 보세요.\u003c/p>\n\u003cnav class=\"flow\" aria-label=\"활동 순서\">\u003cspan class=\"active\">1 예측\u003c/span>\u003ci>\u003c/i>\u003cspan class=\"active\">2 실험\u003c/span>\u003ci>\u003c/i>\u003cspan id=\"flowConcept\">3 개념\u003c/span>\u003ci>\u003c/i>\u003cspan id=\"flowQuestion\">4 문제\u003c/span>\u003ci>\u003c/i>\u003cspan id=\"flowTalk\">5 함께 이야기\u003c/span>\u003c/nav>\n\u003csection class=\"card\" aria-labelledby=\"mission-title\">\n \u003cdiv class=\"hero\">\u003cdiv>\u003cspan class=\"badge\">MISSION 01 · 먼저 예상하기\u003c/span>\u003ch2 id=\"mission-title\">거울을 어느 방향으로 놓아야 할까요?\u003c/h2>\u003cp>왼쪽에서 출발한 레이저는 곧장 나아갑니다. 가운데 거울을 돌려 위쪽의 초록색 문에 닿게 해 보세요. 벽에 닿으면 레이저가 멈춥니다.\u003c/p>\u003cdiv class=\"mission\">내 예상: 거울을 \u003cstrong id=\"predictionText\">어느 방향\u003c/strong>으로 기울이면 문이 열릴까?\u003c/div>\u003c/div>\u003cdiv>\u003ch3>실험 전 예상 선택\u003c/h3>\u003cdiv class=\"selects\" role=\"group\" aria-label=\"거울 방향 예상\">\u003cbutton type=\"button\" data-pred=\"/\" aria-pressed=\"false\">↗ / 모양\u003c/button>\u003cbutton type=\"button\" data-pred=\"\\\\\" aria-pressed=\"false\">↘ \\ 모양\u003c/button>\u003cbutton type=\"button\" data-pred=\"—\" aria-pressed=\"false\">— 수평\u003c/button>\u003c/div>\u003cp class=\"small\">예상은 채점하지 않아요. 실제 결과와 비교해 보세요.\u003c/p>\u003c/div>\u003c/div>\n \u003cdiv class=\"lab\">\u003cdiv>\u003cdiv class=\"board\">\u003csvg id=\"scene\" viewBox=\"0 0 600 410\" role=\"img\" aria-label=\"왼쪽의 레이저 발사기, 중앙의 회전 거울, 위쪽의 초록색 목표 문, 경로를 가로막는 벽이 있는 실험 장치\">\u003c/svg>\u003cdiv class=\"board-capt\">\u003cspan id=\"status\">거울을 돌려 빛의 방향을 관찰하세요.\u003c/span>\u003cstrong id=\"attempts\">실험 0회\u003c/strong>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"panel\">\u003cspan class=\"badge\">MISSION 02 · 직접 실험하기\u003c/span>\u003ch3>거울 방향 조절\u003c/h3>\u003cdiv class=\"angle\">\u003cspan>현재 방향\u003c/span>\u003cstrong id=\"angleText\">20°\u003c/strong>\u003c/div>\u003cinput class=\"range\" id=\"angle\" type=\"range\" min=\"-75\" max=\"75\" step=\"1\" value=\"20\" aria-label=\"거울의 방향을 회전\">\u003cdiv class=\"ends\">\u003cspan>왼쪽 위로 기울임\u003c/span>\u003cspan>오른쪽 아래로 기울임\u003c/span>\u003c/div>\u003cp class=\"tip\">슬라이더를 움직이거나 그림 속 거울을 손가락·마우스로 돌릴 수 있어요. 빛이 어디로 향하는지 살펴보세요.\u003c/p>\u003cdiv class=\"actions\">\u003cbutton class=\"btn primary\" type=\"button\" id=\"test\">이 방향으로 실험\u003c/button>\u003cbutton class=\"btn secondary\" type=\"button\" id=\"reset\">처음부터\u003c/button>\u003c/div>\u003cdiv id=\"result\" class=\"result\" role=\"status\" aria-live=\"polite\" hidden>\u003c/div>\u003c/div>\u003c/div>\n\u003c/section>\n\u003csection class=\"card\" id=\"concept\" aria-labelledby=\"concept-title\" hidden>\u003cspan class=\"badge\">개념 공부 · 약 1분\u003c/span>\u003ch2 id=\"concept-title\">거울에서 빛은 어떻게 움직일까요?\u003c/h2>\u003cp>실험에서 빛이 거울에 닿자 진행 방향이 바뀌었어요. 이를 \u003cstrong>빛의 반사\u003c/strong>라고 해요.\u003c/p>\u003cdiv class=\"concept-grid\">\u003cdiv class=\"mini\">\u003cb>① 입사광선\u003c/b>\u003cp>거울을 향해 들어오는 빛의 경로예요.\u003c/p>\u003c/div>\u003cdiv class=\"mini\">\u003cb>② 법선\u003c/b>\u003cp>빛이 닿은 점에서 거울면에 수직으로 그은 기준선이에요.\u003c/p>\u003c/div>\u003cdiv class=\"mini\">\u003cb>③ 반사광선\u003c/b>\u003cp>거울에서 반사되어 나가는 빛의 경로예요.\u003c/p>\u003c/div>\u003c/div>\u003cp class=\"concept-note\">\u003cstrong>반사의 법칙:\u003c/strong> 법선을 기준으로 잰 입사각과 반사각은 같아요. 거울 방향을 바꾸면 빛이 나아가는 방향도 달라집니다.\u003c/p>\u003cdiv class=\"actions\">\u003cbutton class=\"btn primary\" type=\"button\" id=\"toQuestion\">개념 확인 문제 풀기\u003c/button>\u003c/div>\u003c/section>\n\u003csection class=\"card\" id=\"question\" aria-labelledby=\"question-title\" hidden>\u003cspan class=\"badge\">문제 1개 · 약 1분\u003c/span>\u003ch2 id=\"question-title\">실험을 개념으로 설명해요\u003c/h2>\u003cp class=\"question-text\">거울에서 빛이 반사될 때, 입사각과 반사각을 재는 기준은 무엇인가요?\u003c/p>\u003cdiv class=\"options\" role=\"group\" aria-label=\"문제 답 선택\">\u003cbutton class=\"option\" type=\"button\" data-answer=\"a\" aria-pressed=\"false\">\u003cb>①\u003c/b> 거울면\u003c/button>\u003cbutton class=\"option\" type=\"button\" data-answer=\"b\" aria-pressed=\"false\">\u003cb>②\u003c/b> 법선\u003c/button>\u003cbutton class=\"option\" type=\"button\" data-answer=\"c\" aria-pressed=\"false\">\u003cb>③\u003c/b> 레이저 발사기\u003c/button>\u003cbutton class=\"option\" type=\"button\" data-answer=\"d\" aria-pressed=\"false\">\u003cb>④\u003c/b> 목표 문\u003c/button>\u003c/div>\u003cdiv class=\"actions\">\u003cbutton class=\"btn primary\" id=\"submitAnswer\" type=\"button\">답 제출\u003c/button>\u003c/div>\u003cdiv id=\"questionResult\" class=\"result\" role=\"status\" aria-live=\"polite\" hidden>\u003c/div>\u003cdiv class=\"answer\" id=\"answer\" hidden>\u003ch3>정답 ② 법선\u003c/h3>\u003cp>입사각은 \u003cstrong>입사광선과 법선\u003c/strong> 사이의 각이고, 반사각은 \u003cstrong>법선과 반사광선\u003c/strong> 사이의 각이에요. 두 각의 크기는 같습니다. 거울면을 기준으로 재는 각과 혼동하지 않도록 해요.\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"card\" id=\"discussion\" aria-labelledby=\"discussion-title\" hidden>\u003cspan class=\"badge\">발표 준비 · 함께 이야기\u003c/span>\u003ch2 id=\"discussion-title\">내 실험 결과를 한 문장으로 남겨요\u003c/h2>\u003cp>예상과 실험 결과가 같았나요? 거울을 돌렸을 때 빛의 방향이 어떻게 변했는지 적어 보세요.\u003c/p>\u003clabel for=\"observation\" class=\"small\">나의 관찰·설명\u003c/label>\u003ctextarea id=\"observation\" placeholder=\"예: 처음에는 아래로 갔는데 거울을 / 모양으로 돌리자 빛이 위쪽 문에 닿았다. 거울에서 반사되며 방향이 바뀌었다.\">\u003c/textarea>\u003cdiv id=\"share\" class=\"share\" aria-live=\"polite\">\u003c/div>\u003cdiv class=\"discussion-grid\">\u003cdiv>\u003ch3>친구와 이야기할 질문\u003c/h3>\u003cp>① 서로 다른 방향으로 거울을 돌렸을 때 빛의 경로는 어떻게 달랐나요?\u003c/p>\u003cp>② 목표 문을 맞힌 방법을 빛의 반사로 설명할 수 있나요?\u003c/p>\u003c/div>\u003cdiv>\u003ch3>발표할 때\u003c/h3>\u003cp>예상 → 실제로 한 조작 → 관찰 결과 → 알게 된 개념의 순서로 30초 정도 말해 보세요.\u003c/p>\u003c/div>\u003c/div>\u003cdetails>\u003csummary>교사용 결론 · 2~3분\u003c/summary>\u003cp>\u003cstrong>학생 발표 2명 비교:\u003c/strong> 예상과 결과가 같았던 사례, 달랐던 사례를 한 명씩 들어 봅니다. “거울을 돌렸더니 빛의 경로가 왜 달라졌을까?”를 묻고, 법선을 기준으로 입사각과 반사각이 같다는 점을 정리합니다. 이 화면의 빛줄기는 이상적인 직선 광선을 나타낸 간단한 모형입니다.\u003c/p>\u003c/details>\u003c/section>\n\u003cp class=\"foot\">교실용 개인 탐구 활동 · 실험 및 답안은 이 화면에만 표시되며 별도 서버로 전송되지 않습니다.\u003c/p>\n\u003c/main>\n\u003cscript>\n(()=>{\nconst scene=document.getElementById('scene'),slider=document.getElementById('angle'),result=document.getElementById('result');\nconst src={x:62,y:320},mirror={x:252,y:320},goal={x:252,y:72,r:19};\nconst walls=[{x:122,y:115,w:55,h:165},{x:380,y:80,w:58,h:208}];\nlet angle=20,attempts=0,prediction='',lastSuccess=false,successfulAngle=null,selected='',drag=false;\nfunction svg(tag,attrs={}){const e=document.createElementNS('http://www.w3.org/2000/svg',tag);for(const[k,v]of Object.entries(attrs))e.setAttribute(k,v);return e}\nfunction add(tag,attrs={},parent=scene){let e=svg(tag,attrs);parent.append(e);return e}\nfunction text(x,y,value,attrs={}){let e=add('text',{x,y,...attrs});e.textContent=value;return e}\nfunction rectHit(o,d,r){let lo=0,hi=Infinity;for(const axis of ['x','y']){let min=r[axis],max=min+(axis==='x'?r.w:r.h);if(Math.abs(d[axis])\u003c1e-10){if(o[axis]\u003cmin||o[axis]>max)return Infinity;continue}let a=(min-o[axis])/d[axis],b=(max-o[axis])/d[axis];lo=Math.max(lo,Math.min(a,b));hi=Math.min(hi,Math.max(a,b));if(lo>hi)return Infinity}return hi>=0?lo:Infinity}\nfunction circleHit(o,d,c){let ox=o.x-c.x,oy=o.y-c.y,b=ox*d.x+oy*d.y,k=ox*ox+oy*oy-c.r*c.r,disc=b*b-k;if(disc\u003c0)return Infinity;let t=-b-Math.sqrt(disc);return t>=0?t:Infinity}\nfunction ray(){let a=angle*Math.PI/180,d={x:Math.cos(2*a),y:Math.sin(2*a)},o={x:mirror.x+d.x*.2,y:mirror.y+d.y*.2};let edges=[];if(d.x>0)edges.push((583-o.x)/d.x);if(d.x\u003c0)edges.push((17-o.x)/d.x);if(d.y>0)edges.push((393-o.y)/d.y);if(d.y\u003c0)edges.push((17-o.y)/d.y);let t=Math.min(...edges.filter(v=>v>=0));let wallT=Math.min(...walls.map(w=>rectHit(o,d,w)));let goalT=circleHit(o,d,goal);let hit=goalT\u003cwallT&&goalT\u003ct;t=Math.min(t,wallT,goalT);return{end:{x:o.x+d.x*t,y:o.y+d.y*t},hit,blocked:wallT\u003ct+0.001&&!hit,d}}\nfunction draw(){scene.replaceChildren();add('rect',{x:0,y:0,width:600,height:410,fill:'#102c40'});for(let x=20;x\u003c600;x+=30)for(let y=20;y\u003c410;y+=30)add('circle',{cx:x,cy:y,r:1,fill:'#28495a'});\n add('rect',{x:17,y:17,width:566,height:376,rx:12,fill:'none',stroke:'#385367','stroke-width':2});\n walls.forEach(w=>{add('rect',{x:w.x,y:w.y,width:w.w,height:w.h,rx:6,fill:'#476174'});for(let y=w.y+19;y\u003cw.y+w.h;y+=30)add('line',{x1:w.x+8,y1:y,x2:w.x+w.w-8,y2:y,stroke:'#698294','stroke-width':2})});\n add('circle',{cx:goal.x,cy:goal.y,r:32,fill:lastSuccess?'#1ea978':'#225c5a',opacity:.72});add('circle',{cx:goal.x,cy:goal.y,r:goal.r,fill:lastSuccess?'#a6ffbd':'#51d7ac',stroke:'#c6ffe5','stroke-width':2});text(goal.x,goal.y+5,'문',{fill:'#083e3d','font-size':15,'font-weight':900,'text-anchor':'middle'});\n add('rect',{x:29,y:301,width:42,height:38,rx:7,fill:'#40b8b4',stroke:'#a5ece5','stroke-width':2});add('circle',{cx:67,cy:320,r:7,fill:'#eafffb'});text(48,366,'출발',{fill:'#b7d9db','font-size':14,'text-anchor':'middle'});\n let a=angle*Math.PI/180,half=43,r=ray();add('line',{x1:src.x,y1:src.y,x2:mirror.x,y2:mirror.y,stroke:'#ffdb70','stroke-width':5,'stroke-linecap':'round'});\n add('line',{x1:mirror.x,y1:mirror.y,x2:r.end.x,y2:r.end.y,stroke:r.hit?'#baff7a':'#ffd069','stroke-width':5,'stroke-linecap':'round'});\n if(lastSuccess){let n=a+Math.PI/2;add('line',{x1:mirror.x-59*Math.cos(n),y1:mirror.y-59*Math.sin(n),x2:mirror.x+59*Math.cos(n),y2:mirror.y+59*Math.sin(n),stroke:'#ec9fea','stroke-width':2,'stroke-dasharray':'5 5'});text(mirror.x-72*Math.cos(n),mirror.y-72*Math.sin(n)-7,'법선',{fill:'#ffd6fc','font-size':13,'font-weight':700,'text-anchor':'middle'})}\n add('circle',{cx:mirror.x,cy:mirror.y,r:50,fill:'#173b51',stroke:'#5c8a9a','stroke-width':1.5,'stroke-dasharray':'4 6'});\n add('line',{x1:mirror.x-half*Math.cos(a),y1:mirror.y-half*Math.sin(a),x2:mirror.x+half*Math.cos(a),y2:mirror.y+half*Math.sin(a),stroke:'#a9eafb','stroke-width':9,'stroke-linecap':'round'});\n add('line',{x1:mirror.x-half*Math.cos(a),y1:mirror.y-half*Math.sin(a),x2:mirror.x+half*Math.cos(a),y2:mirror.y+half*Math.sin(a),stroke:'#fff','stroke-width':2,'stroke-linecap':'round'});\n add('circle',{cx:mirror.x,cy:mirror.y,r:4,fill:'#fff'});text(mirror.x,390,'회전 거울',{fill:'#b7d9db','font-size':14,'text-anchor':'middle'});\n if(r.blocked)add('circle',{cx:r.end.x,cy:r.end.y,r:6,fill:'#ff8877'});\n document.getElementById('angleText').textContent=(angle\u003c0?'−'+Math.abs(angle):angle)+'°';document.getElementById('status').textContent=r.hit?'빛이 목표 문에 닿을 방향이에요!':r.blocked?'빛이 벽에 막혔어요.':'빛이 문을 비껴가요. 거울을 더 돌려 보세요.';return r}\nfunction setAngle(v){angle=Math.max(-75,Math.min(75,Math.round(v)));slider.value=angle;lastSuccess=false;result.hidden=true;draw();if(!document.getElementById('discussion').hidden)updateShare()}\nslider.addEventListener('input',()=>setAngle(Number(slider.value)));\nscene.addEventListener('pointerdown',ev=>{let box=scene.getBoundingClientRect(),x=(ev.clientX-box.left)*600/box.width,y=(ev.clientY-box.top)*410/box.height;if(Math.hypot(x-mirror.x,y-mirror.y)>73)return;drag=true;scene.setPointerCapture(ev.pointerId);setAngle(Math.atan2(y-mirror.y,x-mirror.x)*180/Math.PI)});\nscene.addEventListener('pointermove',ev=>{if(!drag)return;let box=scene.getBoundingClientRect(),x=(ev.clientX-box.left)*600/box.width,y=(ev.clientY-box.top)*410/box.height;setAngle(Math.atan2(y-mirror.y,x-mirror.x)*180/Math.PI)});\nscene.addEventListener('pointerup',()=>drag=false);scene.addEventListener('pointercancel',()=>drag=false);\ndocument.querySelectorAll('[data-pred]').forEach(b=>b.addEventListener('click',()=>{prediction=b.dataset.pred;document.querySelectorAll('[data-pred]').forEach(c=>c.setAttribute('aria-pressed',String(c===b)));document.getElementById('predictionText').textContent=prediction==='/'?'/ 모양':prediction==='\\\\'?'\\\\ 모양':'수평'}));\ndocument.getElementById('test').addEventListener('click',()=>{attempts++;document.getElementById('attempts').textContent=`실험 ${attempts}회`;let r=draw();lastSuccess=r.hit;if(r.hit)successfulAngle=angle;draw();result.hidden=false;result.className='result'+(r.hit?'':' warn');result.inn
