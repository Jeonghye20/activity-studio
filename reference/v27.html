g').hidden = false;\n    setTimeout(function(){\n      document.getElementById('s2thinking').hidden = true;\n      var box = document.getElementById('s2result');\n      var t = currentTarget();\n      var wrong = pickWrongGuess(state.targetIdx);\n      state.s2wrong = wrong;\n      box.hidden = false;\n      box.innerHTML =\n        '\u003cdiv class=\"result-box fail\">' +\n          '\u003cdiv class=\"rb-emoji\">'+wrong.emoji+'\u003c/div>' +\n          '\u003cdiv class=\"rb-text\">\u003cspan class=\"result-tag\">오답\u003c/span>\u003cbr>' +\n          'AI 친구: \"' + state.s2tags.join(', ') + '... 그럼 \u003cb>'+wrong.name+'\u003c/b>인가요?\"\u003cbr>' +\n          '정답은 \u003cb>'+t.name+'\u003c/b>이었어요. (그 단서는 '+wrong.name+'에도 똑같이 해당돼요)\u003c/div>' +\n        '\u003c/div>';\n      document.getElementById('s2next').hidden = false;\n    }, 1000);\n  }\n\n  // ---- Screen 3 ----\n  function fillS3(){\n    var t = currentTarget();\n    var tagsText = (state.s2tags && state.s2tags.length) ? state.s2tags.join(', ') : '(고른 단서 없음)';\n    var wrongName = state.s2wrong ? state.s2wrong.name : '다른 동물';\n    document.getElementById('s3text').innerHTML =\n      '방금 \u003cb>\"' + tagsText + '\"\u003c/b>라는 단서만 텍스트로 전달했는데, 이 단서는 ' + t.name + '뿐 아니라 ' + wrongName + '한테도 똑같이 해당돼서 AI 친구는 ' +\n      '\u003cb>' + t.name + '\u003c/b>를 \u003cb>' + wrongName + '\u003c/b>로 착각했어요.\u003cbr>\u003cbr>' +\n      '왜 그랬을까요?';\n  }\n\n  // ---- Screen 4 ----\n  function onS4Input(){\n    var v = document.getElementById('s4input').value;\n    document.getElementById('s4counter').textContent = v.length + ' / 180자';\n    document.getElementById('s4next').disabled = v.trim().length === 0;\n  }\n\n  // ---- Screen 5 ----\n  function fillS5Target(){\n    var t = currentTarget();\n    document.getElementById('s5emoji').textContent = t.emoji;\n    document.getElementById('s5name').textContent = t.name;\n    document.getElementById('panelImageEmoji').textContent = t.emoji;\n    document.getElementById('panelImageText').textContent = t.imageDesc;\n    document.getElementById('panelSoundText').textContent = '\"'+t.soundLabel+'\" — '+t.soundDesc;\n    document.getElementById('panelMotionEmoji').textContent = t.emoji;\n    document.getElementById('panelMotionText').textContent = t.motionDesc;\n    resetS5Toggles();\n  }\n  function resetS5Toggles(){\n    s5active = {image:false, sound:false, motion:false};\n    ['Image','Sound','Motion'].forEach(function(k){\n      document.getElementById('card'+k).classList.remove('active');\n    });\n    document.getElementById('s5result').hidden = true;\n    updateMeter();\n    renderComposeStrip();\n  }\n  function toggleReveal(type){\n    s5active[type] = !s5active[type];\n    var key = type.charAt(0).toUpperCase() + type.slice(1);\n    document.getElementById('card'+key).classList.toggle('active', s5active[type]);\n    updateMeter();\n    renderComposeStrip();\n  }\n  function renderComposeStrip(){\n    var t = currentTarget();\n    var tagsText = (state.s2tags && state.s2tags.length) ? state.s2tags.join(' · ') : '단서 없음';\n    var chips = [{label:'텍스트: '+tagsText, on:true}];\n    chips.push({label:'이미지: '+t.imageNoun, on:s5active.image});\n    chips.push({label:'소리: \"'+t.soundLabel+'\"', on:s5active.sound});\n    chips.push({label:'동작: '+t.motionNoun, on:s5active.motion});\n    document.getElementById('composeChips').innerHTML = chips\n      .filter(function(c){ return c.on; })\n      .map(function(c){ return '\u003cspan class=\"compose-chip on\">'+c.label+'\u003c/span>'; })\n      .join('');\n  }\n  function currentScore(){\n    var score = 20;\n    if(s5active.image) score += 40;\n    if(s5active.sound) score += 25;\n    if(s5active.motion) score += 35;\n    return Math.min(score, 100);\n  }\n  function updateMeter(){\n    var s = currentScore();\n    document.getElementById('meterVal').textContent = s + '%';\n    document.getElementById('meterFill').style.width = s + '%';\n  }\n  function comboLabel(){\n    var parts = ['텍스트'];\n    if(s5active.image) parts.push('이미지');\n    if(s5active.sound) parts.push('소리');\n    if(s5active.motion) parts.push('동작');\n    return parts.join('+');\n  }\n  function buildFlavor(t){\n    var parts = [];\n    if(s5active.image) parts.push(t.imageNoun);\n    if(s5active.sound) parts.push('\"'+t.soundLabel+'\" 소리');\n    if(s5active.motion) parts.push(t.motionNoun);\n    return parts.join(', ');\n  }\n  function sendGuess5(){\n    var score = currentScore();\n    var success = score >= 60;\n    var combo = comboLabel();\n    var flavor = buildFlavor(currentTarget());\n    document.getElementById('s5result').hidden = true;\n    document.getElementById('s5thinking').hidden = false;\n    setTimeout(function(){\n      document.getElementById('s5thinking').hidden = true;\n      var box = document.getElementById('s5result');\n      var t = currentTarget();\n      box.hidden = false;\n      if(success){\n        box.innerHTML =\n          '\u003cdiv class=\"result-box success\">' +\n            '\u003cdiv class=\"rb-emoji\">'+t.emoji+'\u003c/div>' +\n            '\u003cdiv class=\"rb-text\">\u003cspan class=\"result-tag\">정답\u003c/span>\u003cbr>' +\n            'AI 친구: \"'+(flavor ? flavor+'까지 보고 나니 ' : '')+'이건 \u003cb>'+t.name+'\u003c/b>이군요!\"\u003cbr>' +\n            '전달력 \u003cspan class=\"mono\">'+score+'%\u003c/span> · '+combo+'\u003c/div>' +\n          '\u003c/div>';\n        state.s5everSucceeded = true;\n        document.getElementById('s5next').disabled = false;\n      } else {\n        var wrong = pickWrongGuess(state.targetIdx);\n        box.innerHTML =\n          '\u003cdiv class=\"result-box fail\">' +\n            '\u003cdiv class=\"rb-emoji\">'+wrong.emoji+'\u003c/div>' +\n            '\u003cdiv class=\"rb-text\">\u003cspan class=\"result-tag\">오답\u003c/span>\u003cbr>' +\n            'AI 친구: \"'+(flavor ? flavor+'만으로는... ' : '')+'음... \u003cb>'+wrong.name+'\u003c/b>인가요?\"\u003cbr>' +\n            '전달력 \u003cspan class=\"mono\">'+score+'%\u003c/span> · '+combo+'\u003c/div>' +\n          '\u003c/div>';\n      }\n      state.s5attempts++;\n      state.s5history.unshift({combo:combo, score:score, success:success, target:t.name});\n      if(!state.s5firstResultShown){ state.s5firstResultShown = true; }\n      renderHistory();\n    }, 900);\n  }\n  function renderHistory(){\n    var wrap = document.getElementById('s5history');\n    var list = document.getElementById('s5historyList');\n    if(state.s5history.length === 0){ wrap.hidden = true; return; }\n    wrap.hidden = false;\n    list.innerHTML = state.s5history.slice(0,5).map(function(h){\n      return '\u003cdiv class=\"h-item '+(h.success?'ok':'no')+'\">' +\n        '\u003cspan class=\"h-combo\">'+h.target+' · '+h.combo+' ('+h.score+'%)\u003c/span>' +\n        '\u003cspan class=\"h-mark\">'+(h.success?'성공':'실패')+'\u003c/span>' +\n      '\u003c/div>';\n    }).join('');\n  }\n  function reshuffleTarget(){\n    var next;\n    do{ next = Math.floor(Math.random()*TARGETS.length); } while(next === state.targetIdx);\n    state.targetIdx = next;\n    fillS5Target();\n  }\n\n  // ---- Screen 6 ----\n  function onS6Input(){\n    var v = document.getElementById('s6input').value;\n    document.getElementById('s6counter').textContent = v.length + ' / 180자';\n    document.getElementById('s6submit').disabled = v.trim().length === 0;\n  }\n  function finishActivity(){\n    state.s6text = document.getElementById('s6input').value.trim();\n    go(7);\n  }\n\n  // ---- Screen 7 ----\n  function fillS7(){\n    var t0 = TARGETS[0]; // first attempt was always screen 2's original card\n    var s2tagsText = (state.s2tags && state.s2tags.length) ? state.s2tags.join(', ') : '(고른 단서 없음)';\n    var s2wrongName = state.s2wrong ? state.s2wrong.name : '다른 동물';\n    document.getElementById('sum1').innerHTML =\n      '\"'+s2tagsText+'\"라는 텍스트 단서만으로 설명했더니, 그 단서는 여러 동물에 공통이라서 ' +\n      'AI 친구는 \u003cb>'+t0.name+'\u003c/b>를 \u003cb>'+s2wrongName+'\u003c/b>로 잘못 알아들었어요.';\n    document.getElementById('sum2').textContent = state.s4text || document.getElementById('s4input').value.trim();\n\n    var best = null, first = null;\n    state.s5history.slice().reverse().forEach(function(h){\n      if(!first) first = h;\n      if(h.success && (!best || h.score \u003c best.score)) best = h; // smallest passing combo, most informative\n    });\n    var s3text = '';\n    if(first) s3text += first.target+'를(을) '+first.combo+'로 전달했을 때 전달력 '+first.score+'%로 '+(first.success?'성공했어요.':'아직 부족했어요.')+' ';\n    if(best) s3text += '표현 방식을 늘려 '+best.combo+' 조합으로 전달하니 전달력 '+best.score+'%로 성공했어요.';\n    if(!s3text) s3text = '표현 방식을 조합해가며 AI 친구의 정답률 변화를 관찰했어요.';\n    document.getElementById('sum3').textContent = s3text;\n\n    document.getElementById('sum4').textContent = state.s6text || document.getElementById('s6input').value.trim();\n\n    document.getElementById('recDetailText').innerHTML =\n      '\u003cb>①\u003c/b> '+document.getElementById('sum1').innerHTML+'\u003cbr>\u003cbr>' +\n      '\u003cb>②\u003c/b> '+document.getElementById('sum2').textContent+'\u003cbr>\u003cbr>' +\n      '\u003cb>③\u003c/b> '+document.getElementById('sum3').textContent+'\u003cbr>\u003cbr>' +\n      '\u003cb>④\u003c/b> '+document.getElementById('sum4').textContent;\n  }\n\n  // ---- Records / modal ----\n  function openRecords(){\n    for(var i=1;i\u003c=7;i++){ var el = document.getElementById('s'+i); if(el) el.hidden = true; }\n    document.getElementById('sRec').hidden = false;\n    document.getElementById('progressWrap').hidden = true;\n  }\n  function toggleRecDetail(){\n    var d = document.getElementById('recDetail');\n    d.hidden = !d.hidden;\n  }\n  function openQuestionRoom(){\n    document.getElementById('qModal').hidden = false;\n  }\n  function closeModal(){\n    document.getElementById('qModal').hidden = true;\n  }\n  function closeModalOnBackdrop(e){\n    if(e.target.id === 'qModal') closeModal();\n  }\n\n  // init\n  renderProgress();\n  updateMeter();\n\u003c/script>\n\n\u003cscript>document.addEventListener('click',function(e){const a=e.target.closest('a');if(a&&a.getAttribute('href')&&!a.getAttribute('href').startsWith('#'))e.preventDefault();});\u003c/script>\u003c/body>\u003c/html>\n", "grade": "", "school": "중학교", "mode": "온라인", "imported": true, "family": 3}, {"id": "ext-can-i-use-photo", "name": "그 사진, 써도 될까?", "subject": "정보", "visual": "photo", "minutes": 10, "html": "\u003c!doctype html>\u003chtml>\u003chead>\u003cmeta charset=utf8>\u003cmeta name=viewport content=\"width=device-width,initial-scale=1,viewport-fit=cover\">\u003cstyle>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}\u003c/style>\u003c/head>\u003cbody>\n\u003ctitle>저작권 함정 탐구\u003c/title>\n\n\u003cstyle>\n  :root{\n    --bg:#F6F2E8;\n    --surface:#FFFFFF;\n    --surface-2:#EFE8D8;\n    --ink:#23211D;\n    --ink-soft:#6B665A;\n    --line:#DCD3BC;\n    --accent:#2E4A7D;\n    --accent-2:#3F6AAE;\n    --accent-soft:#E6ECF6;\n    --danger:#AE3A2C;\n    --danger-soft:#F7E2DC;\n    --success:#2E6E52;\n    --success-soft:#DFEEE4;\n    --tag-bg:#23211D;\n    --tag-fg:#F3E9CE;\n    --radius:16px;\n    --shadow:0 1px 2px rgba(35,33,29,.07),0 10px 28px -14px rgba(35,33,29,.28);\n    color-scheme:light;\n  }\n  @media (prefers-color-scheme: dark){\n    :root:not([data-theme=\"light\"]){\n      --bg:#17171B;\n      --surface:#1F2025;\n      --surface-2:#26272E;\n      --ink:#EDE8DA;\n      --ink-soft:#A6A190;\n      --line:#37383F;\n      --accent:#8CACE0;\n      --accent-2:#A9C2EE;\n      --accent-soft:#232C3C;\n      --danger:#E2988A;\n      --danger-soft:#3A2621;\n      --success:#8FCBAA;\n      --success-soft:#1E332A;\n      --tag-bg:#EDE8DA;\n      --tag-fg:#1B1B1E;\n      --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.6);\n      color-scheme:dark;\n    }\n  }\n  :root[data-theme=\"dark\"]{\n    --bg:#17171B;\n    --surface:#1F2025;\n    --surface-2:#26272E;\n    --ink:#EDE8DA;\n    --ink-soft:#A6A190;\n    --line:#37383F;\n    --accent:#8CACE0;\n    --accent-2:#A9C2EE;\n    --accent-soft:#232C3C;\n    --danger:#E2988A;\n    --danger-soft:#3A2621;\n    --success:#8FCBAA;\n    --success-soft:#1E332A;\n    --tag-bg:#EDE8DA;\n    --tag-fg:#1B1B1E;\n    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.6);\n    color-scheme:dark;\n  }\n\n  *{box-sizing:border-box;}\n  body{background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans KR',-apple-system,'Malgun Gothic',sans-serif;}\n  .page{max-width:640px;margin:0 auto;padding:28px 16px 64px;display:flex;flex-direction:column;gap:22px;}\n\n  .masthead{display:flex;flex-direction:column;gap:6px;}\n  .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--accent-2);}\n  .masthead h1{font-family:'Gowun Batang',serif;font-weight:700;font-size:clamp(26px,6vw,34px);line-height:1.25;margin:0;text-wrap:balance;}\n  .masthead .sub{margin:0;color:var(--ink-soft);font-size:13.5px;}\n\n  .stepper{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;}\n  .dot{flex:1 0 auto;min-width:38px;height:38px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);font-family:'IBM Plex Sans KR',sans-serif;font-size:15px;font-weight:600;cursor:pointer;transition:background .15s,color .15s,border-color .15s,transform .1s;}\n  .dot:hover{transform:translateY(-1px);}\n  .dot:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px;}\n  .dot[data-state=\"done\"]{background:var(--success-soft);color:var(--success);border-color:transparent;}\n  .dot[data-state=\"current\"]{background:var(--accent);color:#fff;border-color:transparent;box-shadow:var(--shadow);}\n\n  .device{background:var(--surface-2);border-radius:24px;padding:10px;box-shadow:var(--shadow);}\n  .device-bar{display:flex;align-items:center;justify-content:space-between;padding:6px 10px 10px;}\n  .device-tag{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);}\n  .device-dots{display:flex;gap:4px;}\n  .device-dots span{width:6px;height:6px;border-radius:50%;background:var(--line);}\n  .device-screen{background:var(--surface);border-radius:18px;min-height:520px;padding:22px 20px 20px;display:flex;flex-direction:column;box-shadow:inset 0 0 0 1px var(--line);}\n\n  .step{display:flex;flex-direction:column;gap:16px;animation:fade .25s ease;}\n  @media (prefers-reduced-motion: reduce){.step{animation:none;}}\n  @keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}\n\n  .kicker{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-2);}\n  .step h2{font-family:'Gowun Batang',serif;font-size:21px;margin:0;line-height:1.4;text-wrap:balance;}\n  .step p{margin:0;line-height:1.65;font-size:14.5px;color:var(--ink);}\n  .muted{color:var(--ink-soft);}\n\n  .mission-card{background:var(--accent-soft);border-radius:var(--radius);padding:20px;display:flex;flex-direction:column;gap:10px;}\n  .chip-row{display:flex;gap:8px;flex-wrap:wrap;}\n  .chip{font-family:'IBM Plex Mono',monospace;font-size:12px;padding:4px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--ink-soft);}\n  .timer{font-family:'IBM Plex Mono',monospace;font-size:26px;font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums;}\n\n  .btn{appearance:none;border:none;border-radius:11px;padding:12px 18px;font-family:'IBM Plex Sans KR',sans-serif;font-weight:600;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;justify-content:center;transition:transform .1s,filter .15s,background .15s;}\n  .btn:active{transform:scale(.98);}\n  .btn:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px;}\n  .btn-primary{background:var(--accent);color:#fff;}\n  .btn-primary:hover{filter:brightness(1.08);}\n  .btn-primary:disabled{background:var(--line);color:var(--ink-soft);cursor:not-allowed;}\n  .btn-ghost{background:transparent;color:var(--accent);border:1px solid var(--line);}\n  .btn-danger-ghost{background:var(--danger-soft);color:var(--danger);}\n  .btn-block{width:100%;}\n  .btn-row{display:flex;gap:10px;flex-wrap:wrap;}\n\n  .searchbar{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:11px;padding:8px 12px;background:var(--surface-2);}\n  .searchbar input{border:none;background:transparent;flex:1;font-size:14px;color:var(--ink);font-family:'IBM Plex Sans KR',sans-serif;}\n  .searchbar input:focus{outline:none;}\n  .searchbar svg{flex:none;color:var(--ink-soft);}\n\n  .image-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}\n  .imgcard{position:relative;border-radius:13px;overflow:hidden;border:2px solid transparent;background:var(--surface-2);cursor:pointer;text-align:left;padding:0;display:flex;flex-direction:column;}\n  .imgcard:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px;}\n  .imgcard[data-picked=\"true\"]{border-color:var(--accent);}\n  .imgcard .art{height:78px;display:flex;align-items:center;justify-content:center;color:#fff;}\n  .imgcard .meta{padding:8px 9px 9px;display:flex;flex-direction:column;gap:5px;}\n  .imgcard .badge{position:absolute;top:6px;left:6px;background:rgba(0,0,0,.55);color:#fff;font-size:10px;padding:2px 7px;border-radius:999px;font-family:'IBM Plex Sans KR',sans-serif;}\n  .imgcard .name{font-size:12.5px;font-weight:600;}\n  .imgcard .dl{font-size:11.5px;font-weight:700;color:var(--accent);}\n  .imgcard .lic{font-size:8.5px;color:var(--ink-soft);opacity:.55;font-family:'IBM Plex Mono',monospace;letter-spacing:.01em;}\n\n  .source-field{display:flex;flex-direction:column;gap:6px;}\n  .source-field label{font-size:12.5px;color:var(--ink-soft);}\n  .source-field input{border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13.5px;background:var(--surface);color:var(--ink);font-family:'IBM Plex Sans KR',sans-serif;}\n  .source-field input:focus{outline:2px solid var(--accent-2);outline-offset:1px;}\n\n  .result-panel{border-radius:var(--radius);padding:18px;display:flex;gap:12px;align-items:flex-start;}\n  .result-panel.bad{background:var(--danger-soft);}\n  .result-panel.good{background:var(--success-soft);}\n  .result-panel .icon-wrap{flex:none;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;}\n  .result-panel.bad .icon-wrap{background:var(--danger);color:#fff;}\n  .result-panel.good .icon-wrap{background:var(--success);color:#fff;}\n  .result-panel h3{margin:0 0 4px;font-size:14.5px;font-family:'IBM Plex Sans KR',sans-serif;}\n  .result-panel.bad h3{color:var(--danger);}\n  .result-panel.good h3{color:var(--success);}\n  .result-panel p{font-size:13px;line-height:1.6;}\n  .prompt-line{font-size:13px;font-style:normal;color:var(--accent);margin-top:6px;font-weight:600;}\n\n  .recap{display:flex;flex-direction:column;gap:8px;}\n  .recap-row{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:11px;padding:10px 12px;background:var(--surface-2);}\n  .recap-row .num{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);flex:none;padding-top:1px;}\n  .recap-row p{font-size:13px;}\n  .callout{border-left:3px solid var(--accent);padding:4px 0 4px 12px;font-size:13.5px;color:var(--ink);background:var(--accent-soft);border-radius:0 8px 8px 0;padding:10px 12px;}\n\n  textarea.limited{width:100%;border:1px solid var(--line);border-radius:11px;padding:12px 13px;font-size:13.5px;font-family:'IBM Plex Sans KR',sans-serif;color:var(--ink);background:var(--surface);resize:vertical;min-height:76px;line-height:1.55;}\n  textarea.limited:focus{outline:2px solid var(--accent-2);outline-offset:1px;}\n  .counter{align-self:flex-end;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);}\n\n  .cond-block{display:flex;flex-direction:column;gap:10px;}\n  .cond-label{font-size:12px;font-weight:600;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;}\n  .radio-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}\n  .radio-card{border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-size:12.5px;text-align:left;background:var(--surface);cursor:pointer;font-family:'IBM Plex Sans KR',sans-serif;color:var(--ink);}\n  .radio-card[aria-pressed=\"true\"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600;}\n  .toggle-row{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--surface);}\n  .toggle-row .t-name{font-size:13px;font-weight:600;}\n  .toggle-row .t-desc{font-size:11.5px;color:var(--ink-soft);}\n  .switch{position:relative;width:38px;height:22px;flex:none;}\n  .switch input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer;}\n  .switch .track{position:absolute;inset:0;background:var(--line);border-radius:999px;transition:background .15s;}\n  .switch .knob{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .15s;}\n  .switch input:checked + .track{background:var(--accent);}\n  .switch input:checked + .track + .knob{transform:translateX(16px);}\n  .switch input:focus-visible + .track{outline:2px solid var(--accent-2);outline-offset:2px;}\n  .try-counter{font-size:11.5px;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;}\n\n  .summary-card{border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:12px;background:var(--surface-2);}\n  .summary-row{display:flex;flex-direction:column;gap:3px;}\n  .summary-row .k{font-family:'IBM Plex Mono',monospace;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent-2);}\n  .summary-row .v{font-size:13px;line-height:1.55;}\n  .save-state{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--success);font-weight:600;}\n\n  .question-chip{border:1px dashed var(--line);border-radius:999px;padding:8px 13px;font-size:12.5px;background:var(--surface);cursor:pointer;color:var(--ink);text-align:left;font-family:'IBM Plex Sans KR',sans-serif;}\n  .question-chip:hover{border-color:var(--accent-2);color:var(--accent);}\n  .question-list{display:flex;flex-direction:column;gap:7px;}\n\n  .designnote{border:1px dashed var(--line);border-radius:13px;padding:12px 14px;background:var(--surface);}\n  .designnote-label{font-family:'IBM Plex Mono',monospace;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-soft);margin-bottom:4px;}\n  .designnote p{margin:0;font-size:12.5px;color:var(--ink-soft);line-height:1.55;}\n\n  .foot{text-align:center;font-size:11.5px;color:var(--ink-soft);}\n\n  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(10px);background:var(--ink);color:var(--bg);font-size:12.5px;padding:10px 16px;border-radius:999px;box-shadow:var(--shadow);opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:10;}\n  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}\n\n  [hidden]{display:none!important;}\n\u003c/style>\n\n\u003cdiv class=\"page\">\n  \u003cheader class=\"masthead\">\n    \u003cdiv class=\"eyebrow\">AI탐구수업스튜디오 · 탐구공방\u003c/div>\n    \u003ch1>그 사진, 써도 될까?\u003c/h1>\n    \u003cp class=\"sub\">다음 정보 수업(저작권) 전 사전활동 · 교사용 미리보기 — 위 번호를 누르면 단계를 자유롭게 오갈 수 있어요.\u003c/p>\n  \u003c/header>\n\n  \u003cnav class=\"stepper\" id=\"stepper\" aria-label=\"단계 이동\">\u003c/nav>\n\n  \u003cmain class=\"device\">\n    \u003cdiv class=\"device-bar\">\n      \u003cspan class=\"device-tag\" id=\"deviceTag\">STEP 1 · 인트로\u003c/span>\n      \u003cdiv class=\"device-dots\">\u003cspan>\u003c/span>\u003cspan>\u003c/span>\u003cspan>\u003c/span>\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"device-screen\" id=\"screen\">\n\n      \u003csection class=\"step\" data-step=\"1\">\n        \u003cspan class=\"kicker\">① 인트로\u003c/span>\n        \u003ch2>학급 축제 홍보 포스터를 완성하라!\u003c/h2>\n        \u003cdiv class=\"callout\">이 활동은 다음 \u003cstrong>정보 수업(저작권)\u003c/strong> 전에 혼자 완료하는 사전활동이에요. 예상 소요 시간은 8~10분이고, 오늘 겪은 내용은 다음 수업의 출발점이 돼요.\u003c/div>\n        \u003cdiv class=\"mission-card\">\n          \u003cp>너는 이번 학급 축제의 포스터 담당이야. 검색해서 찾은 사진으로 멋진 포스터를 완성해서 제출해줘. 완성된 포스터는 교문 밖 게시판과 학급 SNS에도 올라갈 예정이야.\u003c/p>\n          \u003cdiv class=\"chip-row\">\n            \u003cspan class=\"chip\">담당: 포스터 디자이너\u003c/span>\n            \u003cspan class=\"chip\">공개 범위: 교내 + 교외\u003c/span>\n          \u003c/div>\n          \u003cdiv>\n            \u003cdiv class=\"cond-label\" style=\"margin-bottom:4px;\">진행 시간(참고용, 재촉 아님)\u003c/div>\n            \u003cdiv class=\"timer\" id=\"timer\">00:00\u003c/div>\n          \u003c/div>\n        \u003c/div>\n        \u003cbutton class=\"btn btn-primary btn-block\" id=\"startMission\">미션 시작하기\u003c/button>\n      \u003c/section>\n\n      \u003csection class=\"step\" data-step=\"2\" hidden>\n        \u003cspan class=\"kicker\">② 발견형 도입\u003c/span>\n        \u003ch2 id=\"phase2Title\">사진을 골라 포스터를 완성해보자\u003c/h2>\n\n        \u003cdiv id=\"phase2a\">\n          \u003cdiv class=\"searchbar\">\n            \u003csvg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\">\u003ccircle cx=\"11\" cy=\"11\" r=\"7\"/>\u003cline x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/>\u003c/svg>\n            \u003cinput value=\"축제 불꽃놀이\" readonly aria-label=\"이미지 검색어\">\n          \u003c/div>\n          \u003cdiv class=\"image-grid\" id=\"imageGrid\">\u003c/div>\n          \u003cdiv class=\"source-field\" id=\"sourceField\" hidden>\n            \u003clabel for=\"sourceInput\">출처 표시\u003c/label>\n            \u003cinput id=\"sourceInput\" type=\"text\" value=\"출처: OOO 제공\">\n          \u003c/div>\n          \u003cbutton class=\"btn btn-primary btn-block\" id=\"finishPoster\" disabled>포스터 완성하기\u003c/button>\n        \u003c/div>\n\n        \u003cdiv id=\"phase2b\" hidden>\u003c/div>\n      \u003c/section>\n\n      \u003csection class=\"step\" data-step=\"3\" hidden>\n        \u003cspan class=\"kicker\">③ 문제 상황 확인\u003c/span>\n        \u003ch2>방금 무슨 일이 있었을까?\u003c/h2>\n        \u003cdiv class=\"recap\" id=\"recap\">\u003c/div>\n        \u003cp class=\"prompt-line\" id=\"reflectPrompt\">\u003c/p>\n        \u003cbutton class=\"btn btn-primary btn-block\" id=\"toStep4\">다음: 예상해보기\u003c/button>\n      \u003c/section>\n\n      \u003csection class=\"step\" data-step=\"4\" hidden>\n        \u003cspan class=\"kicker\">④ 예상 입력\u003c/span>\n        \u003ch2>왜 그랬을지, 어떻게 하면 될지 적어보자\u003c/h2>\n        \u003cp class=\"muted\">왜 이런 문제가 생겼을지, 그리고 어떻게 하면 안전하게 쓸 수 있을지 3줄 이내로 적어보세요.\u003c/p>\n        \u003ctextarea class=\"limited\" id=\"predictInput\" maxlength=\"130\" placeholder=\"예) 출처를 밝혀도 라이선스 조건에 따라 못 쓰는 경우가 있는 것 같다...\">\u003c/textarea>\n        \u003cspan class=\"counter\" id=\"predictCounter\">0/130자 · 0/3줄\u003c/span>\n        \u003cbutton class=\"btn btn-primary btn-block\" id=\"toStep5\" disabled>다음: 조건 바꿔 탐구하기\u003c/button>\n      \u003c/section>\n\n      \u003csection class=\"step\" data-step=\"5\" hidden>\n        \u003cspan class=\"kicker\">⑤ 탐구 조작 (심화)\u003c/span>\n        \u003ch2>조건을 바꾸면 결과도 바뀔까?\u003c/h2>\n        \u003cdiv class=\"cond-block\">\n          \u003cspan class=\"cond-label\">이 사진을 어디에 쓸까?\u003c/span>\n          \u003cdiv class=\"radio-grid\" id=\"purposeGrid\">\u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"cond-block\">\n          \u003cspan class=\"cond-label\">이미지의 라이선스 조건\u003c/span>\n          \u003cdiv class=\"toggle-row\">\n            \u003cdiv>\u003cdiv class=\"t-name\">NC · 비영리만 허용\u003c/div>\u003cdiv class=\"t-desc\">돈을 벌거나 홍보하는 데는 못 써요\u003c/div>\u003c/div>\n            \u003clabel class=\"switch\">\u003cinput type=\"checkbox\" id=\"ncToggle\">\u003cspan class=\"track\">\u003c/span>\u003cspan class=\"knob\">\u003c/span>\u003c/label>\n          \u003c/div>\n          \u003cdiv class=\"toggle-row\">\n            \u003cdiv>\u003cdiv class=\"t-name\">ND · 변경 금지\u003c/div>\u003cdiv class=\"t-desc\">자르거나 합성하면 안 돼요\u003c/div>\u003c/div>\n            \u003clabel class=\"switch\">\u003cinput type=\"checkbox\" id=\"ndToggle\">\u003cspan class=\"track\">\u003c/span>\u003cspan class=\"knob\">\u003c/span>\u003c/label>\n          \u003c/div>\n        \u003c/div>\n        \u003cdiv id=\"ruleResult\">\u003c/div>\n        \u003cdiv class=\"btn-row\" style=\"justify-content:space-between;align-items:center;\">\n          \u003cspan class=\"try-counter\" id=\"tryCounter\">0가지 조합 확인함\u003c/span>\n          \u003cbutton class=\"btn btn-primary\" id=\"toStep6\" disabled>다음: 기록하기\u003c/button>\n        \u003c/div>\n      \u003c/section>\n\n      \u003csection class=\"step\" data-step=\"6\" hidden>\n        \u003cspan class=\"kicker\">⑥ 1차 기록 제출\u003c/span>\n        \u003ch2>알게 된 규칙을 정리해보자\u003c/h2>\n        \u003cp class=\"muted\">탐구를 통해 알게 된 저작권 사용 규칙을 3줄 이내로 정리해보세요.\u003c/p>\n        \u003ctextarea class=\"limited\" id=\"ruleInput\" maxlength=\"130\" placeholder=\"예) 사용 목적과 라이선스 조건(NC, ND)을 함께 봐야 안전하게 쓸 수 있다...\">\u003c/textarea>\n        \u003cspan class=\"counter\" id=\"ruleCounter\">0/130자 · 0/3줄\u003c/span>\n        \u003cbutton class=\"btn btn-primary btn-block\" id=\"toStep7\" disabled>제출하고 완료하기\u003c/button>\n      \u003c/section>\n\n      \u003csection class=\"step\" data-step=\"7\" hidden>\n        \u003cspan class=\"kicker\">⑦ 완료 + 한 페이지 기록\u003c/span>\n        \u003ch2>오늘의 탐구, 한 페이지로 정리\u003c/h2>\n        \u003cdiv class=\"callout\">여기까지가 사전활동이에요. 다음 수업 시작 전에 선생님이 이 기록을 확인하고, 아래 질문 중 하나로 수업을 열 거예요.\u003c/div>\n        \u003cdiv class=\"summary-card\" id=\"summaryCard\">\u003c/div>\n        \u003cdiv class=\"btn-row\">\n          \u003cbutton class=\"btn btn-primary\" id=\"saveBtn\">성장기록실에 저장\u003c/button>\n          \u003cspan class=\"save-state\" id=\"saveState\" hidden>\u003c/span>\n        \u003c/div>\n        \u003cdiv class=\"cond-block\">\n          \u003cspan class=\"cond-label\">질문공방으로 이어가기\u003c/span>\n          \u003cdiv class=\"question-list\">\n            \u003cbutton class=\"question-chip\" data-q=\"초상권은 저작권과 무엇이 다를까?\">초상권은 저작권과 무엇이 다를까?\u003c/button>\n            \u003cbutton class=\"question-chip\" data-q=\"AI가 그린 그림에도 저작권이 있을까?\">AI가 그린 그림에도 저작권이 있을까?\u003c/button>\n            \u003cbutton class=\"question-chip\" data-q=\"학교 숙제로 쓰는 것도 저작권 문제가 될까?\">학교 숙제로 쓰는 것도 저작권 문제가 될까?\u003c/button>\n          \u003c/div>\n        \u003c/div>\n      \u003c/section>\n\n    \u003c/div>\n  \u003c/main>\n\n  \u003cdiv class=\"designnote\">\n    \u003cdiv class=\"designnote-label\">설계 노트 (교사용)\u003c/div>\n    \u003cp id=\"designNoteText\">\u003c/p>\n  \u003c/div>\n\n  \u003cp class=\"foot\">정보 · 디지털 윤리 — 탐구공방 활동 프로토타입 · 실제 배포판에서는 학급/학생별 진행 상태가 자동 저장됩니다.\u003c/p>\n\u003c/div>\n\n\u003cdiv class=\"toast\" id=\"toast\" hidden>\u003c/div>\n\n\u003cscript>\n(function(){\n  \"use strict\";\n\n  var ICON = {\n    warning: '\u003csvg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M12 3 2 20h20L12 3Z\"/>\u003cline x1=\"12\" y1=\"10\" x2=\"12\" y2=\"14\"/>\u003ccircle cx=\"12\" cy=\"17.3\" r=\".6\" fill=\"currentColor\" stroke=\"none\"/>\u003c/svg>',\n    check: '\u003csvg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"m8 12.5 2.5 2.5L16 9.5\"/>\u003c/svg>',\n    search: '\u003csvg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\">\u003ccircle cx=\"11\" cy=\"11\" r=\"7\"/>\u003cline x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/>\u003c/svg>',\n    save: '\u003csvg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"m8 12.5 2.5 2.5L16 9.5\"/>\u003c/svg>'\n  };\n\n  function svgIcon(name){\n    switch(name){\n      case 'spark': return '\u003csvg width=\"30\" height=\"30\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\">\u003cline x1=\"12\" y1=\"2\" x2=\"12\" y2=\"8\"/>\u003cline x1=\"12\" y1=\"16\" x2=\"12\" y2=\"22\"/>\u003cline x1=\"2\" y1=\"12\" x2=\"8\" y2=\"12\"/>\u003cline x1=\"16\" y1=\"12\" x2=\"22\" y2=\"12\"/>\u003cline x1=\"4.9\" y1=\"4.9\" x2=\"9\" y2=\"9\"/>\u003cline x1=\"15\" y1=\"15\" x2=\"19.1\" y2=\"19.1\"/>\u003cline x1=\"19.1\" y1=\"4.9\" x2=\"15\" y2=\"9\"/>\u003cline x1=\"9\" y1=\"15\" x2=\"4.9\" y2=\"19.1\"/>\u003c/svg>';\n      case 'beam': return '\u003csvg width=\"30\" height=\"30\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"4\" r=\"1.6\" fill=\"currentColor\" stroke=\"none\"/>\u003cpath d=\"M8 20 12 6 16 20Z\"/>\u003c/svg>';\n      case 'arch': return '\u003csvg width=\"30\" height=\"30\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\">\u003cpath d=\"M5 20V11a7 7 0 0 1 14 0v9\"/>\u003cline x1=\"5\" y1=\"20\" x2=\"5\" y2=\"16\"/>\u003cline x1=\"19\" y1=\"20\" x2=\"19\" y2=\"16\"/>\u003c/svg>';\n      case 'dance': return '\u003csvg width=\"30\" height=\"30\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\">\u003ccircle cx=\"12\" cy=\"5\" r=\"2\"/>\u003cline x1=\"12\" y1=\"7\" x2=\"12\" y2=\"14\"/>\u003cline x1=\"12\" y1=\"9\" x2=\"6\" y2=\"6\"/>\u003cline x1=\"12\" y1=\"9\" x2=\"18\" y2=\"12\"/>\u003cline x1=\"12\" y1=\"14\" x2=\"7\" y2=\"20\"/>\u003cline x1=\"12\" y1=\"14\" x2=\"16\" y2=\"20\"/>\u003c/svg>';\n      case 'star': return '\u003csvg width=\"30\" height=\"30\" viewBox=\"0 0 24 24\" fill=\"currentColor\" stroke=\"none\">\u003cpolygon points=\"12,2 14.7,9 22,9 16,13.6 18.2,21 12,16.8 5.8,21 8,13.6 2,9 9.3,9\"/>\u003c/svg>';\n      case 'building': return '\u003csvg width=\"30\" height=\"30\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\">\u003crect x=\"5\" y=\"4\" width=\"14\" height=\"17\"/>\u003crect x=\"8\" y=\"7.5\" width=\"2.4\" height=\"2.4\"/>\u003crect x=\"13.6\" y=\"7.5\" width=\"2.4\" height=\"2.4\"/>\u003crect x=\"8\" y=\"12.5\" width=\"2.4\" height=\"2.4\"/>\u003crect x=\"13.6\" y=\"12.5\" width=\"2.4\" height=\"2.4\"/>\u003c/svg>';\n      default: return '';\n    }\n  }\n\n  var IMAGES = [\n    {id:'fireworks', title:'축제 불꽃놀이', badge:'인기', c1:'#e0674f', c2:'#b23a2e', nc:true,  nd:false, lic:'CC BY-NC 2.0',    icon:'spark'},\n    {id:'stage',     title:'무대 조명',     badge:'인기', c1:'#8471c9', c2:'#4f3f96', nc:false, nd:true,  lic:'CC BY-ND 2.0',    icon:'beam'},\n    {id:'balloon',   title:'풍선 아치',     badge:null,   c1:'#e69a4e', c2:'#c06a26', nc:true,  nd:true,  lic:'CC BY-NC-ND 2.0', icon:'arch'},\n    {id:'dance',     title:'댄스 공연',     badge:'신규', c1:'#3fa1a6', c2:'#276b6f', nc:true,  nd:false, lic:'CC BY-NC 2.0',    icon:'dance'},\n    {id:'logo',      title:'축제 로고 아트', badge:null,   c1:'#dbb349', c2:'#a8842c', nc:true,  nd:true,  lic:'CC BY-NC-ND 4.0', icon:'star'},\n    {id:'campus',    title:'학교 전경(저해상도)', badge:null, c1:'#7f9184', c2:'#576457', nc:false, nd:false, lic:'CC BY 2.0',   icon:'building'}\n  ];\n\n  var PURPOSES = [\n    {id:'personal', label:'개인 소장·학습용'},\n    {id:'school',   label:'교내 게시(교문 안)'},\n    {id:'public',   label:'교외 공개(SNS·교문 밖)'},\n    {id:'commercial', label:'상업적 이용(굿즈 등)'}\n  ];\n\n  var NOTES = {\n    1:'수업 전 개별로 완료하는 사전활동임을 먼저 알리고, 설명 없이 미션으로 바로 들어가 몰입을 만든다. 이후 벌어질 실수를 예고하지 않는다.',\n    2:'라이선스 정보를 일부러 눈에 띄지 않게 배치해, 학생이 스스로 조건을 놓치고 실패를 겪게 한다. 설명 대신 경험으로 인지 갈등을 만든다.',\n    3:'새 정보를 주지 않고 방금 겪은 일을 되짚기만 한다. 경험을 언어로 옮기는 다리 단계다.',\n    4:'경험을 바탕으로 한 가설(예상)을 3줄로 짧게 세운다. 정답 여부는 채점하지 않는다.',\n    5:'조건을 바꾸면 결과가 바뀌는 것을 즉시 확인하며 규칙을 귀납적으로 도출한다. 실패해도 안전하게 다시 시도할 수 있다.',\n    6:'탐구로 알아낸 규칙을 자기 언어로 요약한다. 평가가 아니라 기록이 목적이다.',\n    7:'①~④ 경험을 한 페이지로 정리해 메타인지를 돕는다. 성장기록실 기록은 교사가 다음 수업 시작 전에 확인해 도입 질문(질문공방)으로 바로 이어간다.'\n  };\n\n  var state = {\n    step: 1,\n    pickedImage: null,\n    trapped: null,\n    prediction: '',\n    purpose: 'school',\n    nc: true,\n    nd: false,\n    triedCombos: {},\n    rule: '',\n    saved: false\n  };\n\n  function comboKey(){ return state.purpose + '|' + (state.nc?1:0) + '|' + (state.nd?1:0); }\n\n  function evaluate(purpose, nc, nd){\n    if(purpose === 'personal'){\n      return {ok:true, msg:'개인적으로 보거나 학습 자료로만 쓰는 경우, 대부분의 라이선스 조건에서 사용할 수 있어요. (출처 표시는 그래도 필요해요)'};\n    }\n    if(purpose === 'school'){\n      if(nd) return {ok:false, msg:'ND(변경 금지) 조건이 있어서, 포스터에 다른 요소를 합성하거나 잘라 쓰면 안 돼요. 원본 그대로만 게시할 수 있어요.'};\n      return {ok:true, msg:'학교 안에서만 게시하는 건 비영리 성격이 강해서, NC 조건이 있어도 사용할 수 있어요.'};\n    }\n    if(purpose === 'public'){\n      if(nc) return {ok:false, msg:'NC(비영리) 조건이 있는데 학교 밖(SNS 등)에 공개하면 홍보 목적으로 간주돼 사용할 수 없어요.'};\n      if(nd) return {ok:false, msg:'ND(변경 금지) 조건이 있어서 포스터용으로 자르거나 합성하면 사용할 수 없어요.'};\n      return {ok:true, msg:'NC·ND 조건이 없다면 학교 밖에 공개해도 괜찮아요. (출처 표시는 항상 필수!)'};\n    }\n    if(purpose === 'commercial'){\n      if(nc) return {ok:false, msg:'NC(비영리) 조건이 있으면 굿즈 판매 같은 상업적 이용은 어떤 경우에도 할 수 없어요.'};\n      if(nd) return {ok:false, msg:'ND(변경 금지) 조건이 있으면 상업용으로 편집해서 쓸 수 없어요.'};\n      return {ok:true, msg:'NC·ND 조건이 없는 이미지는 상업적으로도 사용할 수 있어요. (역시 출처 표시는 필수)'};\n    }\n  }\n\n  function limitTextarea(el, counterEl, maxChars, maxLines){\n    function apply(){\n      var lines = el.value.split('\\n');\n      if(lines.length > maxLines){ lines = lines.slice(0, maxLines); el.value = lines.join('\\n'); }\n      if(el.value.length > maxChars){ el.value = el.value.slice(0, maxChars); }\n      counterEl.textContent = el.value.length + '/' + maxChars + '자 · ' + el.value.split('\\n').length + '/' + maxLines + '줄';\n    }\n    el.addEventListener('input', apply);\n    apply();\n    return apply;\n  }\n\n  function toast(msg){\n    var t = document.getElementById('toast');\n    t.textContent = msg;\n    t.hidden = false;\n    requestAnimationFrame(function(){ t.classList.add('show'); });\n    clearTimeout(toast._h);\n    toast._h = setTimeout(function(){\n      t.classList.remove('show');\n      setTimeout(function(){ t.hidden = true; }, 220);\n    }, 1800);\n  }\n\n  function renderStepper(){\n    var nav = document.getElementById('stepper');\n    nav.innerHTML = '';\n    var circled = ['①','②','③','④','⑤','⑥','⑦'];\n    for(var i=1;i\u003c=7;i++){\n      var b = document.createElement('button');\n      b.className = 'dot';\n      b.type = 'button';\n      b.textContent = circled[i-1];\n      b.setAttribute('aria-label', i + '단계로 이동');\n      if(i === state.step) b.setAttribute('data-state','current');\n      else if(i \u003c state.step) b.setAttribute('data-state','done');\n      b.addEventListener('click', function(n){ return function(){ goTo(n); }; }(i));\n      nav.appendChild(b);\n    }\n  }\n\n  var STEP_TAGS = {1:'인트로',2:'발견형 도입',3:'문제 상황 확인',4:'예상 입력',5:'탐구 조작(심화)',6:'1차 기록 제출',7:'완료 + 한 페이지 기록'};\n\n  function goTo(n){\n    state.step = n;\n    document.querySelectorAll('.step').forEach(function(s){\n      s.hidden = Number(s.getAttribute('data-step')) !== n;\n    });\n    document.getElementById('deviceTag').textContent = 'STEP ' + n + ' · ' + STEP_TAGS[n];\n    document.getElementById('designNoteText').textContent = NOTES[n];\n    renderStepper();\n    if(n === 3) renderRecap();\n    if(n === 5) renderRule();\n    if(n === 7) renderSummary();\n  }\n\n  function renderImageGrid(){\n    var grid = document.getElementById('imageGrid');\n    grid.innerHTML = '';\n    IMAGES.forEach(function(img){\n      var card = document.createElement('button');\n      card.type = 'button';\n      card.className = 'imgcard';\n      card.setAttribute('data-picked', state.pickedImage === img.id ? 'true' : 'false');\n      card.innerHTML =\n        (img.badge ? '\u003cspan class=\"badge\">' + img.badge + '\u003c/span>' : '') +\n        '\u003cdiv class=\"art\" style=\"background:linear-gradient(150deg,' + img.c1 + ',' + img.c2 + ')\">' + svgIcon(img.icon) + '\u003c/div>' +\n        '\u003cdiv class=\"meta\">\u003cspan class=\"name\">' + img.title + '\u003c/span>\u003cspan class=\"dl\">다운로드 ↓\u003c/span>\u003cspan class=\"lic\">' + img.lic + '\u003c/span>\u003c/div>';\n      card.addEventListener('click', function(id){ return function(){\n        state.pickedImage = id;\n        renderImageGrid();\n        document.getElementById('sourceField').hidden = false;\n        document.getElementById('finishPoster').disabled = false;\n      }; }(img.id));\n      grid.appendChild(card);\n    });\n  }\n\n  function finishPoster(){\n    var img = IMAGES.filter(function(i){ return i.id === state.pickedImage; })[0];\n    if(!img) return;\n    state.trapped = !!(img.nc || img.nd);\n    document.getElementById('phase2a').hidden = true;\n    var box = document.getElementById('phase2b');\n    box.hidden = false;\n    if(state.trapped){\n      var reason = img.nc ? 'NC(비영리만 허용) 조건이 있는데, 이 포스터는 교문 밖과 SNS에도 공개될 예정이라 상업적 홍보로 간주될 수 있어요.' : 'ND(변경 금지) 조건이 있는데, 포스터에 다른 요소를 합성해서 원본을 바꿔 썼어요.';\n      box.innerHTML =\n        '\u003cdiv class=\"result-panel bad\">\u003cdiv class=\"icon-wrap\">' + ICON.warning + '\u003c/div>\u003cdiv>\u003ch3>저작권 문제 발생\u003c/h3>\u003cp>' + reason + ' 출처를 표시했는데도 왜 문제가 되었을까요?\u003c/p>\u003c/div>\u003c/div>' +\n        '\u003cbutton class=\"btn btn-danger-ghost btn-block\" id=\"toStep3\" style=\"margin-top:14px;\">다시 살펴보기\u003c/button>';\n    } else {\n      box.innerHTML =\n        '\u003cdiv class=\"result-panel good\">\u003cdiv class=\"icon-wrap\">' + ICON.check + '\u003c/div>\u003cdiv>\u003ch3>포스터 완성!\u003c/h3>\u003cp>이번에 고른 사진은 별도 제한이 없는 CC BY 라이선스라 문제없이 썼어요. 그런데 만약 다른 사진이었다면 어땠을까요?\u003c/p>\u003c/div>\u003c/div>' +\n        '\u003cbutton class=\"btn btn-ghost btn-block\" id=\"toStep3\" style=\"margin-top:14px;\">계속 살펴보기\u003c/button>';\n    }\n    document.getElementById('toStep3').addEventListener('click', function(){ goTo(3); });\n  }\n\n  function renderRecap(){\n    var img = IMAGES.filter(function(i){ return i.id === state.pickedImage; })[0];\n    var recap = document.getElementById('recap');\n    var row2 = state.trapped\n      ? '\\'' + (img?img.title:'사진') + '\\'를 고르고 출처를 적어 제출했더니, 라이선스 조건 때문에 경고를 받았다.'\n      : '\\'' + (img?img.title:'사진') + '\\'를 고르고 출처를 적어 제출했고, 이번에는 조건에 걸리지 않았다.';\n    recap.innerHTML =\n      '\u003cdiv class=\"recap-row\">\u003cspan class=\"num\">01\u003c/span>\u003cp>학급 축제 포스터 담당이 되어 사진을 찾으러 갔다.\u003c/p>\u003c/div>' +\n      '\u003cdiv class=\"recap-row\">\u003cspan class=\"num\">02\u003c/span>\u003cp>' + row2 + '\u003c/p>\u003c/div>' +\n      '\u003cdiv class=\"recap-row\">\u003cspan class=\"num\">03\u003c/span>\u003cp>라이선스 표시는 카드 구석에 아주 작게 적혀 있었다.\u003c/p>\u003c/div>';\n    var prompt = document.getElementById('reflectPrompt');\n    prompt.textContent = state.trapped\n      ? '출처를 표시했는데도 왜 경고가 떴을까요?'\n      : '이번엔 괜찮았지만, 다른 조건의 사진이었다면 어떻게 됐을까요?';\n  }\n\n  function renderRule(){\n    var res = evaluate(state.purpose, state.nc, state.nd);\n    var panel = document.getElementById('ruleResult');\n    panel.innerHTML =\n      '\u003cdiv class=\"result-panel ' + (res.ok ? 'good' : 'bad') + '\">\u003cdiv class=\"icon-wrap\">' + (res.ok ? ICON.check : ICON.warning) + '\u003c/div>\u003cdiv>\u003ch3>' + (res.ok ? '사용 가능' : '사용 불가') + '\u003c/h3>\u003cp>' + res.msg + '\u003c/p>\u003c/div>\u003c/div>';\n    state.triedCombos[comboKey()] = true;\n    var count = Object.keys(state.triedCombos).length;\n    document.getElementById('tryCounter').textContent = count + '가지 조합 확인함';\n    document.getElementById('toStep6').disabled = count \u003c 2;\n  }\n\n  function renderSummary(){\n    var img = IMAGES.filter(function(i){ return i.id === state.pickedImage; })[0];\n    var card = document.getElementById('summaryCard');\n    card.innerHTML =\n      '\u003cdiv class=\"summary-row\">\u003cspan class=\"k\">① 미션\u003c/span>\u003cspan class=\"v\">학급 축제 홍보 포스터를 완성하는 미션을 받았다.\u003c/span>\u003c/div>' +\n      '\u003cdiv class=\"summary-row\">\u003cspan class=\"k\">② 발견한 것\u003c/span>\u003cspan class=\"v\">\\'' + (img?img.title:'') + '\\' 사진을 골라 출처만 적고 제출했더니, ' + (state.trapped ? '라이선스 조건 때문에 사용할 수 없다는 경고를 받았다.' : '이번엔 조건에 걸리지 않고 완성했다.') + '\u003c/span>\u003c/div>' +\n      '\u003cdiv class=\"summary-row\">\u003cspan class=\"k\">③ 문제 확인\u003c/span>\u003cspan class=\"v\">출처 표시만으로는 저작권 조건을 다 지킨 게 아니라는 것을 깨달았다.\u003c/span>\u003c/div>' +\n      '\u003cdiv class=\"summary-row\">\u003cspan class=\"k\">④ 나의 예상\u003c/span>\u003cspan class=\"v\">' + (state.prediction ? state.prediction : '(작성한 예상 내용이 여기에 표시됩니다)') + '\u003c/span>\u003c/div>';\n  }\n\n  function boot(saved){\n    Object.assign(state, saved || {});\n\n    document.getElementById('startMission').addEventListener('click', function(){ goTo(2); });\n    document.getElementById('toStep4').addEventListener('click', function(){ goTo(4); });\n\n    renderImageGrid();\n    document.getElementById('finishPoster').addEventListener('click', finishPoster);\n\n    var predictCounter = document.getElementById('predictCounter');\n    var predictApply = limitTextarea(document.getElementById('predictInput'), predictCounter, 130, 3);\n    document.getElementById('predictInput').addEventListener('input', function(e){\n      state.prediction = e.target.value;\n      document.getElementById('toStep5').disabled = e.target.value.trim().length === 0;\n    });\n    document.getElementById('toStep5').addEventListener('click', function(){ goTo(5); });\n\n    var purposeGrid = document.getElementById('purposeGrid');\n    PURPOSES.forEach(function(p){\n      var b = document.createElement('button');\n      b.type = 'button';\n      b.className = 'radio-card';\n      b.textContent = p.label;\n      b.setAttribute('aria-pressed', state.purpose === p.id ? 'true' : 'false');\n      b.addEventListener('click', function(){\n        state.purpose = p.id;\n        purposeGrid.querySelectorAll('.radio-card').forEach(function(el){ el.setAttribute('aria-pressed','false'); });\n        b.setAttribute('aria-pressed','true');\n        renderRule();\n      });\n      purposeGrid.appendChild(b);\n    });\n    document.getElementById('ncToggle').checked = state.nc;\n    document.getElementById('ndToggle').checked = state.nd;\n    document.getElementById('ncToggle').addEventListener('change', function(e){ state.nc = e.target.checked; renderRule(); });\n    document.getElementById('ndToggle').addEventListener('change', function(e){ state.nd = e.target.checked; renderRule(); });\n    document.getElementById('toStep6').addEventListener('click', function(){ goTo(6); });\n\n    var ruleCounter = document.getElementById('ruleCounter');\n    limitTextarea(document.getElementById('ruleInput'), ruleCounter, 130, 3);\n    document.getElementById('ruleInput').addEventListener('input', function(e){\n      state.rule = e.target.value;\n      document.getElementById('toStep7').disabled = e.target.value.trim().length === 0;\n    });\n    document.getElementById('toStep7').addEventListener('click', function(){ goTo(7); });\n\n    document.getElementById('saveBtn').addEventListener('click', function(){\n      state.saved = true;\n      var s = document.getElementById('saveState');\n      s.hidden = false;\n      s.innerHTML = ICON.save + ' 성장기록실에 저장했어요';\n      toast('한 페이지 기록이 성장기록실에 저장되었어요');\n    });\n\n    document.querySelectorAll('.question-chip').forEach(function(chip){\n      chip.addEventListener('click', function(){\n        var q = chip.getAttribute('data-q');\n        (function(){\n          try{\n            if(navigator.clipboard && navigator.clipboard.writeText){\n              navigator.clipboard.writeText(q).catch(function(){});\n            }\n          }catch(e){}\n        })();\n        toast('질문공방으로 가져갈 질문에 담았어요: \"' + q + '\"');\n      });\n    });\n\n    // elapsed-time flourish for self-paced pre-class work (counts up, never gates progress)\n    var elapsed = 0;\n    var timerEl = document.getElementById('timer');\n    var timerInterval = setInterval(function(){\n      elapsed += 1;\n      var m = Math.floor(elapsed/60), s = elapsed % 60;\n      timerEl.textContent = String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');\n    }, 1000);\n\n    goTo(state.step || 1);\n  }\n\n  boot(null);\n})();\n\u003c/script>\n\n\u003cscript>document.addEventListener('click',function(e){const a=e.target.closest('a');if(a&&a.getAttribute('href')&&!a.getAttribute('href').startsWith('#'))e.preventDefault();});\u003c/script>\u003c/body>\u003c/html>\n", "grade": "", "school": "중학교", "mode": "온라인", "imported": true, "family": 3}, {"id": "ext-wildfire-sensor", "name": "헛다리 짚는 산불 감지기", "subject": "정보", "visual": "sensor", "minutes": 25, "html": "\u003ctitle>헛다리 짚는 산불 감지기\u003c/title>\n\n\u003cstyle>\n/* 레이아웃: 중앙 정렬된 \"관제 카드\" 하나가 화면 단계별로 내용을 갈아끼우는 단일 스테이지 구조.\n   상단에 진행 점 7개 + 교사용 정보 토글이 고정된 헤더로 얹힘. */\n:root{\n  --bg:#EFF4EC; --panel:#FFFFFF; --panel-2:#E4EEE1; --ink:#152317; --ink-dim:#4B5C4F;\n  --pine:#1F6F4A; --pine-dark:#154F35; --ember:#E0632A; --ember-dark:#B84A1C;\n  --line:#CCDBC6; --gold:#C99A2E;\n  --font-display:'Big Shoulders Display',sans-serif; --font-body:'IBM Plex Sans KR',sans-serif; --font-mono:'IBM Plex Mono',monospace;\n  color-scheme:light;\n}\n@media (prefers-color-scheme:dark){\n  :root:not([data-theme=\"light\"]){\n    --bg:#0E1712; --panel:#16211A; --panel-2:#1C2A21; --ink:#E7F0E6; --ink-dim:#9FB29F;\n    --pine:#4FAE7D; --pine-dark:#2E7E56; --ember:#F07C43; --ember-dark:#D45A22;\n    --line:#2A3B2F; --gold:#E0B958; color-scheme:dark;\n  }\n}\n:root[data-theme=\"dark\"]{\n  --bg:#0E1712; --panel:#16211A; --panel-2:#1C2A21; --ink:#E7F0E6; --ink-dim:#9FB29F;\n  --pine:#4FAE7D; --pine-dark:#2E7E56; --ember:#F07C43; --ember-dark:#D45A22;\n  --line:#2A3B2F; --gold:#E0B958; color-scheme:dark;\n}\n*{box-sizing:border-box;}\nbody{background:var(--bg);color:var(--ink);font-family:var(--font-body);}\n#app-root{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:20px 40px;min-height:100%;display:flex;flex-direction:column;gap:14px;}\n\n.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:6px 4px;display:flex;flex-direction:column;gap:8px;}\n.topbar-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}\n.brand{font-family:var(--font-display);font-weight:800;font-size:1.05rem;letter-spacing:.02em;color:var(--pine-dark);display:flex;align-items:center;gap:8px;}\n.brand .dotmark{width:10px;height:10px;border-radius:50%;background:var(--ember);box-shadow:0 0 0 3px color-mix(in srgb, var(--ember) 25%, transparent);}\n.teacher-toggle{font-family:var(--font-body);font-size:.72rem;font-weight:600;color:var(--ink-dim);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;white-space:nowrap;}\n.teacher-toggle:hover{border-color:var(--pine);color:var(--pine-dark);}\n.progress{display:flex;align-items:center;gap:6px;}\n.progress .seg{flex:1;height:5px;border-radius:3px;background:var(--line);position:relative;overflow:hidden;}\n.progress .seg.done{background:var(--pine);}\n.progress .seg.current{background:linear-gradient(90deg,var(--pine) 50%,var(--line) 50%);}\n.progress-label{font-family:var(--font-mono);font-size:.68rem;color:var(--ink-dim);letter-spacing:.04em;}\n\n.teacher-panel{display:none;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:.82rem;line-height:1.55;}\n.teacher-panel.open{display:block;}\n.teacher-panel table{width:100%;border-collapse:collapse;margin-top:8px;}\n.teacher-panel td{border-top:1px solid var(--line);padding:5px 6px;vertical-align:top;}\n.teacher-panel td:first-child{color:var(--ink-dim);white-space:nowrap;font-weight:600;width:34%;}\n\n.stage{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:26px 22px;flex:1;display:flex;flex-direction:column;gap:16px;position:relative;overflow:hidden;}\n.stage::before{content:\"\";position:absolute;inset:0;pointer-events:none;opacity:.5;\n  background-image:\n    radial-gradient(circle at 12% 8%, color-mix(in srgb, var(--pine) 10%, transparent) 0, transparent 40%),\n    repeating-radial-gradient(circle at 85% 92%, transparent 0 16px, color-mix(in srgb, var(--pine) 6%, transparent) 17px 18px);\n}\n.stage > *{position:relative;z-index:1;}\n\n.eyebrow{font-family:var(--font-mono);font-size:.72rem;letter-spacing:.08em;color:var(--pine-dark);text-transform:uppercase;font-weight:600;}\nh1.title{font-family:var(--font-display);font-size:clamp(1.5rem,5vw,2rem);font-weight:800;line-height:1.08;margin:0;letter-spacing:.01em;text-wrap:balance;}\np.lead{margin:0;color:var(--ink-dim);line-height:1.65;font-size:.95rem;}\n.card-body{display:flex;flex-direction:column;gap:14px;}\n\n.btn{font-family:var(--font-body);font-weight:700;font-size:.92rem;border:none;border-radius:12px;padding:13px 20px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .1s ease, filter .15s ease;}\n.btn:active{transform:scale(.97);}\n.btn-primary{background:var(--pine);color:#fff;}\n.btn-primary:hover{filter:brightness(1.08);}\n.btn-primary:disabled{background:var(--line);color:var(--ink-dim);cursor:not-allowed;}\n.btn-ghost{background:transparent;color:var(--ink-dim);border:1px solid var(--line);}\n.btn-ghost:hover{border-color:var(--pine);color:var(--pine-dark);}\n.btn-ember{background:var(--ember);color:#fff;}\n.btn-row{display:flex;gap:10px;justify-content:space-between;margin-top:4px;flex-wrap:wrap;}\n.btn-row .spacer{flex:1;}\n\n.goal-box{background:var(--panel-2);border:1px dashed var(--line);border-radius:12px;padding:12px 14px;font-size:.85rem;color:var(--ink-dim);line-height:1.6;}\n.goal-box b{color:var(--ink);}\n\n/* ② 발견형 도입 */\n.sensor-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}\n@media (max-width:480px){.sensor-grid{grid-template-columns:1fr;}}\n.sensor-card{background:var(--panel-2);border:1px solid var(--line);border-radius:14px;padding:14px 10px;text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .12s ease,border-color .15s ease;}\n.sensor-card:hover:not(.locked):not(.tested){border-color:var(--pine);transform:translateY(-2px);}\n.sensor-card.tested{border-color:var(--ember-dark);}\n.sensor-card.success{border-color:var(--pine);background:color-mix(in srgb, var(--pine) 12%, var(--panel-2));}\n.sensor-card.locked{opacity:.5;cursor:not-allowed;}\n.sensor-emoji{font-size:1.8rem;}\n.sensor-name{font-weight:700;font-size:.85rem;}\n.sensor-state{font-size:.7rem;color:var(--ink-dim);font-family:var(--font-mono);}\n.lock-hint{font-size:.68rem;color:var(--ink-dim);}\n\n.result-panel{border-radius:14px;padding:13px 14px;font-size:.86rem;line-height:1.6;border:1px solid var(--line);background:var(--panel-2);}\n.result-panel.fail{border-color:var(--ember-dark);background:color-mix(in srgb, var(--ember) 12%, var(--panel-2));}\n.result-panel.success{border-color:var(--pine);background:color-mix(in srgb, var(--pine) 14%, var(--panel-2));}\n.wave{display:flex;align-items:flex-end;gap:4px;height:36px;margin:8px 0;}\n.wave span{flex:1;background:var(--ink-dim);border-radius:2px;opacity:.5;}\n.wave span.bad{background:var(--ember);opacity:1;}\n\n/* ④ / ⑥ 서술 입력 */\ntextarea.answer{width:100%;min-height:96px;resize:vertical;font-family:var(--font-body);font-size:.95rem;line-height:1.6;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);}\ntextarea.answer:focus{outline:none;border-color:var(--pine);}\n.counter-row{display:flex;justify-content:space-between;align-items:center;font-family:var(--font-mono);font-size:.75rem;}\n.counter-row .count.ok{color:var(--pine-dark);font-weight:700;}\n.counter-row .count.low{color:var(--ember-dark);font-weight:700;}\n\n/* ⑤ 빌드 단계 */\n.substep-track{display:flex;gap:6px;flex-wrap:wrap;}\n.substep-chip{font-family:var(--font-mono);font-size:.68rem;padding:4px 9px;border-radius:999px;border:1px solid var(--line);color:var(--ink-dim);}\n.substep-chip.active{background:var(--pine);color:#fff;border-color:var(--pine);}\n.substep-chip.done{border-color:var(--pine);color:var(--pine-dark);}\n\n.zone-map{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}\n@media (max-width:480px){.zone-map{grid-template-columns:1fr 1fr 1fr;gap:6px;}}\n.zone-tile{aspect-ratio:1/1;border-radius:14px;border:2px solid var(--line);background:\n  linear-gradient(160deg,color-mix(in srgb, var(--pine) 18%, var(--panel-2)),var(--panel-2));\n  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;position:relative;}\n.zone-tile:hover{border-color:var(--pine);}\n.zone-tile.installed{border-color:var(--pine);}\n.zone-tile.installed::after{content:\"✓ 센서 설치됨\";font-family:var(--font-mono);font-size:.62rem;color:var(--pine-dark);position:absolute;bottom:8px;}\n.zone-label{font-family:var(--font-display);font-weight:800;font-size:1.6rem;color:var(--pine-dark);}\n.zone-sub{font-size:.62rem;color:var(--ink-dim);font-family:var(--font-mono);}\n\n.dnd-wrap{display:flex;flex-direction:column;gap:12px;}\n.tray{display:flex;gap:8px;flex-wrap:wrap;min-height:52px;padding:10px;border-radius:12px;border:1px dashed var(--line);background:var(--panel-2);}\n.chip-item{font-family:var(--font-body);font-size:.82rem;font-weight:600;background:var(--panel);border:1.5px solid var(--pine);color:var(--pine-dark);border-radius:10px;padding:8px 12px;cursor:grab;display:inline-flex;align-items:center;gap:6px;user-select:none;}\n.chip-item.selected{background:var(--pine);color:#fff;box-shadow:0 0 0 3px color-mix(in srgb, var(--pine) 30%, transparent);}\n.slots-row{display:flex;gap:10px;flex-wrap:wrap;}\n.slot{flex:1;min-width:120px;min-height:56px;border-radius:12px;border:2px dashed var(--line);background:var(--panel);display:flex;align-items:center;justify-content:center;text-align:center;font-size:.78rem;color:var(--ink-dim);padding:8px;cursor:pointer;font-family:var(--font-mono);}\n.slot.filled{border-style:solid;border-color:var(--pine);color:var(--ink);background:color-mix(in srgb, var(--pine) 10%, var(--panel));}\n.slot.wrong{border-color:var(--ember-dark);background:color-mix(in srgb, var(--ember) 14%, var(--panel));}\n.slot .slot-tag{font-family:var(--font-mono);font-size:.62rem;color:var(--ink-dim);position:absolute;margin-top:-38px;}\n\n.wiring-board{display:flex;flex-direction:column;gap:10px;}\n.wiring-zone-row{display:flex;align-items:center;gap:10px;}\n.wiring-zone-row .zl{width:26px;height:26px;border-radius:8px;background:var(--panel-2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:800;font-size:.85rem;color:var(--pine-dark);flex:none;}\n.wiring-zone-row .slot{flex:1;min-height:44px;}\n\n.slider-block{display:flex;flex-direction:column;gap:8px;}\ninput[type=range]{width:100%;accent-color:var(--ember);}\n.threshold-readout{font-family:var(--font-mono);font-weight:700;font-size:1.1rem;color:var(--ember-dark);}\n\n.sim-map{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}\n.sim-tile{aspect-ratio:1/1;border-radius:14px;border:2px solid var(--line);background:var(--panel-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;position:relative;overflow:hidden;}\n.sim-tile:hover{border-color:var(--pine);}\n.sim-tile.disabled{cursor:not-allowed;opacity:.6;}\n.sim-tile.burning{border-color:var(--ember);}\n.sim-tile .therm{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(0deg,var(--ember),color-mix(in srgb, var(--ember) 30%, transparent));opacity:.35;transition:height .2s linear;}\n.sim-readout{font-family:var(--font-mono);font-weight:700;font-size:1.15rem;z-index:1;}\n.sim-status{font-size:.62rem;color:var(--ink-dim);z-index:1;font-family:var(--font-mono);}\n.center-board{border-radius:14px;border:2px solid var(--line);background:var(--panel-2);padding:14px;display:flex;align-items:center;gap:12px;}\n.center-board.alarm{border-color:var(--ember);background:color-mix(in srgb, var(--ember) 16%, var(--panel-2));animation:pulse 1s ease-in-out infinite;}\n@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb, var(--ember) 45%, transparent);}50%{box-shadow:0 0 0 10px transparent;}}\n.center-icon{font-size:1.8rem;}\n.center-text{font-size:.85rem;line-height:1.5;}\n.stat-row{display:flex;gap:14px;flex-wrap:wrap;font-family:var(--font-mono);font-size:.72rem;color:var(--ink-dim);}\n.stat-row b{color:var(--ink);}\n\n/* ⑦ 요약 */\n.summary-block{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--panel-2);}\n.summary-block h3{margin:0 0 6px;font-family:var(--font-display);font-size:1rem;font-weight:700;color:var(--pine-dark);}\n.summary-block p{margin:0;font-size:.85rem;line-height:1.6;color:var(--ink-dim);}\n.summary-block p b{color:var(--ink);}\n.modal-note{font-size:.72rem;color:var(--ink-dim);font-style:italic;}\n\n.hint{font-size:.74rem;color:var(--ink-dim);line-height:1.5;}\n\u003c/style>\n\n\u003cdiv id=\"app-root\">\n  \u003cdiv class=\"topbar\">\n    \u003cdiv class=\"topbar-row\">\n      \u003cdiv class=\"brand\">\u003cspan class=\"dotmark\">\u003c/span>헛다리 짚는 산불 감지기\u003c/div>\n      \u003cbutton class=\"teacher-toggle\" id=\"teacherToggleBtn\" type=\"button\">교사용 활동 정보 보기 ▾\u003c/button>\n    \u003c/div>\n    \u003cdiv class=\"progress\" id=\"progressBar\" aria-hidden=\"true\">\u003c/div>\n    \u003cdiv class=\"progress-label\" id=\"progressLabel\">\u003c/div>\n    \u003cdiv class=\"teacher-panel\" id=\"teacherPanel\">\n      \u003cb>탐구공방 활동 메타데이터\u003c/b>\n      \u003ctable>\n        \u003ctr>\u003ctd>subject / domain\u003c/td>\u003ctd>정보 · 컴퓨팅 시스템 (고등학교)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>originalStandardCode\u003c/td>\u003ctd>[12정01-03] 문제 해결에 적합한 피지컬 컴퓨팅 시스템 장치를 선택하여 사물인터넷 시스템을 설계한다.\u003cbr>[12정01-02] 사물인터넷의 구성과 동작 원리를 분석한다.\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>inquiryStage\u003c/td>\u003ctd>①문제·질문 인식 → ②예상·가설 세우기 → ③탐구·검증 수행 (탐구공방 담당 범위)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>coreCompetency\u003c/td>\u003ctd>지식정보처리, 창의적사고\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>studioModule\u003c/td>\u003ctd>탐구공방 → (완료 후) 질문공방 → 성장기록실\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>activityFormat\u003c/td>\u003ctd>조작형 시뮬레이션 — 클릭(센서 후보 시험) · 드래그(장치/프로그램 블록 조립) · 슬라이더(임계값) · 클릭(화재 테스트)\u003c/td>\u003c/tr>\n      \u003c/table>\n    \u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"stage\" id=\"stage\">\u003c/div>\n\u003c/div>\n\n\u003cscript>\n(function(){\n  \"use strict\";\n\n  var SCREENS = [\"intro\",\"discover\",\"confirm\",\"predict\",\"build\",\"reflect\",\"summary\"];\n  var SCREEN_LABEL = {intro:\"인트로\",discover:\"발견하기\",confirm:\"문제 확인\",predict:\"예상하기\",build:\"시스템 조립\",reflect:\"기록하기\",summary:\"완료\"};\n\n  var state = {\n    screen:\"intro\",\n    discover:{ triedSound:false, triedSmell:false, tempUnlocked:false, tempDone:false },\n    predictText:\"\",\n    build:{\n      step:1,\n      zones:{A:false,B:false,C:false},\n      wiring:{A:false,B:false,C:false,center:false},\n      traySensors:[\"s1\",\"s2\",\"s3\"],\n      trayAlarm:true,\n      program:[null,null,null,null],\n      programTray:[\"measure\",\"compare\",\"alert\",\"loop\"],\n      checked:false,\n      threshold:40,\n      fireZone:null,\n      simTemp:22,\n      simRunning:false,\n      simTimer:null,\n      lastResult:null,\n      testSuccessCount:0\n    },\n    reflectText:\"\",\n    _selected:null\n  };\n\n  var PROGRAM_LABEL = {\n    loop:\"⏱ 1초마다 반복\",\n    measure:\"🌡 온도 측정하기\",\n    compare:\"⚖ 임계값 이상인지 확인\",\n    alert:\"🚨 경보 울리기\"\n  };\n  var PROGRAM_ANSWER = [\"loop\",\"measure\",\"compare\",\"alert\"];\n\n  function el(html){\n    var t = document.createElement(\"template\");\n    t.innerHTML = html.trim();\n    return t.content.firstElementChild;\n  }\n\n  function render(){\n    renderTopbar();\n    var stage = document.getElementById(\"stage\");\n    stage.innerHTML = \"\";\n    var fn = RENDERERS[state.screen];\n    stage.appendChild(fn());\n  }\n\n  function renderTopbar(){\n    var idx = SCREENS.indexOf(state.screen);\n    var bar = document.getElementById(\"progressBar\");\n    bar.innerHTML = \"\";\n    for(var i=0;i\u003cSCREENS.length;i++){\n      var seg = document.createElement(\"div\");\n      seg.className = \"seg\" + (i\u003cidx?\" done\":(i===idx?\" current\":\"\"));\n      bar.appendChild(seg);\n    }\n    document.getElementById(\"progressLabel\").textContent =\n      \"STEP \" + (idx+1) + \" / \" + SCREENS.length + \" · \" + SCREEN_LABEL[state.screen];\n  }\n\n  function go(screen){ state.screen = screen; render(); window.scrollTo({top:0,behavior:\"instant\"}); }\n\n  // ---------- ① 인트로 ----------\n  function renderIntro(){\n    var wrap = el('\u003cdiv class=\"card-body\">\u003c/div>');\n    wrap.innerHTML =\n      '\u003cdiv class=\"eyebrow\">사물 인터넷 시스템 설계 · 고등학교 정보\u003c/div>' +\n      '\u003ch1 class=\"title\">산림청 IoT 엔지니어가 되어,\u003cbr>산불을 가장 먼저 알아채는 시스템을 설계하자\u003c/h1>' +\n      '\u003cp class=\"lead\">산불은 건조한 계절에 많이 발생하고, 늦게 발견할수록 진화 비용과 피해가 커진다. 문제를 해결하려면 어떤 데이터를 수집해야 할지부터 정해야 한다. 지금부터 센서를 직접 시험해보고, 실제로 작동하는 산불 조기 감지 시스템을 조립해보자.\u003c/p>' +\n      '\u003cdiv class=\"goal-box\">\u003cb>학습 목표\u003c/b> · 문제 해결에 적합한 피지컬 컴퓨팅 시스템 장치를 선택하고, 사물 인터넷 시스템을 설계할 수 있다. \u003cspan class=\"hint\">(교과서 30쪽)\u003c/span>\u003c/div>';\n    var btnRow = el('\u003cdiv class=\"btn-row\">\u003cspan class=\"spacer\">\u003c/span>\u003c/div>');\n    var startBtn = el('\u003cbutton class=\"btn btn-primary\" type=\"button\">시작하기 →\u003c/button>');\n    startBtn.onclick = function(){ go(\"discover\"); };\n    btnRow.appendChild(startBtn);\n    wrap.appendChild(btnRow);\n    return wrap;\n  }\n\n  // ---------- ②(신규) 발견형 도입 ----------\n  function renderDiscover(){\n    var d = state.discover;\n    var wrap = el('\u003cdiv class=\"card-body\">\u003c/div>');\n    wrap.innerHTML =\n      '\u003cdiv class=\"eyebrow\">2 · 발견하기\u003c/div>' +\n      '\u003ch1 class=\"title\">산불 현장, 무엇을 데이터로 모을까?\u003c/h1>' +\n      '\u003cp class=\"lead\">숲에서 산불이 났다. 아래 센서 후보 중 하나를 눌러 먼저 시험해보자. 어떤 정보가 산불 감지에 진짜 쓸 만한지, 직접 실패해보며 찾아내야 한다.\u003c/p>';\n\n    var grid = el('\u003cdiv class=\"sensor-grid\">\u003c/div>');\n    var cards = [\n      {id:\"sound\", emoji:\"🔊\", name:\"소리 센서\", state:d.triedSound?\"시험 완료\":\"클릭해서 시험\"},\n      {id:\"smell\", emoji:\"👃\", name:\"냄새(가스) 센서\", state:d.triedSmell?\"시험 완료\":\"클릭해서 시험\"},\n      {id:\"temp\", emoji:\"🌡️\", name:\"온도 센서\", state:d.tempUnlocked?(d.tempDone?\"시험 완료\":\"클릭해서 시험\"):\"🔒 잠김\"}\n    ];\n    cards.forEach(function(c){\n      var locked = c.id===\"temp\" && !d.tempUnlocked;\n      var tested = (c.id===\"sound\"&&d.triedSound)||(c.id===\"smell\"&&d.triedSmell)||(c.id===\"temp\"&&d.tempDone);\n      var success = c.id===\"temp\" && d.tempDone;\n      var card = el('\u003cdiv class=\"sensor-card\">\u003c/div>');\n      card.className += locked? \" locked\" : (success? \" success\" : (tested? \" tested\" : \"\"));\n      card.innerHTML =\n        '\u003cdiv class=\"sensor-emoji\">'+c.emoji+'\u003c/div>' +\n        '\u003cdiv class=\"sensor-name\">'+c.name+'\u003c/div>' +\n        '\u003cdiv class=\"sensor-state\">'+c.state+'\u003c/div>';\n      if(!locked){\n        card.onclick = function(){ trySensor(c.id); };\n      }\n      grid.appendChild(card);\n    });\n    wrap.appendChild(grid);\n\n    if(!d.tempUnlocked){\n      wrap.appendChild(el('\u003cdiv class=\"lock-hint\">🔒 온도 센서는 소리·냄새 센서를 모두 시험해봐야 열립니다.\u003c/div>'));\n    }\n\n    var resultHost = el('\u003cdiv id=\"discoverResult\">\u003c/div>');\n    wrap.appendChild(resultHost);\n    renderDiscoverResult(resultHost);\n\n    var btnRow = el('\u003cdiv class=\"btn-row\">\u003c/div>');\n    var back = el('\u003cbutton class=\"btn btn-ghost\" type=\"button\">← 이전\u003c/button>');\n    back.onclick = function(){ go(\"intro\"); };\n    var spacer = el('\u003cspan class=\"spacer\">\u003c/span>');\n    var next = el('\u003cbutton class=\"btn btn-primary\" type=\"button\">다음으로 →\u003c/button>');\n    next.disabled = !d.tempDone;\n    next.onclick = function(){ if(d.tempDone) go(\"confirm\"); };\n    btnRow.appendChild(back); btnRow.appendChild(spacer); btnRow.appendChild(next);\n    wrap.appendChild(btnRow);\n\n    return wrap;\n  }\n\n  state._lastTried = null;\n\n  function trySensor(id){\n    if(id===\"sound\") state.discover.triedSound = true;\n    if(id===\"smell\") state.discover.triedSmell = true;\n    if(id===\"temp\" && state.discover.tempUnlocked) state.discover.tempDone = true;\n    state._lastTried = id;\n    if(state.discover.triedSound && state.discover.triedSmell) state.discover.tempUnlocked = true;\n    render();\n  }\n\n  function renderDiscoverResult(host){\n    var id = state._lastTried;\n    if(!id){ host.innerHTML=\"\"; return; }\n    var panel;\n    if(id===\"sound\"){\n      panel = el('\u003cdiv class=\"result-panel fail\">\u003c/div>');\n      var wave = el('\u003cdiv class=\"wave\">\u003c/div>');\n      var pattern = [1,1,0,1,1]; // 1 = 오작동(바람/새소리), 0 = 실제 산불음\n      pattern.forEach(function(v){\n        var bar = el('\u003cspan>\u003c/span>');\n        bar.style.height = (18+Math.random()*18)+\"px\";\n        if(v===1) bar.className=\"bad\";\n        wave.appendChild(bar);\n      });\n      panel.innerHTML = '\u003cb>🔊 소리 센서 시험 결과\u003c/b> — 경보가 5번 울렸는데, 확인해보니 4번은 바람 소리·나뭇가지 소리였다. 진짜 산불음과 구별이 안 돼서 오작동이 너무 잦다.';\n      panel.appendChild(wave);\n    } else if(id===\"smell\"){\n      panel = el('\u003cdiv class=\"result-panel fail\">\u003c/div>');\n      panel.innerHTML = '\u003cb>👃 냄새(가스) 센서 시험 결과\u003c/b> — 냄새는 넓은 산 전체로 퍼져서, 감지는 되어도 정확히 어느 구역에서 불이 났는지 위치를 특정할 수 없다. 게다가 넓은 산에 촘촘히 설치하기엔 비용도 크다.';\n    } else if(id===\"temp\"){\n      panel = el('\u003cdiv class=\"result-panel success\">\u003c/div>');\n      panel.innerHTML = '\u003cb>🌡️ 온도 센서 시험 결과\u003c/b> — 불이 난 구역의 온도만 다른 구역과 다르게 계속 올라갔다. 25℃ → 33℃ → 41℃로 꾸준히 상승! 구역별로 설치하면 어디서 불이 났는지도 정확히 알 수 있다. ✅ 성공';\n    }\n    host.innerHTML = \"\";\n    host.appendChild(panel);\n  }\n\n  // ---------- ③ 문제 상황 확인 ----------\n  function renderConfirm(){\n    var wrap = el('\u003cdiv class=\"card-body\">\u003c/div>');\n    wrap.innerHTML =\n      '\u003cdiv class=\"eyebrow\">3 · 문제 상황 확인\u003c/div>' +\n      '\u003ch1 class=\"title\">왜 하필 &ldquo;온도&rdquo;였을까?\u003c/h1>' +\n      '\u003cp class=\"lead\">방금 소리 센서는 바람에도 울렸고, 냄새 센서는 어디서 났는지 위치를 못 찾았다. 그런데 온도 센서는 불이 난 구역만 정확히 짚어냈다. 산불 감지에는 왜 &ldquo;온도&rdquo; 정보가 가장 적합했을까?\u003c/p>' +\n      '\u003cdiv class=\"goal-box\">힌트가 필요하면: 교과서에서는 산불 현장에서 소리·연기(냄새)·온도를 모두 수집할 수 있다고 했지만, 실제 문제 해결에는 그중 하나만 골라 썼다. 무엇을 기준으로 골랐을지 생각해보자.\u003c/div>';\n    var btnRow = el('\u003cdiv class=\"btn-row\">\u003c/div>');\n    var back = el('\u003cbutton class=\"btn btn-ghost\" type=\"button\">← 이전\u003c/button>');\n    back.onclick = function(){ go(\"discover\"); };\n    var spacer = el('\u003cspan class=\"spacer\">\u003c/span>');\n    var next = el('\u003cbutton class=\"btn btn-primary\" type=\"button\">내 생각 써보기 →\u003c/button>');\n    next.onclick = function(){ go(\"predict\"); };\n    btnRow.appendChild(back); btnRow.appendChild(spacer); btnRow.appendChild(next);\n    wrap.appendChild(btnRow);\n    return wrap;\n  }\n\n  // ---------- ④ 예상 입력 (30자 이상 필수) ----------\n  function renderPredict(){\n    var wrap = el('\u003cdiv class=\"card-body\">\u003c/div>');\n    wrap.innerHTML =\n      '\u003cdiv class=\"eyebrow\">4 · 예상하기\u003c/div>' +\n      '\u003ch1 class=\"title\">온도 센서가 적합했던 이유, 내 말로 써보기\u003c/h1>' +\n      '\u003cp class=\"lead\">소리·냄새 센서가 왜 실패했는지, 온도 센서는 왜 성공했는지를 떠올리며 \u003cb>30자 이상\u003c/b>으로 직접 설명해보자. (복사-붙여넣기 대신 자기 말로 써볼 것)\u003c/p>';\n    var ta = el('\u003ctextarea class=\"answer\" placeholder=\"예: 온도는 수치로 정확하게 측정할 수 있고, 불이 난 구역에서만 뚜렷하게 오르기 때문에 오작동이 적고 위치도...\">\u003c/textarea>');\n    ta.value = state.predictText;\n    var counterRow = el('\u003cdiv class=\"counter-row\">\u003cspan class=\"hint\">최소 30자\u003c/span>\u003cspan class=\"count\">\u003c/span>\u003c/div>');\n    var countSpan = counterRow.querySelector(\".count\");\n    function updateCount(){\n      var len = ta.value.trim().length;\n      countSpan.textContent = len + \" / 30자\";\n      countSpan.className = \"count \" + (len>=30?\"ok\":\"low\");\n      next.disabled = len\u003c30;\n    }\n    ta.addEventListener(\"input\", function(){ state.predictText = ta.value; updateCount(); });\n    wrap.appendChild(ta);\n    wrap.appendChild(counterRow);\n\n    var btnRow = el('\u003cdiv class=\"btn-row\">\u003c/div>');\n    var back = el('\u003cbutton class=\"btn btn-ghost\" type=\"button\">← 이전\u003c/button>');\n    back.onclick = function(){ go(\"confirm\"); };\n    var spacer = el('\u003cspan class=\"spacer\">\u003c/span>');\n    var next = el('\u003cbutton class=\"btn btn-primary\" type=\"button\">시스템 조립하러 가기 →\u003c/button>');\n    next.onclick = function(){ if(state.predictText.trim().length>=30) go(\"build\"); };\n    btnRow.appendChild(back); btnRow.appendChild(spacer); btnRow.appendChild(next);\n    wrap.appendChild(btnRow);\n    updateCount();\n    return wrap;\n  }\n\n  // ---------- ⑤ 탐구 조작(심화) : 5개 미니 스텝 ----------\n  var BUILD_STEPS = [\n    {n:1, key:\"zones\", label:\"구역 나누기\"},\n    {n:2, key:\"wiring\", label:\"장치 연결\"},\n    {n:3, key:\"program\", label:\"프로그램 순서\"},\n    {n:4, key:\"threshold\", label:\"임계값 설정\"},\n    {n:5, key:\"sim\", label:\"화재 테스트\"}\n  ];\n\n  function renderBuild(){\n    var b = state.build;\n    var wrap = el('\u003cdiv class=\"card-body\">\u003c/div>');\n    wrap.innerHTML = '\u003cdiv class=\"eyebrow\">5 · 시스템 조립 (교과서 IoT 문제 해결 5단계)\u003c/div>';\n    var chips = el('\u003cdiv class=\"substep-track\">\u003c/div>');\n    BUILD_STEPS.forEach(function(s){\n      var chip = el('\u003cspan class=\"substep-chip\">\u003c/span>');\n      chip.textContent = s.n + \". \" + s.label;\n      if(s.n \u003c b.step) chip.className += \" done\";\n      if(s.n === b.step) chip.className += \" active\";\n      chips.appendChild(chip);\n    });\n    wrap.appendChild(chips);\n\n    var body = el('\u003cdiv>\u003c/div>');\n    wrap.appendChild(body);\n    if(b.step===1) body.appendChild(buildStep1());\n    else if(b.step===2) body.appendChild(buildStep2());\n    else if(b.step===3) body.appendChild(buildStep3());\n    else if(b.step===4) body.appendChild(buildStep4());\n    else body.appendChild(buildStep5());\n\n    return wrap;\n  }\n\n  function stepNav(canNext, onNext, backLabel, onBack){\n    var row = el('\u003cdiv class=\"btn-row\">\u003c/div>');\n    var back = el('\u003cbutton class=\"btn btn-ghost\" type=\"button\">'+(backLabel||\"← 이전\")+'\u003c/button>');\n    back.onclick = onBack;\n    var spacer = el('\u003cspan class=\"spacer\">\u003c/span>');\n    var next = el('\u003cbutton class=\"btn btn-primary\" type=\"button\">다음 단계 →\u003c/button>');\n    next.disabled = !canNext;\n    next.onclick = onNext;\n    row.appendChild(back); row.appendChild(spacer); row.appendChild(next);\n    return row;\n  }\n\n  // 5-1 구역 나누기\n  function buildStep1(){\n    var b = state.build;\n    var frag = el('\u003cdiv class=\"card-body\">\u003c/div>');\n    frag.innerHTML =\n      '\u003ch1 class=\"title\" style=\"font-size:1.3rem;\">5-1. 산을 구역으로 나누고 센서 설치하기\u003c/h1>' +\n      '\u003cp class=\"lead\">산 전체를 24시간 감시할 수는 없다. 아래 지도의 A·B·C 구역을 각각 눌러 감시 센서 노드를 설치하자.\u003c/p>';\n    var map = el('\u003cdiv class=\"zone-map\">\u003c/div>');\n    [\"A\",\"B\",\"C\"].forEach(function(z){\n      var tile = el('\u003cdiv class=\"zone-tile\">\u003c/div>');\n      if(b.zones[z]) tile.className += \" installed\";\n      tile.innerHTML = '\u003cdiv class=\"zone-label\">'+z+'\u003c/div>\u003cdiv class=\"zone-sub\">구역\u003c/div>';\n      tile.onclick = function(){ b.zones[z]=true; render(); };\n      map.appendChild(tile);\n    });\n    frag.appendChild(map);\n    var doneAll = b.zones.A && b.zones.B && b.zones.C;\n    frag.appendChild(el('\u003cdiv class=\"hint\">'+(doneAll?\"✅ 3개 구역 모두 설치 완료!\":\"설치된 구역: \"+[\"A\",\"B\",\"C\"].filter(function(z){return b.zones[z];}).length+\" / 3\")+'\u003c/div>'));\n    frag.appendChild(stepNav(doneAll, function(){ b.step=2; render(); }, \"← 예상하기로\", function(){ go(\"predict\"); }));\n    return frag;\n  }\n\n  // 드래그+클릭 겸용 헬퍼\n  function makeDraggable(node, id, onSelect){\n    node.draggable = true;\n    node.dataset.dragId = id;\n    node.addEventListener(\"dragstart\", function(e){\n      e.dataTransfer.setData(\"text/plain\", id);\n      state._selected = id;\n    });\n    node.addEventListener(\"click\", function(){\n      if(state._selected===id){ state._selected=null; } else { state._selected=id; }\n      render();\n    });\n  }\n  function makeDropTarget(node, onDrop){\n    node.addEventListener(\"dragover\", function(e){ e.preventDefault(); });\n    node.addEventListener(\"drop\", function(e){\n      e.preventDefault();\n      var id = e.dataTransfer.getData(\"text/plain\");\n      state._selected = null;\n      if(id){ onDrop(id); render(); }\n    });\n    node.addEventListener(\"click\", function(){\n      if(state._selected){\n        var id = state._selected;\n        state._selected = null;\n        onDrop(id);\n        render();\n      }\n    });\n  }\n\n  // 5-2 장치 연결(드래그)\n  function buildStep2(){\n    var b = state.build;\n    var frag = el('\u003cdiv class=\"card-body\">\u003c/div>');\n    frag.innerHTML =\n      '\u003ch1 class=\"title\" style=\"font-size:1.3rem;\">5-2. 입력·출력 장치 연결하기\u003c/h1>' +\n      '\u003cp class=\"lead\">온도 센서(입력 장치)를 A·B·C 구역 보드에, 경보 장치(출력 장치)를 중앙 관제 보드에 드래그하거나, 아이템을 탭한 뒤 놓을 자리를 탭해서 연결하자.\u003c/p>';\n\n    var dndWrap = el('\u003cdiv class=\"dnd-wrap\">\u003c/div>');\n    var tray = el('\u003cdiv class=\"tray\">\u003c/div>');\n    b.traySensors.forEach(function(sid){\n      var chip = el('\u003cdiv class=\"chip-item\">🌡️ 온도 센서\u003c/div>');\n      if(state._selected===sid) chip.className += \" selected\";\n      makeDraggable(chip, sid, null);\n      tray.appendChild(chip);\n    });\n    if(b.trayAlarm){\n      var achip = el('\u003cdiv class=\"chip-item\">🔔 경보 장치\u003c/div>');\n      if(state._selected===\"alarm\") achip.className += \" selected\";\n      makeDraggable(achip, \"alarm\", null);\n      tray.appendChild(achip);\n    }\n    if(!b.traySensors.length && !b.trayAlarm){\n      tray.appendChild(el('\u003cspan class=\"hint\">모든 장치를 연결했습니다.\u003c/span>'));\n    }\n    dndWrap.appendChild(tray);\n\n    var board = el('\u003cdiv class=\"wiring-board\">\u003c/div>');\n    [\"A\",\"B\",\"C\"].forEach(function(z){\n      var row = el('\u003cdiv class=\"wiring-zone-row\">\u003c/div>');\n      var zl = el('\u003cdiv class=\"zl\">\u003c/div>'); zl.textContent=z;\n      var slot = el('\u003cdiv class=\"slot\">온도 센서를 여기로\u003c/div>');\n      if(b.wiring[z]){ slot.className += \" filled\"; slot.textContent = \"🌡️ 연결됨 · \"+z+\"구역 입력\"; }\n      makeDropTarget(slot, function(id){\n        if(id.indexOf(\"s\")===0 && !b.wiring[z]){\n          b.wiring[z]=true;\n          b.traySensors = b.traySensors.filter(function(x){return x!==id;});\n        }\n      });\n      row.appendChild(zl); row.appendChild(slot);\n      board.appendChild(row);\n    });\n    var crow = el('\u003cdiv class=\"wiring-zone-row\">\u003c/div>');\n    va
