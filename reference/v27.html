r cl = el('\u003cdiv class=\"zl\">C\u003c/div>'); cl.textContent=\"관제\";\n    cl.style.width=\"auto\"; cl.style.padding=\"0 8px\";\n    var cslot = el('\u003cdiv class=\"slot\">경보 장치를 여기로\u003c/div>');\n    if(b.wiring.center){ cslot.className += \" filled\"; cslot.textContent = \"🔔 연결됨 · 중앙 관제 보드 출력\"; }\n    makeDropTarget(cslot, function(id){\n      if(id===\"alarm\" && !b.wiring.center){ b.wiring.center=true; b.trayAlarm=false; }\n    });\n    crow.appendChild(cl); crow.appendChild(cslot);\n    board.appendChild(crow);\n    dndWrap.appendChild(board);\n    frag.appendChild(dndWrap);\n\n    var allDone = b.wiring.A && b.wiring.B && b.wiring.C && b.wiring.center;\n    frag.appendChild(stepNav(allDone, function(){ b.step=3; render(); }, \"← 이전 단계\", function(){ b.step=1; render(); }));\n    return frag;\n  }\n\n  // 5-3 프로그램 순서 맞추기\n  function buildStep3(){\n    var b = state.build;\n    var frag = el('\u003cdiv class=\"card-body\">\u003c/div>');\n    frag.innerHTML =\n      '\u003ch1 class=\"title\" style=\"font-size:1.3rem;\">5-3. 프로그램 순서 맞추기\u003c/h1>' +\n      '\u003cp class=\"lead\">중앙 관제 보드가 실행할 블록 4개가 뒤섞여 있다. 올바른 순서로 슬롯에 넣어보자.\u003c/p>';\n\n    var tray = el('\u003cdiv class=\"tray\">\u003c/div>');\n    b.programTray.forEach(function(pid){\n      var chip = el('\u003cdiv class=\"chip-item\">\u003c/div>');\n      chip.textContent = PROGRAM_LABEL[pid];\n      if(state._selected===pid) chip.className += \" selected\";\n      makeDraggable(chip, pid, null);\n      tray.appendChild(chip);\n    });\n    if(!b.programTray.length) tray.appendChild(el('\u003cspan class=\"hint\">모든 블록을 배치했습니다.\u003c/span>'));\n    frag.appendChild(tray);\n\n    var slots = el('\u003cdiv class=\"slots-row\">\u003c/div>');\n    for(var i=0;i\u003c4;i++){\n      (function(i){\n        var slot = el('\u003cdiv class=\"slot\">\u003c/div>');\n        slot.textContent = (i+1)+\"번\";\n        if(b.program[i]){\n          slot.textContent = (i+1)+\". \"+PROGRAM_LABEL[b.program[i]];\n          slot.className += \" filled\";\n          if(b.checked && b.program[i]!==PROGRAM_ANSWER[i]) slot.className += \" wrong\";\n        }\n        makeDropTarget(slot, function(id){\n          if(!b.program[i] && b.programTray.indexOf(id)>=0){\n            b.program[i]=id;\n            b.programTray = b.programTray.filter(function(x){return x!==id;});\n            b.checked=false;\n          } else if(b.program[i]){\n            // 이미 채워진 슬롯 클릭 시 되돌리기\n          }\n        });\n        slot.addEventListener(\"click\", function(){\n          if(b.program[i] && !state._selected){\n            b.programTray.push(b.program[i]);\n            b.program[i]=null;\n            b.checked=false;\n            render();\n          }\n        });\n        slots.appendChild(slot);\n      })(i);\n    }\n    frag.appendChild(slots);\n\n    var allPlaced = b.program.every(function(x){return x;});\n    var checkBtn = el('\u003cbutton class=\"btn btn-ghost\" type=\"button\" style=\"align-self:flex-start;\">순서 확인하기\u003c/button>');\n    checkBtn.disabled = !allPlaced;\n    checkBtn.onclick = function(){ b.checked=true; render(); };\n    frag.appendChild(checkBtn);\n\n    var correct = b.checked && allPlaced && b.program.every(function(v,i){return v===PROGRAM_ANSWER[i];});\n    if(b.checked && allPlaced){\n      frag.appendChild(el('\u003cdiv class=\"result-panel '+(correct?\"success\":\"fail\")+'\">'+\n        (correct? \"✅ 정확해요! 반복 안에서 온도를 측정하고, 임계값을 넘으면 경보를 울리는 순서입니다.\"\n                : \"❌ 아직 순서가 안 맞아요. 빨간 슬롯을 눌러 되돌리고 다시 배치해보세요.\") +'\u003c/div>'));\n    }\n\n    frag.appendChild(stepNav(correct, function(){ b.step=4; render(); }, \"← 이전 단계\", function(){ b.step=2; render(); }));\n    return frag;\n  }\n\n  // 5-4 임계값 슬라이더\n  function buildStep4(){\n    var b = state.build;\n    var frag = el('\u003cdiv class=\"card-body\">\u003c/div>');\n    frag.innerHTML =\n      '\u003ch1 class=\"title\" style=\"font-size:1.3rem;\">5-4. 화재 판단 기준 온도 정하기\u003c/h1>' +\n      '\u003cp class=\"lead\">온도가 몇 도 이상 지속되면 &ldquo;산불 발생&rdquo;으로 판단할지 정해보자. 너무 낮으면 오탐이 잦고, 너무 높으면 늦게 감지된다.\u003c/p>';\n    var block = el('\u003cdiv class=\"slider-block\">\u003c/div>');\n    var readout = el('\u003cdiv class=\"threshold-readout\">\u003c/div>');\n    readout.textContent = \"🌡️ 기준: \" + b.threshold + \"℃ 이상\";\n    var slider = el('\u003cinput type=\"range\" min=\"20\" max=\"60\" step=\"1\">');\n    slider.value = b.threshold;\n    slider.id = \"thresholdSlider\";\n    slider.addEventListener(\"input\", function(){\n      b.threshold = parseInt(slider.value,10);\n      readout.textContent = \"🌡️ 기준: \" + b.threshold + \"℃ 이상\";\n    });\n    block.appendChild(readout);\n    block.appendChild(slider);\n    block.appendChild(el('\u003cdiv class=\"hint\">교과서 예시는 40℃를 기준으로 삼았어요. 직접 값을 바꿔보고 다음 단계에서 테스트해보세요.\u003c/div>'));\n    frag.appendChild(block);\n    frag.appendChild(stepNav(true, function(){ b.step=5; render(); }, \"← 이전 단계\", function(){ b.step=3; render(); }));\n    return frag;\n  }\n\n  // 5-5 시뮬레이션 테스트\n  function buildStep5(){\n    var b = state.build;\n    var frag = el('\u003cdiv class=\"card-body\">\u003c/div>');\n    frag.innerHTML =\n      '\u003ch1 class=\"title\" style=\"font-size:1.3rem;\">5-5. 시스템 구현 및 테스트하기\u003c/h1>' +\n      '\u003cp class=\"lead\">지도의 구역을 하나 눌러 그 구역에 불을 놓아보자. 온도가 임계값(현재 '+b.threshold+'℃)을 넘으면 중앙 관제 보드가 경보를 울린다.\u003c/p>';\n\n    var map = el('\u003cdiv class=\"sim-map\">\u003c/div>');\n    [\"A\",\"B\",\"C\"].forEach(function(z){\n      var tile = el('\u003cdiv class=\"sim-tile\">\u003c/div>');\n      var burning = b.fireZone===z;\n      if(burning) tile.className += \" burning\";\n      if(b.simRunning && !burning) tile.className += \" disabled\";\n      var therm = el('\u003cdiv class=\"therm\">\u003c/div>');\n      var pct = burning ? Math.min(100, Math.round((b.simTemp-20)/55*100)) : Math.max(0,Math.round((22-20)/55*100));\n      therm.style.height = pct+\"%\";\n      var readout = el('\u003cdiv class=\"sim-readout\">\u003c/div>');\n      readout.textContent = (burning? b.simTemp.toFixed(0) : \"22\") + \"℃\";\n      var status = el('\u003cdiv class=\"sim-status\">\u003c/div>');\n      status.textContent = z + \"구역\" + (burning?\" 🔥\":\"\");\n      tile.appendChild(therm); tile.appendChild(readout); tile.appendChild(status);\n      if(!b.simRunning && !b.fireZone){\n        tile.onclick = function(zz){ return function(){ startFire(zz); }; }(z);\n      }\n      map.appendChild(tile);\n    });\n    frag.appendChild(map);\n\n    var board = el('\u003cdiv class=\"center-board\">\u003c/div>');\n    var alarmOn = b.lastResult===\"success\" && b.simRunning===false;\n    if(b.simRunning && b.simTemp>=b.threshold) board.className += \" alarm\";\n    board.innerHTML = '\u003cdiv class=\"center-icon\">'+((b.simRunning && b.simTemp>=b.threshold)?\"🚨\":\"🖥️\")+'\u003c/div>' +\n      '\u003cdiv class=\"center-text\" id=\"centerText\">중앙 관제 보드 대기 중… 구역을 눌러 화재를 테스트해보세요.\u003c/div>';\n    frag.appendChild(board);\n\n    if(b.lastResult){\n      var rp = el('\u003cdiv class=\"result-panel '+(b.lastResult===\"success\"?\"success\":\"fail\")+'\">\u003c/div>');\n      rp.textContent = b.lastResultMsg;\n      frag.appendChild(rp);\n    }\n\n    var stat = el('\u003cdiv class=\"stat-row\">\u003c/div>');\n    stat.innerHTML = \"\u003cspan>기준 온도: \u003cb>\"+b.threshold+\"℃\u003c/b>\u003c/span>\u003cspan>테스트 성공: \u003cb>\"+b.testSuccessCount+\"회\u003c/b>\u003c/span>\";\n    frag.appendChild(stat);\n\n    var btnRow2 = el('\u003cdiv class=\"btn-row\">\u003c/div>');\n    if(b.fireZone && !b.simRunning){\n      var retry = el('\u003cbutton class=\"btn btn-ember\" type=\"button\">🔀 다시 테스트하기\u003c/button>');\n      retry.onclick = function(){ b.fireZone=null; b.simTemp=22; b.lastResult=null; render(); };\n      btnRow2.appendChild(retry);\n    } else {\n      btnRow2.appendChild(el('\u003cspan>\u003c/span>'));\n    }\n    var backBtn = el('\u003cbutton class=\"btn btn-ghost\" type=\"button\">임계값 다시 정하기\u003c/button>');\n    backBtn.onclick = function(){ if(!b.simRunning){ b.step=4; render(); } };\n    var spacer2 = el('\u003cspan class=\"spacer\">\u003c/span>');\n    var next2 = el('\u003cbutton class=\"btn btn-primary\" type=\"button\">기록하러 가기 →\u003c/button>');\n    next2.disabled = b.testSuccessCount\u003c1;\n    next2.onclick = function(){ if(b.testSuccessCount>=1) go(\"reflect\"); };\n    btnRow2.appendChild(backBtn); btnRow2.appendChild(spacer2); btnRow2.appendChild(next2);\n    frag.appendChild(btnRow2);\n\n    return frag;\n  }\n\n  function startFire(zone){\n    var b = state.build;\n    b.fireZone = zone;\n    b.simRunning = true;\n    b.simTemp = 22;\n    b.lastResult = null;\n    render();\n    var target = 65;\n    var duration = 5200;\n    var startTime = Date.now();\n    if(b.simTimer) clearInterval(b.simTimer);\n    b.simTimer = setInterval(function(){\n      var t = Math.min(1, (Date.now()-startTime)/duration);\n      var eased = 1-Math.pow(1-t,2);\n      b.simTemp = 22 + eased*(target-22);\n      var centerText = document.getElementById(\"centerText\");\n      var board = document.querySelector(\".center-board\");\n      if(b.simTemp >= b.threshold){\n        clearInterval(b.simTimer);\n        b.simRunning = false;\n        b.lastResult = \"success\";\n        b.lastResultMsg = \"🚨 \"+zone+\"구역 화재 감지! 온도가 기준(\"+b.threshold+\"℃)을 넘어서자 중앙 관제 보드가 즉시 경보를 울렸습니다.\";\n        b.testSuccessCount++;\n        render();\n        return;\n      }\n      if(t>=1){\n        clearInterval(b.simTimer);\n        b.simRunning = false;\n        b.lastResult = \"fail\";\n        b.lastResultMsg = \"⚠️ 온도가 \"+Math.round(target)+\"℃까지 올랐지만 기준(\"+b.threshold+\"℃)이 너무 높아 감지하지 못했습니다. 임계값을 낮춰서 다시 시도해보세요.\";\n        render();\n        return;\n      }\n      if(centerText) centerText.textContent = zone+\"구역 온도 상승 중… 현재 \"+b.simTemp.toFixed(0)+\"℃\";\n      if(board){\n        var tile = document.querySelectorAll(\".sim-tile\")[[\"A\",\"B\",\"C\"].indexOf(zone)];\n        if(tile){\n          var therm = tile.querySelector(\".therm\");\n          var rd = tile.querySelector(\".sim-readout\");\n          if(therm) therm.style.height = Math.min(100, Math.round((b.simTemp-20)/55*100))+\"%\";\n          if(rd) rd.textContent = b.simTemp.toFixed(0)+\"℃\";\n        }\n      }\n    }, 120);\n  }\n\n  // ---------- ⑥ 1차 기록 제출 ----------\n  function renderReflect(){\n    var wrap = el('\u003cdiv class=\"card-body\">\u003c/div>');\n    wrap.innerHTML =\n      '\u003cdiv class=\"eyebrow\">6 · 기록하기\u003c/div>' +\n      '\u003ch1 class=\"title\">오늘 탐구로 알게 된 것\u003c/h1>' +\n      '\u003cp class=\"lead\">3줄 이내로 짧게 정리해보자. (예: 어떤 센서가 왜 적합했는지, 임계값을 조정하며 무엇을 느꼈는지)\u003c/p>';\n    var ta = el('\u003ctextarea class=\"answer\" placeholder=\"예: 온도 센서는 수치로 정확히 측정되어 오작동이 적었고, 임계값을 너무 높게 두면 감지가 늦어진다는 것을 알게 되었다.\">\u003c/textarea>');\n    ta.value = state.reflectText;\n    ta.addEventListener(\"input\", function(){ state.reflectText = ta.value; updateBtn(); });\n    wrap.appendChild(ta);\n    var counterRow = el('\u003cdiv class=\"counter-row\">\u003cspan class=\"hint\">권장 20자 이상 · 3줄 이내\u003c/span>\u003cspan class=\"count\">\u003c/span>\u003c/div>');\n    var countSpan = counterRow.querySelector(\".count\");\n    wrap.appendChild(counterRow);\n\n    var btnRow = el('\u003cdiv class=\"btn-row\">\u003c/div>');\n    var back = el('\u003cbutton class=\"btn btn-ghost\" type=\"button\">← 이전\u003c/button>');\n    back.onclick = function(){ go(\"build\"); };\n    var spacer = el('\u003cspan class=\"spacer\">\u003c/span>');\n    var next = el('\u003cbutton class=\"btn btn-primary\" type=\"button\">제출하고 기록 보기 →\u003c/button>');\n    function updateBtn(){\n      var len = ta.value.trim().length;\n      countSpan.textContent = len+\"자\";\n      countSpan.className = \"count \" + (len>=20?\"ok\":\"low\");\n      next.disabled = len\u003c1;\n    }\n    next.onclick = function(){ if(state.reflectText.trim().length>=1) go(\"summary\"); };\n    btnRow.appendChild(back); btnRow.appendChild(spacer); btnRow.appendChild(next);\n    wrap.appendChild(btnRow);\n    updateBtn();\n    return wrap;\n  }\n\n  // ---------- ⑦ 완료 + 한 페이지 기록 ----------\n  function renderSummary(){\n    var b = state.build;\n    var wrap = el('\u003cdiv class=\"card-body\">\u003c/div>');\n    wrap.innerHTML =\n      '\u003cdiv class=\"eyebrow\">7 · 완료\u003c/div>' +\n      '\u003ch1 class=\"title\">오늘의 탐구, 이렇게 진행했어요\u003c/h1>';\n\n    var b1 = el('\u003cdiv class=\"summary-block\">\u003ch3>① 처음 시도 결과\u003c/h3>\u003cp>\u003c/p>\u003c/div>');\n    b1.querySelector(\"p\").innerHTML = \"소리 센서는 바람 소리에 4/5회 오작동했고, 냄새 센서는 화재 위치를 특정하지 못했습니다. \u003cb>온도 센서\u003c/b>로 시험했을 때만 불이 난 구역의 온도가 뚜렷하게 상승해 성공했습니다.\";\n    wrap.appendChild(b1);\n\n    var b2 = el('\u003cdiv class=\"summary-block\">\u003ch3>② 내 예상\u003c/h3>\u003cp>\u003c/p>\u003c/div>');\n    b2.querySelector(\"p\").textContent = state.predictText || \"(작성한 예상 없음)\";\n    wrap.appendChild(b2);\n\n    var b3 = el('\u003cdiv class=\"summary-block\">\u003ch3>③ 조립한 시스템 결과\u003c/h3>\u003cp>\u003c/p>\u003c/div>');\n    b3.querySelector(\"p\").innerHTML = \"감시 구역 \u003cb>3곳(A·B·C)\u003c/b>에 온도 센서를 연결하고, 중앙 관제 보드에 경보 장치를 연결했습니다. 화재 판단 기준은 \u003cb>\"+b.threshold+\"℃\u003c/b>로 설정했고, 화재 테스트에 \u003cb>\"+b.testSuccessCount+\"회\u003c/b> 성공했습니다.\";\n    wrap.appendChild(b3);\n\n    var b4 = el('\u003cdiv class=\"summary-block\">\u003ch3>④ 알게 된 것\u003c/h3>\u003cp>\u003c/p>\u003c/div>');\n    b4.querySelector(\"p\").textContent = state.reflectText || \"(작성한 기록 없음)\";\n    wrap.appendChild(b4);\n\n    var btnRow = el('\u003cdiv class=\"btn-row\" style=\"flex-direction:column;align-items:stretch;\">\u003c/div>');\n    var copyBtn = el('\u003cbutton class=\"btn btn-ghost\" type=\"button\">📋 기록 복사하기\u003c/button>');\n    copyBtn.onclick = function(){\n      var text = \"[헛다리 짚는 산불 감지기 탐구 기록]\\n① 처음 시도: 소리·냄새 센서 실패, 온도 센서 성공\\n② 내 예상: \"+state.predictText+\"\\n③ 시스템 결과: 3구역 · 기준 \"+b.threshold+\"℃ · 테스트 성공 \"+b.testSuccessCount+\"회\\n④ 알게 된 것: \"+state.reflectText;\n      function fallbackCopy(){\n        var ta=document.createElement(\"textarea\"); ta.value=text; document.body.appendChild(ta);\n        ta.select(); try{document.execCommand(\"copy\");}catch(e){} document.body.removeChild(ta);\n        copyBtn.textContent = \"✅ 복사됨\";\n        setTimeout(function(){copyBtn.textContent=\"📋 기록 복사하기\";},1500);\n      }\n      if(navigator.clipboard && navigator.clipboard.writeText){\n        navigator.clipboard.writeText(text).then(function(){\n          copyBtn.textContent = \"✅ 복사됨\";\n          setTimeout(function(){copyBtn.textContent=\"📋 기록 복사하기\";},1500);\n        }).catch(fallbackCopy);\n      } else { fallbackCopy(); }\n    };\n    var growthBtn = el('\u003cbutton class=\"btn btn-primary\" type=\"button\">📚 성장기록실에서 보기\u003c/button>');\n    growthBtn.onclick = function(){ showModal(\"성장기록실\", \"이 기록이 성장기록실에 저장되어, 다른 교과 활동 기록과 함께 누적됩니다. (프로토타입에서는 안내로 대체)\"); };\n    var qBtn = el('\u003cbutton class=\"btn btn-ghost\" type=\"button\">💬 질문공방으로 이동\u003c/button>');\n    qBtn.onclick = function(){ showModal(\"질문공방\", \"이제 '왜 임계값을 그렇게 정했는지', '더 정확하게 만들려면 어떻게 해야 할지'를 질문공방에서 더 깊이 이야기해볼 수 있습니다. (프로토타입에서는 안내로 대체)\"); };\n    btnRow.appendChild(copyBtn); btnRow.appendChild(growthBtn); btnRow.appendChild(qBtn);\n    wrap.appendChild(btnRow);\n    wrap.appendChild(el('\u003cdiv class=\"modal-note\">※ 이 프로토타입은 하나의 활동 화면 흐름(①~⑦)을 보여주기 위한 시연입니다.\u003c/div>'));\n\n    return wrap;\n  }\n\n  function showModal(title, text){\n    var overlay = el('\u003cdiv style=\"position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;\">\u003c/div>');\n    var box = el('\u003cdiv style=\"background:var(--panel);border-radius:16px;padding:20px;max-width:360px;width:100%;\">\u003c/div>');\n    box.innerHTML = '\u003ch3 style=\"margin:0 0 8px;font-family:var(--font-display);\">'+title+'\u003c/h3>\u003cp style=\"margin:0 0 16px;font-size:.88rem;line-height:1.6;color:var(--ink-dim);\">'+text+'\u003c/p>';\n    var closeBtn = el('\u003cbutton class=\"btn btn-primary\" type=\"button\" style=\"width:100%;\">확인\u003c/button>');\n    closeBtn.onclick = function(){ document.body.removeChild(overlay); };\n    box.appendChild(closeBtn);\n    overlay.appendChild(box);\n    overlay.onclick = function(e){ if(e.target===overlay) document.body.removeChild(overlay); };\n    document.body.appendChild(overlay);\n  }\n\n  var RENDERERS = {\n    intro: renderIntro,\n    discover: renderDiscover,\n    confirm: renderConfirm,\n    predict: renderPredict,\n    build: renderBuild,\n    reflect: renderReflect,\n    summary: renderSummary\n  };\n\n  document.getElementById(\"teacherToggleBtn\").addEventListener(\"click\", function(){\n    var p = document.getElementById(\"teacherPanel\");\n    p.classList.toggle(\"open\");\n    this.textContent = p.classList.contains(\"open\") ? \"교사용 활동 정보 닫기 ▴\" : \"교사용 활동 정보 보기 ▾\";\n  });\n\n  function boot(data){\n    if(data && data.state){ try{ Object.assign(state, data.state); }catch(e){} }\n    render();\n  }\n  if(window.claude && window.claude.hot){\n    window.claude.hot.snapshot(function(){ return {state:{screen:state.screen}}; });\n    window.claude.hot.ready ? window.claude.hot.ready(boot) : boot(window.claude.hot.data||{});\n  } else {\n    boot({});\n  }\n})();\n\u003c/script>\n\u003cscript>document.addEventListener('click',function(e){const a=e.target.closest('a');if(a&&a.getAttribute('href')&&!a.getAttribute('href').startsWith('#'))e.preventDefault();});\u003c/script>", "grade": "", "school": "고등학교", "mode": "온라인", "imported": true, "family": 3}, {"id": "ext-wildfire-threshold-lab", "name": "산불 감지 임계값 실험실", "subject": "정보", "visual": "threshold", "minutes": 30, "html": "\u003ctitle>산불 감지 임계값 실험실\u003c/title>\n\n\u003cstyle>\n/* 레이아웃: 기본형(\"헛다리 짚는 산불 감지기\")과 같은 시각 언어를 공유하는 단일 스테이지 구조.\n   심화형은 ⑤ 탐구 조작에 \"구역별 슬라이더 3개 + 반복 실험 + 결과 스택 바\"라는 실험실 레이아웃이 추가됨. */\n:root{\n  --bg:#EFF4EC; --panel:#FFFFFF; --panel-2:#E4EEE1; --ink:#152317; --ink-dim:#4B5C4F;\n  --pine:#1F6F4A; --pine-dark:#154F35; --ember:#E0632A; --ember-dark:#B84A1C;\n  --line:#CCDBC6; --gold:#C99A2E; --badge-bg:#EADFB4; --badge-fg:#6B4E12;\n  --good:#2F8E6C; --warn:#B98226; --crit:#B33A4A; --neutral:#8FA093;\n  --font-display:'Big Shoulders Display',sans-serif; --font-body:'IBM Plex Sans KR',sans-serif; --font-mono:'IBM Plex Mono',monospace;\n  color-scheme:light;\n}\n@media (prefers-color-scheme:dark){\n  :root:not([data-theme=\"light\"]){\n    --bg:#0E1712; --panel:#16211A; --panel-2:#1C2A21; --ink:#E7F0E6; --ink-dim:#9FB29F;\n    --pine:#4FAE7D; --pine-dark:#2E7E56; --ember:#F07C43; --ember-dark:#D45A22;\n    --line:#2A3B2F; --gold:#E0B958; --badge-bg:#3A3218; --badge-fg:#E0C67A;\n    --good:#2F8E6C; --warn:#B98226; --crit:#B33A4A; --neutral:#61715F; color-scheme:dark;\n  }\n}\n:root[data-theme=\"dark\"]{\n  --bg:#0E1712; --panel:#16211A; --panel-2:#1C2A21; --ink:#E7F0E6; --ink-dim:#9FB29F;\n  --pine:#4FAE7D; --pine-dark:#2E7E56; --ember:#F07C43; --ember-dark:#D45A22;\n  --line:#2A3B2F; --gold:#E0B958; --badge-bg:#3A3218; --badge-fg:#E0C67A;\n  --good:#2F8E6C; --warn:#B98226; --crit:#B33A4A; --neutral:#61715F; color-scheme:dark;\n}\n*{box-sizing:border-box;}\nbody{background:var(--bg);color:var(--ink);font-family:var(--font-body);}\n#app-root{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:20px 40px;min-height:100%;display:flex;flex-direction:column;gap:14px;}\n\n.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:6px 4px;display:flex;flex-direction:column;gap:8px;}\n.topbar-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}\n.brand{font-family:var(--font-display);font-weight:800;font-size:1.02rem;letter-spacing:.02em;color:var(--pine-dark);display:flex;align-items:center;gap:8px;flex-wrap:wrap;}\n.brand .dotmark{width:10px;height:10px;border-radius:50%;background:var(--ember);box-shadow:0 0 0 3px color-mix(in srgb, var(--ember) 25%, transparent);flex:none;}\n.tier-badge{font-family:var(--font-mono);font-size:.62rem;font-weight:700;letter-spacing:.03em;background:var(--badge-bg);color:var(--badge-fg);border-radius:999px;padding:3px 10px;white-space:nowrap;}\n.teacher-toggle{font-family:var(--font-body);font-size:.72rem;font-weight:600;color:var(--ink-dim);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;white-space:nowrap;}\n.teacher-toggle:hover{border-color:var(--pine);color:var(--pine-dark);}\n.progress{display:flex;align-items:center;gap:6px;}\n.progress .seg{flex:1;height:5px;border-radius:3px;background:var(--line);}\n.progress .seg.done{background:var(--pine);}\n.progress .seg.current{background:linear-gradient(90deg,var(--pine) 50%,var(--line) 50%);}\n.progress-label{font-family:var(--font-mono);font-size:.68rem;color:var(--ink-dim);letter-spacing:.04em;}\n\n.teacher-panel{display:none;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:.82rem;line-height:1.55;}\n.teacher-panel.open{display:block;}\n.teacher-panel table{width:100%;border-collapse:collapse;margin-top:8px;}\n.teacher-panel td{border-top:1px solid var(--line);padding:5px 6px;vertical-align:top;}\n.teacher-panel td:first-child{color:var(--ink-dim);white-space:nowrap;font-weight:600;width:34%;}\n.teacher-panel a{color:var(--pine-dark);}\n\n.stage{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:26px 22px;flex:1;display:flex;flex-direction:column;gap:16px;position:relative;overflow:hidden;}\n.stage::before{content:\"\";position:absolute;inset:0;pointer-events:none;opacity:.5;\n  background-image:\n    radial-gradient(circle at 12% 8%, color-mix(in srgb, var(--pine) 10%, transparent) 0, transparent 40%),\n    repeating-radial-gradient(circle at 88% 94%, transparent 0 16px, color-mix(in srgb, var(--pine) 6%, transparent) 17px 18px);\n}\n.stage > *{position:relative;z-index:1;}\n\n.eyebrow{font-family:var(--font-mono);font-size:.72rem;letter-spacing:.08em;color:var(--pine-dark);text-transform:uppercase;font-weight:600;}\nh1.title{font-family:var(--font-display);font-size:clamp(1.4rem,4.6vw,1.9rem);font-weight:800;line-height:1.1;margin:0;letter-spacing:.01em;text-wrap:balance;}\np.lead{margin:0;color:var(--ink-dim);line-height:1.65;font-size:.95rem;}\n.card-body{display:flex;flex-direction:column;gap:14px;}\n\n.btn{font-family:var(--font-body);font-weight:700;font-size:.9rem;border:none;border-radius:12px;padding:12px 18px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .1s ease, filter .15s ease;}\n.btn:active{transform:scale(.97);}\n.btn-primary{background:var(--pine);color:#fff;}\n.btn-primary:hover{filter:brightness(1.08);}\n.btn-primary:disabled{background:var(--line);color:var(--ink-dim);cursor:not-allowed;}\n.btn-ghost{background:transparent;color:var(--ink-dim);border:1px solid var(--line);}\n.btn-ghost:hover{border-color:var(--pine);color:var(--pine-dark);}\n.btn-ember{background:var(--ember);color:#fff;}\n.btn-row{display:flex;gap:10px;justify-content:space-between;margin-top:4px;flex-wrap:wrap;}\n.btn-row .spacer{flex:1;}\n\n.goal-box{background:var(--panel-2);border:1px dashed var(--line);border-radius:12px;padding:12px 14px;font-size:.85rem;color:var(--ink-dim);line-height:1.6;}\n.goal-box b{color:var(--ink);}\n.prereq-note{font-size:.78rem;color:var(--ink-dim);border-left:3px solid var(--gold);padding:6px 10px;background:var(--panel-2);border-radius:0 8px 8px 0;}\n\n.zone-info-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}\n@media (max-width:520px){.zone-info-grid{grid-template-columns:1fr;}}\n.zone-info-card{background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:.78rem;line-height:1.5;}\n.zone-info-card b{display:block;font-family:var(--font-display);font-weight:800;font-size:1.05rem;color:var(--pine-dark);margin-bottom:2px;}\n\n.common-test-btn-row{display:flex;justify-content:center;}\n.result-panel{border-radius:14px;padding:13px 14px;font-size:.86rem;line-height:1.6;border:1px solid var(--line);background:var(--panel-2);}\n.result-panel.fail{border-color:var(--crit);background:color-mix(in srgb, var(--crit) 12%, var(--panel-2));}\n.result-panel.warn{border-color:var(--warn);background:color-mix(in srgb, var(--warn) 14%, var(--panel-2));}\n.result-panel.success{border-color:var(--good);background:color-mix(in srgb, var(--good) 14%, var(--panel-2));}\n\ntextarea.answer{width:100%;min-height:96px;resize:vertical;font-family:var(--font-body);font-size:.95rem;line-height:1.6;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);}\ntextarea.answer:focus{outline:none;border-color:var(--pine);}\n.counter-row{display:flex;justify-content:space-between;align-items:center;font-family:var(--font-mono);font-size:.75rem;}\n.counter-row .count.ok{color:var(--pine-dark);font-weight:700;}\n.counter-row .count.low{color:var(--crit);font-weight:700;}\n\n.substep-track{display:flex;gap:6px;flex-wrap:wrap;}\n.substep-chip{font-family:var(--font-mono);font-size:.68rem;padding:4px 9px;border-radius:999px;border:1px solid var(--line);color:var(--ink-dim);}\n.substep-chip.active{background:var(--pine);color:#fff;border-color:var(--pine);}\n.substep-chip.done{border-color:var(--pine);color:var(--pine-dark);}\n\n.threshold-trio{display:flex;flex-direction:column;gap:14px;}\n.threshold-row{display:flex;flex-direction:column;gap:4px;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;}\n.threshold-row .th-label{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--font-mono);font-size:.8rem;}\n.threshold-row .th-label b{font-family:var(--font-display);font-size:1.05rem;color:var(--pine-dark);}\n.threshold-row .th-value{font-weight:700;color:var(--ember-dark);}\ninput[type=range]{width:100%;accent-color:var(--ember);}\n\n.hint{font-size:.74rem;color:var(--ink-dim);line-height:1.5;}\n\n.chart-block{display:flex;flex-direction:column;gap:10px;}\n.legend-row{display:flex;gap:14px;flex-wrap:wrap;font-family:var(--font-mono);font-size:.7rem;color:var(--ink-dim);}\n.legend-chip{display:inline-flex;align-items:center;gap:5px;}\n.legend-swatch{width:10px;height:10px;border-radius:3px;flex:none;}\n.zone-bar-block{display:flex;flex-direction:column;gap:5px;}\n.zone-bar-title{font-family:var(--font-mono);font-size:.74rem;color:var(--ink-dim);display:flex;justify-content:space-between;}\n.zone-bar-title b{color:var(--ink);}\n.stack-bar{display:flex;gap:2px;height:30px;border-radius:7px;overflow:hidden;background:var(--panel-2);border:1px solid var(--line);}\n.stack-seg{display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:.68rem;font-weight:700;color:#fff;min-width:0;position:relative;cursor:default;}\n.stack-seg[data-zero=\"1\"]{display:none;}\n.stack-seg .tip{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-family:var(--font-body);font-weight:500;font-size:.7rem;padding:5px 8px;border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .1s ease;z-index:5;}\n.stack-seg:hover .tip, .stack-seg:focus .tip{opacity:1;}\n.stat-row{display:flex;gap:14px;flex-wrap:wrap;font-family:var(--font-mono);font-size:.72rem;color:var(--ink-dim);}\n.stat-row b{color:var(--ink);}\n\n.exp-history{width:100%;border-collapse:collapse;font-family:var(--font-mono);font-size:.72rem;}\n.exp-history th, .exp-history td{border-top:1px solid var(--line);padding:6px 7px;text-align:center;}\n.exp-history th{color:var(--ink-dim);font-weight:600;font-family:var(--font-body);font-size:.68rem;}\n.exp-history tr:first-child td{border-top:none;}\n.exp-history .best{color:var(--good);font-weight:700;}\n.table-wrap{overflow-x:auto;}\n\n.summary-block{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--panel-2);}\n.summary-block h3{margin:0 0 6px;font-family:var(--font-display);font-size:1rem;font-weight:700;color:var(--pine-dark);}\n.summary-block p{margin:0;font-size:.85rem;line-height:1.6;color:var(--ink-dim);}\n.summary-block p b{color:var(--ink);}\n.modal-note{font-size:.72rem;color:var(--ink-dim);font-style:italic;}\n\u003c/style>\n\n\u003cdiv id=\"app-root\">\n  \u003cdiv class=\"topbar\">\n    \u003cdiv class=\"topbar-row\">\n      \u003cdiv class=\"brand\">\u003cspan class=\"dotmark\">\u003c/span>산불 감지 임계값 실험실\u003cspan class=\"tier-badge\">심화 · 성취수준 상위 전용\u003c/span>\u003c/div>\n      \u003cbutton class=\"teacher-toggle\" id=\"teacherToggleBtn\" type=\"button\">교사용 활동 정보 보기 ▾\u003c/button>\n    \u003c/div>\n    \u003cdiv class=\"progress\" id=\"progressBar\" aria-hidden=\"true\">\u003c/div>\n    \u003cdiv class=\"progress-label\" id=\"progressLabel\">\u003c/div>\n    \u003cdiv class=\"teacher-panel\" id=\"teacherPanel\">\n      \u003cb>탐구공방 심화 활동 메타데이터\u003c/b>\n      \u003ctable>\n        \u003ctr>\u003ctd>subject / domain\u003c/td>\u003ctd>정보 · 컴퓨팅 시스템 (고등학교)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>originalStandardCode\u003c/td>\u003ctd>[12정01-03] 문제 해결에 적합한 피지컬 컴퓨팅 시스템 장치를 선택하여 사물인터넷 시스템을 설계한다.\u003cbr>[12정01-02] 사물인터넷의 구성과 동작 원리를 분석한다.\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>inquiryStage\u003c/td>\u003ctd>①문제·질문 인식 → ②예상·가설 세우기 → ③탐구·검증 수행 → ④해석·판단 근거화(일부, 반복 실험 데이터로 최적 조합 판단) — 탐구공방+질문공방 경계 영역\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>coreCompetency\u003c/td>\u003ctd>지식정보처리, 창의적사고\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>studioModule\u003c/td>\u003ctd>탐구공방(심화 트랙) → 질문공방 → 성장기록실\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>activityFormat\u003c/td>\u003ctd>다변수 조작형 실험 시뮬레이션 — 구역별 개별 슬라이더 + 반복 무작위 실험(오탐/미탐 트레이드오프 탐색)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>difficultyTier\u003c/td>\u003ctd>심화(성취수준 상위) — 팀 공통 스키마에 아직 정식 필드는 아님(제안 중)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>prerequisiteActivity\u003c/td>\u003ctd>기본형 \"헛다리 짚는 산불 감지기\"(같은 산불 감지 소재, 공통 임계값 1개 버전). 독립 실행도 가능.\u003c/td>\u003c/tr>\n      \u003c/table>\n    \u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"stage\" id=\"stage\">\u003c/div>\n\u003c/div>\n\n\u003cscript>\n(function(){\n  \"use strict\";\n\n  var SCREENS = [\"intro\",\"discover\",\"confirm\",\"predict\",\"build\",\"reflect\",\"summary\"];\n  var SCREEN_LABEL = {intro:\"인트로\",discover:\"발견하기\",confirm:\"문제 확인\",predict:\"예상하기\",build:\"실험실\",reflect:\"기록하기\",summary:\"완료\"};\n\n  var ZONES = {\n    A:{ name:\"A · 캠핑장 인근\", desc:\"방문객이 자주 모닥불을 피운다. 실제 산불보다 모닥불 열기가 훨씬 잦다.\",\n        events:[\n          {type:\"모닥불\", real:false, prob:0.6, min:30, max:42},\n          {type:\"실제 산불\", real:true, prob:0.4, min:55, max:75}\n        ]},\n    B:{ name:\"B · 일반 숲\", desc:\"교과서 기본 사례와 같은 평범한 숲 구역. 큰 변수가 적다.\",\n        events:[\n          {type:\"실제 산불\", real:true, prob:0.85, min:50, max:70},\n          {type:\"작은 열원(동물 등)\", real:false, prob:0.15, min:25, max:33}\n        ]},\n    C:{ name:\"C · 침엽수 밀집\", desc:\"나무가 빽빽하고 기름기가 많아 불이 나면 매우 빠르게 번진다. 조금만 늦게 감지해도 피해가 커진다.\",\n        events:[\n          {type:\"실제 산불(급속 확산)\", real:true, prob:1.0, min:35, max:50}\n        ]}\n  };\n  var ZONE_KEYS = [\"A\",\"B\",\"C\"];\n\n  var state = {\n    screen:\"intro\",\n    discover:{ ran:false, results:null },\n    predictText:\"\",\n    build:{\n      step:1,\n      thresholds:{A:40,B:40,C:40},\n      rounds:[], // {n, thresholds:{A,B,C}, perZone:{A:{정탐,오탐,미탐,정상,avgTime}, ...}}\n    },\n    reflectText:\"\"\n  };\n\n  function el(html){\n    var t = document.createElement(\"template\");\n    t.innerHTML = html.trim();\n    return t.content.firstElementChild;\n  }\n\n  function render(){\n    renderTopbar();\n    var stage = document.getElementById(\"stage\");\n    stage.innerHTML = \"\";\n    stage.appendChild(RENDERERS[state.screen]());\n  }\n  function renderTopbar(){\n    var idx = SCREENS.indexOf(state.screen);\n    var bar = document.getElementById(\"progressBar\");\n    bar.innerHTML = \"\";\n    for(var i=0;i\u003cSCREENS.length;i++){\n      var seg = document.createElement(\"div\");\n      seg.className = \"seg\" + (i\u003cidx?\" done\":(i===idx?\" current\":\"\"));\n      bar.appendChild(seg);\n    }\n    document.getElementById(\"progressLabel\").textContent =\n      \"STEP \" + (idx+1) + \" / \" + SCREENS.length + \" · \" + SCREEN_LABEL[state.screen];\n  }\n  function go(screen){ state.screen = screen; render(); window.scrollTo({top:0,behavior:\"instant\"}); }\n\n  // ---------- 실험 엔진 ----------\n  function runTrial(zoneKey, threshold){\n    var zone = ZONES[zoneKey];\n    var r = Math.random();\n    var acc = 0, ev = zone.events[zone.events.length-1];\n    for(var i=0;i\u003czone.events.length;i++){ acc += zone.events[i].prob; if(r\u003c=acc){ ev = zone.events[i]; break; } }\n    var maxTemp = ev.min + Math.random()*(ev.max-ev.min);\n    var alarm = threshold \u003c= maxTemp;\n    var outcome;\n    if(alarm && ev.real) outcome = \"정탐\";\n    else if(alarm && !ev.real) outcome = \"오탐\";\n    else if(!alarm && ev.real) outcome = \"미탐\";\n    else outcome = \"정상\";\n    var detectTime = alarm ? Math.max(0.4, (threshold-22)*0.16) : null;\n    return {event:ev.type, real:ev.real, maxTemp:maxTemp, alarm:alarm, outcome:outcome, detectTime:detectTime};\n  }\n\n  function runBatch(thresholds, count){\n    var out = {};\n    ZONE_KEYS.forEach(function(z){\n      var counts = {\"정탐\":0,\"오탐\":0,\"미탐\":0,\"정상\":0};\n      var times = [];\n      for(var i=0;i\u003ccount;i++){\n        var t = runTrial(z, thresholds[z]);\n        counts[t.outcome]++;\n        if(t.detectTime!=null && t.outcome===\"정탐\") times.push(t.detectTime);\n      }\n      var avg = times.length ? (times.reduce(function(a,b){return a+b;},0)/times.length) : null;\n      out[z] = {counts:counts, avgTime:avg, total:count};\n    });\n    return out;\n  }\n\n  function renderStackBar(zoneKey, counts, total){\n    var order = [\n      {key:\"정탐\", color:\"var(--good)\"},\n      {key:\"오탐\", color:\"var(--warn)\"},\n      {key:\"미탐\", color:\"var(--crit)\"},\n      {key:\"정상\", color:\"var(--neutral)\"}\n    ];\n    var bar = el('\u003cdiv class=\"stack-bar\">\u003c/div>');\n    order.forEach(function(o){\n      var n = counts[o.key] || 0;\n      var seg = el('\u003cdiv class=\"stack-seg\" tabindex=\"0\">\u003c/div>');\n      seg.dataset.zero = n===0 ? \"1\" : \"0\";\n      seg.style.flexBasis = (n/total*100)+\"%\";\n      seg.style.background = o.color;\n      if(n>0) seg.textContent = n;\n      var tip = el('\u003cspan class=\"tip\">\u003c/span>');\n      tip.textContent = o.key+\" \"+n+\"회 (\"+Math.round(n/total*100)+\"%)\";\n      seg.appendChild(tip);\n      bar.appendChild(seg);\n    });\n    return bar;\n  }\n\n  // ---------- ① 인트로 ----------\n  function renderIntro(){\n    var wrap = el('\u003cdiv class=\"card-body\">\u003c/div>');\n    wrap.innerHTML =\n      '\u003cdiv class=\"eyebrow\">사물 인터넷 시스템 설계 · 고등학교 정보 · 심화\u003c/div>' +\n      '\u003ch1 class=\"title\">하나의 기준으로 세 구역을 다 맞힐 수 있을까?\u003c/h1>' +\n      '\u003cp class=\"lead\">산불 감지 시스템에 구역마다 다른 환경(캠핑장 인근, 일반 숲, 침엽수 밀집)이 있다면, 임계 온도 하나로는 부족할 수 있다. 구역별로 임계값을 따로 설정하고, 반복 실험으로 오탐(false alarm)과 미탐(놓침) 사이의 균형점을 직접 찾아보자.\u003c/p>' +\n      '\u003cdiv class=\"goal-box\">\u003cb>학습 목표\u003c/b> · 구역별 환경 조건을 고려해 서로 다른 임계값을 설정하고, 반복 실험을 통해 오탐·미탐의 트레이드오프를 이해하며 최적의 조합을 탐색할 수 있다.\u003c/div>' +\n      '\u003cdiv class=\"prereq-note\">📎 이 활동은 기본 활동 \u003cb>&ldquo;헛다리 짚는 산불 감지기&rdquo;\u003c/b>(공통 임계값 1개 버전)를 마친 학생을 위한 심화 활동입니다. 이 활동만 따로 진행해도 무리 없습니다.\u003c/div>';\n    var btnRow = el('\u003cdiv class=\"btn-row\">\u003cspan class=\"spacer\">\u003c/span>\u003c/div>');\n    var startBtn = el('\u003cbutton class=\"btn btn-primary\" type=\"button\">시작하기 →\u003c/button>');\n    startBtn.onclick = function(){ go(\"discover\"); };\n    btnRow.appendChild(startBtn);\n    wrap.appendChild(btnRow);\n    return wrap;\n  }\n\n  // ---------- ②(신규) 발견형 도입 ----------\n  function renderDiscover(){\n    var d = state.discover;\n    var wrap = el('\u003cdiv class=\"card-body\">\u003c/div>');\n    wrap.innerHTML =\n      '\u003cdiv class=\"eyebrow\">2 · 발견하기\u003c/div>' +\n      '\u003ch1 class=\"title\">공통 임계값 40℃, 세 구역 모두에 적용해보자\u003c/h1>' +\n      '\u003cp class=\"lead\">아래 세 구역 각각에 온도 40℃를 기준으로 6번씩 자동으로 상황을 발생시켜본다. 버튼을 눌러 한 번에 실험해보자.\u003c/p>';\n    var grid = el('\u003cdiv class=\"zone-info-grid\">\u003c/div>');\n    ZONE_KEYS.forEach(function(z){\n      var c = el('\u003cdiv class=\"zone-info-card\">\u003c/div>');\n      c.innerHTML = '\u003cb>'+z+'\u003c/b>'+ZONES[z].desc;\n      grid.appendChild(c);\n    });\n    wrap.appendChild(grid);\n\n    var btnRow0 = el('\u003cdiv class=\"common-test-btn-row\">\u003c/div>');\n    var runBtn = el('\u003cbutton class=\"btn btn-ember\" type=\"button\">🔥 공통 기준 40℃로 한 번에 실험하기\u003c/button>');\n    runBtn.onclick = function(){\n      d.results = runBatch({A:40,B:40,C:40}, 6);\n      d.ran = true;\n      render();\n    };\n    btnRow0.appendChild(runBtn);\n    wrap.appendChild(btnRow0);\n\n    if(d.ran && d.results){\n      var chart = el('\u003cdiv class=\"chart-block\">\u003c/div>');\n      var legend = el('\u003cdiv class=\"legend-row\">\u003c/div>');\n      [[\"정탐 (실제 화재를 제대로 잡음)\",\"var(--good)\"],[\"오탐 (화재가 아닌데 울림)\",\"var(--warn)\"],[\"미탐 (실제 화재를 놓침)\",\"var(--crit)\"],[\"정상 (평온, 반응 없음)\",\"var(--neutral)\"]].forEach(function(l){\n        var chip = el('\u003cspan class=\"legend-chip\">\u003c/span>');\n        var sw = el('\u003cspan class=\"legend-swatch\">\u003c/span>'); sw.style.background = l[1];\n        chip.appendChild(sw); chip.appendChild(document.createTextNode(l[0]));\n        legend.appendChild(chip);\n      });\n      chart.appendChild(legend);\n      ZONE_KEYS.forEach(function(z){\n        var block = el('\u003cdiv class=\"zone-bar-block\">\u003c/div>');\n        var title = el('\u003cdiv class=\"zone-bar-title\">\u003c/div>');\n        title.innerHTML = '\u003cb>'+z+'구역\u003c/b>\u003cspan>기준 40℃ · 6회 실험\u003c/span>';\n        block.appendChild(title);\n        block.appendChild(renderStackBar(z, d.results[z].counts, d.results[z].total));\n        chart.appendChild(block);\n      });\n      wrap.appendChild(chart);\n\n      var a = d.results.A.counts, c = d.results.C.counts;\n      var verdict;\n      if(a[\"오탐\"]>=2 || c[\"미탐\"]>=1 || (c.avgTime)){\n        verdict = el('\u003cdiv class=\"result-panel fail\">\u003c/div>');\n        verdict.innerHTML = '\u003cb>같은 기준, 다른 결과\u003c/b> — A구역은 모닥불 때문에 오탐이 '+a[\"오탐\"]+'번이나 발생했고, C구역은 불이 빨리 번지는데 40℃까지 기다리다 보니 대응이 늦어질 위험이 있다. 40℃ 하나로는 세 구역을 다 만족시키지 못했다.';\n      } else {\n        verdict = el('\u003cdiv class=\"result-panel warn\">\u003c/div>');\n        verdict.innerHTML = '\u003cb>이번엔 큰 문제가 안 보였지만…\u003c/b> — 확률적으로 발생하는 상황이라 다시 실험하면 오탐·미탐이 나타날 수 있다. 아래 버튼으로 몇 번 더 실험해보자.';\n      }\n      wrap.appendChild(verdict);\n    }\n\n    var btnRow = el('\u003cdiv class=\"btn-row\">\u003c/div>');\n    var back = el('\u003cbutton class=\"btn btn-ghost\" type=\"button\">← 이전\u003c/button>');\n    back.onclick = function(){ go(\"intro\"); };\n    var spacer = el('\u003cspan class=\"spacer\">\u003c/span>');\n    var next = el('\u003cbutton class=\"btn btn-primary\" type=\"button\">다음으로 →\u003c/button>');\n    next.disabled = !d.ran;\n    next.onclick = function(){ if(d.ran) go(\"confirm\"); };\n    btnRow.appendChild(back); btnRow.appendChild(spacer); btnRow.appendChild(next);\n    wrap.appendChild(btnRow);\n    return wrap;\n  }\n\n  // ---------- ③ 문제 상황 확인 ----------\n  function renderConfirm(){\n    var wrap = el('\u003cdiv class=\"card-body\">\u003c/div>');\n    wrap.innerHTML =\n      '\u003cdiv class=\"eyebrow\">3 · 문제 상황 확인\u003c/div>' +\n      '\u003ch1 class=\"title\">왜 구역마다 다른 기준이 필요할까?\u003c/h1>' +\n      '\u003cp class=\"lead\">방금 40℃라는 같은 기준을 세 구역에 똑같이 적용했더니, A구역은 모닥불 때문에 오탐이 잦았고 C구역은 대응이 늦어질 위험이 있었다. 왜 하나의 값으로는 세 구역을 동시에 만족시킬 수 없었을까? 각
