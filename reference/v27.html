기 →\u003c/button>\u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003c!-- ③ 문제 상황 확인 -->\n  \u003csection class=\"screen\" id=\"screen3\">\n    \u003cdiv class=\"screen-head\">\u003cdiv class=\"screen-head-left\">\u003cbutton class=\"back-btn\" id=\"back3\" type=\"button\">← 이전\u003c/button>\u003cspan class=\"badge\">③ 문제 상황 확인\u003c/span>\u003c/div>\u003c/div>\n    \u003cp class=\"prompt\" id=\"recap3\">\u003c/p>\n    \u003cdiv class=\"row-line\">\u003cbutton class=\"primary\" id=\"go4\" type=\"button\">예상해보러 가기 →\u003c/button>\u003c/div>\n  \u003c/section>\n\n  \u003c!-- ④ 예상 입력 (서술형 ①) -->\n  \u003csection class=\"screen\" id=\"screen4\">\n    \u003cdiv class=\"screen-head\">\u003cdiv class=\"screen-head-left\">\u003cbutton class=\"back-btn\" id=\"back4\" type=\"button\">← 이전\u003c/button>\u003cspan class=\"badge\">④ 예상 입력\u003c/span>\u003c/div>\u003c/div>\n    \u003cp class=\"prompt\">로봇이 왜 실패했을지, 그리고 제대로 정렬하려면 로봇에게 무엇을 더 시켜야 할지 \u003cb>나의 예상\u003c/b>을 적어보세요. (3줄 이내)\u003c/p>\n    \u003ctextarea id=\"predictText\" maxlength=\"200\" placeholder=\"예) 한 번만 훑어서는 뒤쪽에 있던 큰 수가 다 못 옮겨간 것 같다. 여러 번 반복해서 훑어야…\">\u003c/textarea>\n    \u003cdiv class=\"field-foot\">\u003cspan>\u003cspan class=\"tabular\" id=\"predictCount\">0\u003c/span>/200자\u003c/span>\u003cspan class=\"done-badge\" id=\"predictBadge\">✓ 제출 완료\u003c/span>\u003c/div>\n    \u003cdiv class=\"row-line\">\u003cbutton class=\"primary\" id=\"predictSubmit\" type=\"button\">예상 제출하기\u003c/button>\u003c/div>\n  \u003c/section>\n\n  \u003c!-- ⑤ 탐구 조작(심화) -->\n  \u003csection class=\"screen\" id=\"screen5\">\n    \u003cdiv class=\"screen-head\">\u003cdiv class=\"screen-head-left\">\u003cbutton class=\"back-btn\" id=\"back5\" type=\"button\">← 이전\u003c/button>\u003cspan class=\"badge\">⑤ 탐구 조작(심화)\u003c/span>\u003c/div>\u003c/div>\n    \u003cp class=\"prompt\">계속 로봇에게 명령해서 \u003cb>완전히 정렬\u003c/b>될 때까지 훑어보세요. 다른 숫자로 새로 도전할 수도 있어요.\u003c/p>\n\n    \u003cdiv class=\"row-line\">\n      \u003cspan class=\"stat-pill\">훑은 횟수 \u003cb class=\"tabular\" id=\"passCount5\">1\u003c/b>회\u003c/span>\n      \u003cspan class=\"stat-pill\">비교 \u003cb class=\"tabular\" id=\"cmp5\">0\u003c/b>번\u003c/span>\n      \u003cspan class=\"stat-pill\">교환 \u003cb class=\"tabular\" id=\"swp5\">0\u003c/b>번\u003c/span>\n    \u003c/div>\n\n    \u003cdiv class=\"card-row\" id=\"cards5\">\u003c/div>\n\n    \u003cdiv id=\"playArea5\">\n      \u003cp class=\"ask-line\" id=\"ask5\">\u003c/p>\n      \u003cdiv class=\"row-line\">\n        \u003cbutton class=\"primary\" id=\"swap5\" type=\"button\">🔁 자리를 바꿔요\u003c/button>\n        \u003cbutton class=\"ghost\" id=\"hold5\" type=\"button\">➡ 이대로 둬요\u003c/button>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"callout\" id=\"passDone5\" style=\"display:none;\">\n      \u003cp id=\"passDoneMsg5\">\u003c/p>\n      \u003cdiv class=\"row-line\" style=\"justify-content:flex-start;margin-top:10px;\">\u003cbutton class=\"primary\" id=\"nextPass5\" type=\"button\">다음 훑기 시작 →\u003c/button>\u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"callout win\" id=\"allDone5\" style=\"display:none;\">\n      \u003cp id=\"allDoneMsg5\">\u003c/p>\n      \u003cdiv class=\"row-line\" style=\"justify-content:flex-start;margin-top:10px;\">\u003cbutton class=\"primary\" id=\"go6\" type=\"button\">기록 남기러 가기 →\u003c/button>\u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"row-line\">\u003cbutton class=\"ghost\" id=\"reshuffle5\" type=\"button\">다른 숫자로 다시 섞기 🔀 (재시도)\u003c/button>\u003c/div>\n  \u003c/section>\n\n  \u003c!-- ⑥ 1차 기록 제출 (서술형 ②) -->\n  \u003csection class=\"screen\" id=\"screen6\">\n    \u003cdiv class=\"screen-head\">\u003cdiv class=\"screen-head-left\">\u003cbutton class=\"back-btn\" id=\"back6\" type=\"button\">← 이전\u003c/button>\u003cspan class=\"badge\">⑥ 1차 기록 제출\u003c/span>\u003c/div>\u003c/div>\n    \u003cp class=\"prompt\">실험해보니 \u003cb>알게 된 것\u003c/b>을 짧게 정리해서 적어보세요. (3줄 이내)\u003c/p>\n    \u003ctextarea id=\"learnText\" maxlength=\"200\" placeholder=\"예) 한 번 훑을 때마다 가장 큰 수가 하나씩 뒤로 밀려간다. 그래서…\">\u003c/textarea>\n    \u003cdiv class=\"field-foot\">\u003cspan>\u003cspan class=\"tabular\" id=\"learnCount\">0\u003c/span>/200자\u003c/span>\u003cspan class=\"done-badge\" id=\"learnBadge\">✓ 제출 완료\u003c/span>\u003c/div>\n    \u003cdiv class=\"row-line\">\u003cbutton class=\"primary\" id=\"learnSubmit\" type=\"button\">제출하기\u003c/button>\u003c/div>\n  \u003c/section>\n\n  \u003c!-- ⑦ 완료 + 한 페이지 기록 -->\n  \u003csection class=\"screen\" id=\"screen7\">\n    \u003cdiv class=\"screen-head\">\u003cdiv class=\"screen-head-left\">\u003cbutton class=\"back-btn\" id=\"back7\" type=\"button\">← 이전\u003c/button>\u003cspan class=\"badge\">⑦ 완료\u003c/span>\u003c/div>\u003c/div>\n    \u003cp class=\"prompt\">오늘의 탐구, 이렇게 진행했어요.\u003c/p>\n    \u003cdiv class=\"summary-card\" id=\"summaryCard\">\u003c/div>\n    \u003cdiv class=\"row-line\">\n      \u003cbutton class=\"ghost\" id=\"copyBtn\" type=\"button\">기록 복사하기\u003c/button>\n      \u003cbutton class=\"ghost\" id=\"toGrowth\" type=\"button\">성장기록실에서 보기\u003c/button>\n      \u003cbutton class=\"ghost\" id=\"toQuestion\" type=\"button\">질문공방으로 이동\u003c/button>\n    \u003c/div>\n    \u003ctextarea class=\"copy-fallback mono\" id=\"copyFallback\" readonly style=\"display:none;\">\u003c/textarea>\n  \u003c/section>\n\n  \u003c/div>\n\n  \u003cfooter class=\"end\">성급한 정렬 로봇 · 탐구공방\u003c/footer>\n\u003c/div>\n\n\u003cdiv class=\"modal-overlay\" id=\"modalOverlay\">\n  \u003cdiv class=\"modal-box\">\n    \u003ch3 id=\"modalTitle\">\u003c/h3>\n    \u003cp id=\"modalBody\">\u003c/p>\n    \u003cdiv class=\"row-line\">\u003cbutton class=\"primary\" id=\"modalClose\" type=\"button\">확인\u003c/button>\u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003cscript>\n(function(){\n  \"use strict\";\n  const reduceMotion = window.matchMedia && window.matchMedia(\"(prefers-reduced-motion: reduce)\").matches;\n\n  const state = {\n    predict:\"\", predictSubmitted:false,\n    learn:\"\", learnSubmitted:false,\n    pass1Snapshot:null,     // { arr, flaggedCount }\n    finalRun:null,          // { passes, comparisons, swaps }\n    finalRunLocked:false\n  };\n\n  const STEP_LABELS = {1:\"인트로\",2:\"발견형 도입\",3:\"문제 상황 확인\",4:\"예상 입력\",5:\"탐구 조작(심화)\",6:\"1차 기록 제출\",7:\"완료\"};\n  const STEP_MARKS = {1:\"①\",2:\"②\",3:\"③\",4:\"④\",5:\"⑤\",6:\"⑥\",7:\"⑦\"};\n\n  let currentScreen = 1;\n  let maxReached = 1;\n\n  function goToScreen(n){\n    document.querySelectorAll(\".screen\").forEach(s=> s.classList.remove(\"active\"));\n    document.getElementById(\"screen\"+n).classList.add(\"active\");\n    currentScreen = n;\n    maxReached = Math.max(maxReached, n);\n    updateProgress();\n    if(n === 2) enterScreen2();\n    if(n === 3) renderRecap3();\n    if(n === 5) enterScreen5();\n    if(n === 7) renderSummary();\n  }\n\n  function updateProgress(){\n    document.querySelectorAll(\".progress-dot\").forEach(dot=>{\n      const s = Number(dot.dataset.step);\n      dot.classList.remove(\"done\",\"current\");\n      if(s \u003c currentScreen) dot.classList.add(\"done\");\n      else if(s === currentScreen) dot.classList.add(\"current\");\n    });\n    document.getElementById(\"progressText\").textContent = STEP_LABELS[currentScreen];\n    document.querySelector(\".progress-caption span\").textContent = STEP_MARKS[currentScreen];\n    document.getElementById(\"progressTrack\").setAttribute(\"aria-valuenow\", String(currentScreen));\n  }\n\n  document.getElementById(\"go2\").addEventListener(\"click\", ()=> goToScreen(2));\n  document.getElementById(\"go3\").addEventListener(\"click\", ()=> goToScreen(3));\n  document.getElementById(\"go4\").addEventListener(\"click\", ()=> goToScreen(4));\n  document.getElementById(\"go6\").addEventListener(\"click\", ()=> goToScreen(6));\n  [\"2\",\"3\",\"4\",\"5\",\"6\",\"7\"].forEach(n=>{\n    const btn = document.getElementById(\"back\"+n);\n    if(btn) btn.addEventListener(\"click\", ()=> goToScreen(Number(n)-1));\n  });\n\n  /* ---------- 정렬 로봇 공용 로직 ---------- */\n  function isSorted(a){ for(let i=1;i\u003ca.length;i++) if(a[i-1] > a[i]) return false; return true; }\n  function randomDataset(){\n    let vals;\n    do{\n      const pool = new Set();\n      while(pool.size \u003c 6){ pool.add(5 + Math.floor(Math.random()*91)); }\n      vals = Array.from(pool);\n      for(let i=vals.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [vals[i],vals[j]]=[vals[j],vals[i]]; }\n    } while(isSorted(vals));\n    return vals;\n  }\n\n  const RAW = [58,12,77,34,9,45];\n  const game = { arr: RAW.slice(), n: RAW.length, passNo: 1, pairIdx: 0, totalComparisons: 0, totalSwaps: 0 };\n\n  function passComparisons(){ return game.n - 1; }\n  function passComplete(){ return game.pairIdx >= passComparisons(); }\n\n  function applyAction(action){\n    const j = game.pairIdx;\n    const left = game.arr[j], right = game.arr[j+1];\n    game.totalComparisons++;\n    if(action === \"swap\"){\n      const t = game.arr[j]; game.arr[j] = game.arr[j+1]; game.arr[j+1] = t;\n      game.totalSwaps++;\n    }\n    game.pairIdx++;\n    return {left, right};\n  }\n\n  function renderCards(containerId, arr, hi, flaggedSet){\n    const wrap = document.getElementById(containerId);\n    wrap.innerHTML = \"\";\n    arr.forEach((v, idx)=>{\n      const c = document.createElement(\"div\");\n      let cls = \"num-card\";\n      if(hi && (idx === hi[0] || idx === hi[1])) cls += \" compare\";\n      if(flaggedSet && flaggedSet.has(idx)) cls += \" flag\";\n      c.className = cls;\n      c.textContent = v;\n      wrap.appendChild(c);\n    });\n  }\n\n  /* ---------- ②(신규) 발견형 도입 ---------- */\n  function updateAsk2(){\n    document.getElementById(\"ask2\").innerHTML = \"\u003cspan class=\\\"mono\\\">\"+game.arr[game.pairIdx]+\"\u003c/span> 와 \u003cspan class=\\\"mono\\\">\"+game.arr[game.pairIdx+1]+\"\u003c/span>, 순서가 맞을까요?\";\n  }\n  function renderPass1Frozen(){\n    const snap = state.pass1Snapshot;\n    const flagged = new Set();\n    for(let i=1;i\u003csnap.arr.length;i++){ if(snap.arr[i-1] > snap.arr[i]){ flagged.add(i-1); flagged.add(i); } }\n    document.getElementById(\"playArea2\").style.display = \"none\";\n    renderCards(\"cards2\", snap.arr, null, flagged);\n    document.getElementById(\"robotSay2\").style.display = \"flex\";\n    document.getElementById(\"robotSpeech2\").textContent = \"명령대로 이웃한 카드를 전부 \"+(snap.arr.length-1)+\"번 비교했어요. 완료! ✅\";\n    document.getElementById(\"checkRow2\").style.display = \"none\";\n    document.getElementById(\"discover2\").style.display = \"block\";\n    document.getElementById(\"discoverMsg2\").innerHTML = flagged.size > 0\n      ? \"\u003cb>어라? 로봇은 \\\"완료\\\"라고 했는데,\u003c/b> 빨간 표시가 된 카드들은 아직 순서가 안 맞아요!\"\n      : \"이번엔 운 좋게 한 번에 다 됐어요! 그런데 항상 그럴까요? 다른 숫자로도 실험해보면 알 수 있어요.\";\n  }\n  function enterScreen2(){\n    if(state.pass1Snapshot){ renderPass1Frozen(); return; }\n    if(!passComplete()){\n      document.getElementById(\"playArea2\").style.display = \"block\";\n      renderCards(\"cards2\", game.arr, [game.pairIdx, game.pairIdx+1], null);\n      updateAsk2();\n      document.getElementById(\"robotSay2\").style.display = \"none\";\n      document.getElementById(\"checkRow2\").style.display = \"none\";\n      document.getElementById(\"discover2\").style.display = \"none\";\n    } else {\n      document.getElementById(\"playArea2\").style.display = \"none\";\n      renderCards(\"cards2\", game.arr, null, null);\n      document.getElementById(\"robotSay2\").style.display = \"flex\";\n      document.getElementById(\"robotSpeech2\").textContent = \"명령대로 이웃한 카드를 전부 \"+passComparisons()+\"번 비교했어요. 완료! ✅\";\n      document.getElementById(\"checkRow2\").style.display = \"flex\";\n    }\n  }\n  function handlePass1Action(action){\n    applyAction(action);\n    if(!passComplete()){\n      renderCards(\"cards2\", game.arr, [game.pairIdx, game.pairIdx+1], null);\n      updateAsk2();\n    } else {\n      document.getElementById(\"playArea2\").style.display = \"none\";\n      renderCards(\"cards2\", game.arr, null, null);\n      document.getElementById(\"robotSay2\").style.display = \"flex\";\n      document.getElementById(\"robotSpeech2\").textContent = \"명령대로 이웃한 카드를 전부 \"+passComparisons()+\"번 비교했어요. 완료! ✅\";\n      document.getElementById(\"checkRow2\").style.display = \"flex\";\n    }\n  }\n  document.getElementById(\"swap2\").addEventListener(\"click\", ()=> handlePass1Action(\"swap\"));\n  document.getElementById(\"hold2\").addEventListener(\"click\", ()=> handlePass1Action(\"hold\"));\n\n  document.getElementById(\"checkNow2\").addEventListener(\"click\", ()=>{\n    document.getElementById(\"checkRow2\").style.display = \"none\";\n    const flagged = new Set();\n    for(let i=1;i\u003cgame.arr.length;i++){ if(game.arr[i-1] > game.arr[i]){ flagged.add(i-1); flagged.add(i); } }\n    renderCards(\"cards2\", game.arr, null, flagged);\n    state.pass1Snapshot = { arr: game.arr.slice(), flaggedCount: flagged.size };\n    // 다음 훑기 준비 (⑤ 화면에서 이어서 진행)\n    game.passNo += 1;\n    game.pairIdx = 0;\n\n    const msg = document.getElementById(\"discoverMsg2\");\n    msg.innerHTML = flagged.size > 0\n      ? \"\u003cb>어라? 로봇은 \\\"완료\\\"라고 했는데,\u003c/b> 빨간 표시가 된 카드들은 아직 순서가 안 맞아요!\"\n      : \"이번엔 운 좋게 한 번에 다 됐어요! 그런데 항상 그럴까요? 다른 숫자로도 실험해보면 알 수 있어요.\";\n    document.getElementById(\"discover2\").style.display = \"block\";\n  });\n\n  /* ---------- ③ 문제 상황 확인 (동적 문구) ---------- */\n  function renderRecap3(){\n    const n = state.pass1Snapshot ? state.pass1Snapshot.flaggedCount : 0;\n    const p = document.getElementById(\"recap3\");\n    if(n > 0){\n      p.innerHTML = \"방금 로봇은 딱 한 번, 이웃한 카드끼리만 훑어보고 \\\"완료!\\\"라고 했어요. 그런데 확인해보니 \"+n+\"곳은 순서가 안 맞았죠. 로봇은 왜 이렇게 판단했을까요? 그리고 어떻게 해야 로봇이 정말로 정렬을 끝낼 수 있을까요?\";\n    } else {\n      p.innerHTML = \"방금은 한 번만 훑고도 운 좋게 다 정렬됐어요. 하지만 카드 순서가 달랐다면 어땠을까요? 로봇이 \u003cb>항상\u003c/b> 한 번만 훑어도 될지 예상해봅시다.\";\n    }\n  }\n  /* ---------- ④, ⑥ 서술형 공통 처리 ---------- */\n  function wireTextarea(taId, countId, submitId, badgeId, stateKey, submittedKey, onSubmit){\n    const ta = document.getElementById(taId);\n    const count = document.getElementById(countId);\n    const submit = document.getElementById(submitId);\n    const badge = document.getElementById(badgeId);\n    submit.dataset.labelDefault = submit.textContent;\n    ta.addEventListener(\"input\", ()=>{\n      state[stateKey] = ta.value;\n      count.textContent = String(ta.value.length);\n      if(state[submittedKey]){\n        badge.classList.remove(\"show\");\n        state[submittedKey] = false;\n        submit.textContent = submit.dataset.labelDefault;\n      }\n    });\n    submit.addEventListener(\"click\", ()=>{\n      if(ta.value.trim().length \u003c 5){ ta.focus(); return; }\n      state[submittedKey] = true;\n      badge.classList.add(\"show\");\n      submit.textContent = \"다시 제출하기\";\n      onSubmit && onSubmit();\n    });\n  }\n  wireTextarea(\"predictText\",\"predictCount\",\"predictSubmit\",\"predictBadge\",\"predict\",\"predictSubmitted\", ()=> goToScreen(5));\n  wireTextarea(\"learnText\",\"learnCount\",\"learnSubmit\",\"learnBadge\",\"learn\",\"learnSubmitted\", ()=> goToScreen(7));\n\n  /* ---------- ⑤ 탐구 조작(심화) : 이어서 반복 훑기 ---------- */\n  function enterScreen5(){\n    document.getElementById(\"allDone5\").style.display = \"none\";\n    document.getElementById(\"passDone5\").style.display = \"none\";\n    refreshStats5();\n    if(passComplete()){\n      // 이론상 도달하지 않지만 방어적으로 처리\n      onPassComplete5();\n    } else {\n      document.getElementById(\"playArea5\").style.display = \"block\";\n      renderCards(\"cards5\", game.arr, [game.pairIdx, game.pairIdx+1], null);\n      updateAsk5();\n    }\n  }\n  function refreshStats5(){\n    document.getElementById(\"passCount5\").textContent = String(game.passNo);\n    document.getElementById(\"cmp5\").textContent = String(game.totalComparisons);\n    document.getElementById(\"swp5\").textContent = String(game.totalSwaps);\n  }\n  function updateAsk5(){\n    document.getElementById(\"ask5\").innerHTML = \"\u003cspan class=\\\"mono\\\">\"+game.arr[game.pairIdx]+\"\u003c/span> 와 \u003cspan class=\\\"mono\\\">\"+game.arr[game.pairIdx+1]+\"\u003c/span>, 순서가 맞을까요?\";\n  }\n  function handleGameAction5(action){\n    applyAction(action);\n    refreshStats5();\n    if(!passComplete()){\n      renderCards(\"cards5\", game.arr, [game.pairIdx, game.pairIdx+1], null);\n      updateAsk5();\n    } else {\n      onPassComplete5();\n    }\n  }\n  function onPassComplete5(){\n    document.getElementById(\"playArea5\").style.display = \"none\";\n    if(isSorted(game.arr)){\n      renderCards(\"cards5\", game.arr, null, null);\n      document.getElementById(\"allDoneMsg5\").innerHTML = \"\u003cb>정렬 완료!\u003c/b> 총 \"+game.passNo+\"번 훑어서 비교 \"+game.totalComparisons+\"번, 교환 \"+game.totalSwaps+\"번 만에 끝났어요.\";\n      document.getElementById(\"allDone5\").style.display = \"block\";\n      if(!state.finalRunLocked){\n        state.finalRunLocked = true;\n        state.finalRun = { passes: game.passNo, comparisons: game.totalComparisons, swaps: game.totalSwaps };\n      }\n    } else {\n      const flagged = new Set();\n      for(let i=1;i\u003cgame.arr.length;i++){ if(game.arr[i-1] > game.arr[i]){ flagged.add(i-1); flagged.add(i); } }\n      renderCards(\"cards5\", game.arr, null, flagged);\n      document.getElementById(\"passDoneMsg5\").innerHTML = game.passNo+\"번째 훑기 완료! 빨간 카드는 아직 순서가 안 맞아요. 계속해볼까요?\";\n      document.getElementById(\"passDone5\").style.display = \"block\";\n    }\n  }\n  document.getElementById(\"swap5\").addEventListener(\"click\", ()=> handleGameAction5(\"swap\"));\n  document.getElementById(\"hold5\").addEventListener(\"click\", ()=> handleGameAction5(\"hold\"));\n  document.getElementById(\"nextPass5\").addEventListener(\"click\", ()=>{\n    game.passNo += 1;\n    game.pairIdx = 0;\n    document.getElementById(\"passDone5\").style.display = \"none\";\n    document.getElementById(\"playArea5\").style.display = \"block\";\n    renderCards(\"cards5\", game.arr, [game.pairIdx, game.pairIdx+1], null);\n    updateAsk5();\n    refreshStats5();\n  });\n  document.getElementById(\"reshuffle5\").addEventListener(\"click\", ()=>{\n    const fresh = randomDataset();\n    game.arr = fresh; game.n = fresh.length; game.passNo = 1; game.pairIdx = 0;\n    game.totalComparisons = 0; game.totalSwaps = 0;\n    document.getElementById(\"allDone5\").style.display = \"none\";\n    document.getElementById(\"passDone5\").style.display = \"none\";\n    document.getElementById(\"playArea5\").style.display = \"block\";\n    renderCards(\"cards5\", game.arr, [game.pairIdx, game.pairIdx+1], null);\n    updateAsk5();\n    refreshStats5();\n  });\n\n  /* ---------- ⑦ 완료 + 한 페이지 기록 ---------- */\n  function pass1Summary(){\n    if(!state.pass1Snapshot) return \"(아직 실행 전)\";\n    const arr = state.pass1Snapshot.arr;\n    return \"로봇이 1번만 훑었을 때: [\"+arr.join(\", \")+\"] → 아직 순서가 안 맞는 곳이 \"+state.pass1Snapshot.flaggedCount+\"군데 남아있었어요.\";\n  }\n  function finalRunSummary(){\n    if(!state.finalRun) return \"(아직 실행 전)\";\n    const r = state.finalRun;\n    return \"총 \"+r.passes+\"번 훑어서 완전히 정렬 완료 (비교 \"+r.comparisons+\"번 · 교환 \"+r.swaps+\"번)\";\n  }\n  function renderSummary(){\n    const box = document.getElementById(\"summaryCard\");\n    box.innerHTML = \"\";\n    const head = document.createElement(\"div\");\n    head.className = \"summary-head\";\n    head.innerHTML = \"\u003cspan class=\\\"badge\\\">정보\u003c/span>\u003cspan class=\\\"std\\\">성급한 정렬 로봇 · [9정03-03]\u003c/span>\";\n    box.appendChild(head);\n    const rows = [\n      [\"① 처음 시도 결과\", pass1Summary()],\n      [\"② 내 예상\", state.predict || \"(작성 없음)\"],\n      [\"③ 다시 탐구한 결과\", finalRunSummary()],\n      [\"④ 알게 된 것\", state.learn || \"(작성 없음)\"]\n    ];\n    rows.forEach(([label, val])=>{\n      const r = document.createElement(\"div\");\n      r.className = \"summary-row\";\n      const b = document.createElement(\"b\"); b.textContent = label;\n      const span = document.createElement(\"span\"); span.textContent = val;\n      r.appendChild(b); r.appendChild(span);\n      box.appendChild(r);\n    });\n  }\n  document.getElementById(\"copyBtn\").addEventListener(\"click\", async ()=>{\n    const text = [\n      \"[성급한 정렬 로봇 · 오늘의 탐구 기록]\",\n      \"① 처음 시도 결과: \" + pass1Summary(),\n      \"② 내 예상: \" + (state.predict || \"(작성 없음)\"),\n      \"③ 다시 탐구한 결과: \" + finalRunSummary(),\n      \"④ 알게 된 것: \" + (state.learn || \"(작성 없음)\")\n    ].join(\"\\n\");\n    try{\n      await navigator.clipboard.writeText(text);\n      const btn = document.getElementById(\"copyBtn\");\n      const orig = btn.textContent;\n      btn.textContent = \"복사 완료 ✓\";\n      setTimeout(()=>{ btn.textContent = orig; }, 1800);\n    }catch(e){\n      const fb = document.getElementById(\"copyFallback\");\n      fb.style.display = \"block\"; fb.value = text; fb.focus(); fb.select();\n    }\n  });\n\n  /* ---------- 성장기록실 / 질문공방 모달 ---------- */\n  function openModal(title, body){\n    document.getElementById(\"modalTitle\").textContent = title;\n    document.getElementById(\"modalBody\").textContent = body;\n    document.getElementById(\"modalOverlay\").classList.add(\"show\");\n  }\n  document.getElementById(\"modalClose\").addEventListener(\"click\", ()=> document.getElementById(\"modalOverlay\").classList.remove(\"show\"));\n  document.getElementById(\"modalOverlay\").addEventListener(\"click\", (e)=>{ if(e.target.id === \"modalOverlay\") document.getElementById(\"modalOverlay\").classList.remove(\"show\"); });\n  document.getElementById(\"toGrowth\").addEventListener(\"click\", ()=> openModal(\"🌱 성장기록실\", \"이 기록이 성장기록실에 저장됩니다. (프로토타입에서는 화면 없이 안내로 대체했어요)\"));\n  document.getElementById(\"toQuestion\").addEventListener(\"click\", ()=> openModal(\"💬 질문공방으로 이동\", \"질문공방에서는 \\\"왜 그렇게 생각했어?\\\" 같은 후속 질문을 받으며 판단 근거를 더 다듬게 됩니다. (프로토타입에서는 화면 없이 안내로 대체했어요)\"));\n\n  /* ---------- init ---------- */\n  updateProgress();\n})();\n\u003c/script>\n\n\u003cscript>document.addEventListener('click',function(e){const a=e.target.closest('a');if(a&&a.getAttribute('href')&&!a.getAttribute('href').startsWith('#'))e.preventDefault();});\u003c/script>\u003c/body>\u003c/html>\n", "grade": "", "school": "중학교", "mode": "온라인", "imported": true, "family": 1}, {"id": "ext-how-many-passes", "name": "몇 번을 봐야 끝날까", "subject": "정보", "visual": "sort", "minutes": 20, "html": "\u003c!doctype html>\u003chtml>\u003chead>\u003cmeta charset=utf8>\u003cmeta name=viewport content=\"width=device-width,initial-scale=1,viewport-fit=cover\">\u003cstyle>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}\u003c/style>\u003c/head>\u003cbody>\n\u003ctitle>몇 번을 봐야 끝날까\u003c/title>\n\u003cstyle>\n  :root{\n    --bg:#EFF2F6;\n    --surface:#FFFFFF;\n    --surface-2:#E2E7ED;\n    --ink:#171B23;\n    --muted:#5B6472;\n    --accent:#3454D1;\n    --accent-ink:#FFFFFF;\n    --card-bg:#FFFFFF;\n    --card-border:#C9D0DA;\n    --highlight:#F5A623;\n    --highlight-ink:#171B23;\n    --danger:#E0483E;\n    --success:#1E9E6B;\n    --warn:#C97A1A;\n    --ring: rgba(52,84,209,0.18);\n    color-scheme: light;\n  }\n  @media (prefers-color-scheme: dark){\n    :root:not([data-theme=\"light\"]){\n      --bg:#11151C;\n      --surface:#1B212B;\n      --surface-2:#232B37;\n      --ink:#EDF0F4;\n      --muted:#9AA3B0;\n      --accent:#7C93FF;\n      --accent-ink:#0B0F17;\n      --card-bg:#232B37;\n      --card-border:#37424F;\n      --highlight:#FFC24B;\n      --highlight-ink:#171B23;\n      --danger:#FF6B61;\n      --success:#3FD08C;\n      --warn:#E2A23B;\n      --ring: rgba(124,147,255,0.22);\n      color-scheme: dark;\n    }\n  }\n  :root[data-theme=\"dark\"]{\n    --bg:#11151C;\n    --surface:#1B212B;\n    --surface-2:#232B37;\n    --ink:#EDF0F4;\n    --muted:#9AA3B0;\n    --accent:#7C93FF;\n    --accent-ink:#0B0F17;\n    --card-bg:#232B37;\n    --card-border:#37424F;\n    --highlight:#FFC24B;\n    --highlight-ink:#171B23;\n    --danger:#FF6B61;\n    --success:#3FD08C;\n    --warn:#E2A23B;\n    --ring: rgba(124,147,255,0.22);\n    color-scheme: dark;\n  }\n\n  * { box-sizing: border-box; }\n  body{\n    background: var(--bg);\n    color: var(--ink);\n    font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif;\n    line-height: 1.55;\n    padding: 24px 16px 48px;\n  }\n  h1,h2,h3{ font-family: 'Do Hyeon','Noto Sans KR',sans-serif; text-wrap: balance; letter-spacing: 0.01em; margin: 0; }\n  .mono{ font-family: 'IBM Plex Mono', 'SFMono-Regular', monospace; }\n\n  .wrap{ max-width: 640px; margin: 0 auto; }\n\n  header.top{ display:flex; flex-direction:column; gap:10px; margin-bottom: 18px; }\n  .eyebrow{ font-size:.78rem; letter-spacing:.08em; color: var(--muted); text-transform:uppercase; }\n  .top h1{ font-size: clamp(1.6rem, 5vw, 2.1rem); }\n  .top .sub{ color: var(--muted); font-size: .95rem; }\n\n  .progress{ display:flex; align-items:center; gap:6px; margin: 6px 0 2px; }\n  .progress .dot{ width:9px; height:9px; border-radius:50%; background: var(--surface-2); flex:none; }\n  .progress .dot.done{ background: var(--accent); }\n  .progress .dot.active{ background: var(--accent); box-shadow: 0 0 0 3px var(--ring); }\n  .progress .label{ margin-left:8px; font-size:.82rem; color: var(--muted); }\n\n  .panel{\n    background: var(--surface);\n    border-radius: 18px;\n    padding: 22px 20px;\n    box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(20,24,34,.06);\n    border: 1px solid var(--surface-2);\n  }\n  .panel + .panel{ margin-top: 14px; }\n\n  p{ margin: 0 0 12px; }\n  p:last-child{ margin-bottom: 0; }\n\n  .btnrow{ display:flex; gap:10px; flex-wrap:wrap; margin-top: 16px; }\n  button{\n    font: inherit;\n    font-weight: 700;\n    border: none;\n    border-radius: 12px;\n    padding: 12px 18px;\n    cursor: pointer;\n    transition: transform .08s ease, filter .15s ease;\n  }\n  button:active{ transform: translateY(1px); }\n  button.primary{ background: var(--accent); color: var(--accent-ink); }\n  button.primary:hover{ filter: brightness(1.06); }\n  button.ghost{ background: var(--surface-2); color: var(--ink); }\n  button.ghost:hover{ filter: brightness(0.97); }\n  button.swap{ background: var(--highlight); color: var(--highlight-ink); }\n  button.keep{ background: var(--surface-2); color: var(--ink); }\n  button:disabled{ opacity:.5; cursor: default; }\n\n  details.teacher{ margin-bottom: 14px; }\n  details.teacher summary{\n    cursor:pointer; font-size:.85rem; color: var(--muted); font-weight:600;\n    padding: 8px 2px;\n  }\n  details.teacher table{ width:100%; border-collapse: collapse; font-size:.85rem; margin-top:8px; }\n  details.teacher td{ padding:6px 8px; border-bottom:1px solid var(--surface-2); vertical-align: top; }\n  details.teacher td:first-child{ color: var(--muted); white-space:nowrap; width: 30%; }\n  details.teacher .levels{ display:flex; flex-direction:column; gap:6px; margin-top:6px; }\n  details.teacher .levels div{ font-size:.85rem; }\n  details.teacher .levels b{ color: var(--accent); }\n\n  .cards{\n    display:grid; grid-template-columns: repeat(6, 1fr); gap:8px;\n    margin: 16px 0;\n  }\n  @media (max-width: 480px){ .cards{ grid-template-columns: repeat(3, 1fr); } }\n  .card{\n    background: var(--card-bg);\n    border: 2px solid var(--card-border);\n    border-radius: 12px;\n    padding: 14px 4px;\n    text-align:center;\n    font-size: 1.35rem;\n    font-weight: 600;\n    transition: border-color .2s, background .2s, transform .2s;\n  }\n  .card.active{ border-color: var(--highlight); box-shadow: 0 0 0 4px var(--ring); transform: translateY(-2px); }\n  .card.bad{ border-color: var(--danger); background: color-mix(in srgb, var(--danger) 10%, var(--card-bg)); }\n  .card.flash{ background: color-mix(in srgb, var(--highlight) 25%, var(--card-bg)); }\n\n  .rule{\n    display:inline-block; font-size:.85rem; color: var(--muted);\n    background: var(--surface-2); border-radius: 8px; padding: 6px 10px; margin-bottom: 4px;\n  }\n\n  .status{ display:flex; gap:8px; align-items:center; font-weight:700; margin-bottom: 6px; }\n  .status.ok{ color: var(--success); }\n  .status.warn{ color: var(--warn); }\n  .status.bad{ color: var(--danger); }\n\n  textarea{\n    width:100%; font: inherit; font-size: .95rem; color: var(--ink);\n    background: var(--surface-2); border: 1px solid var(--card-border);\n    border-radius: 10px; padding: 12px; resize: vertical; min-height: 74px;\n  }\n  textarea::placeholder{ color: var(--muted); }\n  label.field{ display:block; font-weight:700; margin: 14px 0 6px; }\n  label.field:first-of-type{ margin-top: 0; }\n  .count{ text-align:right; font-size:.78rem; color: var(--muted); margin-top:4px; }\n\n  .stat{ display:flex; gap:18px; flex-wrap:wrap; margin: 10px 0 0; }\n  .stat div{ font-size:.85rem; color: var(--muted); }\n  .stat b{ display:block; font-size:1.25rem; color: var(--ink); font-family:'IBM Plex Mono',monospace; }\n\n  .summary-block{ border-top: 1px dashed var(--card-border); padding-top: 12px; margin-top: 12px; }\n  .summary-block h3{ font-size: 1rem; margin-bottom: 6px; }\n  .summary-block p{ font-size: .92rem; }\n  .arrowline{ color: var(--muted); font-size:.85rem; margin: 4px 0 12px; }\n\n  [hidden]{ display:none !important; }\n\u003c/style>\n\n\n\n\u003cdiv class=\"wrap\">\n  \u003cheader class=\"top\">\n    \u003cdiv class=\"eyebrow\">정렬을 배우기 전에 먼저 해보는 활동 · 약 15~20분\u003c/div>\n    \u003ch1>몇 번을 봐야 끝날까?\u003c/h1>\n    \u003cdiv class=\"sub\">로봇에게 카드 정리 명령을 내려봐요. 로봇은 시키는 대로만 움직이고, 딱 한 번만 훑어보고는 \"다 됐다!\"고 말해버리는데, 정말 그럴까요?\u003c/div>\n    \u003cdiv class=\"progress\" id=\"progress\">\u003c/div>\n  \u003c/header>\n\n  \u003cdetails class=\"teacher\" id=\"teacherInfo\">\n    \u003csummary>교사용 활동 정보 보기\u003c/summary>\n    \u003ctable>\n      \u003ctr>\u003ctd>교과 / 영역\u003c/td>\u003ctd>정보 · 알고리즘과 프로그래밍\u003c/td>\u003c/tr>\n      \u003ctr>\u003ctd>성취기준\u003c/td>\u003ctd>[9정03-03] 알고리즘의 중요성을 이해하고, 문제를 해결하는 다양한 알고리즘을 비교·분석한다.\u003cbr>[9정03-02] 문제 해결을 위한 추상화의 중요성을 이해하고, 핵심요소를 중심으로 알고리즘을 표현한다. (관련)\u003c/td>\u003c/tr>\n      \u003ctr>\u003ctd>활동 목적\u003c/td>\u003ctd>정렬 알고리즘(버블 정렬형 반복 비교)을 정식으로 배우기 전, 학생이 \"한 번의 훑어보기로는 부족하다\"는 필요성을 직접 조작하며 스스로 발견하게 하는 도입 활동지. 개념어(버블 정렬 등)는 사용하지 않음.\u003c/td>\u003c/tr>\n      \u003ctr>\u003ctd>성취수준(안)\u003c/td>\u003ctd>\n        \u003cdiv class=\"levels\">\n          \u003cdiv>\u003cb>상\u003c/b> — 반복해야 완전히 정렬됨을 스스로 확인하고, 한 번의 훑어보기가 부족한 이유를 자신의 말로 설명하며, 궁금한 점을 구체적인 질문으로 표현한다.\u003c/div>\n          \u003cdiv>\u003cb>중\u003c/b> — 반복 활동으로 정렬을 완성하고, 한 번의 훑어보기만으로는 부족했음을 설명한다.\u003c/div>\n          \u003cdiv>\u003cb>하\u003c/b> — 안내에 따라 카드 비교 활동에 참여하고, 정렬이 아직 되지 않은 상태를 확인한다.\u003c/div>\n        \u003c/div>\n        \u003cdiv style=\"margin-top:6px; color:var(--muted); font-size:.8rem;\">※ 학교 자체 성취수준표 초안이며, 실제 반영 전 교육청·학교 기준과 대조를 권장합니다.\u003c/div>\n      \u003c/td>\u003c/tr>\n      \u003ctr>\u003ctd>이후 연결\u003c/td>\u003ctd>이 활동 이후 정식 정렬 알고리즘(비교·교환 반복) 수업으로 이어집니다. 학생이 적은 \"예상 질문\"을 다음 수업 도입에 활용할 수 있습니다.\u003c/td>\u003c/tr>\n    \u003c/table>\n  \u003c/details>\n\n  \u003c!-- SCREEN 0: intro -->\n  \u003csection class=\"panel screen\" id=\"s0\">\n    \u003cp>\u003cstrong>여섯 장의 숫자 카드\u003c/strong>가 뒤섞여 있어요. 정렬 로봇을 하나 데려왔는데, 이 로봇은 사실 아무것도 스스로 판단하지 못해요. 무엇을 비교하고 바꿀지는 전부 \u003cstrong>내가 직접\u003c/strong> \"바꿔요 / 그대로 둬요\"로 명령해야 해요 — 로봇은 그냥 시키는 대로만 움직이는 손발일 뿐이에요.\u003c/p>\n    \u003cp class=\"rule\">규칙: 이웃한 두 카드를 볼 때마다, 작은 수가 항상 왼쪽에 오도록 명령해 주세요.\u003c/p>\n    \u003cp>다만 로봇은 \u003cstrong>왼쪽부터 이웃한 카드끼리 딱 한 바퀴\u003c/strong>만 돌면 알아서 \"완료!\"를 선언해버려요. 명령은 내가 다 내렸는데, 정말 한 바퀴로 충분할까요?\u003c/p>\n    \u003cdiv class=\"btnrow\">\u003cbutton class=\"primary\" onclick=\"App.goto(1)\">내가 직접 명령 내리기\u003c/button>\u003c/div>\n  \u003c/section>\n\n  \u003c!-- SCREEN 1: pass 1 -->\n  \u003csection class=\"panel screen\" id=\"s1\" hidden>\n    \u003ch2>1. 로봇에게 명령하기 — 첫 바퀴\u003c/h2>\n    \u003cp class=\"rule\">규칙: 작은 수가 항상 왼쪽에 오도록\u003c/p>\n    \u003cdiv class=\"cards\" id=\"cards1\">\u003c/div>\n    \u003cdiv class=\"arrowline\" id=\"pairInfo1\">\u003c/div>\n    \u003cdiv class=\"btnrow\">\n      \u003cbutton class=\"swap\" onclick=\"App.decide(true)\">바꿔요\u003c/button>\n      \u003cbutton class=\"keep\" onclick=\"App.decide(false)\">그대로 둬요\u003c/button>\n    \u003c/div>\n    \u003cdiv class=\"stat\">\n      \u003cdiv>지금까지 비교\u003cb class=\"mono\" id=\"cmp1\">0\u003c/b>\u003c/div>\n      \u003cdiv>지금까지 교환\u003cb class=\"mono\" id=\"swp1\">0\u003c/b>\u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003c!-- SCREEN 2: check after pass 1 -->\n  \u003csection class=\"panel screen\" id=\"s2\" hidden>\n    \u003ch2>2. 확인하기\u003c/h2>\n    \u003cp class=\"status warn\" id=\"declareLine\">로봇: \"한 바퀴 다 돌았어요. 완료! ✔\"\u003c/p>\n    \u003cdiv class=\"cards\" id=\"cards2\">\u003c/div>\n    \u003cp id=\"checkText\">\u003c/p>\n    \u003cdiv class=\"btnrow\">\u003cbutton class=\"primary\" onclick=\"App.goto(3)\">왜 이랬을지 예상해보기\u003c/button>\u003c/div>\n  \u003c/section>\n\n  \u003c!-- SCREEN 3: predict -->\n  \u003csection class=\"panel screen\" id=\"s3\" hidden>\n    \u003ch2>3. 예상해보기\u003c/h2>\n    \u003cp>로봇이 왜 실패했을지, 완전히 정렬하려면 무엇을 더 시켜야 할지 짧게 적어보세요.\u003c/p>\n    \u003ctextarea id=\"predictInput\" maxlength=\"200\" placeholder=\"예: 딱 한 바퀴로는 뒤쪽 카드가 앞으로 못 와서...\">\u003c/textarea>\n    \u003cdiv class=\"count\">\u003cspan id=\"predictCount\">0\u003c/span>/200\u003c/div>\n    \u003cdiv class=\"btnrow\">\u003cbutton class=\"primary\" id=\"predictBtn\" onclick=\"App.submitPredict()\" disabled>다시 탐구하러 가기\u003c/button>\u003c/div>\n  \u003c/section>\n\n  \u003c!-- SCREEN 4: repeat passes -->\n  \u003csection class=\"panel screen\" id=\"s4\" hidden>\n    \u003ch2>4. 다시 탐구하기 — \u003cspan id=\"passLabel\">2\u003c/span>바퀴째\u003c/h2>\n    \u003cp class=\"rule\">규칙: 작은 수가 항상 왼쪽에 오도록\u003c/p>\n    \u003cdiv class=\"cards\" id=\"cards4\">\u003c/div>\n    \u003cdiv class=\"arrowline\" id=\"pairInfo4\">\u003c/div>\n    \u003cdiv class=\"btnrow\" id=\"decideRow4\">\n      \u003cbutton class=\"swap\" onclick=\"App.decide(true)\">바꿔요\u003c/button>\n      \u003cbutton class=\"keep\" onclick=\"App.decide(false)\">그대로 둬요\u003c/button>\n    \u003c/div>\n    \u003cdiv class=\"btnrow\" id=\"nextPassRow\" hidden>\n      \u003cbutton class=\"primary\" onclick=\"App.nextPass()\">다음 훑기 시작하기\u003c/button>\n    \u003c/div>\n    \u003cdiv class=\"btnrow\" id=\"doneRow\" hidden>\n      \u003cbutton class=\"primary\" onclick=\"App.goto(5)\">성찰하러 가기\u003c/button>\n    \u003c/div>\n    \u003cp id=\"passResultText\">\u003c/p>\n    \u003cdiv class=\"stat\">\n      \u003cdiv>총 비교\u003cb class=\"mono\" id=\"cmp4\">0\u003c/b>\u003c/div>\n      \u003cdiv>총 교환\u003cb class=\"mono\" id=\"swp4\">0\u003c/b>\u003c/div>\n      \u003cdiv>완료한 바퀴\u003cb class=\"mono\" id=\"passCount4\">1\u003c/b>\u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003c!-- SCREEN 5: reflect -->\n  \u003csection class=\"panel screen\" id=\"s5\" hidden>\n    \u003ch2>5. 느낀 점 &amp; 궁금한 점 적기\u003c/h2>\n    \u003clabel class=\"field\" for=\"feelInput\">오늘 활동에서 느낀 점을 적어보세요.\u003c/label>\n    \u003ctextarea id=\"feelInput\" maxlength=\"200\" placeholder=\"예: 로봇이 성급하게 '완료'라고 해서 조금 놀랐어요. 한 번에 끝날 줄 알았는데 아니었어요.\">\u003c/textarea>\n    \u003cdiv class=\"count\">\u003cspan id=\"feelCount\">0\u003c/span>/200\u003c/div>\n\n    \u003clabel class=\"field\" for=\"questionInput\">정렬에 대해 궁금한 점(예상 질문)을 적어보세요.\u003c/label>\n    \u003ctextarea id=\"questionInput\" maxlength=\"200\" placeholder=\"예: 카드가 100장이면 몇 바퀴나 돌려야 할까? 더 빨리 정렬하는 방법도 있을까?\">\u003c/textarea>\n    \u003cdiv class=\"count\">\u003cspan id=\"questionCount\">0\u003c/span>/200\u003c/div>\n\n    \u003cdiv class=\"btnrow\">\u003cbutton class=\"primary\" id=\"reflectBtn\" onclick=\"App.submitReflect()\" disabled>기록 완료하기\u003c/button>\u003c/div>\n  \u003c/section>\n\n  \u003c!-- SCREEN 6: done -->\n  \u003csection class=\"panel screen\" id=\"s6\" hidden>\n    \u003ch2>오늘의 탐구, 이렇게 진행했어요\u003c/h2>\n    \u003cdiv id=\"finalSummary\">\u003c/div>\n    \u003cdiv class=\"btnrow\">\n      \u003cbutton class=\"primary\" onclick=\"App.copyRecord()\">기록 복사하기\u003c/button>\n      \u003cbutton class=\"ghost\" onclick=\"App.restart()\">다시 해보기\u003c/button>\n    \u003c/div>\n    \u003cp style=\"margin-top:14px; color:var(--muted); font-size:.9rem;\">다음 시간에는 이 로봇이 따랐던 규칙에 이름이 있다는 것과, 그 규칙(정렬 알고리즘)을 정식으로 배워볼 거예요.\u003c/p>\n  \u003c/section>\n\u003c/div>\n\n\u003cscript>\ndocument.documentElement.lang = 'ko';\n\nconst App = (function(){\n  const START = [63, 8, 41, 29, 56, 17];\n  const STEP_LABELS = ['소개','명령 내리기','확인하기','예상하기','다시 탐구하기','느낀점·질문','완료'];\n\n  let state = {\n    screen: 0,\n    current: START.slice(),\n    pairIndex: 0,\n    passNumber: 1,\n    passSwaps: 0,\n    totalComparisons: 0,\n    totalSwaps: 0,\n    completedPasses: 0,\n    firstPassSnapshot: null,\n    predictText: '',\n    feelText: '',\n    questionText: ''\n  };\n\n  function isSorted(arr){\n    for(let i=0;i\u003carr.length-1;i++){ if(arr[i] > arr[i+1]) return false; }\n    return true;\n  }\n\n  function renderProgress(){\n    const el = document.getElementById('progress');\n    el.innerHTML = '';\n    for(let i=0;i\u003c7;i++){\n      const d = document.createElement('div');\n      d.className = 'dot' + (i \u003c state.screen ? ' done' : '') + (i === state.screen ? ' active' : '');\n      el.appendChild(d);\n    }\n    const label = document.createElement('span');\n    label.className = 'label';\n    label.textContent = (state.screen+1) + '/7 · ' + STEP_LABELS[state.screen];\n    el.appendChild(label);\n  }\n\n  function showScreen(n){\n    for(let i=0;i\u003c7;i++){\n      document.getElementById('s'+i).hidden = (i !== n);\n    }\n    state.screen = n;\n    renderProgress();\n  }\n\n  function goto(n){\n    if(n === 1){ renderPassScreen('cards1','pairInfo1'); updateStats1(); }\n    if(n === 4){ renderPassScreen('cards4','pairInfo4'); }\n    showScreen(n);\n    window.scrollTo({top:0, behavior:'smooth'});\n  }\n\n  function renderPassScreen(cardsId, pairInfoId, badIdx){\n    const wrap = document.getElementById(cardsId);\n    wrap.innerHTML = '';\n    state.current.forEach((v, i) => {\n      const c = document.createElement('div');\n      c.className = 'card mono';\n      if(!badIdx && (i === state.pairIndex || i === state.pairIndex+1) && state.pairIndex \u003c 5){\n        c.className += ' active';\n      }\n      if(badIdx && badIdx.includes(i)) c.className += ' bad';\n      c.textContent = v;\n      wrap.appendChild(c);\n    });\n    const info = document.getElementById(pairInfoId);\n    if(info){\n      if(state.pairIndex \u003c 5){\n        info.textContent = (state.pairIndex+1) + ' / 5번째 비교 — 강조된 두 카드 중 어느 것이 왼쪽에 와야 할까요?';\n      } else {\n        info.textContent = '';\n      }\n    }\n  }\n\n  function updateStats1(){\n    document.getElementById('cmp1').textContent = state.totalComparisons;\n    document.getElementById('swp1').textContent = state.totalSwaps;\n  }\n\n  function decide(swap){\n    if(state.pairIndex >= 5) return;\n    const i = state.pairIndex;\n    if(swap){\n      const tmp = state.current[i];\n      state.current[i] = state.current[i+1];\n      state.current[i+1] = tmp;\n      state.totalSwaps++;\n      state.passSwaps++;\n    }\n    state.totalComparisons++;\n    state.pairIndex++;\n\n    if(state.screen === 1){\n      renderPassScreen('cards1','pairInfo1');\n      updateStats1();\n      if(state.pairIndex >= 5){\n        finishFirstPass();\n      }\n    } else if(state.screen === 4){\n      renderPassScreen('cards4','pairInfo4');\n      updateStats4();\n      if(state.pairIndex >= 5){\n        finishRepeatPass();\n      }\n    }\n  }\n\n  function finishFirstPass(){\n    state.completedPasses = 1;\n    state.firstPassSnapshot = state.current.slice();\n    const sorted = isSorted(state.current);\n    const badIdx = [];\n    for(let i=0;i\u003cstate.current.length-1;i++){ if(state.current[i] > state.current[i+1]){ badIdx.push(i); badIdx.push(i+1); } }\n\n    setTimeout(() => {\n      renderPassScreen('cards2', null, sorted ? null : badIdx);\n      const declareLine = document.getElementById('declareLine');\n      const checkText = document.getElementById('checkText');\n      if(sorted){\n        declareLine.className = 'status ok';\n        declareLine.textContent = '로봇: \"한 바퀴 다 돌았어요. 완료! ✔\" — 확인해보니 이번엔 맞았어요!';\n        checkText.textContent = '이번엔 한 바퀴로 정렬이 끝났어요. 그런데 정말 어떤 순서에서도 항상 한 바퀴면 충분할까요? 다음 화면에서 더 확인해봐요.';\n      } else {\n        declareLine.className = 'status warn';\n        declareLine.textContent = '로봇: \"한 바퀴 다 돌았어요. 완료! ✔\"';\n        checkText.textContent = '그런데 빨간색으로 표시된 카드들을 보세요 — 아직 작은 수가 오른쪽에 있는 곳이 남아있어요. 로봇은 딱 한 바퀴만 보고 성급하게 \"완료\"를 선언한 거예요.';\n      }\n      goto(2);\n    }, 120);\n  }\n\n  function updateStats4(){\n    document.getElementById('cmp4').textContent = state.totalComparisons;\n    document.getElementById('swp4').textContent = state.totalSwaps;\n    document.getElementById('passCount4').textContent = state.completedPasses;\n    document.getElementById('passLabel').textContent = state.passNumber;\n  }\n\n  function finishRepeatPass(){\n    state.completedPasses++;\n    const sorted = isSorted(state.current);\n    const badIdx = [];\n    for(let i=0;i\u003cstate.current.length-1;i++){ if(state.current[i] > state.current[i+1]){ badIdx.push(i); badIdx.push(i+1); } }\n\n    setTimeout(() => {\n      renderPassScreen('cards4', null, sorted ? null : badIdx);\n      updateStats4();\n      const resultText = document.getElementById('passResultText');\n      document.getElementById('decideRow4').hidden = true;\n      if(sorted){\n        resultText.innerHTML = '\u003cspan class=\"status ok\">완전히 정렬됐어요!\u003c/span> 총 ' + state.completedPasses + '바퀴, 비교 ' + state.totalComparisons + '번, 교환 ' + state.totalSwaps + '번으로 끝났어요.';\n        document.getElementById('nextPassRow').hidden = true;\n        document.getElementById('doneRow').hidden = false;\n      } else {\n        resultText.innerHTML = '\u003cspan class=\"status bad\">아직이에요.\u003c/span> 빨간 카드가 남아있어요. 한 바퀴 더 돌려볼까요?';\n        document.getElementById('nextPassRow').hidden = false;\n        document.getElementById('doneRow').hidden = true;\n      }\n    }, 120);\n  }\n\n  function nextPass(){\n    state.pairIndex = 0;\n    state.passSwaps = 0;\n    state.passNumber++;\n    document.getElementById('decideRow4').hidden = false;\n    document.getElementById('nextPassRow').hidden = true;\n    document.getElementById('passResultText').textContent = '';\n    renderPassScreen('cards4','pairInfo4');\n    updateStats4();\n  }\n\n  function submitPredict(){\n    state.predictText = document.getElementById('predictInput').value.trim();\n    state.pairIndex = 0;\n    state.passSwaps = 0;\n    state.passNumber = 2;\n    document.getElementById('decideRow4').hidden = false;\n    document.getElementById('nextPassRow').hidden = true;\n    document.getElementById('doneRow').hidden = true;\n    document.getElementById('passResultText').textContent = '';\n    goto(4);\n  }\n\n  function submitReflect(){\n    state.feelText = document.getElementById('feelInput').value.trim();\n    state.questionText = document.getElementById('questionInput').value.trim();\n    renderFinalSummary();\n    goto(6);\n  }\n\n  function renderFinalSummary(){\n    const el = document.getElementById('finalSummary');\n    el.innerHTML =\n      '\u003cdiv class=\"summary-block\">\u003ch3>① 처음 순서\u003c/h3>\u003cp class=\"mono\">' + START.join(', ') + '\u003c/p>\u003c/div>' +\n      '\u003cdiv class=\"summary-block\">\u003ch3>② 로봇이 \"완료\"라고 말한 첫 바퀴 결과\u003c/h3>\u003cp class=\"mono\">' + state.firstPassSnapshot.join(', ') + '\u003c/p>\u003c/div>' +\n      '\u003cdiv class=\"summary-block\">\u003ch3>③ 내 예상\u003c/h3>\u003cp>' + escapeHtml(state.predictText || '(작성하지 않음)') + '\u003c/p>\u003c/div>' +\n      '\u003cdiv class=\"summary-block\">\u003ch3>④ 다시 탐구한 결과\u003c/h3>\u003cp>총 ' + state.completedPasses + '바퀴, 비교 ' + state.totalComparisons + '번, 교환 ' + state.totalSwaps + '번으로 완전히 정렬됨.\u003c/p>\u003c/div>' +\n      '\u003cdiv class=\"summary-block\">\u003ch3>⑤ 느낀 점\u003c/h3>\u003cp>' + escapeHtml(state.feelText || '(작성하지 않음)') + '\u003c/p>\u003c/div>' +\n      '\u003cdiv class=\"summary-block\">\u003ch3>⑥ 궁금한 점(예상 질문)\u003c/h3>\u003cp>' + escapeHtml(state.questionText || '(작성하지 않음)') + '\u003c/p>\u003c/div>';\n  }\n\n  function escapeHtml(s){\n    return s.replace(/&/g,'&amp;').replace(/\u003c/g,'&lt;').replace(/>/g,'&gt;');\n  }\n\n  function copyRecord(){\n    const text = '[정렬 사전 탐구 활동 기록]\\n' +\n      '처음 순서: ' + START.join(', ') + '\\n' +\n      '로봇이 완료라 말한 첫 바퀴 결과: ' + state.firstPassSnapshot.join(', ') + '\\n' +\n      '내 예상: ' + (state.predictText || '(작성하지 않음)') + '\\n' +\n      '다시 탐구한 결과: 총 ' + state.completedPasses + '바퀴, 비교 ' + state.totalComparisons + '번, 교환 ' + state.totalSwaps + '번\\n' +\n      '느낀 점: ' + (state.feelText || '(작성하지 않음)') + '\\n' +\n      '궁금한 점(예상 질문): ' + (state.questionText || '(작성하지 않음)');\n    const btn = event.target;\n    const done = () => { const old = btn.textContent; btn.textContent = '복사됐어요!'; setTimeout(()=>{btn.textContent = old;}, 1500); };\n    try{\n      navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));\n    }catch(e){ fallbackCopy(text, done); }\n  }\n\n  function fallbackCopy(text, done){\n    const ta = document.createElement('textarea');\n    ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';\n    document.body.appendChild(ta); ta.select();\n    try{ document.execCommand('copy'); done(); }catch(e){}\n    document.body.removeChild(ta);\n  }\n\n  function restart(){\n    state = {\n      screen: 0, current: START.slice(), pairIndex: 0, passNumber: 1, passSwaps: 0,\n      totalComparisons: 0, totalSwaps: 0, completedPasses: 0, firstPassSnapshot: null,\n      predictText: '', feelText: '', questionText: ''\n    };\n    document.getElementById('predictInput').value = '';\n    document.getElementById('feelInput').value = '';\n    document.getElementById('questionInput').value = '';\n    document.getElementById('predictCount').textContent = '0';\n    document.getElementById('feelCount').textContent = '0';\n    document.getElementById('questionCount').textContent = '0';\n    document.getElementById('predictBtn').disabled = true;\n    document.getElementById('reflectBtn').disabled = true;\n    goto(0);\n  }\n\n  function bindTextareas(){\n    const pairs = [\n      ['predictInput','predictCount','predictBtn'],\n      ['feelInput','feelCount', null],\n      ['questionInput','questionCount', null]\n    ];\n    pairs.forEach(([inputId,countId,btnId]) => {\n      const input = document.getElementById(inputId);\n      const count = document.getElementById(countId);\n      input.addEventListener('input', () => {\n        count.textContent = input.value.length;\n        if(btnId){ document.getElementById(btnId).disabled = input.value.trim().length === 0; }\n        checkReflectReady();\n      });\n    });\n  }\n\n  function checkReflectReady(){\n    const f = document.getElementById('feelInput');\n    const q = document.getElementById('questionInput');\n    if(f && q){\n      document.getElementById('reflectBtn').disabled = !(f.value.trim().length > 0 && q.value.trim().length > 0);\n    }\n  }\n\n  function init(){\n    renderProgress();\n    bindTextareas();\n  }\n\n  return { goto, decide, nextPass, submitPredict, submitReflect, copyRecord, restart, init };\n})();\n\nApp.init();\n\u003c/script>\n\n\u003cscript>document.addEventListener('click',function(e){const a=e.target.closest('a');if(a&&a.getAttribute('href')&&!a.getAttribute('href').startsWith('#'))e.preventDefault();});\u003c/script>\u003c/body>\u003c/html>\n", "grade": "", "school": "중학교", "mode": "온라인", "imported": true, "family": 1}, {"id": "ext-not-just-words", "name": "말로만은 안 통해요", "subject": "정보", "visual": "data", "minutes": 15, "html": "\u003c!doctype html>\u003chtml>\u003chead>\u003cmeta charset=utf8>\u003cmeta name=viewport content=\"width=device-width,initial-scale=1,viewport-fit=cover\">\u003cstyle>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}\u003c/style>\u003c/head>\u003cbody>\n\u003ctitle>말로만은 안 통해요\u003c/title>\n\n\n\u003cstyle>\n  :root{\n    --bg:#FBF7F0;\n    --surface:#FFFFFF;\n    --surface-2:#F3ECDE;\n    --border:#E4D9C5;\n    --text:#221D17;\n    --text-dim:#7A7266;\n    --accent:#0E7C86;\n    --accent-ink:#FFFFFF;\n    --accent-2:#E1603C;\n    --success:#25874F;\n    --success-bg:#E3F4E9;\n    --success-border:#B7E1C4;\n    --fail:#C6402F;\n    --fail-bg:#FBE8E4;\n    --fail-border:#F0C3B9;\n    --shadow:rgba(34,29,23,0.10);\n    color-scheme: light;\n  }\n  @media (prefers-color-scheme: dark){\n    :root:not([data-theme=\"light\"]){\n      --bg:#14181A;\n      --surface:#1D2325;\n      --surface-2:#252B2C;\n      --border:#363C3C;\n      --text:#EEEAE2;\n      --text-dim:#A6A099;\n      --accent:#54D2C9;\n      --accent-ink:#0B2422;\n      --accent-2:#F0937C;\n      --success:#67CE8E;\n      --success-bg:#1B3327;\n      --success-border:#2C5B3E;\n      --fail:#F0897C;\n      --fail-bg:#3B211D;\n      --fail-border:#663B33;\n      --shadow:rgba(0,0,0,0.5);\n      color-scheme: dark;\n    }\n  }\n  :root[data-theme=\"dark\"]{\n    --bg:#14181A;\n    --surface:#1D2325;\n    --surface-2:#252B2C;\n    --border:#363C3C;\n    --text:#EEEAE2;\n    --text-dim:#A6A099;\n    --accent:#54D2C9;\n    --accent-ink:#0B2422;\n    --accent-2:#F0937C;\n    --success:#67CE8E;\n    --success-bg:#1B3327;\n    --success-border:#2C5B3E;\n    --fail:#F0897C;\n    --fail-bg:#3B211D;\n    --fail-border:#663B33;\n    --shadow:rgba(0,0,0,0.5);\n    color-scheme: dark;\n  }\n\n  *{box-sizing:border-box;}\n  body{\n    background:\n      radial-gradient(var(--border) 1px, transparent 1px) 0 0/22px 22px,\n      var(--bg);\n    color:var(--text);\n    font-family:'Noto Sans KR', -apple-system, sans-serif;\n    padding-inline:16px;\n    padding-block:28px;\n    display:flex;\n    justify-content:center;\n  }\n  .stage{\n    width:100%;\n    max-width:480px;\n  }\n  h1,h2,h3{\n    font-family:'Noto Serif KR', serif;\n    font-weight:900;\n    letter-spacing:-0.01em;\n    text-wrap:balance;\n    margin:0;\n  }\n  .mono{font-family:'IBM Plex Mono', monospace;}\n\n  /* progress rail */\n  .rail{\n    display:flex;\n    align-items:center;\n    gap:6px;\n    margin-bottom:18px;\n  }\n  .rail .dot{\n    flex:1;\n    height:5px;\n    border-radius:99px;\n    background:var(--border);\n    position:relative;\n    overflow:hidden;\n  }\n  .rail .dot.done{background:var(--accent);}\n  .rail .dot.now{background:var(--border);}\n  .rail .dot.now::after{\n    content:'';\n    position:absolute; inset:0;\n    background:var(--accent);\n    animation:pulse 1.6s ease-in-out infinite;\n  }\n  @keyframes pulse{\n    0%,100%{opacity:.35;} 50%{opacity:1;}\n  }\n  .stepline{\n    display:flex; justify-content:space-between; align-items:baseline;\n    margin-bottom:14px;\n  }\n  .stepline .label{\n    font-size:12px; letter-spacing:.06em; color:var(--text-dim); font-weight:700;\n  }\n  .stepline .back{\n    font-size:12px; color:var(--accent); background:none; border:none; cursor:pointer;\n    padding:4px 2px; font-family:inherit;\n  }\n  .stepline .back:focus-visible{outline:2px solid var(--accent); border-radius:4px;}\n\n  .card{\n    background:var(--surface);\n    border:1px solid var(--border);\n    border-radius:20px;\n    padding:26px 22px;\n    box-shadow:0 10px 30px -12px var(--shadow);\n  }\n  .screen{animation:rise .45s ease both;}\n  @keyframes rise{\n    from{opacity:0; transform:translateY(10px);}\n    to{opacity:1; transform:translateY(0);}\n  }\n  @media (prefers-reduced-motion: reduce){\n    .screen{animation:none;}\n    .rail .dot.now::after{animation:none; opacity:.7;}\n  }\n\n  p{line-height:1.62; margin:0 0 14px;}\n  .lede{font-size:15px; color:var(--text-dim);}\n\n  .btn{\n    width:100%;\n    padding:14px 18px;\n    border-radius:14px;\n    border:none;\n    font-family:inherit;\n    font-weight:700;\n    font-size:15px;\n    cursor:pointer;\n    transition:transform .15s ease, opacity .15s ease;\n  }\n  .btn:active{transform:scale(.98);}\n  .btn:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}\n  .btn-primary{background:var(--accent); color:var(--accent-ink);}\n  .btn-primary:disabled{opacity:.4; cursor:not-allowed;}\n  .btn-ghost{background:var(--surface-2); color:var(--text); border:1px solid var(--border);}\n  .btn-row{display:flex; gap:10px; margin-top:16px;}\n  .btn-row .btn{flex:1;}\n\n  textarea, .charbox{\n    width:100%;\n    border:1px solid var(--border);\n    background:var(--surface-2);\n    color:var(--text);\n    border-radius:12px;\n    padding:12px 14px;\n    font-family:inherit;\n    font-size:14.5px;\n    resize:none;\n    line-height:1.5;\n  }\n  textarea:focus-visible{outline:2px solid var(--accent);}\n  .counter{\n    text-align:right; font-size:12px; color:var(--text-dim); margin-top:6px;\n  }\n  .counter.over{color:var(--fail);}\n\n  .goal-box{\n    background:var(--surface-2);\n    border-left:3px solid var(--accent);\n    border-radius:10px;\n    padding:14px 16px;\n    margin:16px 0 20px;\n  }\n  .goal-box .goal-label{\n    font-size:11px; font-weight:700; letter-spacing:.04em; color:var(--accent); margin-bottom:6px;\n  }\n  .goal-box ol{margin:0; padding-left:18px;}\n  .goal-box li{font-size:13.5px; line-height:1.55; margin-bottom:4px;}\n  .goal-box li:last-child{margin-bottom:0;}\n\n  .target-card{\n    background:var(--surface-2);\n    border:1px dashed var(--border);\n    border-radius:16px;\n    padding:20px;\n    text-align:center;\n    margin-bottom:16px;\n  }\n  .target-emoji{font-size:52px; line-height:1;}\n  .target-name{font-family:'Noto Serif KR',serif; font-weight:900; font-size:20px; margin-top:8px;}\n  .target-tag{font-size:11.5px; color:var(--text-dim); margin-top:4px;}\n\n  .result-box{\n    border-radius:14px;\n    padding:16px;\n    margin:14px 0;\n    border:1px solid;\n    display:flex; gap:12px; align-items:flex-start;\n  }\n  .result-box.fail{background:var(--fail-bg); border-color:var(--fail-border); color:var(--fail);}\n  .result-box.success{background:var(--success-bg); border-color:var(--success-border); color:var(--success);}\n  .result-box .rb-emoji{font-size:26px;}\n  .result-box .rb-text{color:var(--text); font-size:14px; line-height:1.55;}\n  .result-box .rb-text b{color:inherit;}\n  .result-tag{\n    display:inline-block; font-size:11px; font-weight:700; padding:2px 8px; border-radius:99px;\n    margin-bottom:4px;\n  }\n  .result-box.fail .result-tag{background:var(--fail); color:#fff;}\n  .result-box.success .result-tag{background:var(--success); color:#fff;}\n\n  .thinking{\n    display:flex; align-items:center; gap:10px; padding:14px 16px;\n    background:var(--surface-2); border-radius:14px; margin:14px 0;\n    font-size:14px; color:var(--text-dim);\n  }\n  .thinking .dots span{\n    display:inline-block; width:5px; height:5px; border-radius:50%; background:var(--text-dim);\n    margin-right:3px; animation:bounce 1s infinite ease-in-out;\n  }\n  .thinking .dots span:nth-child(2){animation-delay:.15s;}\n  .thinking .dots span:nth-child(3){animation-delay:.3s;}\n  @keyframes bounce{0%,80%,100%{transform:translateY(0); opacity:.4;} 40%{transform:translateY(-4px); opacity:1;}}\n\n  .tag-grid{display:flex; flex-wrap:wrap; gap:8px; margin:14px 0 6px;}\n  .tag-chip{\n    font-family:inherit; font-size:13px; font-weight:600;\n    padding:9px 14px; border-radius:99px;\n    border:1px solid var(--border); background:var(--surface-2); color:var(--text);\n    cursor:pointer; transition:background .15s ease, color .15s ease, border-color .15s ease;\n  }\n  .tag-chip:hover:not(:disabled){border-color:var(--accent);}\n  .tag-chip:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}\n  .tag-chip.selected{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}\n  .tag-chip:disabled{opacity:.4; cursor:not-allowed;}\n\n  .compose-strip{margin:16px 0 4px;}\n  .compose-label{font-size:11px; font-weight:700; color:var(--text-dim); letter-spacing:.04em; margin-bottom:7px;}\n  .compose-chips{display:flex; flex-wrap:wrap; gap:6px; min-height:28px;}\n  .compose-chip{\n    font-size:11.5px; font-weight:600; padding:6px 11px; border-radius:99px;\n    background:var(--surface-2); border:1px solid var(--border); color:var(--text-dim);\n    animation:chipIn .25s ease both;\n  }\n  .compose-chip.on{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}\n  @keyframes chipIn{from{opacity:0; transform:scale(.85);} to{opacity:1; transform:scale(1);}}\n\n  .reveal-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(126px,1fr)); gap:10px; margin:14px 0;}\n  .reveal-card{\n    font-family:inherit; text-align:left; cursor:pointer; width:100%;\n    background:var(--surface-2); border:1px solid var(--border); border-radius:14px;\n    padding:12px; transition:border-color .15s ease, box-shadow .15s ease;\n  }\n  .reveal-card:hover{border-color:var(--accent);}\n  .reveal-card:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}\n  .reveal-card.active{border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent);}\n  .rc-top{display:flex; align-items:center; gap:7px;}\n  .rc-icon{font-size:17px;}\n  .rc-title{font-weight:700; font-size:13px; flex:1; color:var(--text);}\n  .rc-pct{font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--text-dim); font-weight:600;}\n  .reveal-card.active .rc-pct{color:var(--accent);}\n  .rc-panel{max-height:0; opacity:0; overflow:hidden; transition:max-height .35s ease, opacity .3s ease, margin-top .35s ease; margin-top:0;}\n  .reveal-card.active .rc-panel{max-height:130px; opacity:1; margin-top:10px;}\n  .rc-panel-inner{display:flex; flex-direction:column; align-items:center; text-align:center; gap:6px; padding-top:8px; border-top:1px dashed var(--border);}\n  .rc-panel-emoji{font-size:24px;}\n  .rc-panel-text{font-size:11px; color:var(--text-dim); line-height:1.4;}\n  .rc-wave{display:flex; align-items:flex-end; gap:3px; height:20px;}\n  .rc-wave span{width:4px; background:var(--accent); border-radius:2px; animation:wave .9s ease-in-out infinite;}\n  .rc-wave span:nth-child(1){height:7px; animation-delay:0s;}\n  .rc-wave span:nth-child(2){height:17px; animation-delay:.15s;}\n  .rc-wave span:nth-child(3){height:11px; animation-delay:.3s;}\n  .rc-wave span:nth-child(4){height:19px; animation-delay:.45s;}\n  @keyframes wave{0%,100%{transform:scaleY(.4);} 50%{transform:scaleY(1);}}\n  .rc-bob{display:inline-block; animation:bob 1.4s ease-in-out infinite;}\n  @keyframes bob{0%,100%{transform:translateY(0) rotate(0deg);} 50%{transform:translateY(-4px) rotate(-4deg);}}\n  @media (prefers-reduced-motion: reduce){\n    .rc-wave span, .rc-bob{animation:none;}\n    .compose-chip{animation:none;}\n  }\n\n  .meter-wrap{margin:16px 0 6px;}\n  .meter-label{display:flex; justify-content:space-between; font-size:12px; color:var(--text-dim); margin-bottom:6px;}\n  .meter-label .val{font-family:'IBM Plex Mono',monospace; color:var(--text); font-weight:600;}\n  .meter{\n    height:10px; border-radius:99px; background:var(--surface-2); border:1px solid var(--border); overflow:hidden;\n  }\n  .meter-fill{\n    height:100%; border-radius:99px;\n    background:linear-gradient(90deg, var(--accent-2), var(--accent));\n    transition:width .4s ease;\n  }\n\n  .history{margin-top:18px;}\n  .history-title{font-size:12px; font-weight:700; color:var(--text-dim); letter-spacing:.04em; margin-bottom:8px;}\n  .h-item{\n    display:flex; justify-content:space-between; gap:10px; align-items:center;\n    padding:9px 12px; border-radius:10px; background:var(--surface-2); border:1px solid var(--border);\n    font-size:12.5px; margin-bottom:6px;\n  }\n  .h-item .h-combo{color:var(--text-dim);}\n  .h-item .h-mark{font-weight:700;}\n  .h-item.ok .h-mark{color:var(--success);}\n  .h-item.no .h-mark{color:var(--fail);}\n\n  .summary-block{\n    border-left:3px solid var(--accent); padding-left:14px; margin-bottom:18px;\n  }\n  .summary-block .sb-num{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--accent); font-weight:600;}\n  .summary-block h3{font-size:15px; margin:2px 0 6px;}\n  .summary-block p{font-size:13.5px; color:var(--text); margin-bottom:0;}\n\n  .badge-row{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px;}\n  .badge{\n    font-size:11.5px; font-weight:700; padding:5px 10px; border-radius:99px;\n    background:var(--surface-2); border:1px solid var(--border); color:var(--text-dim);\n  }\n  .badge.accent{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}\n\n  /* records list (성장기록실) */\n  .rec-card{\n    display:flex; gap:12px; align-items:center;\n    border:1px solid var(--border); border-radius:14px; padding:14px; margin-bottom:10px;\n    background:var(--surface-2); cursor:pointer;\n  }\n  .rec-card:focus-visible{outline:2px solid var(--accent);}\n  .rec-emoji{font-size:26px; width:38px; text-align:center; flex-shrink:0;}\n  .rec-body{flex:1; min-width:0;}\n  .rec-subject{font-size:11px; font-weight:700; color:var(--accent);}\n  .rec-title{font-weight:700; font-size:14px; margin-top:2px;}\n  .rec-meta{font-size:11.5px; color:var(--text-dim); margin-top:2px;}\n  .rec-fresh{font-size:10.5px; font-weight:700; color:var(--accent-2); flex-shrink:0;}\n\n  /* modal */\n  .modal-backdrop{\n    position:fixed; inset:0; background:rgba(0,0,0,.45);\n    display:flex; align-items:center; justify-content:center; padding:20px; z-index:20;\n  }\n  .modal{\n    background:var(--surface); border:1px solid var(--border); border-radius:18px;\n    padding:24px; max-width:360px; width:100%; text-align:center;\n    box-shadow:0 20px 50px -15px var(--shadow);\n  }\n  .modal .m-emoji{font-size:34px; margin-bottom:8px;}\n  .modal h3{font-size:16px; margin-bottom:8px;}\n  .modal p{font-size:13.5px; color:var(--text-dim);}\n\n  [hidden]{display:none!important;}\n\u003c/style>\n\n\u003cdiv class=\"stage\">\n  \u003cdiv id=\"progressWrap\">\n    \u003cdiv class=\"rail\" id=\"rail\">\u003c/div>\n    \u003cdiv class=\"stepline\">\n      \u003cspan class=\"label\" id=\"stepLabel\">STEP 1 / 7\u003c/span>\n      \u003cbutton class=\"back\" id=\"backBtn\" type=\"button\" hidden>← 이전\u003c/button>\n    \u003c/div>\n  \u003c/div>\n\n  \u003cdiv class=\"card\">\n\n    \u003c!-- ① 인트로 -->\n    \u003csection class=\"screen\" id=\"s1\">\n      \u003cspan class=\"badge accent\" style=\"margin-bottom:10px; display:inline-block;\">탐구공방 · 정보\u003c/span>\n      \u003ch1 style=\"font-size:24px; margin-bottom:10px;\">말로만은 안 통해요\u003c/h1>\n      \u003cp class=\"lede\">같은 대상을, 다른 데이터로 표현해 보는 탐구예요. AI 친구에게 무언가를 맞히게 해야 하는데, 처음엔 딱 하나의 방법만 쓸 수 있어요.\u003c/p>\n      \u003cp class=\"lede\">과연 텍스트 하나만으로 충분할까요? 직접 겪어보고 확인해보세요.\u003c/p>\n\n      \u003cdiv class=\"goal-box\">\n        \u003cdiv class=\"goal-label\">오늘의 목표\u003c/div>\n        \u003col>\n          \u003cli>같은 대상도 텍스트·이미지·소리·동작처럼 서로 다른 데이터로 표현할 수 있음을 안다.\u003c/li>\n          \u003cli>전달에 쓰는 데이터의 종류·양이 늘어날수록 의미가 더 정확하게 전달됨을 설명할 수 있다.\u003c/li>\n        \u003c/ol>\n      \u003c/div>\n\n      \u003cbutton class=\"btn btn-primary\" onclick=\"go(2)\">시작하기\u003c/button>\n    \u003c/section>\n\n    \u003c!-- ②(신규) 발견형 도입 -->\n    \u003csection class=\"screen\" id=\"s2\" hidden>\n      \u003ch2 style=\"font-size:18px; margin-bottom:10px;\">첫 번째 시도\u003c/h2>\n      \u003cdiv id=\"s2-reveal-wrap\">\n        \u003cp>당신에게만 카드가 한 장 주어집니다. 눌러서 확인해보세요.\u003c/p>\n        \u003cbutton class=\"btn btn-ghost\" onclick=\"revealCard()\">🎴 카드 확인하기\u003c/button>\n      \u003c/div>\n\n      \u003cdiv id=\"s2-after-reveal\" hidden>\n        \u003cdiv class=\"target-card\">\n          \u003cdiv class=\"target-emoji\" id=\"targetEmoji\">🦒\u003c/div>\n          \u003cdiv class=\"target-name\" id=\"targetName\">기린\u003c/div>\n          \u003cdiv class=\"target-tag\">이 카드는 나만 볼 수 있어요. AI 친구는 아직 몰라요.\u003c/div>\n        \u003c/div>\n\n        \u003cp>이제 \u003cb>텍스트 단서만, 최대 2개\u003c/b> 골라서 AI 친구에게 전달해주세요.\u003c/p>\n        \u003cdiv class=\"tag-grid\" id=\"s2tags\">\n          \u003cbutton type=\"button\" class=\"tag-chip\" data-tag=\"몸집이 크다\" onclick=\"toggleTag(this)\">몸집이 크다\u003c/button>\n          \u003cbutton type=\"button\" class=\"tag-chip\" data-tag=\"네 발로 걷는다\" onclick=\"toggleTag(this)\">네 발로 걷는다\u003c/button>\n          \u003cbutton type=\"button\" class=\"tag-chip\" data-tag=\"풀을 먹는다\" onclick=\"toggleTag(this)\">풀을 먹는다\u003c/button>\n          \u003cbutton type=\"button\" class=\"tag-chip\" data-tag=\"더운 지역에 산다\" onclick=\"toggleTag(this)\">더운 지역에 산다\u003c/button>\n          \u003cbutton type=\"button\" class=\"tag-chip\" data-tag=\"동물원에서 볼 수 있다\" onclick=\"toggleTag(this)\">동물원에서 볼 수 있다\u003c/button>\n        \u003c/div>\n        \u003cdiv class=\"counter\" id=\"s2counter\">0 / 2개 선택\u003c/div>\n\n        \u003cbutton class=\"btn btn-primary\" id=\"s2send\" style=\"margin-top:14px;\" disabled onclick=\"sendGuess2()\">AI 친구에게 보내기\u003c/button>\n\n        \u003cdiv id=\"s2thinking\" class=\"thinking\" hidden>\n          \u003cdiv class=\"dots\">\u003cspan>\u003c/span>\u003cspan>\u003c/span>\u003cspan>\u003c/span>\u003c/div>\n          \u003cspan>AI 친구가 생각하고 있어요…\u003c/span>\n        \u003c/div>\n\n        \u003cdiv id=\"s2result\" hidden>\u003c/div>\n\n        \u003cbutton class=\"btn btn-primary\" id=\"s2next\" style=\"margin-top:14px;\" hidden onclick=\"go(3)\">다음으로\u003c/button>\n      \u003c/div>\n    \u003c/section>\n\n    \u003c!-- ③ 문제 상황 확인 -->\n    \u003csection class=\"screen\" id=\"s3\" hidden>\n      \u003ch2 style=\"font-size:18px; margin-bottom:12px;\">잠깐, 다시 생각해보면\u003c/h2>\n      \u003cp id=\"s3text\" style=\"font-size:15px;\">\u003c/p>\n      \u003cbutton class=\"btn btn-primary\" onclick=\"go(4)\">예상해보러 가기\u003c/button>\n    \u003c/section>\n\n    \u003c!-- ④ 예상 입력 -->\n    \u003csection class=\"screen\" id=\"s4\" hidden>\n      \u003ch2 style=\"font-size:18px; margin-bottom:10px;\">내 예상\u003c/h2>\n      \u003cp class=\"lede\">텍스트 설명 하나만으로는 왜 부족했을까요? 어떻게 하면 AI 친구가 더 잘 알아들을 수 있을지, 3줄 이내로 적어보세요.\u003c/p>\n      \u003ctextarea id=\"s4input\" rows=\"4\" maxlength=\"180\" placeholder=\"예: 글자만으로는 생김새를 정확히 전달하기 어려워서...\" oninput=\"onS4Input()\">\u003c/textarea>\n      \u003cdiv class=\"counter\" id=\"s4counter\">0 / 180자\u003c/div>\n      \u003cbutton class=\"btn btn-primary\" id=\"s4next\" style=\"margin-top:14px;\" disabled onclick=\"go(5)\">탐구하러 가기\u003c/button>\n    \u003c/section>\n\n    \u003c!-- ⑤ 탐구 조작(심화) -->\n    \u003csection class=\"screen\" id=\"s5\" hidden>\n      \u003ch2 style=\"font-size:18px; margin-bottom:6px;\">표현 방법을 늘려보기\u003c/h2>\n      \u003cp class=\"lede\">텍스트 말고 다른 데이터도 함께 보낼 수 있어요. 조합을 바꿔가며 AI 친구가 얼마나 잘 알아듣는지 확인해보세요.\u003c/p>\n\n      \u003cdiv class=\"target-card\">\n        \u003cdiv class=\"target-emoji\" id=\"s5emoji\">🦒\u003c/div>\n        \u003cdiv class=\"target-name\" id=\"s5name\">기린\u003c/div>\n        \u003cdiv class=\"target-tag\">전달할 대상\u003c/div>\n      \u003c/div>\n\n      \u003cp class=\"lede\" style=\"font-size:13px; margin-bottom:0;\">②에서 고른 텍스트 단서는 그대로 포함돼요. 아래 카드를 눌러 표현을 하나씩 추가해보세요.\u003c/p>\n\n      \u003cdiv class=\"compose-strip\">\n        \u003cdiv class=\"compose-label\">지금 보내는 것\u003c/div>\n        \u003cdiv class=\"compose-chips\" id=\"composeChips\">\u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"reveal-grid\">\n        \u003cbutton type=\"button\" class=\"reveal-card\" id=\"cardImage\" onclick=\"toggleReveal('image')\">\n          \u003cdiv class=\"rc-top\">\n            \u003cspan class=\"rc-icon\">🖼️\u003c/span>\n            \u003cspan class=\"rc-title\">이미지\u003c/span>\n            \u003cspan class=\"rc-pct\">+40%\u003c/span>\n          \u003c/div>\n          \u003cdiv class=\"rc-panel\">\n            \u003cdiv class=\"rc-panel-inner\">\n              \u003cspan class=\"rc-panel-emoji\" id=\"panelImageEmoji\">🦒\u003c/span>\n              \u003cspan class=\"rc-panel-text\" id=\"panelImageText\">\u003c/span>\n            \u003c/div>\n          \u003c/div>\n        \u003c/button>\n        \u003cbutton type=\"button\" class=\"reveal-card\" id=\"cardSound\" onclick=\"toggleReveal('sound')\">\n          \u003cdiv class=\"rc-top\">\n            \u003cspan class=\"rc-icon\">🔊\u003c/span>\n            \u003cspan class=\"rc-title\">소리\u003c/span>\n            \u003cspan class=\"rc-pct\">+25%\u003c/span>\n          \u003c/div>\n          \u003cdiv class=\"rc-panel\">\n            \u003cdiv class=\"rc-panel-inner\">\n              \u003cspan class=\"rc-wave\" aria-hidden=\"true\">\u003cspan>\u003c/span>\u003cspan>\u003c/span>\u003cspan>\u003c/span>\u003cspan>\u003c/span>\u003c/span>\n              \u003cspan class=\"rc-panel-text\" id=\"panelSoundText\">\u003c/span>\n            \u003c/div>\n          \u003c/div>\n        \u003c/button>\n        \u003cbutton type=\"button\" class=\"reveal-card\" id=\"cardMotion\" onclick=\"toggleReveal('motion')\">\n          \u003cdiv class=\"rc-top\">\n            \u003cspan class=\"rc-icon\">🕺\u003c/span>\n            \u003cspan class=\"rc-title\">동작\u003c/span>\n            \u003cspan class=\"rc-pct\">+35%\u003c/span>\n          \u003c/div>\n          \u003cdiv class=\"rc-panel\">\n            \u003cdiv class=\"rc-panel-inner\">\n              \u003cspan class=\"rc-panel-emoji rc-bob\" id=\"panelMotionEmoji\">🦒\u003c/span>\n              \u003cspan class=\"rc-panel-text\" id=\"panelMotionText\">\u003c/span>\n            \u003c/div>\n          \u003c/div>\n        \u003c/button>\n      \u003c/div>\n\n      \u003cdiv class=\"meter-wrap\">\n        \u003cdiv class=\"meter-label\">\u003cspan>예상 전달력\u003c/span>\u003cspan class=\"val mono\" id=\"meterVal\">20%\u003c/span>\u003c/div>\n        \u003cdiv class=\"meter\">\u003cdiv class=\"meter-fill\" id=\"meterFill\" style=\"width:20%\">\u003c/div>\u003c/div>\n      \u003c/div>\n\n      \u003cbutton class=\"btn btn-primary\" style=\"margin-top:14px;\" onclick=\"sendGuess5()\">AI 친구에게 다시 보내기\u003c/button>\n\n      \u003cdiv id=\"s5thinking\" class=\"thinking\" hidden>\n        \u003cdiv class=\"dots\">\u003cspan>\u003c/span>\u003cspan>\u003c/span>\u003cspan>\u003c/span>\u003c/div>\n        \u003cspan>AI 친구가 생각하고 있어요…\u003c/span>\n      \u003c/div>\n\n      \u003cdiv id=\"s5result\" hidden>\u003c/div>\n\n      \u003cdiv class=\"history\" id=\"s5history\" hidden>\n        \u003cdiv class=\"history-title\">지금까지의 시도\u003c/div>\n        \u003cdiv id=\"s5historyList\">\u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"btn-row\">\n        \u003cbutton class=\"btn btn-ghost\" onclick=\"reshuffleTarget()\">🔀 다른 카드로 다시 도전\u003c/button>\n        \u003cbutton class=\"btn btn-primary\" id=\"s5next\" disabled onclick=\"go(6)\">기록하러 가기\u003c/button>\n      \u003c/div>\n    \u003c/section>\n\n    \u003c!-- ⑥ 1차 기록 제출 -->\n    \u003csection class=\"screen\" id=\"s6\" hidden>\n      \u003ch2 style=\"font-size:18px; margin-bottom:10px;\">1차 기록 제출\u003c/h2>\n      \u003cp class=\"lede\">실험해보니 알게 된 것을 3줄 이내로 정리해 제출하세요.\u003c/p>\n      \u003ctextarea id=\"s6input\" rows=\"4\" maxlength=\"180\" placeholder=\"예: 데이터의 종류를 늘릴수록 AI가 더 정확하게 알아들었다...\" oninput=\"onS6Input()\">\u003c/textarea>\n      \u003cdiv class=\"counter\" id=\"s6counter\">0 / 180자\u003c/div>\n      \u003cbutton class=\"btn btn-primary\" id=\"s6submit\" style=\"margin-top:14px;\" disabled onclick=\"finishActivity()\">제출하기\u003c/button>\n    \u003c/section>\n\n    \u003c!-- ⑦ 완료 + 한 페이지 기록 -->\n    \u003csection class=\"screen\" id=\"s7\" hidden>\n      \u003cdiv class=\"badge-row\">\n        \u003cspan class=\"badge accent\">정보 · 데이터\u003c/span>\n        \u003cspan class=\"badge\" id=\"s7standard\">[9정02-01]\u003c/span>\n      \u003c/div>\n      \u003ch2 style=\"font-size:19px; margin-bottom:14px;\">오늘의 탐구, 이렇게 진행했어요\u003c/h2>\n\n      \u003cdiv class=\"summary-block\">\n        \u003cdiv class=\"sb-num\">① 처음 시도 결과\u003c/div>\n        \u003ch3>텍스트만으로는 통하지 않았어요\u003c/h3>\n        \u003cp id=\"sum1\">\u003c/p>\n      \u003c/div>\n      \u003cdiv class=\"summary-block\">\n        \u003cdiv class=\"sb-num\">② 내 예상\u003c/div>\n        \u003ch3>이렇게 예상했어요\u003c/h3>\n        \u003cp id=\"sum2\">\u003c/p>\n      \u003c/div>\n      \u003cdiv class=\"summary-block\">\n        \u003cdiv class=\"sb-num\">③ 다시 탐구한 결과\u003c/div>\n        \u003ch3>표현 방법을 늘려가며 확인했어요\u003c/h3>\n        \u003cp id=\"sum3\">\u003c/p>\n      \u003c/div>\n      \u003cdiv class=\"summary-block\">\n        \u003cdiv class=\"sb-num\">④ 알게 된 것\u003c/div>\n        \u003ch3>결론\u003c/h3>\n        \u003cp id=\"sum4\">\u003c/p>\n      \u003c/div>\n\n      \u003cdiv class=\"btn-row\">\n        \u003cbutton class=\"btn btn-ghost\" onclick=\"openRecords()\">📚 성장기록실에서 보기\u003c/button>\n        \u003cbutton class=\"btn btn-primary\" onclick=\"openQuestionRoom()\">질문공방으로 이동\u003c/button>\n      \u003c/div>\n    \u003c/section>\n\n    \u003c!-- 성장기록실 뷰 -->\n    \u003csection class=\"screen\" id=\"sRec\" hidden>\n      \u003cdiv class=\"stepline\" style=\"margin-bottom:14px;\">\n        \u003ch2 style=\"font-size:18px;\">성장기록실\u003c/h2>\n        \u003cbutton class=\"back\" onclick=\"go(7)\">← 돌아가기\u003c/button>\n      \u003c/div>\n      \u003cp class=\"lede\" style=\"margin-bottom:14px;\">교과를 넘나들며 쌓인 나의 탐구 기록이에요.\u003c/p>\n\n      \u003cdiv class=\"rec-card\" tabindex=\"0\" onclick=\"toggleRecDetail()\">\n        \u003cdiv class=\"rec-emoji\">🦒\u003c/div>\n        \u003cdiv class=\"rec-body\">\n          \u003cdiv class=\"rec-subject\">정보 · 데이터\u003c/div>\n          \u003cdiv class=\"rec-title\">말로만은 안 통해요\u003c/div>\n          \u003cdiv class=\"rec-meta\">오늘\u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"rec-fresh\">방금 완료\u003c/div>\n      \u003c/div>\n      \u003cdiv id=\"recDetail\" class=\"card\" style=\"margin:-2px 0 14px; box-shadow:none;\" hidden>\n        \u003cp id=\"recDetailText\" style=\"font-size:13px; margin:0;\">\u003c/p>\n      \u003c/div>\n\n      \u003cdiv class=\"rec-card\">\n        \u003cdiv class=\"rec-emoji\">🌱\u003c/div>\n        \u003cdiv class=\"rec-body\">\n          \u003cdiv class=\"rec-subject\">과학 · 생명\u003c/div>\n          \u003cdiv class=\"rec-title\">광합성 속도, 온도를 바꾸면?\u003c/div>\n          \u003cdiv class=\"rec-meta\">지난주\u003c/div>\n        \u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"rec-card\">\n        \u003cdiv class=\"rec-emoji\">📝\u003c/div>\n        \u003cdiv class=\"rec-body\">\n          \u003cdiv class=\"rec-subject\">국어 · 쓰기\u003c/div>\n          \u003cdiv class=\"rec-title\">이 글의 주장, 근거가 충분할까?\u003c/div>\n          \u003cdiv class=\"rec-meta\">2주 전\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/section>\n\n  \u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"modal-backdrop\" id=\"qModal\" hidden onclick=\"closeModalOnBackdrop(event)\">\n  \u003cdiv class=\"modal\">\n    \u003cdiv class=\"m-emoji\">💬\u003c/div>\n    \u003ch3>질문공방으로 이동할 준비 중이에요\u003c/h3>\n    \u003cp>오늘 알게 된 것을 바탕으로, AI와 대화하며 판단 근거를 더 정교하게 다듬는 공간이에요. (프로토타입에서는 이동이 연결돼 있지 않아요)\u003c/p>\n    \u003cbutton class=\"btn btn-primary\" style=\"margin-top:16px;\" onclick=\"closeModal()\">확인\u003c/button>\n  \u003c/div>\n\u003c/div>\n\n\u003cscript>\n  // 네 동물 모두 \"몸집이 크다 / 네 발로 걷는다 / 풀을 먹는다 / 더운 지역에 산다 / 동물원에서 볼 수 있다\"에\n  // 똑같이 해당함 — 이 중 최대 2개만 전달하면 어떤 조합을 골라도 넷 중 하나로 특정되지 않으므로,\n  // AI 친구가 다른 동물을 잘못 짚는 것이 항상 \"말이 되는\" 오답이 되도록 설계함.\n  var TARGETS = [\n    {emoji:'🦒', name:'기린',\n      imageDesc:'아주 긴 목을 그려서 보여줘요', imageNoun:'긴 목 그림',\n      soundLabel:'음머어~', soundDesc:'낮은 울음소리를 흉내 내요',\n      motionDesc:'목을 쭉 뻗어 나뭇잎을 먹는 몸짓을 해요', motionNoun:'목을 쭉 뻗는 몸짓'},\n    {emoji:'🐘', name:'코끼리',\n      imageDesc:'긴 코와 큰 귀를 그려서 보여줘요', imageNoun:'긴 코 그림',\n      soundLabel:'빠아앙~', soundDesc:'코로 나팔 부는 소리를 흉내 내요',\n      motionDesc:'긴 코를 흔들며 걷는 몸짓을 해요', motionNoun:'코를 흔드는 몸짓'},\n    {emoji:'🐫', name:'낙타',\n      imageDesc:'등에 있는 혹을 그려서 보여줘요', imageNoun:'등 혹 그림',\n      soundLabel:'우으응~', soundDesc:'낮게 우는 소리를 흉내 내요',\n      motionDesc:'뒤뚱뒤뚱 사막을 걷는 몸짓을 해요', motionNoun:'뒤뚱뒤뚱 걷는 몸짓'},\n    {emoji:'🦛', name:'하마',\n      imageDesc:'짧은 다리와 커다란 입을 그려서 보여줘요', imageNoun:'커다란 입 그림',\n      soundLabel:'우워어~', soundDesc:'입을 크게 벌리고 우는 소리를 흉내 내요',\n      motionDesc:'입을 크게 벌리는 몸짓을 해요', motionNoun:'입을 크게 벌리는 몸짓'}\n  ];\n  function pickWrongGuess(excludeIdx){\n    var pool = TARGETS.filter(function(x,i){ return i !== excludeIdx; });\n    return pool[Math.floor(Math.random()*pool.length)];\n  }\n\n  var state = {\n    screen: 1,\n    targetIdx: 0,\n    s2tags: [],\n    s2wrong: null,\n    s4text: '',\n    s5attempts: 0,\n    s5history: [],\n    s5everSucceeded: false,\n    s5firstResultShown: false,\n    s6text: ''\n  };\n\n  function currentTarget(){ return TARGETS[state.targetIdx]; }\n\n  function renderProgress(){\n    var rail = document.getElementById('rail');\n    rail.innerHTML = '';\n    for(var i=1;i\u003c=7;i++){\n      var d = document.createElement('div');\n      d.className = 'dot' + (i \u003c state.screen ? ' done' : (i === state.screen ? ' now' : ''));\n      rail.appendChild(d);\n    }\n    document.getElementById('stepLabel').textContent = 'STEP ' + Math.min(state.screen,7) + ' / 7';\n    document.getElementById('backBtn').hidden = state.screen \u003c= 2 || state.screen > 7;\n  }\n\n  function go(n){\n    for(var i=1;i\u003c=7;i++){\n      var el = document.getElementById('s'+i);\n      if(el) el.hidden = (i !== n);\n    }\n    document.getElementById('sRec').hidden = true;\n    state.screen = n;\n    document.getElementById('progressWrap').hidden = false;\n    renderProgress();\n    if(n === 3){ fillS3(); }\n    if(n === 5){ fillS5Target(); }\n    if(n === 7){ fillS7(); }\n    window.scrollTo({top:0, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'});\n  }\n\n  document.getElementById('backBtn').addEventListener('click', function(){\n    if(state.screen > 2) go(state.screen - 1);\n  });\n\n  // ---- Screen 2 ----\n  function revealCard(){\n    document.getElementById('targetEmoji').textContent = currentTarget().emoji;\n    document.getElementById('targetName').textContent = currentTarget().name;\n    document.getElementById('s2-reveal-wrap').hidden = true;\n    document.getElementById('s2-after-reveal').hidden = false;\n  }\n  var MAX_TAGS = 2;\n  var selectedTags = [];\n  var s5active = {image:false, sound:false, motion:false};\n  function toggleTag(btn){\n    var tag = btn.dataset.tag;\n    var idx = selectedTags.indexOf(tag);\n    if(idx > -1){\n      selectedTags.splice(idx,1);\n      btn.classList.remove('selected');\n    } else {\n      if(selectedTags.length >= MAX_TAGS) return;\n      selectedTags.push(tag);\n      btn.classList.add('selected');\n    }\n    document.getElementById('s2counter').textContent = selectedTags.length + ' / ' + MAX_TAGS + '개 선택';\n    document.getElementById('s2send').disabled = selectedTags.length === 0;\n    updateTagChipStates();\n  }\n  function updateTagChipStates(){\n    var atMax = selectedTags.length >= MAX_TAGS;\n    document.querySelectorAll('#s2tags .tag-chip').forEach(function(c){\n      c.disabled = !c.classList.contains('selected') && atMax;\n    });\n  }\n  function sendGuess2(){\n    state.s2tags = selectedTags.slice();\n    document.getElementById('s2send').disabled = true;\n    document.getElementById('s2thinkin
