}}\n:root{--acc:#e3f2ea;--accd:#2c6545}<\/style><\/head>\n<body data-mode=\"student\"><script>window.WS_TEACHER=false;window.WS_MODE=\"student\";<\/script>\n<nav class=\"ws-tabs\" aria-label=\"보기 방식\"><button data-mode=\"student\">학생 화면<\/button><button data-mode=\"print\">인쇄본<\/button><button data-mode=\"teacher\">교사용 정답<\/button><button id=\"ws-print\" class=\"no-print\" style=\"background:#fff;color:#1f2a44\">인쇄하기<\/button><\/nav>\n<main class=\"page\">\n<header class=\"ws-head\"><div class=\"ws-meta\">중학교 정보 · Ⅲ. 알고리즘과 프로그래밍 › 2. 프로그래밍 › 02 논리 연산 프로그래밍 (교과서 117쪽)<\/div><h1><span class=\"ws-tag\">근거로 판단<\/span>놀이공원 입장료 예측표<\/h1><div class=\"ws-name\">학년<span><\/span>반<span><\/span>번호<span><\/span>이름<span class=\"w\"><\/span><\/div><\/header>\n\n<section class=\"blk b-concept\"><h2><span class=\"n\">①<\/span>오늘의 개념<\/h2><p>그리고(AND)는 두 조건이 <u>모두<\/u> 참일 때만 참, 또는(OR)은 <u>하나라도<\/u> 참이면 참이다.<\/p><\/section>\n<section class=\"blk\"><h2><span class=\"n\">②<\/span>손으로 예측하기 <small>프로그램을 실행하기 전에 표를 먼저 채워요<\/small><\/h2>\n<p style=\"margin:0\">놀이공원 입장료 프로그램의 규칙이에요. 기본 입장료는 <b>10,000원<\/b>이고, 해당하는 할인은 모두 적용돼요.<\/p>\n<ol class=\"rules\"><li>조건 1: 나이가 13세 이상 <b>그리고<\/b> 19세 이하 → 2,000원 할인<\/li><li>조건 2: 나이가 7세 이하 <b>또는<\/b> 65세 이상 → 5,000원 할인<\/li><li>조건 3: 방문 요일이 월~금(평일) → 1,000원 할인<\/li><\/ol>\n<div style=\"overflow-x:auto\"><table class=\"t\"><thead><tr><th>번호<\/th><th>나이<\/th><th>요일<\/th><th>조건 1<br>(AND)<\/th><th>조건 2<br>(OR)<\/th><th>조건 3<\/th><th>입장료<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>15세<\/td><td>토요일<\/td><td><div class=\"tf\" data-k=\"c1-0\" data-ans=\"참\" aria-label=\"1번 조건 1\"><button>참<\/button><button>거짓<\/button><\/div><\/td><td><div class=\"tf\" data-k=\"c2-0\" data-ans=\"거짓\" aria-label=\"1번 조건 2\"><button>참<\/button><button>거짓<\/button><\/div><\/td><td><div class=\"tf\" data-k=\"c3-0\" data-ans=\"거짓\" aria-label=\"1번 조건 3\"><button>참<\/button><button>거짓<\/button><\/div><\/td><td><input class=\"w s\" inputmode=\"numeric\" data-k=\"fee-0\" data-ans=\"8000\" aria-label=\"1번 입장료\"> 원<\/td><\/tr><tr><td>2<\/td><td>6세<\/td><td>수요일<\/td><td><div class=\"tf\" data-k=\"c1-1\" data-ans=\"거짓\" aria-label=\"2번 조건 1\"><button>참<\/button><button>거짓<\/button><\/div><\/td><td><div class=\"tf\" data-k=\"c2-1\" data-ans=\"참\" aria-label=\"2번 조건 2\"><button>참<\/button><button>거짓<\/button><\/div><\/td><td><div class=\"tf\" data-k=\"c3-1\" data-ans=\"참\" aria-label=\"2번 조건 3\"><button>참<\/button><button>거짓<\/button><\/div><\/td><td><input class=\"w s\" inputmode=\"numeric\" data-k=\"fee-1\" data-ans=\"4000\" aria-label=\"2번 입장료\"> 원<\/td><\/tr><tr><td>3<\/td><td>30세<\/td><td>금요일<\/td><td><div class=\"tf\" data-k=\"c1-2\" data-ans=\"거짓\" aria-label=\"3번 조건 1\"><button>참<\/button><button>거짓<\/button><\/div><\/td><td><div class=\"tf\" data-k=\"c2-2\" data-ans=\"거짓\" aria-label=\"3번 조건 2\"><button>참<\/button><button>거짓<\/button><\/div><\/td><td><div class=\"tf\" data-k=\"c3-2\" data-ans=\"참\" aria-label=\"3번 조건 3\"><button>참<\/button><button>거짓<\/button><\/div><\/td><td><input class=\"w s\" inputmode=\"numeric\" data-k=\"fee-2\" data-ans=\"9000\" aria-label=\"3번 입장료\"> 원<\/td><\/tr><tr><td>4<\/td><td>19세<\/td><td>일요일<\/td><td><div class=\"tf\" data-k=\"c1-3\" data-ans=\"참\" aria-label=\"4번 조건 1\"><button>참<\/button><button>거짓<\/button><\/div><\/td><td><div class=\"tf\" data-k=\"c2-3\" data-ans=\"거짓\" aria-label=\"4번 조건 2\"><button>참<\/button><button>거짓<\/button><\/div><\/td><td><div class=\"tf\" data-k=\"c3-3\" data-ans=\"거짓\" aria-label=\"4번 조건 3\"><button>참<\/button><button>거짓<\/button><\/div><\/td><td><input class=\"w s\" inputmode=\"numeric\" data-k=\"fee-3\" data-ans=\"8000\" aria-label=\"4번 입장료\"> 원<\/td><\/tr><tr><td>5<\/td><td>65세<\/td><td>토요일<\/td><td><div class=\"tf\" data-k=\"c1-4\" data-ans=\"거짓\" aria-label=\"5번 조건 1\"><button>참<\/button><button>거짓<\/button><\/div><\/td><td><div class=\"tf\" data-k=\"c2-4\" data-ans=\"참\" aria-label=\"5번 조건 2\"><button>참<\/button><button>거짓<\/button><\/div><\/td><td><div class=\"tf\" data-k=\"c3-4\" data-ans=\"거짓\" aria-label=\"5번 조건 3\"><button>참<\/button><button>거짓<\/button><\/div><\/td><td><input class=\"w s\" inputmode=\"numeric\" data-k=\"fee-4\" data-ans=\"5000\" aria-label=\"5번 입장료\"> 원<\/td><\/tr><tr><td>6<\/td><td>13세<\/td><td>화요일<\/td><td><div class=\"tf\" data-k=\"c1-5\" data-ans=\"참\" aria-label=\"6번 조건 1\"><button>참<\/button><button>거짓<\/button><\/div><\/td><td><div class=\"tf\" data-k=\"c2-5\" data-ans=\"거짓\" aria-label=\"6번 조건 2\"><button>참<\/button><button>거짓<\/button><\/div><\/td><td><div class=\"tf\" data-k=\"c3-5\" data-ans=\"참\" aria-label=\"6번 조건 3\"><button>참<\/button><button>거짓<\/button><\/div><\/td><td><input class=\"w s\" inputmode=\"numeric\" data-k=\"fee-5\" data-ans=\"7000\" aria-label=\"6번 입장료\"> 원<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"acts student-only\"><button class=\"btn p\" id=\"chk1\" type=\"button\">내 예측 채점하기<\/button><\/div><p class=\"fb\" id=\"fb1\" aria-live=\"polite\"><\/p><\/section>\n<section class=\"blk opt\"><h2><span class=\"n\">③<\/span>실행해서 확인하기 <small>선택 · 엔트리 또는 아래 실행기<\/small><\/h2>\n<div class=\"student-only\"><div class=\"frame\">나이 <input class=\"w s\" id=\"runAge\" inputmode=\"numeric\" value=\"15\"> 세, 요일 <select class=\"w\" id=\"runDay\" style=\"width:auto\"><option>월<\/option><option>화<\/option><option>수<\/option><option>목<\/option><option>금<\/option><option>토<\/option><option>일<\/option><\/select> <button class=\"btn\" id=\"run\" type=\"button\">▶ 실행<\/button><\/div><p class=\"fb\" id=\"runOut\" aria-live=\"polite\"><\/p><\/div>\n<p class=\"print-only\" style=\"margin:0\">선생님이 엔트리로 실행한 결과를 보고, 예측과 다른 칸에 ○ 표시하세요. 다른 칸 수: ______개<\/p><\/section>\n<section class=\"blk\"><h2><span class=\"n\">④<\/span>내 말로 설명하기<\/h2>\n<div class=\"frame\">나이가 <input class=\"w\" data-ans=\"15\"> 세이고 요일이 <input class=\"w\" data-ans=\"토\"> 요일이면, 조건 <input class=\"w s\" data-ans=\"1\"> 이(가) 참이 되어 입장료는 <input class=\"w\" data-ans=\"8000\"> 원이다.<\/div>\n<div class=\"frame\" style=\"margin-top:8px\">‘그리고’와 ‘또는’의 차이: <input class=\"w\" style=\"flex:1 1 320px\" data-ans=\"그리고는 둘 다 참이어야, 또는은 하나만 참이어도 참\"><\/div><\/section>\n<section class=\"blk opt\"><h2><span class=\"n\">⑤<\/span>도전 <small>선택<\/small><\/h2><p style=\"margin:0 0 6px\">조건이 바뀌는 ‘경계’의 나이를 넣은 사례 2개를 만들고, 왜 경계값을 꼭 확인해야 하는지 쓰세요.<\/p><textarea class=\"w\" data-ans=\"예) 19세 토요일 → 8,000원 / 20세 토요일 → 10,000원. ‘이하’와 ‘미만’을 헷갈리면 경계에서 결과가 달라지기 때문\"><\/textarea><\/section>\n<aside class=\"hint\"><h3>힌트<\/h3><ol><li>조건 1은 두 조건(13 이상, 19 이하)을 <b>모두<\/b> 확인해야 해요. 13세와 19세도 포함돼요.<\/li><li>할인은 여러 개가 함께 적용돼요. 10,000원에서 참인 조건의 할인을 차례로 빼 보세요.<\/li><\/ol><div class=\"acts student-only\"><button class=\"btn hint-next\" type=\"button\">힌트 1단계씩 보기<\/button><\/div><\/aside>\n<section class=\"blk teacher-only\" aria-label=\"교사용 정답과 해설\"><h2>교사용 · 정답과 지도 포인트<\/h2><table class=\"t\"><thead><tr><th>번호<\/th><th>조건1<\/th><th>조건2<\/th><th>조건3<\/th><th>입장료<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>참<\/td><td>거짓<\/td><td>거짓<\/td><td>8,000원<\/td><\/tr><tr><td>2<\/td><td>거짓<\/td><td>참<\/td><td>참<\/td><td>4,000원<\/td><\/tr><tr><td>3<\/td><td>거짓<\/td><td>거짓<\/td><td>참<\/td><td>9,000원<\/td><\/tr><tr><td>4<\/td><td>참<\/td><td>거짓<\/td><td>거짓<\/td><td>8,000원<\/td><\/tr><tr><td>5<\/td><td>거짓<\/td><td>참<\/td><td>거짓<\/td><td>5,000원<\/td><\/tr><tr><td>6<\/td><td>참<\/td><td>거짓<\/td><td>참<\/td><td>7,000원<\/td><\/tr><\/tbody><\/table><p><b>예상 오답<\/b><\/p><ul><li>19세·13세를 청소년에서 빼는 경우: ‘이상·이하’와 ‘초과·미만’ 혼동 → 경계값을 수직선에 표시해 보게 합니다.<\/li><li>6세 수요일을 5,000원으로 계산: 할인 중복 적용을 놓침 → 조건마다 따로 확인하도록 지도합니다.<\/li><li>65세를 조건 2에서 거짓으로 판단: OR을 AND처럼 읽음 → 두 조건 중 하나만 참이어도 된다는 점을 짚어 줍니다.<\/li><\/ul>\n<p><b>지도 포인트<\/b> 표를 다 채운 뒤에 실행하게 해야 ‘예측 → 확인’ 효과가 생겨요. 다른 칸이 나온 학생에게 “어느 조건을 다르게 봤나요?”를 묻습니다.<\/p><\/section>\n<p class=\"ws-foot\">수업활동 스튜디오 · 활동지 초안 (교사 검토 전) · A4 1장 · 15~20분<\/p>\n<\/main><script>\n(function(){\n  const body=document.body,TEACHER=window.WS_TEACHER;\n  function setMode(m){body.dataset.mode=m;if(m!=='student')document.querySelectorAll('.wrong,.right').forEach(e=>e.classList.remove('wrong','right'));document.querySelectorAll('.fb').forEach(f=>{if(m!=='student')f.textContent=''});document.querySelectorAll('.ws-tabs [data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===m)));\n    if(m==='teacher'){document.querySelectorAll('[data-ans]').forEach(el=>{if(el.matches('input,textarea')){el.dataset.saved=el.value;el.value=el.dataset.ans;el.readOnly=true}else if(el.classList.contains('tf')){el.dataset.saved=el.dataset.v||'';sel(el,el.dataset.ans)}})}\n    else{document.querySelectorAll('[data-ans]').forEach(el=>{if(el.matches('input,textarea')&&el.readOnly){el.value=el.dataset.saved||'';el.readOnly=false}else if(el.classList.contains('tf')&&el.dataset.saved!==undefined){sel(el,el.dataset.saved);delete el.dataset.saved}})}\n  }\n  function sel(tf,v){tf.dataset.v=v||'';tf.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.textContent===v)))}\n  window.WS_sel=sel;\n  document.querySelectorAll('.tf').forEach(tf=>{tf.querySelectorAll('button').forEach(b=>{b.type='button';b.onclick=()=>{if(body.dataset.mode!=='student')return;sel(tf,tf.dataset.v===b.textContent?'':b.textContent);tf.classList.remove('wrong','right')}})});\n  document.querySelectorAll('.hint').forEach(h=>{const items=[...h.querySelectorAll('li')];items.forEach(li=>li.hidden=true);const b=h.querySelector('.hint-next');if(b)b.onclick=()=>{const nx=items.find(li=>li.hidden);if(nx){nx.hidden=false}if(!items.some(li=>li.hidden)){b.disabled=true;b.textContent='힌트를 모두 봤어요'}}});\n  document.querySelectorAll('.ws-tabs [data-mode]').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));\n  const pr=document.getElementById('ws-print');if(pr)pr.onclick=()=>{setMode('print');setTimeout(()=>window.print(),50)};\n  window.addEventListener('message',e=>{if(e.data&&e.data.wsMode){setMode(e.data.wsMode);if(e.data.print)setTimeout(()=>window.print(),80)}});\n  window.WS_mark=(el,ok)=>{el.classList.remove('wrong','right');el.classList.add(ok?'right':'wrong')};\n  window.WS_fb=(id,ok,msg)=>{const f=document.getElementById(id);f.className='fb '+(ok?'ok':'no');f.textContent=msg};\n  setMode(window.WS_MODE||'student');\n  if(!TEACHER)document.querySelector('.ws-tabs')?.remove();\n})();\n<\/script><script>const C=[[\"\\ucc38\", \"\\uac70\\uc9d3\", \"\\uac70\\uc9d3\", 8000], [\"\\uac70\\uc9d3\", \"\\ucc38\", \"\\ucc38\", 4000], [\"\\uac70\\uc9d3\", \"\\uac70\\uc9d3\", \"\\ucc38\", 9000], [\"\\ucc38\", \"\\uac70\\uc9d3\", \"\\uac70\\uc9d3\", 8000], [\"\\uac70\\uc9d3\", \"\\ucc38\", \"\\uac70\\uc9d3\", 5000], [\"\\ucc38\", \"\\uac70\\uc9d3\", \"\\ucc38\", 7000]];\nfunction fee(a,d){let f=10000;if(a>=13&&a<=19)f-=2000;if(a<=7||a>=65)f-=5000;if('월화수목금'.includes(d))f-=1000;return f}\ndocument.getElementById('chk1').onclick=()=>{let ok=0,tot=0;C.forEach((r,i)=>{[1,2,3].forEach(k=>{const el=document.querySelector(`[data-k=\"c${k}-${i}\"]`);tot++;const g=el.dataset.v===r[k-1];if(g)ok++;WS_mark(el,g)});const f=document.querySelector(`[data-k=\"fee-${i}\"]`);tot++;const g=Number(f.value.replace(/[^0-9]/g,''))===r[3];if(g)ok++;WS_mark(f,g)});WS_fb('fb1',ok===tot,ok===tot?`모두 맞았어요! (${ok}/${tot})`:`${tot}칸 중 ${ok}칸이 맞았어요. 빨간 칸의 조건을 다시 확인해 보세요.`)};\ndocument.getElementById('run').onclick=()=>{const a=Number(document.getElementById('runAge').value),d=document.getElementById('runDay').value;if(!a&&a!==0)return;const r=[a>=13&&a<=19,a<=7||a>=65,'월화수목금'.includes(d)];document.getElementById('runOut').className='fb ok';document.getElementById('runOut').textContent=`조건1 ${r[0]?'참':'거짓'} · 조건2 ${r[1]?'참':'거짓'} · 조건3 ${r[2]?'참':'거짓'} → 입장료 ${fee(a,d).toLocaleString()}원`};<\/script><\/body><\/html>", "grade": "중1", "school": "중학교", "mode": "종이·온라인", "imported": true, "worksheet": true, "unit": "Ⅲ-2-02 논리 연산 프로그래밍", "page": 117, "goal": "그리고(AND)·또는(OR) 조건이 참·거짓이 되는 경우를 예측하고, 실행 결과와 비교해 설명할 수 있다.", "wsGoal": "AND·OR 조건의 참·거짓을 예측하고, 근거를 들어 설명할 수 있다.", "parts": ["개념: AND는 모두, OR는 하나라도", "예측: 6개 사례의 조건 참·거짓과 입장료 표 채우기", "확인: 실행기(또는 엔트리)로 결과 비교", "문장 틀: 조건과 결과 연결해 설명", "도전: 경계값 사례 만들기"], "material": "활동지를 나눠 주고(또는 링크 배포) ②번 예측을 먼저 채우게 한 뒤 ③에서 확인합니다. 힌트는 막힐 때만 한 단계씩 엽니다.", "question": "15세 토요일 방문자의 입장료는 얼마이고, 어떤 조건 때문인가요?", "solution": "조건 1(13세 이상 그리고 19세 이하)만 참이므로 10,000−2,000=8,000원", "hint": "①번 개념 문장을 다시 읽고, 예측과 결과가 다른 칸부터 살펴보세요."}, {"id": "ws-debug", "name": "버그 탐정: 고장 난 블록 찾기", "subject": "정보", "visual": "code", "minutes": 20, "html": "<!doctype html><html lang=\"ko\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>버그 탐정: 고장 난 블록 찾기 · 활동지<\/title><style>\n:root{--ink:#1f2a44;--sub:#4a5563;--line:#cfd6df;--soft:#f5f7fa;--yellow:#ffdc58;--acc:#e3f2ea;--accd:#2c6545;--bad:#b3261e;--good:#1e7a46}\n*{box-sizing:border-box}\nhtml,body{margin:0;background:#eef1f5;color:var(--ink);font:15px/1.6 \"Pretendard\",\"Apple SD Gothic Neo\",\"Malgun Gothic\",\"Noto Sans KR\",sans-serif}\n.ws-tabs{position:sticky;top:0;z-index:5;display:flex;gap:6px;justify-content:center;padding:10px;background:#1f2a44}\n.ws-tabs button{min-height:40px;padding:0 16px;border-radius:20px;border:0;background:#2e3d63;color:#fff;font:inherit;font-weight:700;cursor:pointer}\n.ws-tabs button[aria-pressed=\"true\"]{background:var(--yellow);color:var(--ink)}\n.page{max-width:820px;margin:16px auto;background:#fff;border-radius:14px;padding:28px 32px;box-shadow:0 4px 20px rgba(31,42,68,.08)}\n.ws-head{border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:14px;display:grid;grid-template-columns:1fr auto;gap:4px 16px;align-items:end}\n.ws-meta{grid-column:1/-1;font-size:12px;color:var(--sub)}\n.ws-head h1{margin:0;font-size:24px;letter-spacing:-.02em}\n.ws-tag{display:inline-block;font-size:12px;font-weight:700;background:var(--acc);color:var(--accd);border-radius:8px;padding:2px 8px;margin-right:6px;vertical-align:middle}\n.ws-name{font-size:13px;color:var(--sub);white-space:nowrap}\n.ws-name span{display:inline-block;min-width:34px;border-bottom:1px solid var(--ink);margin:0 4px}\n.ws-name span.w{min-width:90px}\n.blk{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:12px 0;break-inside:avoid}\n.blk h2{margin:0 0 8px;font-size:16px;display:flex;align-items:center;gap:8px}\n.blk h2 .n{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:12px;background:var(--ink);color:#fff;font-size:13px}\n.blk h2 small{font-weight:500;color:var(--sub);font-size:12px}\n.b-concept{background:var(--acc);border-color:transparent}\n.b-concept p{margin:0;font-weight:600}\n.opt{border-style:dashed}\n.rules{margin:6px 0 10px;padding-left:20px}\n.rules li{margin:2px 0}\ntable.t{width:100%;border-collapse:collapse;font-size:14px}\ntable.t th,table.t td{border:1px solid var(--line);padding:6px;text-align:center;vertical-align:middle}\ntable.t th{background:var(--soft);font-size:13px}\ninput.w,textarea.w{font:inherit;border:1px solid var(--line);border-radius:8px;padding:6px 8px;width:100%;background:#fff;color:var(--ink)}\ninput.w.s{width:90px;text-align:center}\ntextarea.w{min-height:64px;resize:vertical}\n.tf{display:inline-flex;gap:2px;border:1px solid var(--line);border-radius:16px;padding:2px}\n.tf button{min-width:40px;min-height:30px;border:0;border-radius:14px;background:transparent;font:inherit;font-size:13px;cursor:pointer;color:var(--sub)}\n.tf button[aria-pressed=\"true\"]{background:var(--ink);color:#fff}\n.frame{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:6px 0}\n.frame input.w{width:auto;min-width:90px;flex:0 1 140px}\n.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}\n.btn{min-height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:#fff;font:inherit;font-weight:700;cursor:pointer;color:var(--ink)}\n.btn.p{background:var(--yellow);border-color:#e8c53e}\n.fb{margin-top:8px;font-size:14px;font-weight:600}\n.fb.ok{color:var(--good)} .fb.no{color:var(--bad)}\n.wrong{outline:2px solid var(--bad);outline-offset:1px;border-radius:8px}\n.right{outline:2px solid var(--good);outline-offset:1px;border-radius:8px}\n.hint{border:1px dashed #c9a92a;background:#fffbe6;border-radius:12px;padding:10px 14px;margin:12px 0}\n.hint h3{margin:0;font-size:14px}\n.hint ol{margin:6px 0 0;padding-left:20px}\n.hint li[hidden]{display:none}\n.code{font-family:\"D2Coding\",ui-monospace,Menlo,monospace;font-size:13px;background:var(--soft);border-radius:10px;padding:10px 12px;line-height:1.7;white-space:pre}\n.code .ln{display:inline-block;width:22px;color:#8a94a6}\n.ans{display:none;color:var(--bad);font-weight:700;font-size:13px}\n.teacher-only{display:none}\n.ws-foot{margin-top:14px;font-size:11px;color:#6b7280;text-align:right}\n.print-only{display:none}\n/* 교사용 */\nbody[data-mode=\"teacher\"] .ans{display:inline}\nbody[data-mode=\"teacher\"] .teacher-only{display:block}\nbody[data-mode=\"teacher\"] .student-only{display:none}\n/* 인쇄본 */\nbody[data-mode=\"print\"] .student-only{display:none}\nbody[data-mode=\"print\"] .print-only{display:block}\nbody[data-mode=\"print\"] .acts,body[data-mode=\"print\"] .fb{display:none}\nbody[data-mode=\"print\"] input.w,body[data-mode=\"print\"] textarea.w{border:0;border-bottom:1px solid #333;border-radius:0;background:transparent;color:transparent;pointer-events:none}\nbody[data-mode=\"print\"] textarea.w{border:1px solid #999;border-radius:6px;min-height:70px}\nbody[data-mode=\"print\"] .tf{border:0}\nbody[data-mode=\"print\"] .tf button{background:transparent!important;color:var(--ink)!important;pointer-events:none}\nbody[data-mode=\"print\"] .tf button+button::before{content:\"/\";margin-right:6px;color:#999}\nbody[data-mode=\"print\"] .hint li[hidden]{display:list-item}\nbody[data-mode=\"print\"] .hint{border-style:dashed;position:relative}\nbody[data-mode=\"print\"] .hint::before{content:\"✂ 접어서 가렸다가, 막히면 펼쳐 보세요\";display:block;font-size:11px;color:#8a6d00;margin-bottom:2px}\n@media print{\n  @page{size:A4;margin:12mm}\n  html,body{background:#fff;font-size:12.5px}\n  .ws-tabs,.no-print{display:none!important}\n  .page{box-shadow:none;margin:0;padding:0;max-width:none;border-radius:0}\n  .blk{margin:7px 0;padding:9px 12px}\n}\n@media (max-width:600px){.page{padding:18px 14px;margin:0;border-radius:0}.ws-head{grid-template-columns:1fr}.ws-name{white-space:normal}}\n:root{--acc:#fde9e4;--accd:#8a2c1c}<\/style><\/head>\n<body data-mode=\"student\"><script>window.WS_TEACHER=false;window.WS_MODE=\"student\";<\/script>\n<nav class=\"ws-tabs\" aria-label=\"보기 방식\"><button data-mode=\"student\">학생 화면<\/button><button data-mode=\"print\">인쇄본<\/button><button data-mode=\"teacher\">교사용 정답<\/button><button id=\"ws-print\" class=\"no-print\" style=\"background:#fff;color:#1f2a44\">인쇄하기<\/button><\/nav>\n<main class=\"page\">\n<header class=\"ws-head\"><div class=\"ws-meta\">중학교 정보 · Ⅲ. 알고리즘과 프로그래밍 › 2. 프로그래밍 › 05 함수와 디버깅 (교과서 140쪽)<\/div><h1><span class=\"ws-tag\">오류 고치기<\/span>버그 탐정: 고장 난 블록 찾기<\/h1><div class=\"ws-name\">학년<span><\/span>반<span><\/span>번호<span><\/span>이름<span class=\"w\"><\/span><\/div><\/header>\n\n<section class=\"blk b-concept\"><h2><span class=\"n\">①<\/span>오늘의 개념<\/h2><p>디버깅은 프로그램을 한 단계씩 따라가며 오류(버그)의 위치와 원인을 찾아 고치는 과정이다.<\/p><\/section>\n<section class=\"blk\"><h2><span class=\"n\">②<\/span>손으로 예측하기 <small>실행하지 말고 코드만 보고 찾아요<\/small><\/h2><div class=\"blk\" style=\"margin:10px 0\"><h3 style=\"margin:0 0 4px;font-size:15px\">버그 1. 정오각형 그리기<\/h3><p style=\"margin:0 0 6px;color:#4a5563;font-size:14px\">정오각형을 그리려고 했는데 도형이 닫히지 않아요.<\/p><div class=\"code\"><span class=\"ln\">1<\/span>5번 반복하기\n<span class=\"ln\">2<\/span>  50만큼 움직이기\n<span class=\"ln\">3<\/span>  60도 회전하기<\/div>\n<div class=\"frame\">실행 결과 예측: <input class=\"w\" data-ans=\"도형이 닫히지 않고 벌어진다\" aria-label=\"버그 1 실행 결과 예측\"> 오류가 있는 줄: <input class=\"w s\" data-k=\"line-0\" data-ans=\"3\" inputmode=\"numeric\" aria-label=\"버그 1 오류 줄 번호\"> 번<\/div>\n<div class=\"frame\">고친 내용: <input class=\"w\" style=\"flex:1 1 320px\" data-ans=\"60도 → 72도 (360 ÷ 5)\" aria-label=\"버그 1 고친 내용\"><\/div><\/div><div class=\"blk\" style=\"margin:10px 0\"><h3 style=\"margin:0 0 4px;font-size:15px\">버그 2. 1부터 10까지 더하기<\/h3><p style=\"margin:0 0 6px;color:#4a5563;font-size:14px\">1부터 10까지의 합(55)을 구하려고 했는데 결과가 이상해요.<\/p><div class=\"code\"><span class=\"ln\">1<\/span>합을 0으로 정하기\n<span class=\"ln\">2<\/span>i를 1로 정하기\n<span class=\"ln\">3<\/span>10번 반복하기\n<span class=\"ln\">4<\/span>  합에 i만큼 더하기\n<span class=\"ln\">5<\/span>합 말하기<\/div>\n<div class=\"frame\">실행 결과 예측: <input class=\"w\" data-ans=\"10\" aria-label=\"버그 2 실행 결과 예측\"> 오류가 있는 줄: <input class=\"w s\" data-k=\"line-1\" data-ans=\"4\" inputmode=\"numeric\" aria-label=\"버그 2 오류 줄 번호\"> 번<\/div>\n<div class=\"frame\">고친 내용: <input class=\"w\" style=\"flex:1 1 320px\" data-ans=\"반복 안에 ‘i에 1만큼 더하기’ 추가\" aria-label=\"버그 2 고친 내용\"><\/div><\/div><div class=\"blk\" style=\"margin:10px 0\"><h3 style=\"margin:0 0 4px;font-size:15px\">버그 3. 점수 등급 말하기<\/h3><p style=\"margin:0 0 6px;color:#4a5563;font-size:14px\">95점인데 ‘최우수’가 아니라 ‘우수’라고 말해요.<\/p><div class=\"code\"><span class=\"ln\">1<\/span>만일 점수 > 80 이라면\n<span class=\"ln\">2<\/span>  ‘우수’ 말하기\n<span class=\"ln\">3<\/span>아니면 만일 점수 > 90 이라면\n<span class=\"ln\">4<\/span>  ‘최우수’ 말하기<\/div>\n<div class=\"frame\">실행 결과 예측: <input class=\"w\" data-ans=\"우수\" aria-label=\"버그 3 실행 결과 예측\"> 오류가 있는 줄: <input class=\"w s\" data-k=\"line-2\" data-ans=\"1\" inputmode=\"numeric\" aria-label=\"버그 3 오류 줄 번호\"> 번<\/div>\n<div class=\"frame\">고친 내용: <input class=\"w\" style=\"flex:1 1 320px\" data-ans=\"점수 > 90 조건을 먼저 검사하도록 순서 바꾸기\" aria-label=\"버그 3 고친 내용\"><\/div><\/div><div class=\"blk\" style=\"margin:10px 0\"><h3 style=\"margin:0 0 4px;font-size:15px\">버그 4. 과일 리스트 첫 항목<\/h3><p style=\"margin:0 0 6px;color:#4a5563;font-size:14px\">리스트 [사과, 배, 귤]의 첫 항목을 말하려는데 오류가 나요.<\/p><div class=\"code\"><span class=\"ln\">1<\/span>과일 리스트 = [사과, 배, 귤]\n<span class=\"ln\">2<\/span>과일의 0번째 항목 말하기<\/div>\n<div class=\"frame\">실행 결과 예측: <input class=\"w\" data-ans=\"오류(항목 없음)\" aria-label=\"버그 4 실행 결과 예측\"> 오류가 있는 줄: <input class=\"w s\" data-k=\"line-3\" data-ans=\"2\" inputmode=\"numeric\" aria-label=\"버그 4 오류 줄 번호\"> 번<\/div>\n<div class=\"frame\">고친 내용: <input class=\"w\" style=\"flex:1 1 320px\" data-ans=\"0번째 → 1번째 (엔트리 리스트 번호는 1부터)\" aria-label=\"버그 4 고친 내용\"><\/div><\/div>\n<div class=\"acts student-only\"><button class=\"btn p\" id=\"chk2\" type=\"button\">오류 줄 번호 채점하기<\/button><\/div><p class=\"fb\" id=\"fb2\" aria-live=\"polite\"><\/p><\/section>\n<section class=\"blk opt\"><h2><span class=\"n\">③<\/span>한 단계씩 실행해 보기 <small>선택 · 버그 2를 디버거처럼<\/small><\/h2>\n<div class=\"student-only\"><div class=\"acts\" style=\"margin-top:0\"><button class=\"btn\" id=\"step\" type=\"button\">▶ 한 단계 실행<\/button><label style=\"display:inline-flex;gap:6px;align-items:center;font-size:14px\"><input type=\"checkbox\" id=\"fixed\"> 고친 코드로 실행<\/label><button class=\"btn\" id=\"reset\" type=\"button\">처음부터<\/button><\/div>\n<table class=\"t\" style=\"margin-top:8px\"><thead><tr><th>반복 횟수<\/th><th>i<\/th><th>합<\/th><\/tr><\/thead><tbody id=\"trace\"><\/tbody><\/table><\/div>\n<div class=\"print-only\"><table class=\"t\"><thead><tr><th>반복 횟수<\/th><th>1<\/th><th>2<\/th><th>3<\/th><th>4<\/th><th>…<\/th><th>10<\/th><\/tr><\/thead><tbody><tr><th>i<\/th><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><th>합<\/th><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><\/tbody><\/table><p style=\"margin:6px 0 0;font-size:13px\">버그 2의 변수 값을 직접 따라가 적어 보세요.<\/p><\/div><\/section>\n<section class=\"blk\"><h2><span class=\"n\">④<\/span>내 말로 설명하기<\/h2><div class=\"frame\">버그 3의 오류는 <input class=\"w\" data-ans=\"조건을 검사하는 순서\"> 에 있었고, <input class=\"w\" data-ans=\"점수 > 90 조건\"> 을(를) <input class=\"w\" data-ans=\"먼저 검사하도록\"> 바꾸면 해결된다.<\/div><\/section>\n<section class=\"blk opt\"><h2><span class=\"n\">⑤<\/span>도전 <small>선택<\/small><\/h2><p style=\"margin:0 0 6px\">버그 1을 고친 뒤, 변의 수만 바꾸면 어떤 정다각형이든 그리는 함수 ‘정다각형 그리기(변의 수)’를 설계해 보세요. 회전 각도는 어떻게 계산하나요?<\/p><textarea class=\"w\" data-ans=\"변의 수만큼 반복하기 → 50만큼 움직이기 → (360 ÷ 변의 수)도 회전하기\"><\/textarea><\/section>\n<aside class=\"hint\"><h3>힌트<\/h3><ol><li>오류를 찾을 때는 ‘원하는 결과’와 ‘실제로 나올 결과’를 줄마다 비교해요.<\/li><li>버그 2는 i가 바뀌는지, 버그 3은 어떤 조건이 먼저 검사되는지 보세요.<\/li><\/ol><div class=\"acts student-only\"><button class=\"btn hint-next\" type=\"button\">힌트 1단계씩 보기<\/button><\/div><\/aside>\n<section class=\"blk teacher-only\" aria-label=\"교사용 정답과 해설\"><h2>교사용 · 정답과 지도 포인트<\/h2><ol><li><b>정오각형 그리기<\/b> — 3번 줄 · 60도 → 72도 (360 ÷ 5) · 고치기 전 결과: 도형이 닫히지 않고 벌어진다<\/li><li><b>1부터 10까지 더하기<\/b> — 4번 줄 · 반복 안에 ‘i에 1만큼 더하기’ 추가 · 고치기 전 결과: 10<\/li><li><b>점수 등급 말하기<\/b> — 1번 줄 · 점수 > 90 조건을 먼저 검사하도록 순서 바꾸기 · 고치기 전 결과: 우수<\/li><li><b>과일 리스트 첫 항목<\/b> — 2번 줄 · 0번째 → 1번째 (엔트리 리스트 번호는 1부터) · 고치기 전 결과: 오류(항목 없음)<\/li><\/ol><p><b>예상 오답<\/b><\/p><ul><li>버그 1에서 반복 횟수를 고치려는 경우 → 정오각형은 5번이 맞고, 회전 각도(360÷5)가 문제임을 짚어 줍니다.<\/li><li>버그 3에서 ‘> 80’을 ‘>= 80’으로 고치는 경우 → 95점도 첫 조건에서 끝나는 원리를 단계별로 따라가게 합니다.<\/li><li>버그 4는 엔트리 리스트 번호가 1부터 시작한다는 점을 처음 접하는 학생이 많습니다.<\/li><\/ul><p><b>지도 포인트<\/b> ③의 단계 실행은 교과서의 디버거 개념과 연결됩니다. 고친 코드로 다시 실행해 합이 55가 되는지 확인시키세요.<\/p><\/section>\n<p class=\"ws-foot\">수업활동 스튜디오 · 활동지 초안 (교사 검토 전) · A4 1장 · 15~20분<\/p>\n<\/main><script>\n(function(){\n  const body=document.body,TEACHER=window.WS_TEACHER;\n  function setMode(m){body.dataset.mode=m;if(m!=='student')document.querySelectorAll('.wrong,.right').forEach(e=>e.classList.remove('wrong','right'));document.querySelectorAll('.fb').forEach(f=>{if(m!=='student')f.textContent=''});document.querySelectorAll('.ws-tabs [data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===m)));\n    if(m==='teacher'){document.querySelectorAll('[data-ans]').forEach(el=>{if(el.matches('input,textarea')){el.dataset.saved=el.value;el.value=el.dataset.ans;el.readOnly=true}else if(el.classList.contains('tf')){el.dataset.saved=el.dataset.v||'';sel(el,el.dataset.ans)}})}\n    else{document.querySelectorAll('[data-ans]').forEach(el=>{if(el.matches('input,textarea')&&el.readOnly){el.value=el.dataset.saved||'';el.readOnly=false}else if(el.classList.contains('tf')&&el.dataset.saved!==undefined){sel(el,el.dataset.saved);delete el.dataset.saved}})}\n  }\n  function sel(tf,v){tf.dataset.v=v||'';tf.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.textContent===v)))}\n  window.WS_sel=sel;\n  document.querySelectorAll('.tf').forEach(tf=>{tf.querySelectorAll('button').forEach(b=>{b.type='button';b.onclick=()=>{if(body.dataset.mode!=='student')return;sel(tf,tf.dataset.v===b.textContent?'':b.textContent);tf.classList.remove('wrong','right')}})});\n  document.querySelectorAll('.hint').forEach(h=>{const items=[...h.querySelectorAll('li')];items.forEach(li=>li.hidden=true);const b=h.querySelector('.hint-next');if(b)b.onclick=()=>{const nx=items.find(li=>li.hidden);if(nx){nx.hidden=false}if(!items.some(li=>li.hidden)){b.disabled=true;b.textContent='힌트를 모두 봤어요'}}});\n  document.querySelectorAll('.ws-tabs [data-mode]').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));\n  const pr=document.getElementById('ws-print');if(pr)pr.onclick=()=>{setMode('print');setTimeout(()=>window.print(),50)};\n  window.addEventListener('message',e=>{if(e.data&&e.data.wsMode){setMode(e.data.wsMode);if(e.data.print)setTimeout(()=>window.print(),80)}});\n  window.WS_mark=(el,ok)=>{el.classList.remove('wrong','right');el.classList.add(ok?'right':'wrong')};\n  window.WS_fb=(id,ok,msg)=>{const f=document.getElementById(id);f.className='fb '+(ok?'ok':'no');f.textContent=msg};\n  setMode(window.WS_MODE||'student');\n  if(!TEACHER)document.querySelector('.ws-tabs')?.remove();\n})();\n<\/script><script>document.getElementById('chk2').onclick=()=>{const A=[3,4,1,2];let ok=0;A.forEach((a,i)=>{const el=document.querySelector(`[data-k=\"line-${i}\"]`);const g=Number(el.value)===a;if(g)ok++;WS_mark(el,g)});WS_fb('fb2',ok===4,ok===4?'오류 줄을 모두 찾았어요!':`4개 중 ${ok}개를 찾았어요. 힌트를 참고해 다시 살펴보세요.`)};\nlet n=0,i=1,sum=0;const tb=document.getElementById('trace');\nfunction reset(){n=0;i=1;sum=0;tb.innerHTML='';document.getElementById('step').disabled=false}\ndocument.getElementById('reset').onclick=reset;document.getElementById('fixed').onchange=reset;\ndocument.getElementById('step').onclick=()=>{if(n>=10)return;n++;sum+=i;const r=document.createElement('tr');r.innerHTML=`<td>${n}<\/td><td>${i}<\/td><td>${sum}<\/td>`;tb.append(r);if(document.getElementById('fixed').checked)i++;if(n>=10){document.getElementById('step').disabled=true;const e=document.createElement('tr');e.innerHTML=`<td colspan=\"3\"><b>합 말하기 → ${sum}<\/b> ${sum===55?'✓ 원하는 결과':'✗ 55가 아니에요'}<\/td>`;tb.append(e)}};<\/script><\/body><\/html>", "grade": "중1", "school": "중학교", "mode": "종이·온라인", "imported": true, "worksheet": true, "unit": "Ⅲ-2-05 함수와 디버깅", "page": 140, "goal": "코드를 한 단계씩 따라가며 오류의 위치와 원인을 찾고 고칠 수 있다.", "wsGoal": "코드를 따라가며 오류의 위치와 원인을 찾아 고칠 수 있다.", "parts": ["개념: 디버깅이란", "예측: 버그 4개의 결과·오류 줄·고친 내용", "확인: 반복을 한 단계씩 실행하며 변수 추적", "문장 틀: 오류 원인 설명", "도전: 정다각형 함수 설계"], "material": "활동지를 나눠 주고(또는 링크 배포) ②번 예측을 먼저 채우게 한 뒤 ③에서 확인합니다. 힌트는 막힐 때만 한 단계씩 엽니다.", "question": "1부터 10까지 더하는 코드의 결과가 10이 나온 이유는 무엇인가요?", "solution": "반복 안에서 i가 증가하지 않아 매번 1만 더해졌기 때문", "hint": "①번 개념 문장을 다시 읽고, 예측과 결과가 다른 칸부터 살펴보세요."}, {"id": "ws-bits", "name": "0과 1로 그림 보내기", "subject": "정보", "visual": "code", "minutes": 20, "html": "<!doctype html><html lang=\"ko\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>0과 1로 그림 보내기 · 활동지<\/title><style>\n:root{--ink:#1f2a44;--sub:#4a5563;--line:#cfd6df;--soft:#f5f7fa;--yellow:#ffdc58;--acc:#e3f2ea;--accd:#2c6545;--bad:#b3261e;--good:#1e7a46}\n*{box-sizing:border-box}\nhtml,body{margin:0;background:#eef1f5;color:var(--ink);font:15px/1.6 \"Pretendard\",\"Apple SD Gothic Neo\",\"Malgun Gothic\",\"Noto Sans KR\",sans-serif}\n.ws-tabs{position:sticky;top:0;z-index:5;display:flex;gap:6px;justify-content:center;padding:10px;background:#1f2a44}\n.ws-tabs button{min-height:40px;padding:0 16px;border-radius:20px;border:0;background:#2e3d63;color:#fff;font:inherit;font-weight:700;cursor:pointer}\n.ws-tabs button[aria-pressed=\"true\"]{background:var(--yellow);color:var(--ink)}\n.page{max-width:820px;margin:16px auto;background:#fff;border-radius:14px;padding:28px 32px;box-shadow:0 4px 20px rgba(31,42,68,.08)}\n.ws-head{border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:14px;display:grid;grid-template-columns:1fr auto;gap:4px 16px;align-items:end}\n.ws-meta{grid-column:1/-1;font-size:12px;color:var(--sub)}\n.ws-head h1{margin:0;font-size:24px;letter-spacing:-.02em}\n.ws-tag{display:inline-block;font-size:12px;font-weight:700;background:var(--acc);color:var(--accd);border-radius:8px;padding:2px 8px;margin-right:6px;vertical-align:middle}\n.ws-name{font-size:13px;color:var(--sub);white-space:nowrap}\n.ws-name span{display:inline-block;min-width:34px;border-bottom:1px solid var(--ink);margin:0 4px}\n.ws-name span.w{min-width:90px}\n.blk{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:12px 0;break-inside:avoid}\n.blk h2{margin:0 0 8px;font-size:16px;display:flex;align-items:center;gap:8px}\n.blk h2 .n{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:12px;background:var(--ink);color:#fff;font-size:13px}\n.blk h2 small{font-weight:500;color:var(--sub);font-size:12px}\n.b-concept{background:var(--acc);border-color:transparent}\n.b-concept p{margin:0;font-weight:600}\n.opt{border-style:dashed}\n.rules{margin:6px 0 10px;padding-left:20px}\n.rules li{margin:2px 0}\ntable.t{width:100%;border-collapse:collapse;font-size:14px}\ntable.t th,table.t td{border:1px solid var(--line);padding:6px;text-align:center;vertical-align:middle}\ntable.t th{background:var(--soft);font-size:13px}\ninput.w,textarea.w{font:inherit;border:1px solid var(--line);border-radius:8px;padding:6px 8px;width:100%;background:#fff;color:var(--ink)}\ninput.w.s{width:90px;text-align:center}\ntextarea.w{min-height:64px;resize:vertical}\n.tf{display:inline-flex;gap:2px;border:1px solid var(--line);border-radius:16px;padding:2px}\n.tf button{min-width:40px;min-height:30px;border:0;border-radius:14px;background:transparent;font:inherit;font-size:13px;cursor:pointer;color:var(--sub)}\n.tf button[aria-pressed=\"true\"]{background:var(--ink);color:#fff}\n.frame{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:6px 0}\n.frame input.w{width:auto;min-width:90px;flex:0 1 140px}\n.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}\n.btn{min-height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:#fff;font:inherit;font-weight:700;cursor:pointer;color:var(--ink)}\n.btn.p{background:var(--yellow);border-color:#e8c53e}\n.fb{margin-top:8px;font-size:14px;font-weight:600}\n.fb.ok{color:var(--good)} .fb.no{color:var(--bad)}\n.wrong{outline:2px solid var(--bad);outline-offset:1px;border-radius:8px}\n.right{outline:2px solid var(--good);outline-offset:1px;border-radius:8px}\n.hint{border:1px dashed #c9a92a;background:#fffbe6;border-radius:12px;padding:10px 14px;margin:12px 0}\n.hint h3{margin:0;font-size:14px}\n.hint ol{margin:6px 0 0;padding-left:20px}\n.hint li[hidden]{display:none}\n.code{font-family:\"D2Coding\",ui-monospace,Menlo,monospace;font-size:13px;background:var(--soft);border-radius:10px;padding:10px 12px;line-height:1.7;white-space:pre}\n.code .ln{display:inline-block;width:22px;color:#8a94a6}\n.ans{display:none;color:var(--bad);font-weight:700;font-size:13px}\n.teacher-only{display:none}\n.ws-foot{margin-top:14px;font-size:11px;color:#6b7280;text-align:right}\n.print-only{display:none}\n/* 교사용 */\nbody[data-mode=\"teacher\"] .ans{display:inline}\nbody[data-mode=\"teacher\"] .teacher-only{display:block}\nbody[data-mode=\"teacher\"] .student-only{display:none}\n/* 인쇄본 */\nbody[data-mode=\"print\"] .student-only{display:none}\nbody[data-mode=\"print\"] .print-only{display:block}\nbody[data-mode=\"print\"] .acts,body[data-mode=\"print\"] .fb{display:none}\nbody[data-mode=\"print\"] input.w,body[data-mode=\"print\"] textarea.w{border:0;border-bottom:1px solid #333;border-radius:0;background:transparent;color:transparent;pointer-events:none}\nbody[data-mode=\"print\"] textarea.w{border:1px solid #999;border-radius:6px;min-height:70px}\nbody[data-mode=\"print\"] .tf{border:0}\nbody[data-mode=\"print\"] .tf button{background:transparent!important;color:var(--ink)!important;pointer-events:none}\nbody[data-mode=\"print\"] .tf button+button::before{content:\"/\";margin-right:6px;color:#999}\nbody[data-mode=\"print\"] .hint li[hidden]{display:list-item}\nbody[data-mode=\"print\"] .hint{border-style:dashed;position:relative}\nbody[data-mode=\"print\"] .hint::before{content:\"✂ 접어서 가렸다가, 막히면 펼쳐 보세요\";display:block;font-size:11px;color:#8a6d00;margin-bottom:2px}\n@media print{\n  @page{size:A4;margin:12mm}\n  html,body{background:#fff;font-size:12.5px}\n  .ws-tabs,.no-print{display:none!important}\n  .page{box-shadow:none;margin:0;padding:0;max-width:none;border-radius:0}\n  .blk{margin:7px 0;padding:9px 12px}\n}\n@media (max-width:600px){.page{padding:18px 14px;margin:0;border-radius:0}.ws-head{grid-template-columns:1fr}.ws-name{white-space:normal}}\n:root{--acc:#efe8fb;--accd:#5b3fa0}<\/style><\/head>\n<body data-mode=\"student\"><script>window.WS_TEACHER=false;window.WS_MODE=\"student\";<\/script>\n<nav class=\"ws-tabs\" aria-label=\"보기 방식\"><button data-mode=\"student\">학생 화면<\/button><button data-mode=\"print\">인쇄본<\/button><button data-mode=\"teacher\">교사용 정답<\/button><button id=\"ws-print\" class=\"no-print\" style=\"background:#fff;color:#1f2a44\">인쇄하기<\/button><\/nav>\n<main class=\"page\">\n<header class=\"ws-head\"><div class=\"ws-meta\">중학교 정보 · Ⅱ. 데이터 › 1. 데이터의 표현 › 02 다양한 데이터의 디지털 표현 (교과서 48쪽)<\/div><h1><span class=\"ws-tag\">탐구·실험<\/span>0과 1로 그림 보내기<\/h1><div class=\"ws-name\">학년<span><\/span>반<span><\/span>번호<span><\/span>이름<span class=\"w\"><\/span><\/div><\/header>\n\n<style>.grid{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;max-width:240px;aspect-ratio:1;background:#cfd6df;border:2px solid #1f2a44;padding:2px}.grid button{border:0;background:#fff;padding:0;cursor:pointer;min-height:0}.grid button.on{background:#1f2a44}.grid button.wrong{outline:2px solid #b3261e;outline-offset:-2px}body[data-mode=\"print\"] .grid button.on{background:#fff}body[data-mode=\"print\"] #gT button.on,body[data-mode=\"teacher\"] #gT button.on{background:#b3261e}<\/style><section class=\"blk b-concept\"><h2><span class=\"n\">①<\/span>오늘의 개념<\/h2><p>흑백 그림은 칸마다 0(흰색) 또는 1(검은색), 즉 1비트로 나타낼 수 있다. 컴퓨터는 그림을 이런 0과 1의 묶음으로 저장하고 보낸다.<\/p><\/section>\n<section class=\"blk\"><h2><span class=\"n\">②<\/span>손으로 예측하기 <small>A. 받은 코드를 그림으로 · B. 내 그림을 코드로<\/small><\/h2>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px\">\n<div><p style=\"margin:0 0 6px\"><b>A.<\/b> 친구가 보낸 8줄 코드예요. 1인 칸을 칠해 그림을 복원하세요.<\/p><ol style=\"margin:0;padding-left:22px\"><li class=\"code\" style=\"padding:2px 10px;margin:2px 0;white-space:normal\">00000000<\/li><li class=\"code\" style=\"padding:2px 10px;margin:2px 0;white-space:normal\">01100110<\/li><li class=\"code\" style=\"padding:2px 10px;margin:2px 0;white-space:normal\">11111111<\/li><li class=\"code\" style=\"padding:2px 10px;margin:2px 0;white-space:normal\">11111111<\/li><li class=\"code\" style=\"padding:2px 10px;margin:2px 0;white-space:normal\">01111110<\/li><li class=\"code\" style=\"padding:2px 10px;margin:2px 0;white-space:normal\">00111100<\/li><li class=\"code\" style=\"padding:2px 10px;margin:2px 0;white-space:normal\">00011000<\/li><li class=\"code\" style=\"padding:2px 10px;margin:2px 0;white-space:normal\">00000000<\/li><\/ol><\/div>\n<div><div class=\"grid\" id=\"gA\" aria-label=\"A 복원 격자\"><\/div><p class=\"fb\" id=\"fbA\" aria-live=\"polite\"><\/p><\/div><\/div>\n<div class=\"acts student-only\"><button class=\"btn p\" id=\"chkA\" type=\"button\">A 채점하기<\/button><\/div>\n<hr style=\"border:0;border-top:1px dashed #cfd6df;margin:14px 0\">\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px\">\n<div><p style=\"margin:0 0 6px\"><b>B.<\/b> 격자에 나만의 그림을 그리고, 각 줄을 0과 1로 적어 짝에게 보내세요.<\/p><div class=\"grid\" id=\"gB\" aria-label=\"B 내 그림 격자\"><\/div><\/div>\n<div><ol style=\"margin:0;padding-left:22px\" id=\"codeB\"><li style=\"margin:3px 0\"><input class=\"w\" data-k=\"b-0\" maxlength=\"8\" inputmode=\"numeric\" style=\"font-family:ui-monospace,monospace;letter-spacing:3px\" aria-label=\"1번째 줄 코드\"><\/li><li style=\"margin:3px 0\"><input class=\"w\" data-k=\"b-1\" maxlength=\"8\" inputmode=\"numeric\" style=\"font-family:ui-monospace,monospace;letter-spacing:3px\" aria-label=\"2번째 줄 코드\"><\/li><li style=\"margin:3px 0\"><input class=\"w\" data-k=\"b-2\" maxlength=\"8\" inputmode=\"numeric\" style=\"font-family:ui-monospace,monospace;letter-spacing:3px\" aria-label=\"3번째 줄 코드\"><\/li><li style=\"margin:3px 0\"><input class=\"w\" data-k=\"b-3\" maxlength=\"8\" inputmode=\"numeric\" style=\"font-family:ui-monospace,monospace;letter-spacing:3px\" aria-label=\"4번째 줄 코드\"><\/li><li style=\"margin:3px 0\"><input class=\"w\" data-k=\"b-4\" maxlength=\"8\" inputmode=\"numeric\" style=\"font-family:ui-monospace,monospace;letter-spacing:3px\" aria-label=\"5번째 줄 코드\"><\/li><li style=\"margin:3px 0\"><input class=\"w\" data-k=\"b-5\" maxlength=\"8\" inputmode=\"numeric\" style=\"font-family:ui-monospace,monospace;letter-spacing:3px\" aria-label=\"6번째 줄 코드\"><\/li><li style=\"margin:3px 0\"><input class=\"w\" data-k=\"b-6\" maxlength=\"8\" inputmode=\"numeric\" style=\"font-family:ui-monospace,monospace;letter-spacing:3px\" aria-label=\"7번째 줄 코드\"><\/li><li style=\"margin:3px 0\"><input class=\"w\" data-k=\"b-7\" maxlength=\"8\" inputmode=\"numeric\" style=\"font-family:ui-monospace,monospace;letter-spacing:3px\" aria-label=\"8번째 줄 코드\"><\/li><\/ol><\/div><\/div>\n<div class=\"acts student-only\"><button class=\"btn p\" id=\"chkB\" type=\"button\">내 그림과 코드가 맞는지 확인<\/button><\/div><p class=\"fb\" id=\"fbB\" aria-live=\"polite\"><\/p><\/section>\n<section class=\"blk opt\"><h2><span class=\"n\">③<\/span>짝과 확인하기 <small>선택<\/small><\/h2><p style=\"margin:0\">짝이 내 코드로 복원한 그림과 원래 그림을 겹쳐 보세요. 다른 칸 수: <input class=\"w s\" aria-label=\"다른 칸 수\"> 개 · 다른 칸이 생긴 이유: <input class=\"w\" style=\"max-width:320px;display:inline-block\" aria-label=\"다른 칸이 생긴 이유\"><\/p><\/section>\n<section class=\"blk\"><h2><span class=\"n\">④<\/span>내 말로 설명하기<\/h2><div class=\"frame\">흑백 그림 한 칸은 <input class=\"w s\" data-ans=\"1\"> 비트이고, 8×8 그림은 모두 <input class=\"w s\" data-ans=\"64\"> 비트가 필요하다. 칸 수를 늘리면 그림이 <input class=\"w\" data-ans=\"더 정밀해지지만 비트 수가 늘어난다\"> .<\/div><\/section>\n<section class=\"blk opt\"><h2><span class=\"n\">⑤<\/span>도전 <small>선택<\/small><\/h2><p style=\"margin:0 0 6px\">흰색·검은색·빨간색·파란색 4가지 색을 쓰려면 한 칸에 몇 비트가 필요할까요? 8×8 그림 전체는요?<\/p><div class=\"frame\">한 칸 <input class=\"w s\" data-ans=\"2\"> 비트 · 전체 <input class=\"w s\" data-ans=\"128\"> 비트 · 이유: <input class=\"w\" style=\"flex:1 1 240px\" data-ans=\"2비트로 00·01·10·11 네 가지를 구분할 수 있어서\"><\/div><\/section>\n<aside class=\"hint\"><h3>힌트<\/h3><ol><li>코드의 왼쪽 글자부터 차례로 격자의 왼쪽 칸에 대응해요. 1이면 칠하고 0이면 비워요.<\/li><li>B에서는 한 줄씩, 칠한 칸은 1, 빈 칸은 0으로 8글자를 써요.<\/li><\/ol><div class=\"acts student-only\"><button class=\"btn hint-next\" type=\"button\">힌트 1단계씩 보기<\/button><\/div><\/aside>\n<section class=\"blk teacher-only\" aria-label=\"교사용 정답과 해설\"><h2>교사용 · 정답과 지도 포인트<\/h2><p><b>A 정답<\/b>: 하트 모양<\/p><div class=\"grid t-ans\" id=\"gT\"><\/div><p><b>④<\/b> 1비트 · 64비트 · 칸이 많아지면 더 정밀하지만 저장 공간(비트 수)이 늘어남 <b>⑤<\/b> 2비트 · 128비트<\/p><p><b>예상 오답<\/b><\/p><ul><li>줄 순서를 아래에서 위로 칠함 → 첫 줄이 맨 위임을 약속으로 정해 둡니다.<\/li><li>B에서 8글자가 안 되게 쓰는 경우 → 빈 칸도 0으로 써야 길이가 맞습니다.<\/li><li>⑤를 4비트로 답함 → 색 4가지는 2비트(4가지 조합)로 충분함을 00/01/10/11로 보여 줍니다.<\/li><\/ul><p><b>지도 포인트<\/b> 언플러그드라서 기기 없이도 할 수 있어요. ‘집중이 흐트러졌어요’ 10분 활동으로도 쓸 수 있습니다.<\/p><\/section>\n<p class=\"ws-foot\">수업활동 스튜디오 · 활동지 초안 (교사 검토 전) · A4 1장 · 15~20분<\/p>\n<\/main><script>\n(function(){\n  const body=document.body,TEACHER=window.WS_TEACHER;\n  function setMode(m){body.dataset.mode=m;if(m!=='student')document.querySelectorAll('.wrong,.right').forEach(e=>e.classList.remove('wrong','right'));document.querySelectorAll('.fb').forEach(f=>{if(m!=='student')f.textContent=''});document.querySelectorAll('.ws-tabs [data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===m)));\n    if(m==='teacher'){document.querySelectorAll('[data-ans]').forEach(el=>{if(el.matches('input,textarea')){el.dataset.saved=el.value;el.value=el.dataset.ans;el.readOnly=true}else if(el.classList.contains('tf')){el.dataset.saved=el.dataset.v||'';sel(el,el.dataset.ans)}})}\n    else{document.querySelectorAll('[data-ans]').forEach(el=>{if(el.matches('input,textarea')&&el.readOnly){el.value=el.dataset.saved||'';el.readOnly=false}else if(el.classList.contains('tf')&&el.dataset.saved!==undefined){sel(el,el.dataset.saved);delete el.dataset.saved}})}\n  }\n  function sel(tf,v){tf.dataset.v=v||'';tf.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.textContent===v)))}\n  window.WS_sel=sel;\n  document.querySelectorAll('.tf').forEach(tf=>{tf.querySelectorAll('button').forEach(b=>{b.type='button';b.onclick=()=>{if(body.dataset.mode!=='student')return;sel(tf,tf.dataset.v===b.textContent?'':b.textContent);tf.classList.remove('wrong','right')}})});\n  document.querySelectorAll('.hint').forEach(h=>{const items=[...h.querySelectorAll('li')];items.forEach(li=>li.hidden=true);const b=h.querySelector('.hint-next');if(b)b.onclick=()=>{const nx=items.find(li=>li.hidden);if(nx){nx.hidden=false}if(!items.some(li=>li.hidden)){b.disabled=true;b.textContent='힌트를 모두 봤어요'}}});\n  document.querySelectorAll('.ws-tabs [data-mode]').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));\n  const pr=document.getElementById('ws-print');if(pr)pr.onclick=()=>{setMode('print');setTimeout(()=>window.print(),50)};\n  window.addEventListener('message',e=>{if(e.data&&e.data.wsMode){setMode(e.data.wsMode);if(e.data.print)setTimeout(()=>window.print(),80)}});\n  window.WS_mark=(el,ok)=>{el.classList.remove('wrong','right');el.classList.add(ok?'right':'wrong')};\n  window.WS_fb=(id,ok,msg)=>{const f=document.getElementById(id);f.className='fb '+(ok?'ok':'no');f.textContent=msg};\n  setMode(window.WS_MODE||'student');\n  if(!TEACHER)document.querySelector('.ws-tabs')?.remove();\n})();\n<\/script><script>const H=[\"00000000\", \"01100110\", \"11111111\", \"11111111\", \"01111110\", \"00111100\", \"00011000\", \"00000000\"];\nfunction grid(id,interactive){const g=document.getElementById(id);g.innerHTML='';for(let r=0;r<8;r++)for(let c=0;c<8;c++){const b=document.createElement('button');b.type='button';b.dataset.r=r;b.dataset.c=c;b.setAttribute('aria-label',(r+1)+'행 '+(c+1)+'열');if(interactive)b.onclick=()=>{if(document.body.dataset.mode!=='student')return;b.classList.toggle('on');b.classList.remove('wrong');b.setAttribute('aria-pressed',b.classList.contains('on'))};g.append(b)}return g}\ngrid('gA',true);grid('gB',true);const T=grid('gT',false);[...T.children].forEach(b=>{if(H[b.dataset.r][b.dataset.c]==='1')b.classList.add('on')});\ndocument.getElementById('chkA').onclick=()=>{let bad=0;[...document.getElementById('gA').children].forEach(b=>{const want=H[b.dataset.r][b.dataset.c]==='1';const g=b.classList.contains('on')===want;b.classList.toggle('wrong',!g);if(!g)bad++});WS_fb('fbA',!bad,bad?`다른 칸이 ${bad}개 있어요. 빨간 테두리 칸을 다시 확인하세요.`:'정확히 복원했어요! 무슨 그림인가요?')};\ndocument.getElementById('chkB').onclick=()=>{const cells=[...document.getElementById('gB').children];let bad=0,empty=0;for(let r=0;r<8;r++){const inp=document.querySelector(`[data-k=\"b-${r}\"]`);const v=inp.value.trim();if(!v){empty++;continue}const want=cells.slice(r*8,r*8+8).map(b=>b.classList.contains('on')?'1':'0').join('');const g=v===want;if(!g)bad++;WS_mark(inp,g)}WS_fb('fbB',!bad&&!empty,empty?`아직 비어 있는 줄이 ${empty}개 있어요.`:bad?`그림과 다른 줄이 ${bad}개 있어요. 칠한 칸=1, 빈 칸=0 인지 확인하세요.`:'그림과 코드가 정확히 일치해요. 짝에게 코드를 보내 보세요!')};<\/script><\/body><\/html>", "grade": "중1", "school": "중학교", "mode": "언플러그드·온라인", "imported": true, "worksheet": true, "unit": "Ⅱ-1-02 다양한 데이터의 디지털 표현", "page": 48, "goal": "흑백 그림을 0과 1로 나타내고, 칸 수와 색 수에 따라 필요한 비트 수가 달라짐을 설명할 수 있다.", "wsGoal": "그림을 0과 1로 나타내고, 필요한 비트 수를 설명할 수 있다.", "parts": ["개념: 한 칸 = 1비트", "예측: 코드로 그림 복원 · 내 그림을 코드로", "확인: 짝과 바꿔 복원해 보기", "문장 틀: 칸 수와 비트 수", "도전: 4색일 때 필요한 비트 수"], "material": "활동지를 나눠 주고(또는 링크 배포) ②번 예측을 먼저 채우게 한 뒤 ③에서 확인합니다. 힌트는 막힐 때만 한 단계씩 엽니다.", "question": "8×8 흑백 그림을 보내려면 몇 비트가 필요하고, 그 이유는 무엇인가요?", "solution": "한 칸이 1비트이므로 8×8=64비트", "hint": "①번 개념 문장을 다시 읽고, 예측과 결과가 다른 칸부터 살펴보세요."}];worksheetActivities.forEach(a=>{a.evaluation=[{id:a.id+"-eval",question:a.question,criteria:a.solution,origin:"teacher"}];a.evaluationSource=evaluationSignature(a);a.kind="inquiry";});importedActivities.unshift(...worksheetActivities);worksheetActivities.forEach(a=>{a.kw={'ws-logic':'조건문 조건 논리 연산 선택 구조 참 거짓 and or','ws-debug':'디버깅 오류 버그 함수 코드 블록','ws-bits':'비트 0과 1 이진 디지털 이미지 픽셀 데이터 표현'}[a.id]||''});worksheetActivities.forEach(a=>{const S={"ws-logic": [["wrap", "quiz"], ["조건 3개와 할인 규칙 읽기", "6개 사례의 참·거짓과 입장료 예측하기", "실행기로 예측과 결과 비교하기", "조건과 결과를 문장으로 설명하기", "경계값 사례 직접 만들기"]], "ws-debug": [["level", "quiz"], ["디버깅의 뜻 확인하기", "코드만 보고 버그 4개의 오류 줄 찾기", "한 단계씩 실행하며 변수 값 따라가기", "오류 원인을 문장으로 설명하기", "정다각형 함수 설계하기"]], "ws-bits": [["focus", "wrap"], ["한 칸 = 1비트 개념 확인하기", "코드로 그림 복원하고, 내 그림을 코드로 바꾸기", "짝과 코드를 바꿔 복원해 보기", "칸 수와 비트 수 관계 설명하기", "4색일 때 필요한 비트 수 구하기"]]};a.sits=S[a.id][0];a.parts=S[a.id][1];});

browse=function(){if(['my','results','templates'].includes(mode))return priorCatalogueBrowse();mode='activities';const found=filterCatalogue();return `<div class="heading"><div><h1>오늘 수업, 활동부터 골라요.</h1><p>고르고 · 바꾸고 · 사용하고</p></div><label class="search-label"><span class="sr-only">활동 검색</span><input id="catalogue-search" value="${esc(catalogueQuery)}" placeholder="활동 검색"></label></div><div class="activity-tabs">${[['all','전체'],['basic','기본 활동'],['topics','주제 활동'],['missions','미션 활동'],['inquiry','탐구 활동']].map(([k,v])=>`<button data-group="${k}" class="${activityGroup===k?'active':''}" aria-pressed="${activityGroup===k}">${v}</button>`).join('')}</div><div class="filter-row">${picker('교과','subject',['전체 교과','정보','국어','수학','과학'])}<label>학년<select data-filter="grade">${['전체 학년',...grades,'학년 미지정'].map(g=>`<option value="${g}" ${filters.grade===g?'selected':''}>${grades.includes(g)?gradeNames(g):g}</option>`).join('')}</select></label>${picker('방식','format',['모든 방식','온라인','언플러그드','의사코딩','깊은 대화'])}</div><div class="section-line"><h2>수업 활동 <span class="muted">${found.length}</span></h2><button class="template-link" data-mode="templates">활동 유형으로 찾기</button></div>${filters.format==='의사코딩'||filters.format==='깊은 대화'?'<p class="notice">방식 선택을 추가했습니다. 해당 방식의 전용 활동은 아직 등록하지 않았습니다.</p>':''}<div class="cards">${found.map(activityCard).join('')}</div>${!found.length?'<div class="empty"><h2>조건에 맞는 활동이 없어요.</h2><button id="catalogue-reset">전체 보기</button></div>':''}<p class="notice">카드 그림은 활동 구성을 보여주는 예시입니다. 학년 미지정 활동은 교사가 내용과 수준을 확인해 학년을 지정할 수 있습니다.</p>`};
const beforeImportedDetail=detail;
detail=function(a){if(!a.imported)return beforeImportedDetail(a);return `<div class="save-bar"><span class="type-label">탐구 활동 · 가져온 자료</span><button id="save-lesson" ${savedLessons.has(a.id)||drafts.has(a.id)?'disabled':''}>${savedLessons.has(a.id)||drafts.has(a.id)?'✓ 내 자료에 담김':'＋ 내 자료에 담기'}</button></div><button class="back" id="back-list">← 활동 찾기</button><div class="heading"><div><h1>${esc(a.name)}</h1><p>${subjectBadge(a)} ${a.grade?gradeNames(a.grade):a.school+' · 학년 미지정'} · ${a.minutes}분</p></div></div><div class="detail-grid"><section>${cover(a)}<h2>학습 목표</h2><p>${esc(a.goal)}</p><h3>수업 안내</h3><p class="material">${esc(a.material)}</p><p class="notice">원본 활동의 조작 화면을 열어요. 공통 편집에서는 수업 안내와 평가를 바꿀 수 있습니다. 실험의 계산 규칙은 유지됩니다.</p></section><section><h2>활동과 기록</h2><p>원본 탐구를 수행한 뒤 관찰 결과를 제출합니다.</p>${evaluationSummary(a)}<div class="actions"><button id="integrated-edit">내용 편집</button><button id="external-launch" class="primary">활동 열기</button></div></section></div>`};
function startUnifiedEdit(){editorState=structuredClone(get(selected));editorState.minutes=editorState.minutes||20;editorHistory=[];chatItems=[];pendingPatch=null;currentEditorTab='content';draft=editorState;go('edit')}
function editPreview(){const a=editorState;return `${cover(a)}<h2>${esc(a.name)}</h2><p class="notice">${a.grade?gradeNames(a.grade):'학년 미지정'} · ${a.minutes||20}분 · ${esc(a.mode||'온라인')}</p><h3>학습 목표</h3><p>${esc(a.goal||'')}</p><h3>${a.imported?'수업 안내':'자료·사례'}</h3><p class="material">${esc(a.material)}</p><h3>활동 질문</h3><p>${esc(a.question||'')}</p>${a.steps?a.steps.map((s,i)=>`<p><strong>${i+1}. ${esc(s.title)}</strong><br>${esc(s.question)}</p>`).join(''):''}<p class="notice">평가는 활동으로 돌아가 ‘평가 편집’에서 수정합니다.</p>`}
function contentFields(){const a=editorState;return `${field('활동 이름','name',a.name,'text')}<div class="two"><label>학년<select name="grade"><option value="">학년 미지정</option>${grades.map(g=>`<option value="${g}" ${a.grade===g?'selected':''}>${gradeNames(g)}</option>`).join('')}</select></label>${field('시간(분)','minutes',a.minutes||20,'number')}</div>${field('학습 목표','goal',a.goal||'')}${field(a.id==='sort'||a.id===mission.id?'서로 다른 번호 5개 · 쉼표로 구분':a.imported?'수업 안내':'자료·사례','material',a.material)}${field('활동 질문','question',a.question||'')}${a.options?`<label>정답<select name="correct">${a.options.map(v=>`<option ${v===a.correct?'selected':''}>${v}</option>`).join('')}</select></label>`:''}${a.hint?field('도움말','hint',a.hint):''}${a.solution&&a.id!=='sort'&&a.id!==mission.id?field('교사용 예시 답변','solution',a.solution):''}${a.steps?a.steps.map((s,i)=>field('활동 '+(i+1)+' 질문','step-'+i,s.question)).join(''):''}`}
function chatPanel(){return `<div class="chat-disclaimer">채팅 편집 체험 · 실제 AI 미연결<br>아래 예시 또는 ‘항목: 새 내용’으로 변경안을 만들 수 있어요.</div><div class="chat-messages">${chatItems.map(m=>`<div class="chat-message ${m.role}">${esc(m.text)}</div>`).join('')||'<div class="chat-message assistant">어떤 내용을 바꿀까요? 변경안을 먼저 보여드릴게요.</div>'}</div><div class="chat-examples"><button type="button" data-prompt="활동 시간을 10분으로 바꿔줘">10분으로</button><button type="button" data-prompt="학년을 중학교 3학년으로 바꿔줘">중3으로</button><button type="button" data-prompt="제목: 우리 반 탐구 활동">제목 바꾸기</button></div>${pendingPatch?`<section class="patch-preview"><h3>변경안</h3>${Object.entries(pendingPatch).map(([k,v])=>`<p><strong>${fieldLabels[k]||k}</strong><br><del>${esc(editorState[k]||'미지정')}</del><br>${esc(v)}</p>`).join('')}<div class="actions"><button type="button" id="patch-discard">취소</button><button type="button" class="primary" id="patch-apply">변경안 적용</button></div></section>`:''}<label for="chat-request" class="sr-only">수정 요청</label><textarea id="chat-request" class="student-input" maxlength="1800" placeholder="예: 질문: 왜 그렇게 생각했나요? 근거를 두 가지 적어 보세요."></textarea><button type="button" class="primary" id="chat-send">변경안 만들기</button>`}
editPage=function(){return `<button class="back" id="unified-cancel">← 활동으로</button><div class="heading"><div><h1>내용 편집</h1></div><div class="actions"><button id="editor-undo" ${!editorHistory.length?'disabled':''}>되돌리기</button><button id="unified-save" class="primary">저장</button></div></div><div class="unified-editor"><section class="edit-panel"><div class="editor-tabs" role="tablist" aria-label="편집 방식"><button id="content-tab" role="tab" aria-selected="${currentEditorTab==='content'}" data-editor-tab="content">내용</button><button id="chat-tab" role="tab" aria-selected="${currentEditorTab==='chat'}" data-editor-tab="chat">채팅</button></div><div id="editor-error" class="error" role="alert"></div>${currentEditorTab==='content'?`<form class="form" id="unified-fields">${contentFields()}</form>`:chatPanel()}<p class="notice">${editorState.imported?'원본 실험의 계산 규칙을 제외한 수업 안내·질문을 편집합니다.':'자료를 바꾸면 정답·도움말·평가 기준도 확인해 주세요.'}</p></section><section class="editor-preview"><div class="live-label">미리보기</div><div id="unified-preview" class="paper">${editPreview()}</div></section></div>`};
function parseEditRequest(raw){const result={};let match;const fields={'제목':'name','활동 이름':'name','목표':'goal','학습 목표':'goal','자료':'material','수업 안내':'material','질문':'question','활동 질문':'question','도움말':'hint','예시 답변':'solution'};for(const line of raw.split('\n')){match=line.match(/^\s*(제목|활동 이름|목표|학습 목표|자료|수업 안내|질문|활동 질문|도움말|예시 답변)\s*[:：]\s*(.+)$/);if(match)result[fields[match[1]]]=match[2].trim()}
 match=raw.match(/(?:시간[^\d]*)?(\d+)\s*분(?:으로|\s|$)/);if(match&&+match[1]>=5&&+match[1]<=60)result.minutes=+match[1];
 match=raw.match(/(초등학교|중학교|고등학교|초등|중등|고등|초|중|고)\s*([1-6])\s*학?년?/);if(match){const g=({초등학교:'초',초등:'초',중학교:'중',중등:'중',고등학교:'고',고등:'고'})[match[1]]||match[1];if(grades.includes(g+match[2]))result.grade=g+match[2]}
 return result;
}
function validateEditor(a){if(['name','goal','material','question'].some(k=>!String(a[k]||'').trim()))return '활동 이름, 학습 목표, 자료와 질문을 입력해 주세요.';if(!Number.isFinite(+a.minutes)||+a.minutes<5||+a.minutes>60)return '시간은 5~60분으로 입력해 주세요.';if(a.id==='sort'||a.id===mission.id){const ns=a.material.split(',').map(v=>v.trim());if(ns.length!==5||ns.some(v=>!/^\d{1,3}$/.test(v))||new Set(ns.map(Number)).size!==5)return '서로 다른 0~999 숫자 5개를 쉼표로 구분해 주세요.';a.solution=ns.map(Number).sort((x,y)=>x-y).join(', ')}return ''}
function bindUnified(){document.querySelectorAll('[data-editor-tab]').forEach(b=>b.onclick=()=>{currentEditorTab=b.dataset.editorTab;render()});document.getElementById('unified-cancel').onclick=()=>go('detail');document.getElementById('unified-save').onclick=()=>{const err=validateEditor(editorState);if(err){document.getElementById('editor-error').textContent=err;return}drafts.set(selected,structuredClone(editorState));go('detail');toast('수정 내용을 저장했어요.')};document.getElementById('editor-undo').onclick=()=>{if(editorHistory.length){editorState=editorHistory.pop();draft=editorState;pendingPatch=null;render()}};
 const form=document.getElementById('unified-fields');if(form){form.addEventListener('focusin',e=>{if(e.target.name)editorHistory.push(structuredClone(editorState))});form.oninput=e=>{const k=e.target.name;if(!k)return;if(k.startsWith('step-'))editorState.steps[+k.slice(5)].question=e.target.value;else editorState[k]=k==='minutes'?Number(e.target.value):e.target.value;document.getElementById('unified-preview').innerHTML=editPreview();document.getElementById('editor-undo').disabled=!editorHistory.length};form.onsubmit=e=>e.preventDefault()}
 document.querySelectorAll('[data-prompt]').forEach(b=>b.onclick=()=>document.getElementById('chat-request').value=b.dataset.prompt);
 const send=document.getElementById('chat-send');if(send)send.onclick=()=>{const raw=document.getElementById('chat-request').value.trim();if(!raw)return;chatItems.push({role:'user',text:raw});const patch=parseEditRequest(raw);pendingPatch=Object.keys(patch).length?patch:null;chatItems.push({role:'assistant',text:pendingPatch?'변경안을 만들었어요. 확인한 뒤 적용해 주세요.':'이 요청은 체험 편집기가 해석하지 못했어요. “질문: 새 질문”처럼 항목과 내용을 입력하거나 내용 탭에서 수정해 주세요.'});render()};const apply=document.getElementById('patch-apply');if(apply)apply.onclick=()=>{const candidate={...editorState,...pendingPatch};const err=validateEditor(candidate);if(err){document.getElementById('editor-error').textContent=err;return}editorHistory.push(structuredClone(editorState));editorState=candidate;draft=editorState;pendingPatch=null;chatItems.push({role:'assistant',text:'미리보기에 적용했어요. 저장을 누르면 활동에 반영됩니다.'});render()};const discard=document.getElementById('patch-discard');if(discard)discard.onclick=()=>{pendingPatch=null;render()};}
function openImported(){const a=structuredClone(get(selected)),d=document.getElementById('student-dialog');d.classList.add('imported-dialog');d.innerHTML=`<div class="dialog-head"><div><strong>${esc(a.name)}</strong><p class="notice">원본 활동을 수행한 뒤 아래 ‘활동 후 기록’을 제출하세요.</p></div><button id="import-close">닫기</button></div><details><summary>교사 수업 안내</summary><p class="material">${esc(a.material)}</p></details><iframe id="imported-frame" title="${esc(a.name)}" sandbox="allow-scripts" referrerpolicy="no-referrer"></iframe><section class="import-record"><h2>활동 후 기록</h2><label for="import-note">직접 조작한 내용과 관찰 결과</label><textarea class="student-input" id="import-note" maxlength="1800" placeholder="원본 활동의 기록을 복사해 붙이거나, 실험 조건과 결과를 적어 주세요."></textarea>${studentEvaluation(a)}</section>`;d.querySelector('iframe').srcdoc=a.html;d.showModal();d.querySelector('#import-close').onclick=()=>{d.close();d.classList.remove('imported-dialog')};d.querySelector('#student-submit').onclick=()=>{const name=d.querySelector('#student-name').value.trim(),answer=d.querySelector('#import-note').value.trim(),evaluationAnswers=a.evaluation.map((_,i)=>d.querySelector('#student-eval-'+i).value.trim());if(!name||!answer||evaluationAnswers.some(v=>!v)){d.querySelector('#submit-error').textContent='이름, 관찰 기록과 평가 답변을 적어 주세요.';return}saveSubmission(a,{name,answer,evaluationAnswers});d.close();mode='results';resultActivity=a.id;resultStatus='all';go('browse');toast('탐구 기록과 평가 답변을 제출했어요.')};}
const integrationBind=bind;
bind=function(){integrationBind();if(view==='edit')bindUnified();for(const id of ['edit','back-edit','topic-edit','mission-edit','integrated-edit']){const e=document.getElementById(id);if(e)e.onclick=startUnifiedEdit}const launch=document.getElementById('external-launch');if(launch)launch.onclick=openImported;const search=document.getElementById('catalogue-search');if(search)search.oninput=e=>{catalogueQuery=e.target.value;const pos=e.target.selectionStart;render();const next=document.getElementById('catalogue-search');next.focus();next.setSelectionRange(pos,pos)};const reset=document.getElementById('catalogue-reset');if(reset)reset.onclick=()=>{filters={subject:'전체 교과',grade:'전체 학년',time:'모든 시간',format:'모든 방식'};activityGroup='all';catalogueQuery='';render()}};
// The original binder expects edit-form only on the old edit screen. Skip that branch.
const integrationRender=render;
render=function(){if(view==='edit'){document.title='내용 편집 · 수업활동 스튜디오';app.innerHTML=nav()+`<main>${editPage()}</main><dialog id="student-dialog"></dialog><dialog id="worksheet-dialog"></dialog><dialog id="result-dialog"></dialog>`;const oldView=view;view='unified-edit';bind();view=oldView;bindUnified();}else integrationRender()};
const integratedResults=resultsPage;resultsPage=function(){return integratedResults().replace('<option value="all">전체 활동</option>',`<option value="all">전체 활동</option>${importedActivities.map(a=>`<option value="${a.id}" ${resultActivity===a.id?'selected':''}>${esc(get(a.id).name)}</option>`).join('')}`)};
mode='activities';activityGroup='all';view='browse';render();
</script><style>#editor-undo{min-width:132px;white-space:nowrap;flex-shrink:0}.editor-tabs{gap:0;padding-bottom:0;border-bottom:2px solid #e1e5eb}.editor-tabs button{min-width:125px;border-radius:12px 12px 0 0;border:1px solid #e1e5eb;border-bottom:0;background:#f4f5f7;color:#69717c;margin-right:6px;padding:15px 30px}.editor-tabs button[aria-selected=true]{background:#fff4ba;color:#24252b;border-color:#d7b332;border-bottom:4px solid #dfb425;position:relative;bottom:-2px}.multi-filter{position:relative;min-width:210px;flex:1;border:1px solid #d8dde4;border-radius:10px;background:white;align-self:stretch}.multi-filter summary{padding:14px 16px;cursor:pointer;display:flex;justify-content:space-between;gap:18px}.multi-filter summary span{font-size:16px;color:#687282}.multi-options{position:absolute;top:100%;left:0;width:290px;max-height:340px;overflow:auto;padding:12px;background:white;border:1px solid #ddd;border-radius:12px;box-shadow:0 7px 20px #26364922;z-index:20}.multi-options label{display:flex;align-items:center;gap:10px;padding:9px;font-size:17px;font-weight:500}.multi-options input{width:20px;height:20px;accent-color:#b38b10}.multi-options button{font-size:14px;width:100%;padding:7px}.ai-example{margin:22px 0;background:#fff8d5;border-radius:12px;padding:18px}.evaluation-context .material{white-space:pre-line}textarea[hidden]{display:none!important}
</style><script>const defaultActions=[['사례를 분류','분류한 이유를 설명'],['순서를 구성','그 순서로 진행하는 이유를 설명'],['오류를 발견','오류의 원인과 수정 내용을 설명'],['자료를 근거로 판단','판단한 이유를 설명']];
const customActions={
 'sort':['선택 정렬 절차에 따라 숫자를 정렬','반복한 절차를 설명'],
 'mission-sort':['선택 정렬 절차에 따라 숫자를 정렬','확정된 위치를 제외하는 이유를 설명'],
 'topic-recycle':['학습 자료와 분류 오류의 관계를 설명','근거를 들어 개선안을 제안'],
 'ext-picky-ai':['학습 자료의 구성을 변경','분류 결과의 차이를 설명'],
 'ext-sorting-robot':['비교와 교환을 반복하여 정렬','반복이 필요한 이유를 설명'],
 'ext-how-many-passes':['비교와 교환을 반복하여 정렬','한 번의 훑어보기가 부족한 이유를 설명'],
 'ext-not-just-words':['여러 종류의 데이터로 대상을 표현','표현 방법에 따른 차이를 비교'],
 'ext-can-i-use-photo':['이용 조건에 따라 사진 사용 가능 여부를 판단','판단의 근거가 되는 이용 조건을 설명'],
 'ext-wildfire-sensor':['센서와 장치의 역할에 맞게 시스템을 구성','감지 기준에 따른 작동 결과를 설명'],
 'ext-wildfire-threshold-lab':['구역별 임계값을 조정','오탐과 미탐 결과를 비교'],
 'ext-math-graph':['좌표를 이용해 이차함수 그래프를 작성','꼭짓점과 최솟값을 설명'],
 'ext-science-laser':['거울 방향을 조절하여 빛의 경로를 변경','관찰한 경로를 빛의 반사로 설명']
};
function objectiveCriteria(goal){return goal.split(/\n+/).map(s=>s.trim().replace(/[.。]$/,'')).filter(Boolean).map(s=>s.endsWith('할 수 있다')?s.slice(0,-6)+'할 수 있는가?':s.endsWith('수 있다')?s.slice(0,-4)+'수 있는가?':s+' — 활동 결과에서 확인할 수 있는가?')}
generateEvaluation=function(a){return objectiveCriteria(a.goal).map((question,i)=>({id:newEvalId(),question,criteria:i===0?'활동의 선택·조작·작성 결과가 학습 목표에 맞는지 확인한다.':'학생이 작성한 이유와 관찰 기록에 타당한 근거가 있는지 확인한다.',origin:'auto'}))};
allActivityIds().forEach(id=>{const a=get(id);a.grade=a.grade||'중1';const actions=customActions[id]||defaultActions[a.family||0];a.goal=actions.map(v=>v+'할 수 있다.').join('\n');a.evaluation=generateEvaluation(a);a.evaluationSource=evaluationSignature(a)});

rror" role="alert"></p><div class="actions"><button type="button" id="create-cancel">취소</button><button type="submit">내용 편집으로</button><button class="primary" id="create-with-ai" type="submit">AI 생성</button></div></form>`;

    wrap.querySelectorAll('[data-v14-class]').forEach(b=>b.onclick=()=>{const c=b.dataset.v14Class;picked.has(c)?picked.delete(c):picked.add(c);ready.dataset.v14='';wrap.remove();deployView()});
    const click=id=>document.getElementById(id)?.click();
    wrap.querySelector('#v14-try').onclick=()=>click('launch');
    wrap.querySelector('#v14-edit').onclick=()=>click('back-edit');
    wrap.querySelector('#v14-another').onclick=()=>click('another');
    const dep=wrap.querySelector('#v14-deploy');
    if(dep)dep.onclick=()=>{const snap=lhSnapshot(a);const prior=lhState.assignments.find(x=>x.activity.id===a.id);const item={id:prior?.id||lhId(),activity:snap,at:new Date().toISOString(),classes:[...picked],code:codeFor(a.id)};if(prior)Object.assign(prior,item);else lhState.assignments.unshift(item);lhPersist();toast([...picked].join(', ')+'에 배포했어요.');render()};
    const st=wrap.querySelector('#v14-student');if(st)st.onclick=()=>lhGo('home');
  }

  /* 3. 안내 문구 정리 (상단 칩 하나만 남김) */
  const NOTICE=/브라우저(에| 안에)? ?저장|기기 간 공유|동일 브라우저 체험용|현재 페이지에서만/;
  function trimNotices(root){
    root.querySelectorAll('p,div,span,small').forEach(el=>{
      if(el.closest('.ui-avatar,.ui-demo-label,dialog,.v14-deploy'))return;
      if(el.querySelector('button,select,input,a,h1,h2,h3,table'))return;
      const t=el.textContent.trim();
      if(t.length<140&&NOTICE.test(t))el.classList.add('v14-hide');
    });
  }

  /* 4. 용어 통일 */
  const TERMS=[[/나의 Learning History/g,'나의 학습 기록'],[/Learning History/g,'학습 기록'],[/나의 Portfolio/g,'나의 포트폴리오'],[/Portfolio/g,'포트폴리오'],[/나의 Learning World/g,'나의 학습 세계'],[/Learning World는/g,'학습 세계는'],[/Learning World/g,'학습 세계']];
  function unifyTerms(root){
    const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;
    while((n=w.nextNode())){
      const p=n.parentElement;if(!p||p.closest('script,style,.lh-section-label,.ui-eyebrow,[class*=eyebrow]'))continue;
      let t=n.nodeValue,o=t;for(const [r,s] of TERMS)t=t.replace(r,s);if(t!==o)n.nodeValue=t;
    }
  }

  /* 5. 버튼 모양 통일, 남은 데모 버튼 숨김 */
  function tidyButtons(root){
    root.querySelectorAll('button').forEach(b=>{
      const t=b.textContent.trim();
      if(/→$/.test(t)&&t.length<=20&&!b.querySelector('h1,h2,h3,strong,b,div,span:not(:only-child)')&&!b.classList.contains('primary')&&!b.closest('.ui-hero,.lh-hero,.ui-journey,[class*=hero]'))b.classList.add('v14-link');
      if(b.id==='lh-demo'&&b.disabled)b.closest('.lh-actions')?b.closest('.lh-actions').classList.add('v14-hide'):b.classList.add('v14-hide');
    });
  }

  /* 6. 접근성: 랜드마크, 본문 바로가기, 화면 전환 시 h1로 포커스 */
  let lastH1=null,first=true;
  function a11y(){
    if(!document.querySelector('main,[role=main]')){const m=document.querySelector('.ui-main');if(m){m.setAttribute('role','main');m.id=m.id||'v14-main'}}
    const main=document.querySelector('main,[role=main]');if(main&&!main.id)main.id='v14-main';
    document.querySelectorAll('aside.ui-side').forEach(s=>{s.setAttribute('role','navigation');s.setAttribute('aria-label',s.textContent.includes('학생 홈')?'학생 메뉴':'교사 메뉴')});
    if(!document.querySelector('.v14-skip')){const a=document.createElement('a');a.className='v14-skip';a.href='#';a.textContent='본문 바로가기';a.onclick=e=>{e.preventDefault();const h=document.querySelector('main h1,[role=main] h1');if(h){h.setAttribute('tabindex','-1');h.focus()}};document.body.prepend(a)}
    const h1=document.querySelector('main h1,[role=main] h1');const key=h1?h1.textContent.trim():null;
    if(!first&&h1&&key!==lastH1&&!document.querySelector('dialog[open]')){h1.setAttribute('tabindex','-1');h1.focus({preventScroll:true})}
    lastH1=key;first=false;
  }

  function studentTodo(root){
    if(typeof lhRows!=='function')return;
    const done=new Set(lhRows().map(r=>r.activity.id));
    root.querySelectorAll('[data-lh-perform]').forEach(b=>{const as=lhState.assignments.find(x=>x.id===b.dataset.lhPerform);const item=b.closest('.ui-task,.lh-student-assignment');if(as&&done.has(as.activity.id)&&item)item.classList.add('v14-hide')});
    root.querySelectorAll('.ui-panel,.lh-grid section').forEach(sec=>{const h=sec.querySelector('h2');if(!h||!/지금 할|이번 수업/.test(h.textContent))return;const left=[...sec.querySelectorAll('[data-lh-perform]')].filter(b=>!b.closest('.v14-hide')).length;const chip=sec.querySelector('.ui-chip');if(chip)chip.textContent=left+'개 남음';if(!left&&!sec.querySelector('.v14-empty'))sec.insertAdjacentHTML('beforeend','<p class="ui-empty v14-empty">배포된 활동을 모두 마쳤어요.</p>')});
  }
  function enhance(){
    try{const root=document.getElementById('app')||document.body;deployView();studentTodo(root);trimNotices(root);unifyTerms(root);tidyButtons(root);a11y()}catch(e){console.warn('v14',e)}
  }
  return {seed:v14Seed, enhance};
})();

const teacherHome=(()=>{

    {id:'focus',label:'집중이 흐트러졌어요',time:'5~10분',why:'몸이나 손을 움직이며 바로 시작하는 짧은 활동',ids:[['mission-sort','번호를 맞춰 가며 단계를 깨는 미션형'],['ext-can-i-use-photo','10분 안에 끝나는 판단 활동'],['ext-science-laser','레이저 방향을 바꿔 미로를 푸는 조작형']]},

    {id:'wrap',label:'오늘 내용 정리',time:'10~15분',why:'배운 개념을 분류·설명하며 정리하는 활동',ids:[['0-0','배운 개념을 사례에 적용해 분류'],['1-0','절차를 순서대로 놓으며 정리'],['3-0','자료를 보고 근거를 들어 선택']]},

  ];
  let sit='focus',fresh=false,guideOpen=false;

  function data(){

    const waiting=recs.filter(r=>!r.feedback.length);
    return {recs,lessons,all,waiting};
  }
  function steps(d){
    return [['상황에 맞는 활동 찾기',d.all.length>0||(!fresh&&savedLessons.size>0)],['반을 골라 배포하기',d.all.length>0],['학생 답변 확인하기',d.recs.some(r=>r.feedback.length||r.reviewed)]];
  }


  function openActivity(id,to){selected=id;uiTeacherHome=false;lhPage='';lhTeacher=false;if(to==='edit'&&typeof startUnifiedEdit==='function'){startUnifiedEdit();return}go(to)}
  function bindHome(){
    const home=document.querySelector('.v15-home');if(!home||home.dataset.bound)return;home.dataset.bound='1';
    home.querySelectorAll('[data-v15-sit]').forEach(b=>b.onclick=()=>{sit=b.dataset.v15Sit;try{localStorage.setItem('v15-sit',sit)}catch(e){};render();document.querySelector(`[data-v15-sit="${sit}"]`)?.focus()});
    home.querySelectorAll('[data-v15-go]').forEach(b=>b.onclick=()=>openActivity(b.dataset.v15Go,'ready'));
    home.querySelectorAll('[data-v15-edit]').forEach(b=>b.onclick=()=>openActivity(b.dataset.v15Edit,'edit'));
    home.querySelectorAll('[data-v15-peek]').forEach(b=>b.onclick=()=>openActivity(b.dataset.v15Peek,'detail'));

  }
  function sideBadge(){

    document.querySelectorAll('aside.ui-side button').forEach(b=>{if(b.textContent.trim().startsWith('학생 결과')&&!b.querySelector('.v15-badge')&&n)b.insertAdjacentHTML('beforeend',`<span class="v15-badge" aria-label="확인할 답변 ${n}건">${n}</span>`)});

/* v19 · 교사 범위(학교급·교과): 처음 한 번 설정, 칩으로 보여 주고 필요할 때만 바꾼다 */
const teacherScope=(()=>{
  const KEY='v19-scope',LEVELS=['초등학교','중학교','고등학교'],SUBJECTS=['정보','과학','수학','국어','사회','전체 교과'];
  let saved=null;try{saved=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}
  const def=()=>saved||{level:'중학교',subject:'정보'};
  const label=sc=>sc.level+' · '+(sc.subject==='전체 교과'?'전체 교과':sc.subject);
  const levelOf=a=>{const g=String(a.grade||'');return g.startsWith('초')?'초등학교':g.startsWith('고')?'고등학교':'중학교'};
  const match=(a,sc)=>(!sc.level||levelOf(a)===sc.level)&&(!sc.subject||sc.subject==='전체 교과'||a.subject===sc.subject);
  function save(sc){saved={level:sc.level,subject:sc.subject};try{localStorage.setItem(KEY,JSON.stringify(saved))}catch(e){}}
  function chip(id,sc){
    return `<span class="v19-scope-wrap"><button type="button" class="v19-scope" id="${id}" aria-haspopup="true" aria-expanded="false" aria-controls="${id}-pop">${esc(label(sc))} <span aria-hidden="true">▾</span></button>
<div class="v19-pop" id="${id}-pop" hidden role="group" aria-label="찾는 범위"><p class="v19-pop-t">학교급</p><div class="v19-opts">${LEVELS.map(l=>`<button type="button" data-v19-level="${l}" aria-pressed="${sc.level===l}">${l}</button>`).join('')}</div>
<p class="v19-pop-t">교과</p><div class="v19-opts">${SUBJECTS.map(x=>`<button type="button" data-v19-subject="${x}" aria-pressed="${sc.subject===x}">${x}</button>`).join('')}</div>
<div class="v19-pop-act"><button type="button" data-v19-default>기본값으로 저장</button><button type="button" class="v19-done" data-v19-close>완료</button></div></div></span>`;
  }
  function bindChip(id,get,set){
    const b=document.getElementById(id),pop=document.getElementById(id+'-pop');if(!b||b.dataset.bound)return;b.dataset.bound='1';
    const close=(focus)=>{pop.hidden=true;b.setAttribute('aria-expanded','false');if(focus)b.focus()};
    b.onclick=e=>{e.stopPropagation();const open=pop.hidden;pop.hidden=!open;b.setAttribute('aria-expanded',String(open));if(open)pop.querySelector('[aria-pressed="true"]')?.focus()};
    pop.onclick=e=>e.stopPropagation();
    pop.onkeydown=e=>{if(e.key==='Escape')close(true)};
    pop.querySelectorAll('[data-v19-level]').forEach(x=>x.onclick=()=>{const sc={...get(),level:x.dataset.v19Level};set(sc,true)});
    pop.querySelectorAll('[data-v19-subject]').forEach(x=>x.onclick=()=>{const sc={...get(),subject:x.dataset.v19Subject};set(sc,true)});
    pop.querySelector('[data-v19-default]').onclick=()=>{save(get());toast('기본 범위를 ‘'+label(get())+'’(으)로 저장했어요.');close(true)};
    pop.querySelector('[data-v19-close]').onclick=()=>close(true);
    document.addEventListener('click',()=>{if(!pop.hidden)close(false)},{once:true});
  }
  function reopen(id){const b=document.getElementById(id),pop=document.getElementById(id+'-pop');if(b&&pop){pop.hidden=false;b.setAttribute('aria-expanded','true');pop.querySelector('[aria-pressed="true"]')?.focus()}}
  /* 처음 한 번: 범위 설정 */
  function setupNeeded(){return !saved}
  function setupHTML(){const sc=def();return `<dialog class="v19-setup" id="v19-setup" aria-labelledby="v19-setup-t"><h2 id="v19-setup-t">어떤 수업을 하세요?</h2><p>한 번만 정해 두면 활동을 찾을 때 이 범위로 먼저 보여 드려요. 나중에 언제든 바꿀 수 있어요.</p>
<p class="v19-pop-t">학교급</p><div class="v19-opts">${LEVELS.map(l=>`<button type="button" data-v19s-level="${l}" aria-pressed="${sc.level===l}">${l}</button>`).join('')}</div>
<p class="v19-pop-t">교과</p><div class="v19-opts">${SUBJECTS.map(x=>`<button type="button" data-v19s-subject="${x}" aria-pressed="${sc.subject===x}">${x}</button>`).join('')}</div>
<div class="v19-pop-act"><button type="button" class="v19-done" id="v19-setup-ok">시작하기</button></div></dialog>`}
  function openSetup(onDone){
    if(document.getElementById('v19-setup'))return;
    document.body.insertAdjacentHTML('beforeend',setupHTML());
    const d=document.getElementById('v19-setup');let sc={...def()};
    const sync=()=>{d.querySelectorAll('[data-v19s-level]').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.v19sLevel===sc.level)));d.querySelectorAll('[data-v19s-subject]').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.v19sSubject===sc.subject)))};
    d.querySelectorAll('[data-v19s-level]').forEach(x=>x.onclick=()=>{sc.level=x.dataset.v19sLevel;sync()});
    d.querySelectorAll('[data-v19s-subject]').forEach(x=>x.onclick=()=>{sc.subject=x.dataset.v19sSubject;sync()});
    d.querySelector('#v19-setup-ok').onclick=()=>{save(sc);d.close();d.remove();onDone&&onDone(sc)};
    d.addEventListener('cancel',e=>e.preventDefault());
    d.showModal();
  }
  return {def,label,levelOf,match,chip,bindChip,reopen,setupNeeded,openSetup,save};
})();

  };
  const BY_ID={'ws-logic':'judge','ws-debug':'fix','ws-bits':'explore','sort':'order','mission-sort':'order','topic-recycle':'project','ext-picky-ai':'classify','ext-sorting-robot':'order','ext-how-many-passes':'order','ext-not-just-words':'judge','ext-can-i-use-photo':'judge','ext-wildfire-sensor':'explore','ext-wildfire-threshold-lab':'explore','ext-math-graph':'explore','ext-science-laser':'explore','rep-report':'classify','rep-colosseum':'project','rep-writing':'judge'};
  const FAM=['classify','order','fix','judge'];
  function typeOf(a){return BY_ID[a.id]||FAM[a.family]||'explore'}
  window.v16TypeOf=typeOf;
  function thumb(a){const t=typeOf(a);return `<button type="button" class="v16-thumb v16-t-${t}" data-v15-peek="${a.id}" aria-label="미리보기: ${esc(a.name)}"><svg viewBox="0 0 100 60" aria-hidden="true">${TYPES[t].svg}</svg>${a.worksheet?'<span class="v24-badge">활동지</span>':''}<span class="v16-hover" aria-hidden="true">미리보기</span></button>`}
  function kindLabel(a){try{return {basic:'기본',topics:'주제',missions:'미션',inquiry:'탐구'}[catKind(a)]||''}catch(e){return ''}}
  function desc(a){const m=(a.material||'').split('\n')[0];return (a.imported||/활동 화면의 안내/.test(m))?(a.goal||a.question||''):(m||a.goal||'')}
