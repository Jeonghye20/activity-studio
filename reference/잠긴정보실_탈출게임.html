const blocks=SOURCE.sections.flatMap(s=>s.blocks),key='computer-escape-game-v1';let s={step:0,records:{},open:false},selected=null,message='',tone='',busy=false;try{const v=JSON.parse(localStorage.getItem(key));if(v&&Number.isInteger(v.step)&&v.step>=0&&v.step<=6&&v.records)s=v}catch{}const $=q=>document.querySelector(q),E=(t,c,txt)=>{const e=document.createElement(t);if(c)e.className=c;if(txt!=null)e.textContent=txt;return e},B=(t,f,c='')=>{const b=E('button',c,t);b.type='button';b.onclick=f;return b};function save(){try{localStorage.setItem(key,JSON.stringify(s))}catch{}}function rec(b){return s.records[b.id]||(s.records[b.id]={input:null,tries:0,done:false})}function feedback(t,c=''){message=t;tone=c;const el=$('#feedback');if(el){el.textContent=t;el.className='feedback '+c}}function go(){s.step++;selected=null;message='';tone='';save();render()}function render(){const n=blocks.slice(1,4).filter(b=>rec(b).done).length;$('#tokens').replaceChildren();blocks.slice(1,4).forEach((b,i)=>{let t=E('div','token'+(rec(b).done?' on':''));t.append(E('small','',`관문 ${i+1}`),document.createTextNode(rec(b).done?b.reward:'?'));$('#tokens').append(t)});$('#nodes').innerHTML=['부품 연결','흐름 복원','OS 인증'].map((t,i)=>`<div class="node ${i<n?'on':''}"><b>${i<n?'✓':['▥','⇢','⌘'][i]}</b>${t}</div>`).join('');$('#monitor').className='monitor'+(n?' power':'')+(n>=2?' boot':'')+(s.open?' open':'');$('#screenIcon').textContent=s.open?'✓':n===3?'▣':n===2?'⌘':n===1?'ϟ':'▣';$('#screenText').textContent=s.open?'정보실 시스템 복구 완료':['시스템 응답 없음','하드웨어 연결 확인','데이터 흐름 복원','잠금 번호 입력 대기'][n];$('#screenSub').textContent=s.open?'접속을 환영합니다.':['복구 장치를 점검하세요.','전원 신호가 돌아왔습니다.','운영 체제 인증을 진행하세요.','관문 번호 세 자리를 입력하세요.'][n];$('#systemNote').textContent=['부품의 역할을 연결해 복구를 시작하세요.','부품 연결 완료. 입력에서 출력까지의 흐름을 복원하세요.','화면이 응답합니다. 운영 체제 기능을 연결하세요.','세 장치를 복구했습니다. 번호를 모아 잠금을 해제하세요.'][n];if(s.open)$('#systemNote').textContent='잠금이 해제됐습니다. 마지막 메시지를 완성해 임무를 마치세요.';$('#route').innerHTML=['시작 점검','부품 연결','흐름 복원','OS 인증','잠금 해제','메시지 복원'].map((t,i)=>`<div class="stage ${i<s.step?'done':i===s.step?'current':''}" ${i===s.step?'aria-current="step"':''}><span class="step-circle">${i<s.step?'✓':i+1}</span><span class="stage-label">${t}</span><span class="stage-state">${i<s.step?'완료':i===s.step?'진행 중':'대기'}</span></div>`).join('');const work=$('#work');work.replaceChildren();if(s.step===6){work.innerHTML='<div class="completion"><strong>✓</strong><h2>정보실 복구 성공</h2><p>부품의 역할, 데이터의 흐름, 운영 체제의 기능을 연결했습니다.</p></div>';blocks.slice(1,4).forEach(b=>work.append(E('p','',`관문 ${b.gate} · ${rec(b).tries}회 시도`)));return}if(s.step===4){lock(work);return}const b=blocks[s.step===5?4:s.step],r=rec(b);work.append(E('h2','',['복구 대상 확인','부품을 제어 포트에 연결하기','데이터가 흐르는 순서 복원','운영 체제 기능 인증','', '시스템 메시지 완성'][s.step]),E('div','prompt',b.prompt));const board=E('div','board');work.append(board);if(b.kind==='choice')drawChoice(board,b,r);if(b.kind==='sort')drawSort(board,b,r);if(b.kind==='order')drawOrder(board,b,r);if(b.kind==='match')drawMatch(board,b,r);if(b.kind==='cloze')drawParts(board,b,r);addHint(work);if(r.done)board.querySelectorAll('button,select').forEach(e=>e.disabled=true);const actions=E('div','actions'),fb=E('div','feedback '+tone,message||(r.done?'복구 완료. 다음 장치로 이동하세요.':'조작을 마친 뒤 장치를 작동시키세요.'));fb.id='feedback';fb.setAttribute('role','status');fb.setAttribute('aria-live','polite');actions.append(fb,B(r.done?s.step===5?'임무 완료':'다음 장치 →':b.kind==='order'?'▶ 흐름 실행':'장치 작동',()=>r.done?go():check(b),'primary'));work.append(actions,E('div','attempts',`${r.tries}회 시도 · 오답은 수정 후 다시 실행할 수 있습니다.`));if(r.done)work.append(E('p','explain',b.explain))}function drawChoice(root,b,r){const box=E('div','choices');b.options.forEach((v,i)=>{const bt=B(v,()=>{r.input=i;save();render()},'choice'+(r.input===i?' selected':''));bt.setAttribute('aria-pressed',String(r.input===i));box.append(bt)});root.append(box)}function drawSort(root,b,r){if(!r.input)r.input=b.items.map(()=>null);root.append(E('p','hint','부품을 누른 뒤 연결할 포트를 누르세요. 옮기려면 부품을 다시 선택하세요.'));const bank=E('div','bank'),glyphs=['⌨','◉','▦','▥','▤','♫','▣'];b.items.forEach((v,i)=>{const bt=B('',()=>{selected=i;render()},'chip'+(selected===i?' selected':'')+(r.input[i]!=null?' assigned':''));bt.append(E('span','glyph',glyphs[i]),document.createTextNode(v.t),E('small','',r.input[i]==null?'미연결':b.groups[r.input[i]]));bt.setAttribute('aria-pressed',String(selected===i));bank.append(bt)});const docks=E('div','docks');b.groups.forEach((g,i)=>{const dock=B('',()=>{if(selected==null){feedback('먼저 연결할 부품을 선택하세요.');return}r.input[selected]=i;selected=null;save();render()},'dock');dock.append(E('strong','',g),E('small','',b.items.filter((_,j)=>r.input[j]===i).map(v=>v.t).join(' · ')||'부품 연결 대기'));docks.append(dock)});root.append(bank,docks)}function drawOrder(root,b,r){if(!r.input)r.input=[...b.start];root.append(E('p','hint','화살표로 이동해 순서를 정하세요. 실행하면 첫 단계부터 신호가 흐릅니다.'));const list=E('div','order');r.input.forEach((id,i)=>{const row=E('div','order-row');row.dataset.row=i;row.append(E('em','',String(i+1)),E('span','',b.items[id]));for(const [txt,d]of[['↑',-1],['↓',1]]){const bt=B(txt,()=>{[r.input[i],r.input[i+d]]=[r.input[i+d],r.input[i]];save();render()});bt.disabled=i+d<0||i+d>=r.input.length;bt.setAttribute('aria-label',`${i+1}번 단계 ${txt==='↑'?'위로':'아래로'}`);row.append(bt)}list.append(row)});root.append(list)}function drawMatch(root,b,r){if(!r.input)r.input=b.left.map(()=>null);root.append(E('p','hint','왼쪽 기능을 선택한 뒤 오른쪽 설명을 눌러 연결하세요. 번호가 같으면 연결된 쌍입니다.'));const links=E('div','links'),left=E('div','linkcol'),right=E('div','linkcol');b.left.forEach((v,i)=>{const bt=B('',()=>{selected=i;render()},'chip'+(selected===i?' selected':'')+(r.input[i]!=null?' linked':''));bt.append(E('span','number',String(i+1)),document.createTextNode(v));bt.setAttribute('aria-pressed',String(selected===i));left.append(bt)});b.shuffle.forEach(j=>{const owner=r.input.indexOf(j);const bt=B('',()=>{if(selected==null){feedback('먼저 왼쪽 기능을 선택하세요.');return}r.input=r.input.map(v=>v===j?null:v);r.input[selected]=j;selected=null;save();render()},owner<0?'':'linked');bt.append(E('span','number',owner<0?'·':String(owner+1)),document.createTextNode(b.right[j]));right.append(bt)});links.append(left,right);root.append(links)}function drawParts(root,b,r){const parts=b.parts.filter(v=>typeof v==='object');if(!r.input)r.input=parts.map(()=>null);const p=E('div','parts');let n=0;b.parts.forEach(v=>{if(typeof v==='string')p.append(document.createTextNode(v));else{const i=n++,sel=E('select');sel.setAttribute('aria-label',`${i+1}번째 빈칸`);const o=E('option','','선택');o.value='';sel.append(o);v.options.forEach(t=>{const o=E('option','',t);o.value=t;sel.append(o)});sel.value=r.input[i]??'';sel.onchange=()=>{r.input[i]=sel.value||null;save()};p.append(sel)}});root.append(p)}function valid(b,r){if(r.input==null||Array.isArray(r.input)&&r.input.some(v=>v==null))return null;switch(b.kind){case'choice':return r.input===b.answer;case'sort':return r.input.every((v,i)=>v===b.items[i].g);case'order':return r.input.every((v,i)=>v===i);case'match':return r.input.every((v,i)=>v===b.answer[i]);case'cloze':return b.parts.filter(v=>typeof v==='object').every((v,i)=>r.input[i]===v.answer)}}async function check(b){if(busy)return;const r=rec(b),ok=valid(b,r);if(r.done)return;if(ok==null){feedback('아직 연결하거나 선택하지 않은 항목이 있어요.');return}r.tries++;save();if(b.kind==='order'){busy=true;document.querySelectorAll('button').forEach(e=>e.disabled=true);feedback('입력된 순서대로 데이터 흐름을 점검합니다.');for(let i=0;i<r.input.length;i++){$('.order').querySelectorAll('.order-row').forEach((e,j)=>e.classList.toggle('playing',j===i));$('#screenText').textContent=b.items[r.input[i]];await new Promise(res=>setTimeout(res,650))}busy=false;$('#reset').disabled=false}r.done=ok;message=ok?b.reward?`복구 성공 · 잠금 번호 ${b.reward} 획득`:'점검 완료. 다음으로 진행하세요.':'장치가 응답하지 않아요. 연결 또는 순서를 다시 확인하세요.';tone=ok?'good':'bad';save();render();if(ok){$('#monitor').classList.remove('pulse');void $('#monitor').offsetWidth;$('#monitor').classList.add('pulse')}}function lock(work){work.append(E('h2','','세 자리 번호로 잠금 해제'),E('p','','관문 1 → 2 → 3에서 얻은 번호를 입력하세요.'));const pad=E('form','lockpad'),input=E('input','code');input.inputMode='numeric';input.maxLength=3;input.autocomplete='off';input.setAttribute('aria-label','잠금 번호');const keys=E('div','keys');['1','2','3','4','5','6','7','8','9','지움','0','해제'].forEach(t=>keys.append(B(t,()=>{if(t==='지움')input.value=input.value.slice(0,-1);else if(t==='해제')unlock();else if(input.value.length<3)input.value+=t})));const fb=E('div','feedback');fb.id='feedback';fb.setAttribute('role','status');function unlock(){if(input.value==='472'){s.open=true;save();go()}else feedback('번호가 맞지 않아요. 획득한 번호의 순서를 확인하세요.','bad')}pad.onsubmit=e=>{e.preventDefault();unlock()};pad.append(input,keys);work.append(pad,fb);addHint(work)}
function addHint(root){const hints=[

'손으로 만질 수 있는 장치, 장치가 일을 하도록 하는 프로그램, 컴퓨터의 자원을 관리하는 기본 프로그램을 떠올려 보세요.'
];const box=E('div','hint-area'),content=E('div','hint-content',hints[s.step]);content.id='stage-hint';content.hidden=true;const btn=B('◇ 힌트 보기',()=>{content.hidden=!content.hidden;btn.textContent=content.hidden?'◇ 힌트 보기':'◇ 힌트 접기';btn.setAttribute('aria-expanded',String(!content.hidden))},'hint-toggle');btn.setAttribute('aria-expanded','false');btn.setAttribute('aria-controls','stage-hint');box.append(btn,content);root.append(box)}
