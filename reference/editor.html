<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>활동지 편집 시제품</title><style>:root{--ink:#1f2a44;--sub:#4a5563;--mute:#6b7383;--line:#cfd6df;--line2:#e3e8ee;--soft:#f5f7fa;--bg:#eef1f5;--navy:#1f2a44;--navy2:#2e3d63;--sel:#e7eef8;--yellow:#ffdc58;--good:#1e7a46;--goodbg:#e6f4ec;--bad:#b3261e;--badbg:#fbeceb;--warn:#8a5a00;--warnbg:#fff4d6}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #6b8fd6;outline-offset:2px}

/* review toolbar (not part of the worksheet) */
.tb{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);padding:10px 16px}
.tb-in{max-width:880px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
.tb-tabs{display:flex;flex-wrap:wrap;gap:6px}
.tb-tabs button{min-height:36px;padding:0 12px;border-radius:18px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:600}
.tb-tabs button[aria-pressed=true]{background:var(--sel);border-color:var(--navy);color:var(--navy)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{min-height:36px;padding:0 12px;border:0;background:#fff;font-size:13px;font-weight:600}
.seg button[aria-pressed=true]{background:var(--navy);color:#fff}

/* worksheet */
.ws{max-width:880px;margin:16px auto 40px;background:#fff;border-radius:16px;box-shadow:0 4px 20px rgba(31,42,68,.08);overflow:hidden}
.ws-head{padding:22px 28px 16px;border-bottom:1px solid var(--line2)}
.ws-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--sub);margin-bottom:6px}
.tag{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;font-size:12px;font-weight:700;background:var(--soft);color:var(--sub);border:1px solid var(--line2)}
.tag.type{background:var(--sel);color:var(--navy);border-color:#c9d6ea}
.tag.game{background:var(--warnbg);color:var(--warn);border-color:#f0dca4}
.ws-head h1{margin:0 0 8px;font-size:24px;letter-spacing:-.02em;line-height:1.35}
.goal{display:flex;gap:8px;font-size:14px;color:var(--sub)}
.goal b{color:var(--ink);white-space:nowrap}
.name{display:flex;gap:14px;justify-content:flex-end;font-size:13px;color:var(--sub);margin-top:10px}
.name label{display:flex;align-items:center;gap:6px}
.nm{width:48px;min-height:34px;border:1px solid var(--line);border-radius:8px;text-align:center;font:inherit;color:var(--ink);background:#fff}
.nm.w{width:110px}
.nm.need{border-color:var(--bad);background:var(--badbg)}
.done-msg.warn{background:var(--badbg);color:var(--bad)}
.story{margin:14px 28px 0;padding:14px 16px;border-radius:12px;background:var(--soft);border-left:4px solid var(--navy);font-size:14px}
.story b{display:block;margin-bottom:2px}
.gates{display:flex;gap:8px;align-items:center;margin:12px 28px 0;flex-wrap:wrap}
.gate{display:flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:17px;border:1px dashed var(--line);font-size:13px;color:var(--mute);background:#fff}
.gate.done{border-style:solid;border-color:var(--good);color:var(--good);background:var(--goodbg);font-weight:700}
.gate .dg{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;background:#fff;border:1px solid currentColor;font-weight:800}
.gate-arrow{color:var(--line)}

.sec{padding:18px 28px 6px}
.sec-h{display:flex;align-items:center;gap:10px;margin:0 0 10px;font-size:17px}
.sec-h .n{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--navy);color:#fff;font-size:13px}
.blk{border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:0 0 14px;break-inside:avoid;position:relative}
.blk.locked{opacity:.45;pointer-events:none}
.blk.locked::after{content:"앞 관문을 통과하면 열려요";position:absolute;inset:0;display:grid;place-items:center;font-weight:700;color:var(--ink);background:rgba(255,255,255,.4);border-radius:12px}
.blk-top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.method{font-size:12px;font-weight:700;color:var(--mute)}
.gate-tag{font-size:12px;font-weight:800;color:var(--warn)}
.prompt{margin:0 0 12px;font-weight:600}

.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts.col{flex-direction:column}
.opt{min-height:44px;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:#fff;text-align:left;display:flex;align-items:center;gap:10px}
.opt .mk{flex:none;display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);font-size:12px;font-weight:800;color:var(--mute)}
.opt.sq .mk{border-radius:5px}
.opt[aria-pressed=true]{background:var(--sel);border-color:var(--navy)}
.opt[aria-pressed=true] .mk{background:var(--navy);border-color:var(--navy);color:#fff}
.opt.is-ans{box-shadow:inset 0 0 0 2px var(--good)}

.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px}
.btn{min-height:40px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:#fff;font-weight:700}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.sm{min-height:34px;padding:0 12px;font-size:13px}
.btn:disabled{opacity:.45;cursor:default}
.fb{font-size:14px;padding:8px 12px;border-radius:8px;display:none}
.fb.show{display:block}
.fb.ok{background:var(--goodbg);color:var(--good)}
.fb.no{background:var(--badbg);color:var(--bad)}
.fb.info{background:var(--soft);color:var(--sub)}
.explain{margin-top:8px;font-size:13.5px;color:var(--sub);background:var(--soft);border-radius:8px;padding:8px 12px;display:none}
.explain.show{display:block}
.explain b{color:var(--good)}
.hintbtn{background:none;border:0;padding:0;font-size:13px;color:var(--sub);text-decoration:underline;min-height:32px}
.hint{font-size:13px;color:var(--warn);background:var(--warnbg);padding:6px 10px;border-radius:8px;display:none}
.hint.show{display:block}
.reward{display:none;align-items:center;gap:10px;margin-top:10px;padding:10px 14px;border-radius:10px;background:var(--navy);color:#fff;font-weight:700}
.reward.show{display:flex}
.reward .dg{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:8px;background:var(--yellow);color:var(--ink);font-size:20px;font-weight:900}

/* code */
.code{background:#f7f8fb;border:1px solid var(--line2);border-radius:10px;padding:10px;font-size:14px;display:flex;flex-direction:column;gap:4px}
.code .ln{display:flex;align-items:center;gap:8px;min-height:32px;border-radius:6px;padding:0 4px;border:1px solid transparent;background:none;text-align:left;width:100%}
.code .ln .no{width:18px;font-size:11px;color:var(--mute);flex:none;text-align:right}
.code .ln .bk{display:inline-flex;align-items:center;height:28px;padding:0 10px;border-radius:6px;font-weight:600;color:#fff}
.bk.loop{background:#6b7fa8}.bk.if{background:#7a8a6a}.bk.act{background:#5b6474}.bk.ev{background:#8a6f5a}
.code.click .ln:hover{background:#eef2f8}
.code .ln[aria-pressed=true]{background:var(--warnbg);border-color:#e8c46a}
.code .ln.is-ans{box-shadow:inset 0 0 0 2px var(--good)}
.code-cap{font-size:12px;font-weight:800;color:var(--sub);margin-bottom:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
@media (max-width:640px){.two{grid-template-columns:1fr}}

/* table */
.tbl{width:100%;border-collapse:collapse;font-size:14px;margin-top:10px}
.tbl th,.tbl td{border:1px solid var(--line);padding:6px 10px;text-align:center}
.tbl th{background:var(--soft);font-weight:700;font-size:13px}
.tbl input,.tbl select{width:100%;max-width:120px;min-height:36px;border:1px solid var(--line);border-radius:8px;text-align:center;font:inherit;background:#fff}
.tbl .is-ans{border-color:var(--good);background:var(--goodbg)}
.tbl td.wrong input,.tbl td.wrong select{border-color:var(--bad);background:var(--badbg)}

/* fix sentence */
.sent{font-size:17px;line-height:2.3}
.slot{display:inline-flex;align-items:center;min-height:34px;padding:0 10px;margin:0 2px;border-radius:8px;border:1.5px dashed #9aa6b8;background:#fff;font-weight:700}
.slot[aria-expanded=true]{border-style:solid;border-color:var(--navy);background:var(--sel)}
.slot.changed{border-style:solid;border-color:var(--navy)}
.slot.is-ans{border-color:var(--good);background:var(--goodbg)}
.slot-menu{display:none;gap:6px;flex-wrap:wrap;margin-top:6px;padding:8px;border-radius:10px;background:var(--soft)}
.slot-menu.show{display:flex}

/* bit cards */
.bit-row{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:10px 0;border-top:1px dashed var(--line2)}
.bit-row:first-of-type{border-top:0}
.bit-target{min-width:90px;font-weight:800}
.bit-target small{display:block;font-weight:600;color:var(--mute);font-size:12px}
.cards{display:flex;gap:6px}
.card{width:58px;height:74px;border-radius:10px;border:1.5px solid var(--line);background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.card .v{font-size:20px;font-weight:900}
.card .b{font-size:12px;color:var(--mute);font-weight:700}
.card[aria-pressed=false]{background:var(--soft)}
.card[aria-pressed=false] .v{color:#c3cad5}
.card[aria-pressed=true]{border-color:var(--navy);background:var(--sel)}
.card[aria-pressed=true] .b{color:var(--navy)}
.bit-sum{font-size:13px;color:var(--sub)}
.bit-sum b{font-size:15px;color:var(--ink)}

/* reveal */
.reveal{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start}
.rv-box{position:relative;width:200px;height:200px;border-radius:10px;overflow:hidden;border:1px solid var(--line);flex:none}
.rv-box svg{display:block}
.rv-tiles{position:absolute;inset:0;display:grid}
.rv-tiles button{border:1px solid #3a4870;background:var(--navy2);color:#9fb0d4;font-weight:800}
.rv-tiles button:hover{background:#3a4c7a}
.rv-tiles button.open{visibility:hidden}
.rv-side{flex:1;min-width:220px}
.rv-count{font-size:13px;color:var(--sub);margin-bottom:8px}

/* maze */
.maze-path{display:flex;align-items:center;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.mz{display:inline-grid;place-items:center;min-width:30px;height:30px;padding:0 8px;border-radius:15px;border:1.5px solid var(--line);font-size:12px;font-weight:800;color:var(--mute);background:#fff}
.mz.cur{border-color:var(--navy);color:var(--navy)}
.mz.done{background:var(--navy);border-color:var(--navy);color:#fff}
.mz-line{width:18px;height:2px;background:var(--line)}
.doors{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:640px){.doors{grid-template-columns:1fr}}
.door{min-height:96px;padding:12px 14px;border-radius:12px 12px 4px 4px;border:1.5px solid var(--line);border-top:6px solid var(--navy2);background:#fff;text-align:left;font-size:14px}
.door:hover{background:var(--soft)}
.door .dl{display:block;font-size:12px;font-weight:800;color:var(--mute);margin-bottom:4px}
.door.dead{border-top-color:var(--bad);background:var(--badbg);animation:shake .3s}
.door.is-ans{box-shadow:inset 0 0 0 2px var(--good)}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.maze-exit{padding:14px;border-radius:12px;background:var(--goodbg);color:var(--good);font-weight:700;display:none}
.maze-exit.show{display:block}

/* lock */
.lockbox{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.lock-ic{width:54px;height:54px;border-radius:14px;background:var(--navy);display:grid;place-items:center;color:var(--yellow);font-size:26px}
.lock-digits{display:flex;gap:8px}
.lock-digits input{width:52px;height:60px;border-radius:10px;border:2px solid var(--line);text-align:center;font-size:26px;font-weight:900;font-family:inherit}
.lockbox.open .lock-ic{background:var(--good);color:#fff}

/* hotspot: invented social post */
.post{max-width:520px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}
.post-h{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line2);font-weight:700;font-size:14px}
.post-av{width:32px;height:32px;border-radius:50%;background:#d9dfe8}
.post-img{height:120px;background:linear-gradient(135deg,#dfe6f0,#c9d3e2);display:grid;place-items:center;color:#7b879b;font-size:13px}
.post-t{padding:12px 14px;font-size:15px;line-height:2}
.spot{display:inline;padding:2px 3px;border-radius:5px;border:0;background:none;font:inherit;line-height:inherit;border-bottom:1.5px dotted #9aa6b8;cursor:pointer}
.spot:hover{background:#f1f4f9}
.spot[aria-pressed=true]{background:var(--warnbg);border-bottom:2px solid #c7951b;font-weight:700}
.spot.is-ans{outline:2px solid var(--good)}
.spot-count{font-size:13px;color:var(--sub);margin-top:8px}

/* label */
.label-wrap{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start}
.board{position:relative;width:300px;flex:none}
.board svg{display:block;width:100%}
.pin{position:absolute;transform:translate(-50%,-50%);width:28px;height:28px;border-radius:50%;background:var(--yellow);border:2px solid var(--ink);display:grid;place-items:center;font-weight:900;font-size:13px}
.label-list{flex:1;min-width:220px;display:flex;flex-direction:column;gap:8px}
.label-list label{display:flex;align-items:center;gap:10px;font-weight:700}
.label-list .pinn{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--yellow);border:2px solid var(--ink);font-size:12px}
.label-list select{flex:1;min-height:40px;border:1px solid var(--line);border-radius:8px;padding:0 8px;font:inherit;background:#fff}
.label-list select.is-ans{border-color:var(--good);background:var(--goodbg)}

/* match */
.match{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:12px 70px}
.match svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.mcol{display:flex;flex-direction:column;gap:10px}
.mi{min-height:46px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:#fff;text-align:left;display:flex;align-items:center;gap:8px;position:relative;z-index:1}
.mi .mb{flex:none;display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;font-size:12px;font-weight:800;border:1.5px solid var(--line);color:var(--mute)}
.mi.picked{background:var(--sel);border-color:var(--navy)}
.mi.paired .mb{background:var(--navy);border-color:var(--navy);color:#fff}
.mi.is-ans{box-shadow:inset 0 0 0 2px var(--good)}

/* order */
.order{display:flex;flex-direction:column;gap:8px;counter-reset:o}
.oi{display:flex;align-items:center;gap:10px;min-height:46px;padding:4px 6px 4px 12px;border-radius:10px;border:1px solid var(--line);background:#fff}
.oi .on{width:24px;font-weight:800;color:var(--mute)}
.oi .bk{flex:1}
.oi .ob{display:flex;gap:4px}
.oi .ob button{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:#fff;font-weight:800}
.oi .ob button:disabled{opacity:.3}
.oi.is-ans{box-shadow:inset 0 0 0 2px var(--good)}
.oi.moved{background:var(--sel)}

/* place: sort & venn */
.bank{display:flex;flex-wrap:wrap;gap:8px;min-height:50px;padding:10px;border-radius:10px;background:var(--soft);border:1px dashed var(--line);margin-bottom:12px}
.bank-empty{font-size:13px;color:var(--mute);align-self:center}
.chip{min-height:38px;padding:4px 12px;border-radius:19px;border:1px solid var(--line);background:#fff;font-size:14px;font-weight:600}
.chip[aria-pressed=true]{background:var(--navy);border-color:var(--navy);color:#fff}
.chip.is-ans{box-shadow:inset 0 0 0 2px var(--good)}
.chip.wrong{border-color:var(--bad);background:var(--badbg)}
.zones{display:grid;gap:10px}
.zone{min-height:120px;border-radius:12px;border:1.5px solid var(--line);padding:10px;background:#fff;text-align:left;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.zone .zt{font-size:13px;font-weight:800;color:var(--sub)}
.zone .zc{display:flex;flex-wrap:wrap;gap:6px}
.zones.armed .zone{border-color:var(--navy);border-style:dashed;background:#fbfcfe}
.place-tip{font-size:12.5px;color:var(--mute);margin:-4px 0 10px}
.venn{position:relative;height:300px;max-width:720px}
.venn .c{position:absolute;top:0;width:58%;height:100%;border-radius:50%;border:2px solid #9aa9c4}
.venn .c.a{left:0;background:rgba(107,127,168,.07)}
.venn .c.b{right:0;background:rgba(122,138,106,.08);border-color:#a9b79a}
.venn .vz{position:absolute;top:12%;height:76%;display:flex;flex-direction:column;align-items:center;gap:6px;padding:6px;border-radius:12px;border:1.5px dashed transparent;background:none;justify-content:flex-start}
.venn .vz .zt{font-size:12.5px;font-weight:800;color:var(--sub);text-align:center}
.venn .vz .zc{display:flex;flex-direction:column;gap:5px;align-items:center}
.venn .vz .chip{font-size:12.5px;min-height:32px;padding:2px 10px;max-width:100%}
.venn .vz.A{left:2%;width:31%}.venn .vz.AB{left:34%;width:32%}.venn .vz.B{left:67%;width:31%}
.venn.armed .vz{border-color:var(--navy);background:rgba(231,238,248,.55)}
@media (max-width:640px){.venn{height:auto}.venn .c{display:none}.venn .vz{position:static;width:auto!important;border:1.5px solid var(--line);margin-bottom:8px}}

/* chart */
.chart svg{width:100%;max-width:560px;display:block}

/* story */
.st-log{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.st-node{padding:10px 14px;border-radius:12px;background:var(--soft);font-size:14.5px}
.st-pick{align-self:flex-end;max-width:80%;padding:8px 12px;border-radius:12px;background:var(--sel);font-size:14px;font-weight:600;color:var(--navy)}
.st-end{padding:12px 14px;border-radius:12px;font-weight:600}
.st-end.good{background:var(--goodbg);color:var(--good)}
.st-end.bad{background:var(--badbg);color:var(--bad)}
.st-end b{display:block;margin-bottom:2px}

/* write */
textarea{width:100%;min-height:84px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;resize:vertical}
.ai-note{font-size:12px;color:var(--mute)}
.sample{display:none;margin-top:8px;font-size:13.5px;background:var(--goodbg);color:var(--good);padding:8px 12px;border-radius:8px}
.sample.show{display:block}
.note{background:var(--soft);border-radius:10px;padding:12px 14px;font-size:14px}
.note label{display:flex;gap:8px;align-items:center;margin-top:8px;font-weight:700}
.note input{width:18px;height:18px}

/* submit */
.submit{padding:10px 28px 26px;border-top:1px solid var(--line2);margin-top:6px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.submit .sum{font-size:14px;color:var(--sub)}
.submit .sum b{color:var(--ink)}
.done-msg{display:none;margin:0 28px 24px;padding:14px 16px;border-radius:12px;background:var(--goodbg);color:var(--good);font-weight:700}
.done-msg.show{display:block}

/* teacher answer mode */
.ans-mode .explain,.ans-mode .sample{display:block}

@media print{
  .tb,.row,.hintbtn,.submit,.fb,.rv-tiles,.reward,.maze-path{display:none!important}
  body{background:#fff}.ws{box-shadow:none;margin:0;border-radius:0}
  .nm{border:0;border-bottom:1px solid var(--ink);border-radius:0;background:none}
  .blk.locked{opacity:1}.blk.locked::after{display:none}
}
@media (max-width:640px){
  .ws{margin:0;border-radius:0}.ws-head,.sec,.submit{padding-left:16px;padding-right:16px}.story,.gates{margin-left:16px;margin-right:16px}
  .match{gap:10px 34px}
}

/* blanks (cloze) */
.slot.blank{min-width:86px;justify-content:center;border-style:dashed;border-color:var(--navy);color:var(--mute)}
.blk.locked::after{content:"앞 관문을 통과하면 열려요"}
.blk.locked[data-lockmsg]::after{content:attr(data-lockmsg)}

/* edit mode (preview inside editor) */
.ed{cursor:pointer;transition:box-shadow .12s}
.blk.ed > *:not(.blk-top), .ws-head.ed > *{pointer-events:none}
.blk.ed:hover,.ws-head.ed:hover{box-shadow:0 0 0 2px #b9c7de}

    b.bars.forEach((x, i) => {
      const bh = (x.v / max) * (H - pad * 2), X = pad + i * bw + bw * .2, Y = H - pad - bh;
      s += `<rect x="${X}" y="${Y}" width="${bw * .6}" height="${bh}" rx="4" fill="#6b7fa8"/><text x="${X + bw * .3}" y="${Y - 6}" font-size="12" font-weight="700" text-anchor="middle" fill="#1f2a44">${x.v}</text>`;
      s += `<text x="${X + bw * .3}" y="${H - pad + 15}" font-size="12" font-weight="700" text-anchor="middle" fill="#1f2a44">${x.label}</text><text x="${X + bw * .3}" y="${H - pad + 29}" font-size="11" text-anchor="middle" fill="#6b7383">${x.sub}</text>`;
    });
    s += `<text x="${pad}" y="14" font-size="11" fill="#6b7383">(${b.unit})</text></svg>`;
    const q = C.choice({ options: b.options, answer: b.answer }, ctx);
    return { el: h('div', { class: 'chart' }, [h('div', { html: s }), h('p', { class: 'prompt', style: 'margin:10px 0 8px' }, b.question), q.el]), answered: q.answered, check: q.check, reveal: q.reveal };
  };

  C.story = function (b, ctx) {
    const log = h('div', { class: 'st-log' });
    const opts = h('div', { class: 'opts col' });
    let ended = null;
    function go(id, pickText) {
      if (pickText) log.append(h('div', { class: 'st-pick' }, pickText));
      const n = b.nodes[id];
      opts.innerHTML = '';
      if (n.end) {
        ended = n.end;
        log.append(h('div', { class: 'st-end ' + n.end }, [h('b', null, n.end === 'good' ? '좋은 대응이에요' : '이런 결과가 생겼어요'), n.text]));
        opts.append(h('button', { class: 'btn sm', type: 'button', onclick: restart }, '처음부터 다시 해 보기'));
        ctx.changed();
        return;
      }
      log.append(h('div', { class: 'st-node' }, n.text));
      n.choices.forEach(([t, to]) => opts.append(h('button', { class: 'opt', type: 'button', onclick: () => go(to, t) }, [h('span', { class: 'mk' }, '›'), t])));
    }
    function restart() { log.innerHTML = ''; ended = null; go(b.start); }
    go(b.start);
    return { el: h('div', null, [log, opts]), answered: () => !!ended, check: () => ended === 'good', ungraded: true, reveal: () => {} };
  };

  C.write = function (b, ctx) {
    const ta = h('textarea', { 'aria-label': '답 쓰기', placeholder: '여기에 써 보세요', oninput: ctx.changed });
    const sample = b.sample ? h('div', { class: 'sample' }, '예시 답: ' + b.sample) : null;
    const need = b.minKeywords || (b.keywords || []).length;
    return {
      el: h('div', null, [ta, b.keywords && b.keywords.length ? h('div', { class: 'ai-note' }, '제출하면 AI가 핵심 단어가 들어갔는지 확인해요 (체험)') : null, sample]),
      answered: () => ta.value.trim().length > 4,
      ungraded: b.graded === false || !(b.keywords && b.keywords.length),
      check: () => { const hit = (b.keywords || []).filter(k => ta.value.includes(k)); return hit.length >= need; },
      detail: () => { const kw = b.keywords || []; const hit = kw.filter(k => ta.value.includes(k)); const miss = kw.filter(k => !ta.value.includes(k)); return `핵심 단어 ${hit.length}/${kw.length}개 포함` + (hit.length < need && miss.length ? ` · '${miss.slice(0, 2).join("', '")}'을(를) 넣어 다시 써 볼까요?` : ''); },
      reveal: () => { if (sample) sample.classList.add('show'); }
    };
  };

  C.note = function (b, ctx) {
    const cb = h('input', { type: 'checkbox', onchange: ctx.changed });
    return { el: h('div', { class: 'note' }, [h('label', null, [cb, '실행해서 확인했어요'])]), answered: () => cb.checked, check: () => cb.checked, ungraded: true, reveal: () => {} };
  };

  /* ---------- sheet ---------- */
  function render(sheet, root, opt) {
    opt = opt || {};
    root.innerHTML = '';
    const [typeName, isGame] = TYPE[sheet.type];
    const blocks = [];
    const gates = {};
    const ws = h('article', { class: 'ws' + (opt.answers ? ' ans-mode' : ''), 'data-id': sheet.id });

    const unitLabel = opt.unitLabel ? opt.unitLabel(sheet.unit) : sheet.unit;
    ws.append(h('header', { class: 'ws-head' }, [
      h('div', { class: 'ws-meta' }, [h('span', { class: 'tag type' }, typeName), h('span', null, unitLabel + ' · ' + sheet.minutes + '분')]),
      h('h1', null, sheet.title),
      h('div', { class: 'goal' }, [h('b', null, '학습목표'), sheet.goal]),
      h('div', { class: 'name' }, [
        h('label', null, ['반', h('input', { class: 'nm', inputmode: 'numeric', maxlength: '2', 'data-f': 'cls' })]),
        h('label', null, ['번호', h('input', { class: 'nm', inputmode: 'numeric', maxlength: '2', 'data-f': 'no' })]),
        h('label', null, ['이름', h('input', { class: 'nm w', maxlength: '10', 'data-f': 'name' })])
      ])
    ]));
    if (opt.edit) { const hd = ws.querySelector('.ws-head'); hd.classList.add('ed'); if (opt.edit.selected == null) hd.classList.add('sel'); hd.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); opt.edit.onSelect(null); }, true); }
    if (sheet.story) ws.append(h('div', { class: 'story' }, [h('b', null, sheet.type === 'escape' ? '미션' : '사건 개요'), sheet.story]));
    let gateBar = null;
    if (sheet.type === 'escape') { gateBar = h('div', { class: 'gates' }); ws.append(gateBar); }

    // 보이는 관문만 순서대로 번호를 매기고, 금고 번호도 그 관문들에서 만든다
    let gi = 0; const lockDigits = [];
    sheet.sections.forEach(sec => sec.blocks.forEach(b => { delete b._g; if (b.gate && !b.hidden) { b._g = ++gi; lockDigits.push(b.reward); } }));
    let secNo = 0;
    sheet.sections.forEach(sec => {
      if (sec.role === 'wrap' && sheet.wrapOn === false) return;
      const vis = sec.blocks.filter(b => !b.hidden);
      if (!vis.length && !(sec.role === 'main' && sheet.lock)) return;
      const s = h('section', { class: 'sec' }, [h('h2', { class: 'sec-h' }, [h('span', { class: 'n' }, String(++secNo)), sec.title])]);
      vis.forEach(b => s.append(block(b)));
      if (sec.role === 'main' && sheet.lock && lockDigits.length) s.append(lockBlock(lockDigits));
      ws.append(s);
    });

    const sum = h('div', { class: 'sum' });
    const submitBtn = h('button', { class: 'btn pri', type: 'button', onclick: submit }, '제출하기');
    const done = h('div', { class: 'done-msg' });
    ws.append(h('div', { class: 'submit' }, [sum, submitBtn]), done);
    root.append(ws);
    ws.addEventListener('input', e => { if (e.target.classList.contains('nm')) e.target.classList.remove('need'); });
    paintGates(); paintSum();
    if (opt.answers) blocks.forEach(x => { x.api.reveal(); if (x.b._g) x.passed = true; x.el.classList.remove('locked'); x.reward && x.reward.classList.add('show'); });
    paintGates();
    blocks.forEach(x => x.api.redraw && x.api.redraw());

    function block(b) {
      const fb = h('div', { class: 'fb' });
      const explain = b.explain ? h('div', { class: 'explain', html: '<b>설명</b> ' + b.explain }) : null;
      const hint = b.hint ? h('div', { class: 'hint' }, '힌트: ' + b.hint) : null;
      const rec = { b, tries: 0, passed: false, fb, explain };
      const ctx = {
        changed: () => { fb.classList.remove('show'); if (!opt.answers) { rec.passed = false; if (explain) explain.classList.remove('show'); } paintSum(); },
        tried: () => { rec.tries++; },
        say: (t, k) => { fb.className = 'fb show ' + k; fb.textContent = t; },
        autoCheck: () => doCheck()
      };
      const api = (C[b.kind] || C.note)(b, ctx);
      rec.api = api;
      const checkBtn = api.selfCheck || api.ungraded ? null : h('button', { class: 'btn sm', type: 'button', onclick: doCheck }, b._g ? '관문 확인' : '확인');
      const reward = b.reward ? h('div', { class: 'reward' }, [h('span', { class: 'dg' }, b.reward), `관문 ${b._g} 통과! 금고 번호 하나를 얻었어요.`]) : null;
      rec.reward = reward;
      function doCheck() {
        if (!api.answered()) { ctx.say('먼저 답을 골라 주세요.', 'info'); return; }
        if (!api.selfCheck) rec.tries++;
        const ok = api.check();
        rec.passed = ok;
        if (ok) {
          if (api.selfCheck) fb.classList.remove('show');
          else ctx.say(b.kind === 'write' ? '좋아요. ' + api.detail() : '맞았어요!', 'ok');
          if (explain) explain.classList.add('show');
          if (reward) reward.classList.add('show');
          if (api.onOk) api.onOk();
          paintGates();
        } else {
          ctx.say(b.kind === 'write' ? api.detail() : '아직 아니에요. 다시 살펴보세요.' + (rec.tries >= 2 && hint ? ' 힌트를 열어 봐도 좋아요.' : ''), 'no');
        }
        paintSum();
      }
      const top = h('div', { class: 'blk-top' }, [b._g ? h('span', { class: 'gate-tag' }, '관문 ' + b._g) : null, (opt.answers || opt.edit) ? h('span', { class: 'method' }, b.method) : null]);
      const row = h('div', { class: 'row' }, [checkBtn, hint ? h('button', { class: 'hintbtn', type: 'button', onclick: () => hint.classList.toggle('show') }, '힌트 보기') : null]);
      const codeTop = b.code && b.kind !== 'table' ? h('div', { style: 'margin-bottom:12px' }, codeView(b.code)) : null;
      const el = h('div', { class: 'blk', 'data-b': b.id }, [top, h('p', { class: 'prompt' }, b.prompt), codeTop, api.el, (checkBtn || hint) ? row : null, hint, fb, explain, reward]);
      rec.el = el;
      blocks.push(rec);
      if (b._g) gates[b._g] = rec;
      if (b.afterLock && !opt.answers && !opt.edit) { rec.afterLock = true; el.classList.add('locked'); el.setAttribute('data-lockmsg', '금고를 열면 나타나요'); }
      if (opt.edit) {
        el.classList.add('ed');
        if (opt.edit.selected === b.id) el.classList.add('sel');
        const mk = opt.edit.marks && opt.edit.marks[b.id];
        if (mk) { el.classList.add('mk-' + mk); top.append(h('span', { class: 'mk-badge ' + mk }, mk === 'ai' ? 'AI 제안' : mk === 'aians' ? 'AI 제안 · 정답 바뀜' : '정답 확인 필요')); }
        el.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); opt.edit.onSelect(b.id); }, true);
      }
      return el;
    }

    function lockBlock(digits) {
      const lock = { answer: digits.join(''), explain: digits.map((d, i) => `관문 ${i + 1}에서 ${d}`).join(', ') + '을(를) 얻었어요.' };
      const ins = digits.map((_, i) => h('input', { inputmode: 'numeric', maxlength: '1', 'aria-label': (i + 1) + '번째 숫자', oninput: e => { e.target.value = e.target.value.replace(/\D/g, ''); if (e.target.value && ins[i + 1]) ins[i + 1].focus(); } }));
      const fb = h('div', { class: 'fb' });
      const box = h('div', { class: 'lockbox' }, [h('div', { class: 'lock-ic', 'aria-hidden': 'true' }, '🔒'), h('div', { class: 'lock-digits' }, ins), h('button', { class: 'btn pri', type: 'button', onclick: () => {
        const v = ins.map(x => x.value).join('');
        if (v === lock.answer) { box.classList.add('open'); box.querySelector('.lock-ic').textContent = '🔓'; blocks.filter(x => x.afterLock).forEach(x => x.el.classList.remove('locked')); fb.className = 'fb show ok'; fb.textContent = '금고가 열렸어요! ' + lock.explain; }
        else { fb.className = 'fb show no'; fb.textContent = '번호가 맞지 않아요. 관문에서 얻은 숫자를 순서대로 넣어 보세요.'; }
      } }, '금고 열기')]);
      if (opt.answers) lock.answer.split('').forEach((d, i) => ins[i].value = d);
      return h('div', { class: 'blk' }, [h('div', { class: 'blk-top' }, [h('span', { class: 'gate-tag' }, '마지막'), h('span', { class: 'method' }, '자물쇠 번호')]), h('p', { class: 'prompt' }, `관문에서 얻은 숫자 ${digits.length}개를 순서대로 넣어 금고를 여세요.`), box, fb]);
    }

    function paintGates() {
      const keys = Object.keys(gates).map(Number).sort();
      keys.forEach(k => { const prev = gates[k - 1]; gates[k].el.classList.toggle('locked', !!prev && !prev.passed && !opt.answers && !opt.edit); });
      if (!gateBar) return;
      gateBar.innerHTML = '';
      keys.forEach((k, i) => {
        const g = gates[k];
        if (i) gateBar.append(h('span', { class: 'gate-arrow' }, '›'));
        gateBar.append(h('span', { class: 'gate' + (g.passed ? ' done' : '') }, ['관문 ' + k, h('span', { class: 'dg' }, g.passed ? g.b.reward : '?')]));
      });
      gateBar.append(h('span', { class: 'gate-arrow' }, '›'), h('span', { class: 'gate' }, '🔒 금고'));
    }

    function paintSum() {
      const graded = blocks.filter(x => !x.api.ungraded);
      const answered = blocks.filter(x => x.api.answered()).length;
      sum.innerHTML = `답한 문항 <b>${answered}/${blocks.length}</b> · 확인해서 맞힌 문항 <b>${graded.filter(x => x.passed).length}/${graded.length}</b>`;
    }

    function submit() {
      const who = [...ws.querySelectorAll('.nm')];
      const empty = who.find(x => !x.value.trim());
      if (empty) { empty.focus(); empty.classList.add('need'); done.classList.add('show'); done.classList.add('warn'); done.textContent = '반, 번호, 이름을 먼저 적어 주세요.'; return; }
      done.classList.remove('warn');
      const left = blocks.filter(x => !x.api.answered());
      if (left.length && !confirm(`아직 답하지 않은 문항이 ${left.length}개 있어요. 그래도 제출할까요?`)) return;
      const graded = blocks.filter(x => !x.api.ungraded);
      const res = graded.map(x => ({ id: x.b.id, ok: x.api.answered() && x.api.check(), tries: x.tries }));
      const okN = res.filter(r => r.ok).length;
      done.classList.add('show');
      done.textContent = `선생님께 제출했어요. 자동 확인 결과 ${okN}/${graded.length}문항이 맞았어요. 선생님 피드백이 오면 알려 드릴게요.`;
      submitBtn.disabled = true;
      if (opt.onSubmit) opt.onSubmit({ id: sheet.id, results: res, at: Date.now() });
    }
  }

  window.WS = { render, TYPE };
})();
</script>
<script>/* 고쳐서 배포 · 내용 수정 시제품: 왼쪽 미리보기 + 오른쪽 [편집 | AI로 고치기] */
(function () {
  'use strict';
  const clone = o => JSON.parse(JSON.stringify(o));
  const $ = s => document.querySelector(s);
  function h(tag, attrs, kids) {
    const el = document.createElement(tag);
    if (attrs) for (const k in attrs) {
      const v = attrs[k];
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'html') el.innerHTML = v;
      else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? '' : v);
    }
    [].concat(kids || []).forEach(c => { if (c == null || c === false) return; el.append(c.nodeType ? c : document.createTextNode(c)); });
    return el;
  }

  const ORIG = clone(window.SHEETS);
  const ST = ORIG.map(s => ({ sheet: clone(s), sel: null, tab: 'edit', check: new Set(), hist: [], chat: [], prop: null }));
  let ci = 0;
  const S = () => ST[ci];
  const WRAP_NAME = { escape: '금고 속 메시지', mystery: '사건 보고서' };

  function find(sheet, id) {
    for (const sec of sheet.sections) { const i = sec.blocks.findIndex(b => b.id === id); if (i >= 0) return { b: sec.blocks[i], sec, i }; }
    return null;
  }
  function gateNo(sheet, id) { let n = 0; for (const sec of sheet.sections) for (const b of sec.blocks) { if (b.gate && !b.hidden) n++; if (b.id === id) return b.hidden ? '숨김' : n; } return ''; }
  function snapshot() { const s = S(); s.hist.push({ sheet: clone(s.sheet), check: [...s.check] }); if (s.hist.length > 40) s.hist.shift(); paintTop(); }

  /* ---------- top bar ---------- */
  function paintTop() {
    const tabs = $('#tabs'); tabs.innerHTML = '';
    ST.forEach((s, i) => tabs.append(h('button', { type: 'button', 'aria-pressed': String(i === ci), title: s.sheet.title, onclick: () => { ci = i; all(); } }, WS.TYPE[s.sheet.type][0])));
    $('#undo').disabled = !S().hist.length;
    const n = S().hist.length;
    $('#chg').textContent = n ? `고친 횟수 ${n}` : '아직 고친 곳 없음';
  }
  $('#undo').onclick = () => { const s = S(); const p = s.hist.pop(); if (!p) return; s.sheet = p.sheet; s.check = new Set(p.check); s.prop = null; all(); };
  $('#reset').onclick = () => { const s = S(); if (!s.hist.length) return; if (!confirm('이 활동지를 원본으로 되돌릴까요? 고친 내용이 모두 사라져요.')) return; s.sheet = clone(ORIG[ci]); s.check.clear(); s.hist = []; s.prop = null; s.chat.push({ who: 'sys', t: '원본으로 되돌렸어요.' }); all(); };

  /* ---------- preview ---------- */
  function paintPreview() {
    const s = S();
    const view = s.prop ? s.prop.sheet : s.sheet;
    const marks = {};
    if (s.prop) { s.prop.changed.forEach(id => marks[id] = 'ai'); s.prop.ans.forEach(id => marks[id] = 'aians'); }
    else s.check.forEach(id => marks[id] = 'check');
    WS.render(clone(view), $('#preview'), {
      answers: true, unitLabel: c => (window.UNITS || {})[c] || c,
      edit: { selected: s.sel, marks, onSelect: id => { s.sel = id; paintPreview(); paintPanel(); } }
    });
    if (s.sel) { const el = document.querySelector(`[data-b="${s.sel}"]`); if (el) { const r = el.getBoundingClientRect(); if (r.top < 70 || r.bottom > innerHeight) el.scrollIntoView({ block: 'center', behavior: 'smooth' }); } }
  }

  /* ---------- panel ---------- */
  function paintPanel() {
    const s = S();
    const f = s.sel ? find(s.sheet, s.sel) : null;
    const target = $('#target');
    target.innerHTML = '';
    target.append(h('span', { class: 'tg-l' }, '대상'), h('span', { class: 'tg-chip' + (f ? '' : ' all') }, [f ? (f.b.gate ? `관문 ${gateNo(s.sheet, f.b.id)} · ` : '') + f.b.method : '활동지 전체', f ? h('button', { type: 'button', 'aria-label': '대상 해제', onclick: () => { s.sel = null; paintPreview(); paintPanel(); } }, '✕') : null]));
    document.querySelectorAll('#ptabs button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.t === s.tab)));
    const body = $('#pbody'); body.innerHTML = '';
    if (s.tab === 'edit') body.append(f ? editBlock(f) : editSheet()); else body.append(aiPane(f));
  }
  document.querySelectorAll('#ptabs button').forEach(b => b.onclick = () => { S().tab = b.dataset.t; paintPanel(); });

  /* field helpers */
  let pending = null;
  function onFocus() { pending = clone(S().sheet); pending.__check = [...S().check]; }
  function commit() { if (!pending) return; const s = S(); s.hist.push({ sheet: pending, check: pending.__check }); delete pending.__check; pending = null; paintTop(); }
  function tie(id) { S().check.add(id); paintCheckBanner(id); }
  function inp(value, on, o) {
    o = o || {};
    const el = h(o.area ? 'textarea' : 'input', { class: 'fi' + (o.small ? ' sm' : ''), rows: o.area ? (o.rows || 2) : null, type: o.area ? null : (o.num ? 'number' : 'text'),
      onfocus: onFocus, onchange: commit,
      oninput: e => { on(e.target.value); if (o.tied) tie(o.tied); paintPreview(); } });
    el.value = value == null ? '' : value;
    return el;
  }
  function field(label, control, help) { return h('div', { class: 'fld' }, [h('label', { class: 'fl' }, label), control, help ? h('div', { class: 'fh' }, help) : null]); }
  function group(title, kids, note) { return h('div', { class: 'grp' }, [h('div', { class: 'gt' }, title), note ? h('div', { class: 'fh' }, note) : null].concat(kids)); }
  function pick(type, name, checked, on, label) {
    return h('label', { class: 'pk', title: label }, [h('input', { type, name, checked: checked || null, onfocus: onFocus, onchange: e => { on(e.target.checked); commit(); clearCheck(); paintPreview(); } }), h('span', null, label)]);
  }
  let curId = null;
  function clearCheck() { if (curId && S().check.has(curId)) { /* 교사가 정답을 직접 고르면 확인한 것으로 봄 */ S().check.delete(curId); paintCheckBanner(curId); } }
  function paintCheckBanner(id) {
    const ban = document.getElementById('ckban');
    if (!ban) return;
    const on = S().check.has(id);
    ban.style.display = on ? 'flex' : 'none';
  }

  function editBlock(f) {
    const s = S(), b = f.b; curId = b.id;
    const wrap = h('div');
    const secBlocks = f.sec.blocks;
    wrap.append(h('div', { class: 'bh' }, [
      h('div', null, [h('div', { class: 'bm' }, b.method), h('div', { class: 'fh' }, `활동 방법은 바꿀 수 없어요. 내용만 고칠 수 있어요.`)]),
      h('div', { class: 'bh-act' }, [

  /* ---------- AI (체험용 시나리오) ---------- */
  function chipsFor(f) {
    if (!f) return [['easy', '숫자를 더 쉽게'], ['hint', '힌트 모두 친절하게'], ['reduce', '문항 하나 줄이기'], ['example', '다른 사례로 바꾸기']];

  }
  function route(t) {
    if (/미로|퀴즈|유형|형태|디자인|색|레이아웃|방식으로|게임으로|활동 방법/.test(t)) return 'struct';
    if (/힌트/.test(t)) return 'hint';
    if (/쉽|숫자|난이도|어렵/.test(t)) return 'easy';
    if (/사례|예시|메뉴|학교|소재|상황/.test(t)) return 'example';
    if (/줄|빼|짧|시간|하나만/.test(t)) return 'reduce';
    return null;
  }

  function ask(text, intent) {
    const s = S();
    if (s.prop) return;
    s.chat.push({ who: 'me', t: text });
    const f = s.sel ? find(s.sheet, s.sel) : null;
    const r = propose(s.sheet, f, intent);
    s.chat.push(r.msg);
    if (r.sheet) s.prop = { sheet: r.sheet, changed: r.changed, ans: r.ans };
    all();
  }
  function apply() {
    const s = S(); if (!s.prop) return;
    snapshot();
    s.sheet = s.prop.sheet; s.prop.ans.forEach(id => s.check.add(id));
    const ans = s.prop.ans.slice();
    const first = s.prop.ans[0] || s.prop.changed[0];
    s.prop = null;
    s.chat.push({ who: 'ai', t: ans.length ? '적용했어요. 정답이 바뀐 문항은 빨간 테두리로 남겨 뒀어요. 맞는지 확인해 주세요.' : '적용했어요.', goEdit: first || true });
    all();
  }
  function cancel() { const s = S(); s.prop = null; s.chat.push({ who: 'ai', t: '취소했어요. 활동지는 그대로예요.' }); all(); }

  const loopRe = /반복하기 (\d+)번/;
  function propose(sheet, f, intent) {
    const nx = clone(sheet);
    const changed = [], ans = [], list = [];
    const blocks = f ? [find(nx, f.b.id).b] : nx.sections.flatMap(sec => sec.blocks).filter(b => !b.hidden);
    if (intent === 'struct') {
      return { msg: { who: 'ai', t: `활동 방법을 바꾸는 건 할 수 없어요. 바꾸면 자동 확인과 화면이 함께 달라지기 때문이에요. 대신 이렇게 해 볼 수 있어요.`, chips: [['easy', '숫자를 더 쉽게'], ['reduce', '이 문항 숨기고 줄이기'], ['hint', '힌트 더 친절하게']] } };
    }
    if (intent === 'easy') {
      blocks.forEach(b => {
        if (b.kind === 'table' && b.code && b.code.filter(l => loopRe.test(l.t)).length === 2) {
          const loops = b.code.filter(l => loopRe.test(l.t));
          const [o, i] = loops.map(l => +l.t.match(loopRe)[1]);
          const no = Math.max(2, o - 1), ni = Math.max(2, i - 1);
          if (no === o && ni === i) return;
          loops[0].t = `반복하기 ${no}번`; loops[1].t = `반복하기 ${ni}번`;
          b.code.forEach(l => { if (/x 좌표를 -\d+만큼/.test(l.t)) l.t = `x 좌표를 -${ni * 30}만큼 바꾸기`; });
          b.explain = `바깥 반복이 한 번 돌 때마다 안쪽 반복이 처음부터 ${ni}번 돌아요. 그래서 줄마다 ${ni}개, ${no}줄이면 ${ni} × ${no} = ${ni * no}개예요.`;
          b.rows = Array.from({ length: no }, (_, k) => [`${k + 1}번째`, { answer: String(ni) }, { answer: String(ni * (k + 1)) }]);
          list.push({ label: '코드', before: `${o}번 · ${i}번 반복`, after: `${no}번 · ${ni}번 반복` }, { label: '표 정답', before: `합계 ${o * i}`, after: `합계 ${no * ni}` });
          changed.push(b.id); ans.push(b.id);
        } else if (b.kind === 'codediff') {
          const ls = [b.a, b.b].map(c => c.filter(l => loopRe.test(l.t)));
          const nums = ls.map(c => c.map(l => +l.t.match(loopRe)[1]));
          const m = { 4: 3, 3: 2 };
          ls.forEach((c, ci2) => c.forEach((l, k) => l.t = `반복하기 ${m[nums[ci2][k]] || nums[ci2][k]}번`));
          const A = ls[0].map(l => +l.t.match(loopRe)[1]), B = ls[1].map(l => +l.t.match(loopRe)[1]);
          [[b.a, A], [b.b, B]].forEach(([c, n]) => c.forEach(l => { if (/x 좌표를 -\d+만큼/.test(l.t)) l.t = `x 좌표를 -${n[1] * 30}만큼 바꾸기`; }));
          b.explain = `${A[0]} × ${A[1]}와 ${B[0]} × ${B[1]}는 모두 ${A[0] * A[1]}개예요. 개수는 같지만 A는 ${A[1]}개씩 ${A[0]}줄, B는 ${B[1]}개씩 ${B[0]}줄로 모양이 달라요.`;
          list.push({ label: '두 코드', before: '3 × 4 / 4 × 3', after: `${A[0]} × ${A[1]} / ${B[0]} × ${B[1]}` }, { label: '설명', after: '숫자에 맞게 고침 (정답 "같다"는 그대로)' });
          changed.push(b.id);
        } else if (b.kind === 'bitcards') {
          const before = b.targets.map(t => t.value).join(', ');
          const nv = [3, 6];
          b.targets.forEach((t, k) => { t.value = nv[k] || t.value; t.answer = t.value.toString(2).padStart(4, '0'); });
          b.explain = b.targets.map(t => `${t.value} → ${t.answer}`).join(', ');
          list.push({ label: '만들 수', before, after: b.targets.map(t => t.value).join(', ') }, { label: '정답', after: b.targets.map(t => t.answer).join(', ') + ' (자동 계산)' });
          changed.push(b.id); ans.push(b.id);
        } else if (b.kind === 'chart' && b.id === 'a2') {
          // 그래프 숫자를 어림하기 쉬운 수로, 이어진 평균 표도 함께
          const nv = { 월: 10, 화: 30, 수: 8, 목: 30, 금: 6 };
          const before = b.bars.map(x => x.v).join(', ');
          b.bars.forEach(x => x.v = nv[x.label]);
          list.push({ label: '그래프 값', before, after: b.bars.map(x => x.v).join(', ') });
          changed.push(b.id);
          const t = find(nx, 'a3');
          if (t && !t.b.hidden) {
            t.b.rows[0][2].answer = '30'; t.b.rows[1][2].answer = '8'; t.b.hint = '(30 + 30) ÷ 2, (10 + 8 + 6) ÷ 3';
            t.b.explain = '생선·나물 반찬 날의 평균(30kg)이 다른 날(8kg)의 3배가 넘어요.';
            t.b.prompt = '3단계 · 메뉴를 두 무리로 나누어 하루 평균 잔반량을 구하세요. (화 30kg, 목 30kg / 월 10kg, 수 8kg, 금 6kg)';
            list.push({ label: '3단계 표 정답 (이어진 문항)', before: '29 / 9', after: '30 / 8' });
            changed.push('a3'); ans.push('a3');
          }
        }
      });
      if (!changed.length) return { msg: { who: 'ai', t: f ? '이 문항에는 쉽게 바꿀 숫자가 없어요. 대신 힌트를 더 친절하게 바꿔 볼까요?' : '이 활동지에는 쉽게 바꿀 숫자가 없어요. 문항을 하나 줄이거나 힌트를 바꿔 볼까요?', chips: [['hint', '힌트 더 친절하게'], ['reduce', '문항 하나 줄이기']] } };
      return { sheet: nx, changed, ans, msg: { who: 'ai', t: '숫자를 이렇게 바꿔 볼게요.', list, ansNote: ans.length ? '숫자가 바뀌어서 정답도 함께 다시 계산했어요. 적용하면 정답 확인 표시가 남아요.' : null, prop: true } };
    }
    if (intent === 'hint') {
      blocks.forEach(b => {
        if (['note', 'story', 'write'].includes(b.kind) && !b.hint) return;
        const before = b.hint || '(없음)';
        const nh = HINTS[b.id] || (b.hint ? b.hint + ' 그래도 어려우면 짝과 먼저 이야기해 보세요.' : '처음 질문을 다시 읽고, 확실한 것부터 하나씩 골라 보세요.');
        b.hint = nh;
        list.push({ label: b.method, before, after: nh });
        changed.push(b.id);
      });
      if (!changed.length) return { msg: { who: 'ai', t: '이 문항은 힌트를 넣는 방식이 아니에요. 지시문을 더 쉽게 바꿔 볼까요?' } };
      if (!f && list.length > 3) { const n = list.length; list.splice(3); list.push({ label: '그 밖에', after: `${n - 3}개 문항 힌트도 같은 방식으로` }); }
      return { sheet: nx, changed, ans, msg: { who: 'ai', t: '힌트를 이렇게 바꿔 볼게요. 정답을 바로 알려 주지 않고 생각할 거리를 주도록 썼어요.', list, prop: true } };
    }
    if (intent === 'reduce') {
      const cand = f ? f.b.id : REDUCE[nx.id];
      const t = cand && find(nx, cand);
      if (!t || t.b.hidden) return { msg: { who: 'ai', t: '더 줄일 문항이 없어요.' } };
      t.b.hidden = true;
      list.push({ label: t.b.method, after: '숨김 (원본에서 지워지지 않아요)' });
      if (nx.type === 'escape' && t.b.gate) list.push({ label: '관문과 금고', after: '관문 번호와 금고 번호 자리 수가 자동으로 줄어요' });
      changed.push(t.b.id);
      return { sheet: nx, changed, ans, msg: { who: 'ai', t: f ? '이 문항을 숨겨 볼게요.' : `시간을 줄이려면 '${t.b.method}' 문항을 숨기는 게 좋겠어요. 학습목표와 가장 덜 겹치는 문항이에요.`, list, prop: true } };
    }
    if (intent === 'example') {
      const ex = EXAMPLES[nx.id];
      if (!ex) return { msg: { who: 'ai', t: '이 활동지는 사례를 바꾸면 정답이 크게 달라져서, 시제품에서는 바꾸지 않았어요. 실제 서비스에서는 바꿀 사례를 물어본 뒤 정답까지 다시 만들어요.' } };
      ex(nx, list, changed);
      return { sheet: nx, changed, ans, msg: { who: 'ai', t: '사례를 이렇게 바꿔 볼게요. 숫자와 정답은 그대로예요.', list, prop: true } };
    }
    return { msg: { who: 'ai', t: '시제품에서는 아래 예시 요청만 실제로 고쳐 볼 수 있어요.', chips: chipsFor(f) } };
  }
  const HINTS = {
    m1: '바깥 반복 1번째일 때 안쪽 반복이 몇 번 도는지부터 세어 보세요. 2번째, 3번째도 똑같이 처음부터 다시 돌아요.',
    m3: '두 코드에서 숫자만 비교해 보세요. 3 × 4와 4 × 3을 계산하면?',
    g1: '가장 큰 카드부터 생각해 보세요. 만들 수보다 크면 끄고, 작거나 같으면 켜요.',
    c1: '이 글만 보고 민서의 생일, 학교, 사는 곳, 연락처를 알 수 있을까요?',
    d4: '빛 값과 50을 비교해서 50보다 작은 칸만 O예요.',
    a3: '두 날의 잔반을 더한 뒤 2로 나누면 평균이에요.'
  };
  const REDUCE = { 'ws-nested': 'm2', 'ws-vault': 'g2', 'ws-privacy': 'c3', 'ws-sleeptemp': 'd1', 'ws-leftover': 'a1', 'ws-cyber': 't2' };
  const EXAMPLES = {
    'ws-nested': (nx, list, changed) => {
      const m1 = find(nx, 'm1').b; m1.columns = ['바깥 반복', '이번 줄의 의자', '지금까지 의자 합계'];
      m1.prompt = '강당 배치도를 그리는 코드예요. 의자 모양 오브젝트로 도장을 찍어요. 바깥 반복이 한 번 돌 때마다 의자가 몇 개 놓이는지 예측해 표를 채우세요.';
      const m3 = find(nx, 'm3').b; m3.question = '두 코드가 놓는 의자의 총 개수는?';
      nx.title = '반복 안의 반복, 의자는 몇 개?';
      list.push({ label: '소재', before: '도장 문양', after: '강당 의자 배치 (코드는 그대로)' }, { label: '제목', after: nx.title });
      changed.push('m1', 'm3');
    },
    'ws-leftover': (nx, list, changed) => {
      const a2 = find(nx, 'a2').b; const m = { 비빔밥: '제육덮밥', 생선구이: '고등어조림', 카레: '짜장밥', 나물무침: '시금치무침', 떡볶이: '스파게티' };
      list.push({ label: '메뉴', before: a2.bars.map(x => x.sub).join(', '), after: a2.bars.map(x => m[x.sub] || x.sub).join(', ') });
      a2.bars.forEach(x => x.sub = m[x.sub] || x.sub);
      changed.push('a2');
    }
  };

  function all() { paintTop(); paintPreview(); paintPanel(); }
  all();
})();
</script>
